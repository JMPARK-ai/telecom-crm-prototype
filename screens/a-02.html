.b04-dh{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.b04-dh h2{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b04-dh p{font-size:12.5px;color:var(--muted);margin-top:2px}
.b04-db{padding:14px 16px;overflow:auto;flex:1}
.b04-req{background:var(--amber-bg);color:#6B4705;border-radius:var(--r1);padding:9px 11px;font-size:13.5px;margin:12px 0}
.b04-req b{display:block;font-size:12px;margin-bottom:2px}
.b04-df{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--sunk)}
.b04-reqcol{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
@media (max-width:1100px){.b04-wrap{grid-template-columns:1fr}.b04-detail{position:static;max-height:none}.b04-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}`;

  App.screen("B-04", {
    title: "협력점 접수함", sc: ["SC-39"],
    render(el, params) {
      const db = App.db;
      if (params.id && st.picked !== params) { st.picked = params; st.sel = params.id; st.state = ""; }
      if (params.state && st.statePicked !== params) { st.statePicked = params; st.state = params.state; }
      el.innerHTML = h`<style>${App.raw(CSS)}</style>
        ${App.head("협력점 접수함", { count: "협력점 · 하부점이 올린 접수 건", actions: h`<button class="btn" data-act="xls">엑셀저장</button>` })}
        <div class="note">회신 · 반송 내용은 협력점 화면의 고객 이력에 시간순으로 보입니다. 문자 · 푸시는 보내지 않습니다.</div>
        <div class="kpis b04-kpis" data-kpis></div>
        <div class="card"><div class="filters">
          <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="고객명 또는 요청 글" aria-label="검색어"></div>
          <select class="in fix" data-on="f" data-k="group" aria-label="정산그룹">${App.opts(db.options.정산그룹, st.group, "정산그룹 전체")}</select>
          <select class="in fix" data-on="f" data-k="partner" aria-label="협력점">${App.opts(db.partners.map((p) => [p.id, p.name]), st.partner, "협력점 전체")}</select>
          <select class="in fix" data-on="f" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, st.carrier, "통신사 전체")}</select>
          <select class="in fix" data-on="f" data-k="product" aria-label="상품선택">${App.opts([...new Set(db.products.map((p) => p.name))], st.product, "상품 전체")}</select>
          <select class="in fix" data-on="f" data-k="state" aria-label="처리 상태">${App.opts([["todo", "미처리(접수 · 재접수)"], ...App.RECEIPT_STATES], st.state, "처리 상태 전체")}</select>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div class="b04-wrap" style="margin-top:12px"><div data-tbl style="min-width:0"></div><aside class="card b04-detail" data-detail></aside></div>`;

      const base = () => db.customers.filter((c) => {
        if (c.via === "본사") return false;
        if (st.q && !(c.name.includes(st.q) || (c.request || "").includes(st.q))) return false;
        if (st.group && (db.partners.find((p) => p.id === c.partnerId) || {}).group !== st.group) return false;
        if (st.partner && c.partnerId !== st.partner) return false; if (st.carrier && c.carrier !== st.carrier) return false; if (st.product && c.product !== st.product) return false;
        return true;
      });
      const rows = () => base().filter((c) => (st.state === "todo" ? todo(c) : !st.state || c.receiptState === st.state));

      const tbl = App.table($("[data-tbl]", el), [
        { label: "접수일시", render: (c) => h`<span class="num">${App.dt(c.receivedAt)}</span>` },
        { label: "협력점", render: (c) => h`${App.partnerName(c.partnerId)}${c.subId ? h` <span class="muted">· ${App.subName(c.subId)}</span>` : ""}` },
        { label: "고객명", render: (c) => h`<span class="name">${c.name}</span>` },
        { label: "상품", render: (c) => h`<span class="muted">${c.carrier}</span> ${c.product}` },
        { label: "요청 글", render: (c) => (c.request ? h`<span class="b04-reqcol" title="${c.request}">${c.request}</span>` : "") },
        { label: "처리 상태", render: (c) => App.chip(c.receiptState) },
      ], rows(), {
        onRow: (c) => { st.sel = c.id; tbl.redraw(); detail(); }, rowClass: (c) => (c.id === st.sel ? "sel" : ""),
        bar: (n) => `검색 결과 <b>${n}</b>건 · 미처리 ${rows().filter(todo).length}건`,
        empty: ["접수 건이 없습니다", st.state || st.q || st.partner || st.group || st.carrier || st.product ? "조건을 바꿔 다시 찾아 보세요." : "협력점이 접수하면 여기에 쌓입니다."],
      });

      function kpis() {
        const b = base(); const t = App.today();
        const card = (key, label, list, hot) => h`<button class="kpi ${st.state === key ? "on" : ""}" data-act="state" data-s="${key}"><span>${label}</span><b class="${hot && list.length ? "hot" : ""}">${list.length}</b><small>오늘 접수 ${list.filter((c) => c.receivedAt.slice(0, 10) === t).length}건</small></button>`;
        $("[data-kpis]", el).innerHTML = h`${card("", "전체", b)}${App.RECEIPT_STATES.map((s) => card(s, s, b.filter((c) => c.receiptState === s), s === "접수" || s === "재접수"))}`;
      }
      function detail() {
        const box = $("[data-detail]", el); const c = rows().find((x) => x.id === st.sel);
        if (!c) { box.innerHTML = h`<div class="empty"><b>${rows().length ? "왼쪽에서 접수 건을 고르세요" : "보여 줄 접수 건이 없습니다"}</b>고르면 요청 글과 지난 회신 · 반송을 보고 바로 처리할 수 있습니다.</div>`; return; }
        const hist = App.historyOf(c.id, true); // 상담은 뺀다(협력점이 보는 것과 같은 범위)
        box.innerHTML = h`<div class="b04-dh"><h2>${c.name} ${App.chip(c.receiptState)} ${App.chip(c.openState)}</h2><p>${App.partnerName(c.partnerId)}${c.subId ? " · " + App.subName(c.subId) : ""} · 접수 ${App.dt(c.receivedAt)}</p></div>
          <div class="b04-db">
            <dl class="kv"><dt>상품</dt><dd>${c.carrier} · ${c.product}</dd><dt>옵션 · 약정</dt><dd>${c.option} · ${c.set} · ${c.contract}</dd><dt>핸드폰</dt><dd class="num">${App.maskPhone(c.phone)}</dd><dt>주소</dt><dd>${c.addr} ${c.addr2}</dd>
              <dt>사은품</dt><dd>${c.gift ? h`${c.gift} · ${c.giftPayer}` : "없음"}</dd><dt>설치예정일</dt><dd class="num">${c.installDue || "-"}</dd><dt>담당자</dt><dd>${c.manager || "-"}</dd></dl>
            ${c.request ? h`<div class="b04-req"><b>협력점 요청</b>${c.request}</div>` : h`<p class="muted" style="font-size:13px;margin:12px 0">요청 글 없이 접수했습니다.</p>`}
            ${c.receiptState === "반송" ? h`<div class="note bad"><b>반송 사유</b> ${c.bounce}<br>협력점의 재접수를 기다리는 중입니다. <a data-go="B-03" data-params="id=${c.id}&mode=re">본사가 대신 재접수</a></div>` : ""}
            <div class="sec-h" style="margin-top:14px"><h2>요청 · 회신 · 반송 이력</h2><small>최근 순 · 상담은 여기 나오지 않습니다</small></div>
            ${App.timeline(hist)}
          </div>
          <div class="b04-df">${todo(c) ? App.raw('<button class="btn p" data-act="rc">확인</button>') : ""}${c.receiptState !== "반송" ? App.raw('<button class="btn" data-act="rr">회신</button><button class="btn" data-act="rb">반송</button>') : h`<span class="hint">반송한 건입니다</span>`}<a class="btn ghost" data-go="B-03" data-params="id=${c.id}" style="margin-left:auto">전체 정보 열기</a></div>`;
      }
      function refresh() {
        kpis(); tbl.set(rows());
        if (!rows().some((c) => c.id === st.sel)) { const f = rows().find(todo) || rows()[0]; st.sel = f ? f.id : ""; tbl.redraw(); }
        detail();
      }
      /** 처리한 뒤: 목록 순서에서 그다음 미처리 건으로 넘어간다 */
      function next(c, order) {
        const i = order.indexOf(c); const n = [...order.slice(i + 1), ...order.slice(0, Math.max(i, 0))].find((x) => x !== c && todo(x));
        if (n) st.sel = n.id; refresh();
        if (!n && !db.customers.some((x) => x.via !== "본사" && todo(x))) App.toast("미처리 접수 건을 모두 처리했습니다");
      }
      const cur = () => db.customers.find((x) => x.id === st.sel);
      const run = (fn) => { const c = cur(); if (!c) return; const order = tbl.rows().slice(); fn(c, () => { next(c, order); const n = App.badge("B-04"); App.$$(".gnb a b, .sub a b").forEach((b) => { b.textContent = n; b.hidden = !n; }); }); }; // 메뉴 옆 미처리 건수도 같이 줄인다
      refresh();
      App.on(el, {
        q: (t) => { st.q = t.value.trim(); refresh(); }, f: (t) => { st[t.dataset.k] = t.value; refresh(); },
        state: (t) => { st.state = t.dataset.s; $('[data-k="state"]', el).value = st.state; refresh(); },
        reset: () => { Object.assign(st, { state: "", group: "", partner: "", carrier: "", product: "", q: "" }); App.redraw(); },
        rc: () => run((c, done) => App.receiptConfirm(c, done)), rr: () => run((c, done) => App.receiptReply(c, done)), rb: () => run((c, done) => App.receiptBounce(c, done)),
        xls: () => App.fake(`검색 결과 ${tbl.rows().length}건 엑셀저장`),
      });
    },
  });
})();
</script>
<script>/* B-05 개통 현황 (옛 SC-28 개통 상태 관리). 개통 상태 8개를 세로 칸으로 세운 판 + 「목록으로 보기」(줄마다 변경 이력 펼침).
   상태는 카드를 눌러 고객 서랍에서 한 건씩 바꾼다. 여러 건 한꺼번에 바꾸기는 없다(D-7). */
(function () {
  "use strict";
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$;
  const blankF = () => ({ group: "", carrier: "", product: "", set: "", partner: "", recruiter: "", manager: "", upper: "", open: "", from: "", to: "" });
  const st = { view: "board", q: "", qBy: "name", more: false, f: blankF(), openIds: new Set() };
  const TONE = { 청약대기: "gray", 청약완료: "blue", 결합대기: "amber", 개통대기: "violet", 유심개통: "green", 개통완료: "green", 개통불가: "red", 해지: "red" };
  const CSS = `
.b05-board{display:grid;grid-template-columns:repeat(8,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.b05-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 300px);min-height:360px}
.b05-ch{padding:9px 10px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;border-top:3px solid var(--line);border-radius:var(--r2) var(--r2) 0 0}
.b05-ch b{font-size:13.5px;font-weight:800}
.b05-ch span{margin-left:auto;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.b05-ch small{margin-left:6px;font-size:11px;color:var(--green);font-weight:700}
.b05-ch.t-blue{border-top-color:var(--blue)} .b05-ch.t-amber{border-top-color:#C99400} .b05-ch.t-violet{border-top-color:var(--violet)} .b05-ch.t-green{border-top-color:var(--green)} .b05-ch.t-red{border-top-color:var(--red)} .b05-ch.t-gray{border-top-color:var(--faint)}
.b05-cb{padding:6px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.b05-card{display:block;flex:none;width:100%;text-align:left;border:1px solid var(--line2);border-radius:var(--r1);padding:7px 9px;background:var(--sunk);font-size:12.5px;line-height:1.45}
.b05-card:hover{border-color:var(--brand);background:#fff}
.b05-card b{display:block;font-size:13.5px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b05-card span{display:block;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b05-card em{display:block;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.b05-card em.late{color:var(--red);font-weight:700}
.b05-none{padding:18px 6px;text-align:center;color:var(--faint);font-size:12.5px}
.b05-x td{background:var(--sunk) !important;white-space:normal !important;padding:10px 14px 12px 44px !important}
.b05-x table{border-collapse:collapse;font-size:12.5px}
.b05-x th{font-weight:700;color:var(--muted);text-align:left;padding:3px 18px 3px 0;font-size:12px}
.b05-x td td{padding:3px 18px 3px 0 !important;background:none !important;border:0 !important}`;

  App.screen("B-05", {
    title: "개통 현황", sc: ["SC-28"],
    render(el, params) {
      if (params.view && st.viewFrom !== params) { st.viewFrom = params; st.view = params.view === "list" ? "list" : "board"; }
      const db = App.db; const f = st.f;
      el.innerHTML = h`<style>${App.raw(CSS)}</style>
        ${App.head("개통 현황", { count: "개통 상태별 접수 건", actions: h`<div class="seg"><label><input type="radio" name="b05-view" value="board" data-on="view" ${st.view === "board" ? App.raw("checked") : ""}>판으로 보기</label><label><input type="radio" name="b05-view" value="list" data-on="view" ${st.view === "list" ? App.raw("checked") : ""}>목록으로 보기</label></div>` })}
        <div class="note"><b>개통 완료된 건만 정산 대상이 됩니다</b>(개통완료 · 유심개통). 상태는 ${st.view === "board" ? "카드" : "줄"}를 눌러 한 건씩 바꾸고, 바꾼 사람과 시각이 기록됩니다.</div>
        <div class="card"><div class="filters">
            <select class="in fix" data-on="top" data-k="qBy" aria-label="검색 항목">${App.opts([["name", "고객명"], ["joinNo", "가입번호"]], st.qBy)}</select>
            <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="고객명 또는 가입번호" aria-label="검색어"></div>
            <select class="in fix" data-on="ff" data-k="partner" aria-label="협력점">${App.opts(db.partners.map((p) => [p.id, p.name]), f.partner, "협력점 전체")}</select>
            <select class="in fix" data-on="ff" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, f.carrier, "통신사 전체")}</select>
            <select class="in fix" data-on="ff" data-k="open" aria-label="개통상태">${App.opts(App.OPEN_STATES, f.open, "개통상태 전체")}</select>
            <span class="muted" style="font-size:12.5px">접수일</span>
            <div class="range"><input class="in" type="date" data-on="ff" data-k="from" value="${f.from}" aria-label="접수일 시작">~<input class="in" type="date" data-on="ff" data-k="to" value="${f.to}" aria-label="접수일 끝"></div>
            <button class="btn sm ghost" data-act="range" data-d="6">7일</button><button class="btn sm ghost" data-act="range" data-d="29">30일</button>
            <button class="btn sm" data-act="more">조건 ${st.more ? "접기" : "더 보기"}</button><button class="btn sm ghost" data-act="reset">초기화</button>
          ${st.more ? h`<div class="filters-more">
            <div class="f"><label>정산그룹</label><select class="in" data-on="ff" data-k="group">${App.opts(db.options.정산그룹, f.group, "전체")}</select></div>
            <div class="f"><label>상품선택</label><select class="in" data-on="ff" data-k="product">${App.opts([...new Set(db.products.map((p) => p.name))], f.product, "전체")}</select></div>
            <div class="f"><label>셋트</label><select class="in" data-on="ff" data-k="set">${App.opts(["단독", "DPS", "TPS"], f.set, "전체")}</select></div>
            <div class="f"><label>유치자</label><select class="in" data-on="ff" data-k="recruiter">${App.opts(db.staff.filter((s) => s.roles.includes("유치자")).map((s) => s.name), f.recruiter, "전체")}</select></div>
            <div class="f"><label>담당자</label><select class="in" data-on="ff" data-k="manager">${App.opts(db.staff.filter((s) => s.roles.includes("담당자")).map((s) => s.name), f.manager, "전체")}</select></div>
            <div class="f"><label>상부점</label><select class="in" data-on="ff" data-k="upper">${App.opts(db.uppers.map((u) => [u.id, u.name]), f.upper, "전체")}</select></div>
          </div>` : ""}</div></div>
        <div data-body style="margin-top:12px"></div>`;

      const rows = () => db.customers.filter((c) => {
        if (st.q && !String(c[st.qBy] || "").includes(st.q)) return false;
        if (f.partner && c.partnerId !== f.partner) return false; if (f.carrier && c.carrier !== f.carrier) return false; if (f.open && c.openState !== f.open) return false;
        if (f.group && (db.partners.find((p) => p.id === c.partnerId) || {}).group !== f.group) return false;
        if (f.product && c.product !== f.product) return false; if (f.set && c.set !== f.set) return false;
        if (f.recruiter && c.recruiter !== f.recruiter) return false; if (f.manager && c.manager !== f.manager) return false; if (f.upper && c.upperId !== f.upper) return false;
        const d = c.receivedAt.slice(0, 10); if (f.from && d < f.from) return false; if (f.to && d > f.to) return false;
        return true;
      });
      /** 건마다 상태 변경 이력(최근 순). 없으면 접수 기록이 「지금 상태가 된 때」다 */
      const changesOf = () => { const m = new Map(); db.history.forEach((x) => { if (x.kind !== "상태 변경" && x.kind !== "접수") return; if (!m.has(x.cid)) m.set(x.cid, { ch: [], first: null }); const e = m.get(x.cid); if (x.kind === "상태 변경") e.ch.push(x); else if (!e.first || x.at < e.first.at) e.first = x; }); return m; };
      const late = (c) => c.installDue && c.installDue < App.today() && !App.isOpened(c) && c.openState !== "해지" && c.openState !== "개통불가";
      const body = $("[data-body]", el);
      let tbl = null;

      function board() {
        const list = rows(); tbl = null;
        body.innerHTML = h`<div class="row" style="margin-bottom:8px;font-size:13px;color:var(--ink2)"><span>검색 결과 <b>${list.length}</b>건 · 설치예정일이 지난 미개통 <b class="${list.some(late) ? "neg" : ""}">${list.filter(late).length}</b>건</span><span class="sp"><button class="btn sm" data-act="xls">엑셀저장</button></span></div>
          <div class="b05-board">${App.OPEN_STATES.map((s) => {
            const col = list.filter((c) => c.openState === s).sort((a, b) => (late(b) - late(a)) || (a.installDue && b.installDue && !App.isOpened(a) ? (a.installDue < b.installDue ? -1 : 1) : a.receivedAt < b.receivedAt ? 1 : -1));
            return h`<section class="b05-col" aria-label="${s}"><div class="b05-ch t-${TONE[s]}"><div><b>${s}</b>${s === "개통완료" || s === "유심개통" ? App.raw("<small>정산 대상</small>") : ""}</div><span>${col.length}</span></div>
              <div class="b05-cb">${col.length ? col.map((c) => h`<button class="b05-card" data-act="open" data-id="${c.id}"><b>${c.name}</b><span>${c.product}</span><span>${App.orgOf(c)} · ${c.carrier}</span>${c.installDue && !App.isOpened(c) ? h`<em class="${late(c) ? "late" : ""}">설치예정 ${c.installDue.slice(5)}${late(c) ? " 지남" : ""}</em>` : c.openedAt ? h`<em>개통 ${c.openedAt.slice(5)}</em>` : h`<em>접수 ${c.receivedAt.slice(5, 10)}</em>`}</button>`) : App.raw('<div class="b05-none">해당 건 없음</div>')}</div></section>`;
          })}</div>`;
      }
      function list() {
        const m = changesOf(); const last = (c) => { const e = m.get(c.id) || { ch: [] }; return e.ch[0] || e.first || { at: c.receivedAt, by: "-" }; };
        body.innerHTML = "<div data-tbl></div>";
        tbl = App.table($("[data-tbl]", body), [
          { label: "고객명", render: (c) => h`<span class="name">${c.name}</span>` }, { key: "carrier", label: "통신사" }, { key: "product", label: "상품" },
          { label: "현재 개통상태", render: (c) => App.chip(c.openState) },
          { label: "변경일시", render: (c) => h`<span class="num">${App.dt(last(c).at)}</span>` }, { label: "변경자", render: (c) => last(c).by },
          { label: "협력점", render: (c) => App.orgOf(c) },
          { label: "설치예정일", render: (c) => (c.installDue ? h`<span class="num ${late(c) ? "neg" : ""}">${c.installDue}</span>` : "") },
          { label: "개통일", render: (c) => (c.openedAt ? h`<span class="num">${c.openedAt}</span>` : "") },
          { label: "가입번호", render: (c) => (c.joinNo ? h`<span class="num">${c.joinNo}</span>` : "") },
          { label: "변경 이력", render: (c) => { const n = (m.get(c.id) || { ch: [] }).ch.length; return h`<button class="btn sm ${st.openIds.has(c.id) ? "p" : ""}" data-act="hist" data-id="${c.id}">${st.openIds.has(c.id) ? "이력 접기" : `이력 보기 ${n}`}</button>`; } },
        ], rows(), {
          onRow: (c) => App.openCustomer(c.id, { onChange: refresh }), bar: (n) => `검색 결과 <b>${n}</b>건 · 줄을 누르면 고객을 열어 상태를 바꿉니다`, tools: h`<button class="btn sm" data-act="xls">엑셀저장</button>`,
          empty: ["검색 결과가 없습니다", "조건을 바꿔 다시 찾아 보세요."],
          onDraw: (root) => $$('[data-act="hist"]', root).forEach((b) => {
            if (!st.openIds.has(b.dataset.id)) return; const e = changesOf().get(b.dataset.id) || { ch: [] };
            b.closest("tr").insertAdjacentHTML("afterend", h`<tr class="b05-x"><td colspan="11">${e.ch.length ? h`<table><thead><tr><th>이전 상태</th><th>바뀐 상태</th><th>바꾼 사람</th><th>시각</th></tr></thead><tbody>${e.ch.map((x) => { const [a, b2] = x.text.split(" > "); return h`<tr><td>${App.chip(a)}</td><td>${App.chip(b2)}</td><td>${x.by}</td><td class="num">${App.dt(x.at)}</td></tr>`; })}</tbody></table>` : h`<span class="muted">상태를 바꾼 적이 없습니다. 접수한 때(${e.first ? App.dt(e.first.at) : "-"})부터 「청약대기」입니다.</span>`}</td></tr>`);
          }),
        });
      }
      function refresh() { if (st.view === "board") board(); else list(); }
      if (st.view === "board") board(); else list();
      App.on(el, {
        view: (t) => { st.view = t.value; App.redraw(); },
        q: (t) => { st.q = t.value.trim(); refresh(); }, top: (t) => { st[t.dataset.k] = t.value; refresh(); }, ff: (t) => { f[t.dataset.k] = t.value; refresh(); },
        range: (t) => { f.to = App.today(); f.from = App.addDays(App.today(), -Number(t.dataset.d)); App.redraw(); },
        more: () => { st.more = !st.more; App.redraw(); }, reset: () => { st.f = blankF(); st.q = ""; App.redraw(); },
        open: (t) => App.openCustomer(t.dataset.id, { onChange: refresh }),
        hist: (t) => { const id = t.dataset.id; st.openIds.has(id) ? st.openIds.delete(id) : st.openIds.add(id); if (tbl) tbl.redraw(); },
        xls: () => App.fake(`검색 결과 ${rows().length}건 엑셀저장`),
      });
    },
  });
})();
</script>
<script>/* B-06 고객이력 (옛 SC-6). 고객명 · 가입번호 · 기간 · 처리 구분으로 전체 이력을 찾는다. 줄을 누르면 고객 서랍(이력 탭). */
(function () {
  "use strict";
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { q: "", joinNo: "", from: "", to: "", kind: "", cid: "" };
  const KINDS = ["접수", "요청", "확인", "회신", "반송", "재접수", "상태 변경", "상담", "수정"];
  const TONE = { 접수: "gray", 요청: "amber", 확인: "blue", 회신: "green", 반송: "red", 재접수: "violet", 상담: "gray", "상태 변경": "blue", 수정: "gray" };
  App.screen("B-06", {
    title: "고객이력", sc: ["SC-6"],
    render(el, params) {
      const db = App.db;
      if (st.from0 !== params) { st.from0 = params; if (params.cid) { st.cid = params.cid; st.q = ""; st.joinNo = ""; st.kind = ""; } if (params.q) { st.q = params.q; st.cid = ""; } }
      const who = st.cid ? App.cust(st.cid) : null;
      el.innerHTML = h`${App.head("고객이력", { count: "접수 · 상태 변경 · 상담 · 회신 · 반송 · 재접수 기록", actions: h`<button class="btn" data-go="B-01">전체 고객관리</button>` })}
        <div class="card"><div class="filters">
          ${who ? h`<span class="chip c-blue" style="font-size:13px;padding:5px 10px">${who.name} 한 명만 보는 중 <a data-act="clearCid" style="margin-left:4px;font-weight:800" aria-label="고객 한 명만 보기 풀기">×</a></span>` : h`<div class="search grow"><input class="in" data-on="q" data-live data-k="q" value="${st.q}" placeholder="고객명" aria-label="고객명"></div>`}
          <input class="in fix" data-on="q" data-live data-k="joinNo" value="${st.joinNo}" placeholder="가입번호" aria-label="가입번호" style="width:150px">
          <span class="muted" style="font-size:12.5px">기간</span>
          <div class="range"><input class="in" type="date" data-on="f" data-k="from" value="${st.from}" aria-label="시작일">~<input class="in" type="date" data-on="f" data-k="to" value="${st.to}" aria-label="종료일"></div>
          <button class="btn sm ghost" data-act="range" data-d="0">오늘</button><button class="btn sm ghost" data-act="range" data-d="6">7일</button><button class="btn sm ghost" data-act="range" data-d="29">30일</button>
          <select class="in fix" data-on="f" data-k="kind" aria-label="처리 구분">${App.opts(KINDS, st.kind, "처리 구분 전체")}</select>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div data-pills style="margin-top:12px"></div>
        <div data-tbl></div>
        <p class="hint" style="margin-top:8px">최근 순으로 보입니다. 상담 기록은 본사만 볼 수 있고 협력점 · 하부점 화면에는 나오지 않습니다.</p>`;

      const base = () => db.history.map((x) => ({ x, c: App.cust(x.cid) })).filter(({ x, c }) => {
        if (!c) return false;
        if (st.cid && c.id !== st.cid) return false;
        if (st.q && !c.name.includes(st.q)) return false; if (st.joinNo && !String(c.joinNo || "").includes(st.joinNo)) return false;
        const d = x.at.slice(0, 10); if (st.from && d < st.from) return false; if (st.to && d > st.to) return false;
        return true;
      }).sort((a, b) => (a.x.at < b.x.at ? 1 : a.x.at > b.x.at ? -1 : 0));
      const rows = () => base().filter(({ x }) => !st.kind || x.kind === st.kind);
      const tbl = App.table($("[data-tbl]", el), [
        { label: "일시", render: ({ x }) => h`<span class="num">${App.dt(x.at)}</span>` },
        { label: "처리 구분", render: ({ x }) => h`<span class="chip c-${TONE[x.kind] || "gray"}">${x.kind}</span>` },
        { label: "고객명", render: ({ c }) => h`<span class="name">${c.name}</span>` },
        { label: "가입번호", render: ({ c }) => (c.joinNo ? h`<span class="num">${c.joinNo}</span>` : "") },
        { label: "통신사 · 상품", render: ({ c }) => h`<span class="muted">${c.carrier}</span> ${c.product}` },
        { label: "협력점", render: ({ c }) => App.orgOf(c) },
        { label: "내용", cls: "wrap", render: ({ x }) => x.text },
        { label: "처리자", render: ({ x }) => x.by },
      ], rows(), {
        onRow: ({ c }) => App.openCustomer(c.id, { tab: "hist", onChange: refresh }),
        bar: (n) => `이력 목록 <b>${n}</b>건`, tools: h`<button class="btn sm" data-act="xls">엑셀저장</button>`,
        empty: ["조건에 맞는 이력이 없습니다", "고객명 · 가입번호 · 기간 · 처리 구분을 바꿔 다시 찾아 보세요."],
      });
      function refresh() {
        const b = base();
        App.pills($("[data-pills]", el), [["전체", b.length, ""], ...KINDS.map((k) => [k, b.filter(({ x }) => x.kind === k).length, k])], st.kind, (k) => { st.kind = k; $('[data-k="kind"]', el).value = k; refresh(); });
        tbl.set(rows());
      }
      refresh();
      App.on(el, {
        q: (t) => { st[t.dataset.k] = t.value.trim(); refresh(); }, f: (t) => { st[t.dataset.k] = t.value; refresh(); },
        range: (t) => { st.to = App.today(); st.from = App.addDays(App.today(), -Number(t.dataset.d)); App.redraw(); },
        reset: () => { Object.assign(st, { q: "", joinNo: "", from: "", to: "", kind: "", cid: "" }); App.redraw(); },
        clearCid: () => { st.cid = ""; App.redraw(); },
        xls: () => App.fake(`이력 ${tbl.rows().length}건 엑셀저장`),
      });
    },
  });
})();
</script>
<script>/* B-07 가망고객 (옛 SC-9 목록 + SC-58 등록·상세).
   목록을 떠나지 않고 서랍에서 기본 정보 수정 · 상담 메모 쌓기 · 「접수로 전환」(B-02 에 from=<id>)까지 한다.
   상담 상태는 5단계(신규 · 상담 중 · 보류 · 전환 · 종료, 인계 H-46). 연락처는 가려서 보이고, 고칠 때만 새 번호를 넣는다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const STATES = ["신규", "상담 중", "보류", "전환", "종료"];
  const st = { q: "", state: "", manager: "", from: "", to: "" };
  const done = (p) => p.state === "전환" || p.state === "종료";
  const managers = (cur) => { const l = App.db.staff.filter((s) => s.roles.includes("담당자") && s.state === "재직").map((s) => s.name); if (cur && !l.includes(cur)) l.push(cur); return l; };
  const fields = (p) => [
    { name: "name", label: "이름", required: true, pattern: /^.{1,20}$/, msg: "이름은 20자까지 넣을 수 있습니다" },
    { name: "phone", label: "연락처", type: "tel", placeholder: p && p.phone ? App.maskPhone(p.phone) : "010-0000-0000", hint: p && p.phone ? "바꿀 때만 새 번호를 넣습니다. 비워 두면 그대로 둡니다." : "" },
    { name: "carrier", label: "관심 통신사", type: "select", options: App.db.carriers },
    { name: "interest", label: "관심 상품", type: "select", options: [...new Set(App.db.products.filter((x) => x.state === "사용" || (p && x.name === p.interest)).map((x) => x.name))] },
    { name: "state", label: "상담 상태", type: "select", options: STATES, first: null, required: true },
    { name: "manager", label: "담당자", type: "select", options: managers(p && p.manager) },
    { name: "next", label: "다음 연락일", type: "date" },
  ];

  App.screen("B-07", {
    title: "가망고객", sc: ["SC-9", "SC-58"],
    render(el, params) {
      const db = App.db;
      el.innerHTML = h`${App.head("가망고객", { actions: h`<button class="btn p" data-act="add">가망고객 등록</button>` })}
        <div class="card"><div class="filters">
          <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="이름으로 찾기" aria-label="이름"></div>
          <select class="in fix" data-on="f" data-k="manager" aria-label="담당자">${App.opts([...new Set(db.prospects.map((p) => p.manager).filter(Boolean))], st.manager, "담당자 전체")}</select>
          <span class="hint">다음 연락일</span>
          <div class="range"><input class="in" type="date" data-on="f" data-k="from" value="${st.from}" aria-label="다음 연락일 시작">~<input class="in" type="date" data-on="f" data-k="to" value="${st.to}" aria-label="다음 연락일 끝"></div>
          <button class="btn sm ghost" data-act="week">이번 주 연락할 건</button><button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div data-pills style="margin-top:12px"></div>
        <div data-tbl></div>
        <p class="hint" style="margin-top:8px">줄을 누르면 오른쪽에서 정보 수정 · 상담 메모 · 접수 전환을 할 수 있습니다. 연락처는 가린 값으로 보입니다.</p>`;

      const base = () => db.prospects.filter((p) => {
        if (st.q && !p.name.includes(st.q)) return false;
        if (st.manager && p.manager !== st.manager) return false;
        if (st.from && (!p.next || p.next < st.from)) return false;
        if (st.to && (!p.next || p.next > st.to)) return false;
        return true;
      });
      const rows = () => base().filter((p) => !st.state || p.state === st.state);
      const tbl = App.table($("[data-tbl]", el), [
        { label: "이름", render: (p) => h`<span class="name">${p.name}</span>` },
        { label: "연락처", render: (p) => h`<span class="num">${App.maskPhone(p.phone)}</span>` },
        { key: "carrier", label: "관심 통신사" }, { key: "interest", label: "관심 상품" },
        { label: "상담 상태", render: (p) => App.chip(p.state) },
        { key: "manager", label: "담당자" },
        { label: "다음 연락일", render: (p) => (p.next ? h`<span class="num ${p.next < App.today() && !done(p) ? "neg" : ""}">${p.next}</span>${p.next < App.today() && !done(p) ? h` <span class="neg" style="font-size:12px">지남</span>` : ""}` : "") },
        { label: "최근 메모", cls: "ell", render: (p) => (p.memos.length ? p.memos[0].text : "") },
        { label: "메모", r: 1, render: (p) => (p.memos.length ? p.memos.length + "건" : "") },
      ], rows(), {
        onRow: (p) => open(p.id), rowClass: (p) => (p.state === "종료" ? "off" : ""),
        bar: (n) => `검색 결과 <b>${n}</b>건`,
        empty: ["가망고객이 없습니다", "조건을 바꾸거나 오른쪽 위 「가망고객 등록」으로 새로 넣어 보세요."],
      });
      function refresh() {
        const b = base();
        App.pills($("[data-pills]", el), [["전체", b.length, ""], ...STATES.map((s) => [s, b.filter((p) => p.state === s).length, s])], st.state, (v) => { st.state = v; refresh(); });
        tbl.set(rows());
      }
      refresh();

      /* 서랍: 기본 정보 · 상담 메모 · 접수로 전환 */
      function open(id) {
        const p = db.prospects.find((x) => x.id === id); if (!p) return;
        App.drawer({
          title: () => h`${p.name} ${App.chip(p.state)}`,
          sub: () => h`${p.carrier || "통신사 미정"} · ${p.interest || "상품 미정"} · 담당 ${p.manager || "없음"}`,
          body: () => { const F = fields(p); return h`
            ${p.state === "전환" ? h`<div class="note ok">접수로 전환한 가망고객입니다. 접수 건은 전체 고객관리에서 봅니다.</div>` : ""}
            <section class="card" style="overflow:hidden" data-form><div class="sec-h" style="padding:12px 14px 0"><h2>기본 정보</h2></div>
              ${App.form(F, { cols: 1, values: Object.assign({}, p, { phone: "" }) })}
              <div class="row" style="padding:10px 12px;justify-content:flex-end"><button class="btn p" data-act="save">저장</button></div></section>
            <section class="sec"><div class="sec-h"><h2>상담 메모</h2><small>${p.memos.length}건</small></div>
              <div class="card pad"><textarea class="in" rows="3" maxlength="300" data-memo placeholder="상담 내용 (300자까지)" aria-label="상담 메모"></textarea><p class="errmsg" data-merr></p>
                <div class="row" style="margin-top:8px"><span class="hint">저장하면 일시 · 작성자와 함께 아래에 쌓입니다.</span><span class="sp"><button class="btn" data-act="memo">메모 저장</button></span></div></div>
              ${p.memos.length ? h`<div class="card pad" style="margin-top:10px"><div class="tl">${p.memos.map((m) => h`<div class="tl-i" style="grid-template-columns:minmax(0,1fr)"><div><p>${m.text}</p><div class="who">${App.dt(m.at)} · ${m.by}</div></div></div>`)}</div></div>` : h`<div class="card empty" style="margin-top:10px;padding:28px 16px"><b>상담 메모가 없습니다</b>첫 통화 내용을 위에 남겨 보세요.</div>`}</section>`; },
          footer: () => h`<button class="btn p" data-act="conv">접수로 전환</button><span class="hint" style="align-self:center">이름 · 연락처 · 관심 상품이 채워진 고객 등록이 열립니다.</span><span style="margin-left:auto"></span><button class="btn ghost" data-act="close">닫기</button>`,
          onDraw: (root, tab, api) => App.on(root, {
            close: () => api.close(),
            save: () => {
              const F = fields(p); const r = App.readForm($("[data-form]", root), F); if (!r.ok) return;
              const v = r.values; if (v.phone === "") delete v.phone;
              Object.assign(p, v); App.toast("저장했습니다"); api.redraw(); refresh();
            },
            memo: () => {
              const text = $("[data-memo]", root).value.trim(); const err = $("[data-merr]", root);
              if (!text) { err.textContent = "상담 내용을 넣어 주세요"; return; }
              if (text.length > 300) { err.textContent = "300자까지 넣을 수 있습니다"; return; }
              p.memos.unshift({ at: App.now(), by: App.session.name, text }); App.toast("메모를 저장했습니다"); api.redraw(); refresh();
            },
            conv: () => App.go("B-02", { from: p.id }),
          }),
        });
      }

      App.on(el, {
        q: (t) => { st.q = t.value.trim(); refresh(); },
        f: (t) => { st[t.dataset.k] = t.value; refresh(); },
        week: () => { const mon = App.weekStart(App.today()); st.from = mon; st.to = App.addDays(mon, 6); App.redraw(); },
        reset: () => { Object.assign(st, { q: "", state: "", manager: "", from: "", to: "" }); App.redraw(); },
        add: () => App.editModal({
          title: "가망고객 등록", fields: fields(null), values: { state: "신규" }, ok: "등록", done: "가망고객을 등록했습니다",
          onSave: (v) => { db.prospects.unshift(Object.assign({ id: App.uid("PS"), memos: [] }, v)); refresh(); },
        }),
      });
      if (params.id) open(params.id);
    },
  });
})();
</script>
<script>/* B-08 인사관리 (옛 SC-10). 유치자 · 담당자 · 상담원 명단. 로그인 계정이 아니라 접수 · 검색의 선택 항목으로만 쓰는 데이터다.
   역할은 여러 개를 겸할 수 있다(W-113). 퇴사 처리하면 새 접수에서 고를 수 없고, 지난 접수 건의 이름은 그대로 남는다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$;
  const ROLES = ["유치자", "담당자", "상담원"];
  const st = { q: "", org: "", role: "", state: "" };
  const orgs = (cur) => { const l = ["본사", ...App.db.partners.filter((p) => p.state === "거래중").map((p) => p.name)]; if (cur && !l.includes(cur)) l.push(cur); return l; };

  App.screen("B-08", {
    title: "인사관리", sc: ["SC-10"],
    render(el) {
      const db = App.db;
      el.innerHTML = h`${App.head("인사관리", { actions: h`<button class="btn p" data-act="add">명단 등록</button>` })}
        <div class="note gray">여기 명단은 로그인 계정이 아닙니다. 고객 등록과 검색에서 유치자 · 담당자 · 상담원을 고를 때 쓰입니다. 계정은 <a data-go="B-17">조직·계정</a>에서 발급합니다.</div>
        <div class="card"><div class="filters">
          <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="이름으로 찾기" aria-label="이름"></div>
          <select class="in fix" data-on="f" data-k="org" aria-label="소속">${App.opts([...new Set(db.staff.map((s) => s.org))], st.org, "소속 전체")}</select>
          <select class="in fix" data-on="f" data-k="role" aria-label="역할">${App.opts(ROLES, st.role, "역할 전체")}</select>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div data-pills style="margin-top:12px"></div>
        <div data-tbl></div>`;
      const base = () => db.staff.filter((s) => (!st.q || s.name.includes(st.q)) && (!st.org || s.org === st.org) && (!st.role || s.roles.includes(st.role)));
      const rows = () => base().filter((s) => !st.state || s.state === st.state);
      const tbl = App.table($("[data-tbl]", el), [
        { label: "이름", render: (s) => h`<span class="name">${s.name}</span>` },
        { key: "org", label: "소속" },
        { label: "역할", render: (s) => h`${s.roles.map((r) => h`<span class="chip c-${s.state === "퇴사" ? "gray" : r === "유치자" ? "blue" : r === "담당자" ? "violet" : "amber"}" style="margin-right:4px">${r}</span>`)}` },
        { label: "연락처", render: (s) => h`<span class="num">${App.maskPhone(s.phone)}</span>` },
        { label: "입사일", render: (s) => h`<span class="num">${s.joined}</span>` },
        { label: "재직 상태", render: (s) => h`${App.chip(s.state)}${s.left ? h` <span class="muted num" style="font-size:12px">${s.left}</span>` : ""}` },
        { label: "", r: 1, render: (s) => h`<button class="btn sm" data-act="edit" data-id="${s.id}">수정</button>${s.state === "재직" ? h` <button class="btn sm" data-act="leave" data-id="${s.id}" style="color:var(--red)">퇴사 처리</button>` : ""}` },
      ], rows(), {
        rowClass: (s) => (s.state === "퇴사" ? "off" : ""), onRow: (s) => edit(s),
        bar: (n) => `검색 결과 <b>${n}</b>건 · 재직 ${rows().filter((s) => s.state === "재직").length}명`,
        empty: ["명단이 없습니다", "조건을 바꾸거나 「명단 등록」으로 새로 넣어 보세요."],
      });
      function refresh() {
        const b = base();
        App.pills($("[data-pills]", el), [["전체", b.length, ""], ["재직", b.filter((s) => s.state === "재직").length, "재직"], ["퇴사", b.filter((s) => s.state === "퇴사").length, "퇴사"]], st.state, (v) => { st.state = v; refresh(); });
        tbl.set(rows());
      }
      refresh();

      /* 등록 · 수정 팝업(W-114). 역할은 여러 개 체크. */
      function edit(s) {
        const F = [
          { name: "name", label: "이름", required: true, pattern: /^.{1,20}$/, msg: "이름은 20자까지 넣을 수 있습니다" },
          { name: "org", label: "소속", type: "select", options: orgs(s && s.org), required: true },
          { name: "roles", label: "역할", required: true, html: String(h`<div class="row" data-roles>${ROLES.map((r) => h`<label class="check"><input type="checkbox" class="cb" value="${r}" ${s && s.roles.includes(r) ? App.raw("checked") : ""}> ${r}</label>`)}</div>`), hint: "겸하는 역할을 모두 체크합니다. 체크한 역할의 선택 항목에 이름이 나옵니다." },
          { name: "phone", label: "연락처", type: "tel", placeholder: s && s.phone ? App.maskPhone(s.phone) : "010-0000-0000", hint: s && s.phone ? "바꿀 때만 새 번호를 넣습니다. 비워 두면 그대로 둡니다." : "" },
          { name: "joined", label: "입사일", type: "date" },
        ];
        if (s) F.push({ name: "state", label: "재직 상태", type: "static", value: s.state + (s.left ? ` (${s.left} 퇴사 처리)` : "") });
        App.modal({
          title: s ? `${s.name} 수정` : "명단 등록",
          body: h`<div class="card" style="overflow:hidden">${App.form(F, { cols: 1, values: s ? Object.assign({}, s, { phone: "" }) : { org: "본사", joined: App.today() } })}</div><p data-top style="margin-top:8px;font-size:12px;font-weight:600;color:var(--red)"></p>`,
          actions: [{ label: "취소" }, { label: s ? "저장" : "등록", kind: "p", onClick: (close, root) => {
            const top = $("[data-top]", root); top.textContent = "";
            const r = App.readForm(root, F); const roles = $$("[data-roles] input:checked", root).map((c) => c.value);
            if (!roles.length) top.textContent = "역할을 하나 이상 체크해 주세요";
            if (!r.ok || !roles.length) return;
            const v = r.values; if (v.phone === "") delete v.phone; v.roles = roles;
            if (s) { const before = s.roles.join(" · "); Object.assign(s, v); if (before !== roles.join(" · ")) App.log("기준정보", `${s.name} 역할 변경(인사관리)`, before, roles.join(" · ")); }
            else { db.staff.unshift(Object.assign({ id: App.uid("E"), phone: "", state: "재직" }, v)); App.log("기준정보", `${v.name} 명단 등록(인사관리)`, "", `${v.org} · ${roles.join(" · ")}`); }
            close(); App.toast(s ? "저장했습니다" : "명단에 등록했습니다"); refresh();
          } }],
        });
      }

      App.on(el, {
        q: (t) => { st.q = t.value.trim(); refresh(); },
        f: (t) => { st[t.dataset.k] = t.value; refresh(); },
        reset: () => { Object.assign(st, { q: "", org: "", role: "", state: "" }); App.redraw(); },
        add: () => edit(null),
        edit: (t) => edit(db.staff.find((s) => s.id === t.dataset.id)),
        leave: async (t) => {
          const s = db.staff.find((x) => x.id === t.dataset.id);
          const ok = await App.confirm(`${s.name}님을 퇴사 처리하시겠습니까?`, { danger: true, ok: "퇴사 처리", detail: "새 접수에서 이 이름을 고를 수 없게 됩니다. 지난 접수 건에 남은 이름은 그대로 보입니다. 되돌릴 수 없습니다." });
          if (!ok) return;
          s.state = "퇴사"; s.left = App.today(); App.log("기준정보", `${s.name} 퇴사 처리(인사관리)`, "재직", "퇴사"); App.toast("퇴사 처리했습니다"); refresh();
        },
      });
    },
  });
})();
</script>
<script>/* B-09 고객센터 (옛 SC-11 본사 쪽). 탭 공지사항(쓰기) · 문의(답변 대기 건수, 답변 저장).
   문의는 받은편지함처럼 왼쪽 목록 · 오른쪽 본문과 답변. 답변을 저장하면 「답변 완료」가 되고 협력점 화면에 바로 보인다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { tab: "notice", nq: "", state: "", partner: "", sel: "" };

  App.screen("B-09", {
    title: "고객센터", sc: ["SC-11"],
    render(el, params) {
      if (params.tab) { st.tab = params.tab === "inq" ? "inq" : "notice"; params.tab = ""; }
      const db = App.db; const waiting = () => db.inquiries.filter((q) => q.state === "답변 대기").length;
      el.innerHTML = h`${App.head("고객센터", { actions: st.tab === "notice" ? h`<button class="btn p" data-act="write">공지 쓰기</button>` : "" })}
        <div data-tabs></div><div data-body></div>`;
      App.tabs($("[data-tabs]", el), [["notice", "공지사항"], ["inq", "문의", waiting() || ""]], st.tab, (k) => { st.tab = k; App.redraw(); });
      const body = $("[data-body]", el);

      if (st.tab === "notice") {
        body.innerHTML = h`<div class="card"><div class="filters"><div class="search grow"><input class="in" data-on="nq" data-live value="${st.nq}" placeholder="제목 · 내용으로 찾기" aria-label="공지 검색"></div><span class="hint">공지는 협력점 · 하부점의 고객센터에 바로 보입니다.</span></div></div><div data-tbl style="margin-top:10px"></div>`;
        const rows = () => db.notices.filter((n) => !st.nq || n.title.includes(st.nq) || n.body.includes(st.nq));
        const tbl = App.table($("[data-tbl]", body), [
          { label: "제목", render: (n) => h`<span class="name">${n.title}</span>` },
          { label: "내용", cls: "ell", render: (n) => h`<span class="muted">${n.body}</span>` },
          { label: "작성일", render: (n) => h`<span class="num">${App.dt(n.at)}</span>` },
          { key: "by", label: "작성자" },
        ], rows(), { onRow: (n) => App.modal({ title: n.title, sub: `${App.dt(n.at)} · ${n.by}`, wide: true, body: h`<p style="white-space:pre-wrap;line-height:1.7">${n.body}</p>` }), bar: (n) => `공지 <b>${n}</b>건`, empty: ["공지가 없습니다", "오른쪽 위 「공지 쓰기」로 첫 공지를 올려 보세요."] });
        App.on(el, {
          nq: (t) => { st.nq = t.value.trim(); tbl.set(rows()); },
          write: () => App.editModal({
            title: "공지 쓰기", wide: true, ok: "올리기", done: "공지를 올렸습니다", note: "올리면 협력점 · 하부점 고객센터의 공지사항 맨 위에 보입니다. 따로 알림은 가지 않습니다.",
            fields: [{ name: "title", label: "제목", required: true, pattern: /^.{1,60}$/, msg: "제목은 60자까지 넣을 수 있습니다" }, { name: "body", label: "내용", type: "textarea", required: true, rows: 8, max: 1000, hint: "1,000자까지" }],
            onSave: (v) => { db.notices.unshift({ id: App.uid("NT"), title: v.title, body: v.body, at: App.now(), by: App.session.name }); tbl.set(rows()); },
          }),
        });
        return;
      }

      /* 문의 탭 */
      body.innerHTML = h`<style>.b09-q{white-space:pre-wrap;word-break:break-word;line-height:1.7;font-size:14px}.b09-a{background:var(--sunk);border-radius:var(--r1);padding:10px 12px;margin-top:6px}</style>
        <div class="row" style="margin-bottom:10px"><div data-pills style="margin:0"></div><span class="sp"><select class="in fix" data-on="partner" aria-label="협력점">${App.opts(db.partners.map((p) => [p.id, p.name]), st.partner, "협력점 전체")}</select></span></div>
        <div class="split" style="grid-template-columns:minmax(0,1fr) minmax(380px,520px)"><div data-tbl></div><div data-view></div></div>`;
      const base = () => db.inquiries.filter((q) => !st.partner || q.partnerId === st.partner);
      const rows = () => base().filter((q) => !st.state || q.state === st.state);
      const tbl = App.table($("[data-tbl]", body), [
        { label: "제목", render: (q) => h`<span class="name">${q.title}</span>` },
        { label: "협력점", render: (q) => App.partnerName(q.partnerId) },
        { label: "등록일", render: (q) => h`<span class="num">${App.dt(q.at)}</span>` },
        { label: "답변 상태", render: (q) => App.chip(q.state) },
      ], rows(), { onRow: (q) => { st.sel = q.id; refresh(); }, rowClass: (q) => (q.id === st.sel ? "sel" : ""), sizes: false, bar: (n) => `문의 <b>${n}</b>건 · 답변 대기 ${rows().filter((q) => q.state === "답변 대기").length}건`, empty: ["문의가 없습니다", "협력점이 문의를 올리면 여기에 보입니다."] });
      function view() {
        const v = $("[data-view]", body); const q = db.inquiries.find((x) => x.id === st.sel);
        if (!q) { v.innerHTML = h`<div class="card empty"><b>문의를 골라 주세요</b>왼쪽 목록에서 문의를 누르면 본문과 답변 칸이 열립니다.</div>`; return; }
        v.innerHTML = h`<div class="card pad">
          <div class="sec-h"><h2>${q.title}</h2><span class="sp">${App.chip(q.state)}</span></div>
          <div class="hint" style="margin-bottom:10px">${App.partnerName(q.partnerId)} · ${q.by} · ${App.dt(q.at)}</div>
          <p class="b09-q">${q.body}</p>
          <div style="border-top:1px solid var(--line2);margin-top:14px;padding-top:12px">
          ${q.state === "답변 완료" ? h`<div class="lbl">답변</div><div class="b09-a"><p class="b09-q">${q.answer}</p><div class="hint" style="margin-top:4px">${App.dt(q.answerAt)} · ${q.answerBy || "임본사"}</div></div>`
            : h`<label class="lbl" for="b09-ans">답변</label><textarea class="in" id="b09-ans" rows="5" maxlength="1000" data-ans placeholder="답변 내용 (1,000자까지)"></textarea><p class="errmsg" data-err></p>
              <div class="row" style="margin-top:8px"><span class="hint">저장하면 「답변 완료」가 되고 협력점 화면에 바로 보입니다.</span><span class="sp"><button class="btn p" data-act="answer">답변 저장</button></span></div>`}
          </div></div>`;
      }
      function refresh() {
        const b = base();
        App.pills($("[data-pills]", body), [["전체", b.length, ""], ["답변 대기", b.filter((q) => q.state === "답변 대기").length, "답변 대기"], ["답변 완료", b.filter((q) => q.state === "답변 완료").length, "답변 완료"]], st.state, (v) => { st.state = v; refresh(); });
        $("[data-pills]", body).style.margin = "0";
        if (st.sel && !rows().some((q) => q.id === st.sel)) st.sel = "";
        if (!st.sel) { const first = rows().find((q) => q.state === "답변 대기") || rows()[0]; if (first) st.sel = first.id; }
        tbl.set(rows()); view();
      }
      refresh();
      App.on(el, {
        partner: (t) => { st.partner = t.value; refresh(); },
        answer: () => {
          const q = db.inquiries.find((x) => x.id === st.sel); const text = $("[data-ans]", body).value.trim(); const err = $("[data-err]", body);
          if (!text) { err.textContent = "답변 내용을 넣어 주세요"; return; }
          q.answer = text; q.answerAt = App.now(); q.answerBy = App.session.name; q.state = "답변 완료";
          App.toast("답변을 저장했습니다"); App.redraw();
        },
      });
    },
  });
})();
</script>
<script>/* B-10 전체 정산관리 (옛 SC-12 + 「일반」 단추 = SC-15 건별 정산 상세 서랍 + 협력점명 = SC-16 협력점 정보 팝업).
   상품(접수 건) 단위 정산 장부. 건별 정산금액 = (상부수수료 + 약정금액 + 셋탑박스 + 부가서비스) − (본사사은품 + 사은품 + 추가사은품 + 미비서류 + 기타).
   금액은 App.settleOf(c) 값을 그대로 쓴다(여기서 다시 계산하지 않는다). 지급처 · 지급완료는 조회만(바꾸기는 고객 상세 · D-8). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const F0 = { group: "", partner: "", recruiter: "", upper: "", carrier: "", product: "", model: "", setbox: "", set: "", open: "__open", by: "openedAt", from: "", to: "" };
  const st = { q: "", more: false, f: Object.assign({}, F0) };
  const cache = new Map(); // 줄 객체를 유지해야 거르기를 바꿔도 선택이 남는다
  const rowOf = (c) => { let r = cache.get(c.id); if (!r) { r = { c }; cache.set(c.id, r); } r.s = App.settleOf(c); return r; };
  const partnerOf = (pid) => App.db.partners.find((p) => p.id === pid) || {};
  const amt = (v) => (v ? App.won(v) : "");
  const noFee = () => h`<a class="neg b10-nofee" data-go="B-14" data-params="tab=fee" title="수수료표 등록으로">수수료 미등록</a>`;
  /** 이 건이 든 협력점 주간 정산(확정 취소된 것은 건이 풀려 있다) */
  const weeklyOf = (c) => (c.settleId ? App.db.settlements.find((s) => s.id === c.settleId) : null);
  const locked = (c) => { const s = weeklyOf(c); return !!(s && s.state === "확정"); };
  const viaPartner = (c) => c.via !== "본사";

  /* ── 건별 정산 상세(서랍) ── */
  function openDetail(c, after) {
    const fields = [
      { name: "dedDocs", label: "미비서류 차감", unit: "원", pattern: /^\d+$/, msg: "0 이상의 금액을 넣어 주세요", placeholder: "0" },
      { name: "dedDocsWhy", label: "미비서류 사유", type: "text", placeholder: "금액을 넣으면 사유도 넣어 주세요" },
      { name: "dedEtc", label: "기타 차감", unit: "원", pattern: /^\d+$/, msg: "0 이상의 금액을 넣어 주세요", placeholder: "0" },
      { name: "dedEtcWhy", label: "기타 사유", type: "text", placeholder: "금액을 넣으면 사유도 넣어 주세요" },
    ];
    App.drawer({
      wide: true,
      title: () => h`${c.name} 건별 정산 ${App.chip(c.openState)}`,
      sub: () => h`${c.carrier} · ${c.product} · ${c.contract} · ${App.orgOf(c)} · 개통일 ${c.openedAt || "-"} · 금액 단위: 원`,
      body: () => {
        const s = App.settleOf(c); const wk = weeklyOf(c); const lock = locked(c); const claw = App.db.clawbacks.filter((k) => k.cid === c.id);
        const line = (l, v, neg, why) => h`<div class="l"><span>${l}${why ? h`<small>${why}</small>` : ""}</span><b class="num">${v == null ? h`<span class="neg">수수료 미등록</span>` : neg ? (v ? h`<span class="neg">-${App.won(v)}</span>` : h`<span class="muted">0</span>`) : App.won(v)}</b></div>`;
        return h`
          ${lock ? h`<div class="note warn"><b>확정된 정산에 든 건입니다.</b> ${App.partnerName(wk.partnerId)} ${App.weekLabel(wk.week)} 정산이 확정되어 차감을 바꿀 수 없습니다. 바꾸려면 주간 정산에서 확정을 취소해야 합니다. <a data-go="B-11" data-params="week=${wk.week}&step=3">주간 정산으로</a></div>` : ""}
          ${App.isOpened(c) ? "" : h`<div class="note gray">${c.openState === "해지" ? "해지된 건입니다. 환수는 환수·미수 화면에서 등록합니다." : "아직 개통 전이라 정산 대상이 아닙니다."} 아래는 지금 값으로 본 금액입니다.</div>`}
          ${s.fee ? "" : h`<div class="note bad"><b>수수료 미등록.</b> 접수일시(${App.dt(c.receivedAt)})에 맞는 수수료표가 없어 정산금액을 낼 수 없습니다(0원으로 치지 않습니다). <a data-go="B-14" data-params="tab=fee">수수료표 등록</a></div>`}
          <div class="card pad"><dl class="kv">

        xls: () => App.fake(`검색 결과 ${tbl.rows().length}건 엑셀저장(화면과 같은 합계)`),
      });
      if (params.id) { const c = App.cust(params.id); delete params.id; if (c) openDetail(c, refresh); }
    },
  });
})();
</script>
<script>/* B-11 주간 정산 (옛 SC-51 수수료 자동 적용 + SC-26 주간 정산 생성 + SC-21 확정·확정 취소 + SC-27 명세서 + SC-14 정산서 발송).
   한 주의 정산 한 바퀴를 한 화면에서: ① 수수료 확인 › ② 정산안 만들기 › ③ 검토 · 확정 › ④ 명세서 · 발송.
   금액은 전부 data.js 의 App.buildSettlement / confirmSettlement / cancelSettlement 결과를 그대로 보여 준다(여기서 다시 계산하지 않는다).
   미리 보기 = buildSettlement 를 돌린 뒤 바로 되돌린 값. 정산안은 「지금 다시 만들면 나올 값」과 같을 때만 확정할 수 있다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = {
    week: "", step: "",
    s1: { only: "", partner: "", carrier: "", more: false, group: "", recruiter: "", upper: "", product: "", set: "", open: "" },
    s2: { group: "", partner: "" },
    s3: { state: "", q: "", group: "", upper: "" },
  };
  const D = () => App.db;
  const thisWeek = () => App.weekStart(App.today());
  const lastWeek = () => App.addDays(thisWeek(), -7);
  const ended = (mon) => App.addDays(mon, 6) < App.today(); // 일요일이 지나야 그 주가 끝난다
  const liveOf = (mon, pid) => D().settlements.find((s) => s.week === mon && s.partnerId === pid && s.state !== "확정 취소");
  const partnerOf = (pid) => D().partners.find((p) => p.id === pid) || {};
  const minus = (n) => (n ? h`<span class="neg">-${App.won(n)}</span>` : h`<span class="muted">0</span>`);
  const carry = (n) => (n ? h`<span class="neg">${App.won(n)}</span>` : h`<span class="muted">0</span>`);
  const feeCell = (v) => (v == null ? h`<a class="neg b11-nofee" data-go="B-14" data-params="tab=fee" title="수수료표 등록으로">수수료 미등록</a>` : App.won(v));

  /* ── 미리 보기 · 다시 만들기: data.js 계산 함수를 그대로 돌리고, 장부에 남기지 않을 때는 되돌린다 ── */
  function discard(s) {
    const db = D(); const i = db.settlements.indexOf(s); if (i >= 0) db.settlements.splice(i, 1);
    s.items.forEach((it) => { const c = App.cust(it.cid); if (c && c.settleId === s.id) c.settleId = ""; });
    db.clawbacks.forEach((k) => { if (k.settleId === s.id) k.settleId = ""; });
  }
  /** 아직 정산안이 없는 협력점의 「만들면 이렇게 됩니다」 */
  function dry(mon, pid) { const n = App.buildSettlement(mon, pid); discard(n); return n; }
  /** 이미 있는 정산안을 지금 값으로 다시 만들면 나올 값(장부는 그대로 둔다) */
  function fresh(s) {
    const db = D(); const i = db.settlements.indexOf(s); const claws = db.clawbacks.filter((k) => k.settleId === s.id);
    discard(s); const n = dry(s.week, s.partnerId);
    db.settlements.splice(i, 0, s); s.items.forEach((it) => { const c = App.cust(it.cid); if (c && !c.settleId) c.settleId = s.id; }); claws.forEach((k) => (k.settleId = s.id));
    return n;
  }
  /** 정산안을 만든 뒤 바뀐 것(있으면 확정을 막고 다시 만들게 한다) */
  function staleWhy(s) {
    if (s.state !== "정산안") return [];
    const n = fresh(s); const why = [];
    if (n.items.length !== s.items.length || n.items.some((i) => !s.items.some((x) => x.cid === i.cid))) why.push(`개통 건 ${s.items.length}건 → ${n.items.length}건`);
    else if (n.items.some((i) => s.items.find((x) => x.cid === i.cid).fee !== i.fee)) why.push("수수료표가 바뀜");
    if (n.clawSum !== s.clawSum) why.push(`환수 차감 ${App.won(s.clawSum)} → ${App.won(n.clawSum)}`);
    if (n.carried !== s.carried) why.push(`이월 미수 ${App.won(s.carried)} → ${App.won(n.carried)}`);
    return why;
  }
  /** 확정 취소를 막아야 하는 경우: 이 정산 뒤에 같은 협력점의 미수 잔액이 또 바뀌었으면 순서대로 되돌려야 잔액이 맞는다 */
  function cancelBlock(s) {
    const rows = D().receivables.filter((r) => r.partnerId === s.partnerId); let last = -1;
    rows.forEach((r, i) => { if (r.week === s.week) last = i; });
    if (last >= 0 && last < rows.length - 1) return `이 정산 뒤에 확정된 ${App.weekLabel(rows[rows.length - 1].week)} 정산이 미수 잔액을 바꿨습니다. 그 정산을 먼저 확정 취소해 주세요.`;
    return "";
  }
  /** 표 안에 쓰는 짧은 말(자세한 설명은 「확정」을 눌렀을 때) */
  function confirmShort(r) {
    const s = r.s;
    if (!ended(s.week)) return `주가 끝난 뒤 확정 (${App.addDays(s.week, 6).slice(5).replace("-", ".")} 일요일까지 진행 중)`;
    if (r.stale.length) return `다시 만들기 필요 · ${r.stale.join(", ")}`;
    if (s.unpriced) return `수수료 미등록 ${s.unpriced}건 · 수수료표 등록 뒤 다시 만들기`;
    return "";
  }
  function confirmBlock(r) {
    const s = r.s;
    if (!ended(s.week)) return `이 주는 ${App.addDays(s.week, 6)}(일)에 끝납니다. 주가 끝난 뒤 확정할 수 있습니다.`;
    if (r.stale.length) return `정산안을 만든 뒤 바뀐 내용이 있습니다(${r.stale.join(", ")}). 「다시 만들기」를 한 뒤 확정해 주세요.`;
    if (s.unpriced) return `수수료 미등록 ${s.unpriced}건이 있습니다. 수수료표를 등록하고 정산안을 다시 만든 뒤 확정해 주세요.`;
    return "";
  }

  /** 그 주의 정산 현황. 줄 = 협력점 하나(개통 건이 있거나, 정산이 있거나, 차감할 확정 환수가 기다리는 곳) */
  function weekInfo(mon) {
    const db = D(); const recent = mon >= lastWeek();
    const rows = db.partners.map((p) => {
      const s = liveOf(mon, p.id); const cnt = App.weekItems(mon, p.id).length;
      const pend = recent && db.clawbacks.some((k) => k.partnerId === p.id && k.state === "확정" && !k.settleId);
      if (!s && !cnt && !pend) return null;
      return { p, s: s || null, v: s || dry(mon, p.id), stale: s ? staleWhy(s) : [] };
    }).filter(Boolean);
    const sum = (k) => rows.reduce((a, r) => a + (k === "n" ? r.v.items.length : r.v[k]), 0);
    const none = rows.filter((r) => !r.s); const draft = rows.filter((r) => r.s && r.s.state === "정산안"); const conf = rows.filter((r) => r.s && r.s.state === "확정");
    const open = none.concat(draft);
    return { mon, rows, none, draft, conf, sent: conf.filter((r) => r.s.sent), ended: ended(mon), n: sum("n"), feeSum: sum("feeSum"), clawSum: sum("clawSum"), carried: sum("carried"), pay: sum("pay"), newRecv: sum("newRecv"),
      unpriced: open.reduce((a, r) => a + r.v.unpriced, 0), unpricedFixed: conf.reduce((a, r) => a + r.s.unpriced, 0), staleN: draft.filter((r) => r.stale.length).length, canceled: db.settlements.filter((s) => s.week === mon && s.state === "확정 취소") };
  }
  /** 지금 어디까지 왔고 다음에 무엇을 하면 되는지 */
  function nextOf(w) {
    if (!w.rows.length) return { step: "1", tone: "idle", text: "이 주에는 정산할 개통 건이 없습니다", sub: "개통일이 이 주(월~일)에 든 유심개통 · 개통완료 건이 생기면 여기에 모입니다." };
    if (w.unpriced) return { step: "1", only: "none", tone: "todo", text: `수수료 미등록 ${w.unpriced}건부터 해결하세요`, sub: "수수료표를 등록해야 금액이 잡힙니다. 미등록 건은 0원으로 치지 않습니다.", btn: "미등록 건 보기" };
    if (w.none.length) return { step: "2", tone: "todo", text: `정산안을 만들 협력점이 ${w.none.length}곳 있습니다`, sub: w.ended ? "미리 본 금액을 확인하고 「정산안 만들기」를 누르세요." : `이 주는 ${App.addDays(w.mon, 6)}(일)까지 진행 중입니다. 정산안은 미리 만들 수 있지만 확정은 주가 끝난 뒤에 합니다.`, btn: "② 정산안 만들기로" };
    if (w.staleN) return { step: "3", tone: "todo", text: `다시 만들어야 하는 정산안이 ${w.staleN}건 있습니다`, sub: "정산안을 만든 뒤 개통 건 · 환수 · 미수가 바뀌었습니다. 「다시 만들기」로 지금 값에 맞추세요.", btn: "③ 검토 · 확정으로" };
    if (w.draft.length) return w.ended ? { step: "3", tone: "todo", text: `확정을 기다리는 정산안이 ${w.draft.length}건 있습니다`, sub: "금액을 검토하고 「확정」을 누르면 금액이 고정됩니다.", btn: "③ 검토 · 확정으로" }
      : { step: "3", tone: "idle", text: `정산안 ${w.draft.length}건 · 주가 끝나면 확정할 수 있습니다`, sub: `이 주는 ${App.addDays(w.mon, 6)}(일)까지 진행 중입니다. 그 사이 개통 건이 늘면 정산안을 다시 만들어야 합니다.` };
    if (w.sent.length < w.conf.length) return { step: "4", tone: "todo", text: `발송 전 명세서가 ${w.conf.length - w.sent.length}건 있습니다`, sub: "확정된 명세서를 골라 「발송」하면 협력점 화면에서 바로 볼 수 있습니다.", btn: "④ 명세서 · 발송으로" };
    return { step: "4", tone: "done", text: "이 주 정산은 발송까지 끝났습니다", sub: `확정 ${w.conf.length}건 · 발송 ${w.sent.length}건. 명세서는 ④에서 다시 열어 볼 수 있습니다.${w.unpricedFixed ? ` 수수료 미등록 ${w.unpricedFixed}건은 금액 없이 확정되어 있습니다(① 에서 확인).` : ""}` };
  }
  const weekWord = (w) => (!w.rows.length ? "대상 없음" : w.unpriced ? `미등록 ${w.unpriced}` : w.none.length ? `정산안 전 ${w.none.length}` : w.draft.length ? `확정 전 ${w.draft.length}` : w.sent.length < w.conf.length ? `발송 전 ${w.conf.length - w.sent.length}` : "발송 끝");

  /** ① 에 보일 그 주 개통 건(정산에 든 건은 정산에 적힌 금액 = 고정값, 아직 안 든 건은 지금 수수료표 값) */
  function feeRows(w) {
    const out = [];
    w.rows.forEach((r) => {
      const seen = new Set();
      const add = (c, it) => { if (!c || seen.has(c.id)) return; seen.add(c.id); const f = App.feeOf(c); out.push({ c, s: r.s, f, it, partner: it ? it.fee : f ? f.partner : null, ver: it ? it.ver : f ? f.ver : null, upper: f ? f.upper : null }); };
      if (r.s) r.s.items.forEach((it) => add(App.cust(it.cid), it));
      App.weekItems(w.mon, r.p.id).forEach((c) => add(c, null));
    });
    return out.sort((a, b) => (a.c.openedAt < b.c.openedAt ? -1 : 1));
  }

  /* ── 명세서(협력점 하나 · 한 주) ── */
  function openStatement(s, after) {
    let carrier = "";
    const p = partnerOf(s.partnerId);
    App.drawer({
      wide: true,
      title: () => h`${p.name} ${s.state === "확정" ? "정산 명세서" : s.state === "정산안" ? "정산안" : "정산 명세서(취소됨)"} ${App.chip(s.state)}`,
      sub: () => h`정산 주차 ${App.weekLabel(s.week)} (월~일 · 개통일 기준) · 금액 단위: 원`,
      body: () => {
        const db = D(); const claws = db.clawbacks.filter((k) => s.clawIds.includes(k.id));
        const items = s.items.map((it) => ({ it, c: App.cust(it.cid) || {} }));
        const carriers = [...new Set(items.map((x) => x.c.carrier).filter(Boolean))];
        const view = carrier ? items.filter((x) => x.c.carrier === carrier) : items;
        // 맞춤 확인: 건별 합 = 수수료 합계, 환수 건 합 = 환수 차감, 수수료 − 환수 − 이월 미수 = 지급액 − 새 미수
        const itemSum = s.items.reduce((a, i) => a + (i.fee || 0), 0); const clawSum = claws.reduce((a, k) => a + k.amount, 0);
        const bad = itemSum !== s.feeSum || clawSum !== s.clawSum || s.feeSum - s.clawSum - s.carried !== s.pay - s.newRecv;
        return h`
          ${s.state === "정산안" ? h`<div class="note warn">아직 확정 전인 정산안입니다. 확정해야 금액이 고정되고 협력점에 보낼 수 있습니다.</div>` : ""}
          ${s.state === "확정 취소" ? h`<div class="note bad"><b>확정 취소된 정산입니다.</b> 사유: ${s.cancelWhy}</div>` : ""}
          ${bad ? h`<div class="note bad"><b>합계가 맞지 않습니다.</b> 건별 수수료 합 ${App.won(itemSum)} · 수수료 합계 ${App.won(s.feeSum)} · 환수 건 합 ${App.won(clawSum)} · 환수 차감 ${App.won(s.clawSum)}. 확정 전에 정산안을 다시 만들어 주세요.</div>` : ""}
          ${s.unpriced ? h`<div class="note bad"><b>수수료 미등록 ${s.unpriced}건</b>은 금액 없이 들어 있습니다(0원으로 계산한 것이 아닙니다). <a data-go="B-14" data-params="tab=fee">수수료표 등록</a></div>` : ""}
          <div class="b11-pay card"><div><span>최종 지급액</span><b class="num">${App.won(s.pay)}<small>원</small></b></div>
            <dl class="kv"><dt>협력점</dt><dd>${p.name} · ${p.group || "-"}</dd><dt>정산 계좌</dt><dd class="num">${p.bank || ""} ${App.maskAcct(p.acct)}</dd><dt>정산 확정일</dt><dd class="num">${s.state === "확정" ? App.dt(s.confirmedAt) : "확정 전"}</dd><dt>발송</dt><dd class="num">${s.sent ? App.dt(s.sent) : "발송 전"}</dd></dl></div>
          <section class="sec"><div class="sec-h"><h2>개통 건별 수수료</h2><small>${s.items.length}건</small><span class="sp">${carriers.length > 1 ? h`<select class="in fix" data-on="carrier" aria-label="통신사" style="height:28px">${App.opts(carriers, carrier, "통신사 전체")}</select>` : ""}</span></div>
            <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>No</th><th>고객명</th><th>통신사</th><th>상품</th><th>약정</th><th>개통일</th><th>적용 버전</th><th class="r">협력점 수수료</th></tr></thead><tbody>
              ${view.map((x, i) => h`<tr><td class="num muted">${i + 1}</td><td class="name">${x.it.name}</td><td>${x.c.carrier || "-"}</td><td>${x.it.product}</td><td>${x.c.contract || "-"}</td><td class="num">${x.c.openedAt || "-"}</td><td class="num">${x.it.ver == null ? "-" : "v" + x.it.ver}</td><td class="r">${x.it.fee == null ? h`<span class="neg">수수료 미등록</span>` : App.won(x.it.fee)}</td></tr>`)}
              ${carrier ? h`<tr class="sum"><td colspan="7">${carrier} 소계 (${view.length}건)</td><td class="r">${App.won(view.reduce((a, x) => a + (x.it.fee || 0), 0))}</td></tr>` : ""}
              <tr class="sum"><td colspan="7">수수료 합계 (${s.items.length}건)</td><td class="r">${App.won(s.feeSum)}</td></tr></tbody></table></div>
              ${s.items.length ? "" : h`<div class="empty" style="padding:20px"><b>이 주에 개통 건이 없습니다</b>확정된 환수만 차감하는 정산입니다.</div>`}</div></section>
          <section class="sec"><div class="sec-h"><h2>지급액 계산</h2></div>
            <div class="card b11-led">
              <div class="l"><span>수수료 합계 <small>${s.items.length}건</small></span><b class="num">${App.won(s.feeSum)}</b></div>
              <div class="l"><span>환수 차감 <small>확정된 환수 ${claws.length}건</small></span><b class="num">${minus(s.clawSum)}</b></div>
              ${claws.map((k) => h`<div class="l cl"><span>${(App.cust(k.cid) || {}).name || "-"} · ${k.why}</span><b class="num">-${App.won(k.amount)}</b></div>`)}
              <div class="l"><span>미수 이월 차감 <small>지난 정산에서 넘어온 미수</small></span><b class="num">${minus(s.carried)}</b></div>
              <div class="l tot"><span>최종 지급액</span><b class="num">${App.won(s.pay)}</b></div>
              <div class="l"><span>새 미수 <small>지급액이 모자라 다음 정산으로 넘기는 금액</small></span><b class="num">${carry(s.newRecv)}</b></div>
            </div>
            <p class="hint" style="margin-top:8px">수수료 합계 − 환수 차감 − 미수 이월 차감이 0보다 작으면 지급액은 0원이 되고, 모자란 금액은 미수로 넘어갑니다.</p></section>`;
      },
      footer: () => h`<button class="btn" data-act="down">명세서 내려받기</button><button class="btn" data-act="xls">엑셀저장</button><span style="margin-left:auto"></span><button class="btn ghost" data-act="close">닫기</button>`,
      onDraw: (root, tab, api) => App.on(root, {
        close: () => api.close(), carrier: (t) => { carrier = t.value; api.redraw(); },
        down: () => App.fake(`${p.name} ${App.weekLabel(s.week)} 명세서 내려받기(엑셀)`), xls: () => App.fake(`개통 건 ${s.items.length}건 엑셀저장`),
      }),
    });
    if (after) after();

      /* ③ 검토 · 확정 */
      if (step === "3") {
        const f = st.s3; const all = db.settlements.filter((s) => s.week === mon);

      const find = (id) => db.settlements.find((s) => s.id === id);

        step: (t) => { st.step = t.dataset.s; if (t.dataset.only) st.s1.only = t.dataset.only; App.redraw(); window.scrollTo(0, 0); },
        xls: () => App.fake(`${App.weekLabel(mon)} 주간 정산 엑셀저장`),

        onlyNone: (t) => { st.s1.only = t.checked ? "none" : ""; App.redraw(); },
        f1: (t) => { st.s1[t.dataset.k] = t.value; App.redraw(); }, more1: () => { st.s1.more = !st.s1.more; App.redraw(); },
        reset1: () => { Object.assign(st.s1, { only: "", partner: "", carrier: "", group: "", recruiter: "", upper: "", product: "", set: "", open: "" }); App.redraw(); },
        f2: (t) => { st.s2[t.dataset.k] = t.value; App.redraw(); },
        f3: (t) => { st.s3[t.dataset.k] = t.value; App.redraw(); }, st3: (t) => { st.s3.state = st.s3.state === t.dataset.v ? "" : t.dataset.v; App.redraw(); },
        q3: (t) => { st.s3.q = t.value.trim(); if (tbl && st._rows3) tbl.set(st._rows3()); }, reset3: () => { Object.assign(st.s3, { state: "", q: "", group: "", upper: "" }); App.redraw(); },
        stmt: (t) => openStatement(find(t.dataset.id)),
        build: async () => {
          const f = st.s2; const list = w.none.filter((r) => (!f.group || r.p.group === f.group) && (!f.partner || r.p.id === f.partner));
          if (!list.length) { App.toast("만들 정산안이 없습니다"); return; }
          if (!w.ended && !(await App.confirm("아직 끝나지 않은 주입니다. 정산안을 미리 만드시겠습니까?", { detail: `이 주는 ${App.addDays(mon, 6)}(일)에 끝납니다. 그 뒤 개통 건이 늘면 「다시 만들기」를 해야 하고, 확정은 주가 끝난 뒤에 할 수 있습니다.`, ok: "미리 만들기" }))) return;
          list.forEach((r) => App.buildSettlement(mon, r.p.id));

          App.toast("정산안을 만들었습니다"); st.step = "3"; App.redraw();
        },
        rebuild: async (t) => {
          const s = find(t.dataset.id); if (!s || s.state !== "정산안") return;
          if (!(await App.confirm(`${App.partnerName(s.partnerId)} ${App.weekLabel(s.week)} 정산안을 지금 값으로 다시 만드시겠습니까?`, { detail: "이 주의 개통 건 · 수수료표 · 확정된 환수 · 미수 잔액을 다시 읽어 금액을 새로 계산합니다.", ok: "다시 만들기" }))) return;
          const before = s.pay; discard(s); const n = App.buildSettlement(s.week, s.partnerId);
          App.log("정산", `${App.partnerName(s.partnerId)} ${App.weekLabel(s.week)} 정산안 다시 만들기`, `지급액 ${App.won(before)}원`, `지급액 ${App.won(n.pay)}원`);

        confirm: async (t) => {
          const s = find(t.dataset.id); if (!s || s.state !== "정산안") return; const block = confirmBlock(rowFor(s));
          if (block) { App.modal({ title: "지금은 확정할 수 없습니다", body: h`<p>${block}</p>` }); return; }
          const ok = await App.confirm(`${App.partnerName(s.partnerId)} ${App.weekLabel(s.week)} 정산을 확정하시겠습니까?`, { danger: true, ok: "확정", detail: `지급액 ${App.won(s.pay)}원${s.newRecv ? ` · 새 미수 ${App.won(s.newRecv)}원` : ""}으로 금액이 고정됩니다. 확정한 뒤에는 수수료표가 바뀌어도 금액이 변하지 않고, 되돌리려면 사유를 남겨 확정 취소해야 합니다.` });
          if (!ok) return; App.confirmSettlement(s); App.toast("정산을 확정했습니다"); App.redraw();
        },
        cancel: (t) => {
          const s = find(t.dataset.id); if (!s || s.state !== "확정") return; const block = cancelBlock(s);
          if (block) { App.modal({ title: "지금은 확정 취소할 수 없습니다", body: h`<p>${block}</p>` }); return; }
          const fields = [{ name: "why", label: "취소 사유", type: "textarea", required: true, max: 200, hint: "200자까지 · 변경 이력에 남습니다" }];
          App.modal({ title: `${App.partnerName(s.partnerId)} ${App.weekLabel(s.week)} 확정 취소`, body: h`<div class="note warn">확정을 취소하면 이 정산에 묶였던 개통 건과 환수가 풀리고, 이 정산으로 바뀐 미수 잔액도 되돌아갑니다. 취소한 뒤 정산안을 다시 만들어야 합니다.${s.sent ? h` <b>이미 발송한 명세서입니다(${App.dt(s.sent)}).</b> 협력점 화면에서 이 명세서가 내려갑니다.` : ""}</div><div class="card" style="overflow:hidden">${App.form(fields, { cols: 1 })}</div>`,
            actions: [{ label: "닫기" }, { label: "확정 취소", kind: "danger", onClick: (close, root) => { const r = App.readForm(root, fields); if (!r.ok) return; App.cancelSettlement(s, r.values.why); s.canceledAt = App.now(); s.canceledBy = App.session.name; close(); App.toast("확정을 취소했습니다"); App.redraw(); } }] });
        },
        pickUnsent: () => {
          if (!sendTbl) return; let n = 0;
          // 표 도우미는 줄을 누를 때마다 다시 그리므로 한 줄씩 찾아 누른다
          for (let guard = 0; guard < 50; guard++) { const tr = [...body.querySelectorAll("tbody tr[data-i]")].find((x) => { const r = sendTbl.rows()[+x.dataset.i]; const box = x.querySelector("[data-sel]"); return r && box && r.s.state === "확정" && !r.s.sent && !box.checked; }); if (!tr) break; tr.querySelector("[data-sel]").click(); n++; }
          if (!n && !sendTbl.selected().length) App.toast("발송 전인 확정 명세서가 없습니다");
        },
        send: async () => {
          if (!sendTbl) return; const sel = sendTbl.selected(); if (!sel.length) { App.toast("보낼 명세서를 골라 주세요"); return; }
          const list = sel.filter((r) => r.s.state === "확정"); if (!list.length) { App.toast("확정된 건만 보낼 수 있습니다"); return; }
          const again = list.filter((r) => r.s.sent).length;
          const ok = await App.confirm(`확정된 명세서 ${list.length}건을 발송하시겠습니까?`, { danger: true, ok: "발송", detail: `${list.map((r) => `${r.p.name} ${App.won(r.s.pay)}원`).join(" · ")}${sel.length > list.length ? ` · 선택 ${sel.length}건 중 확정 전 ${sel.length - list.length}건은 보내지 않습니다.` : ""}${again ? ` · ${again}건은 이미 보낸 명세서를 다시 보냅니다.` : ""} 발송하면 협력점 화면에 바로 보입니다.` });
          if (!ok) return; const at = App.now();
          list.forEach((r) => { r.s.sent = at; db.sendLog.unshift({ id: App.uid("SD"), at, by: App.session.name, partnerId: r.p.id, week: mon, count: r.s.items.length }); App.log("정산", `${r.p.name} ${App.weekLabel(mon)} 명세서 발송`, "발송 전", `발송 ${at}`); });
          App.toast(sel.length > list.length ? `확정된 ${list.length}건만 발송했습니다` : "명세서를 발송했습니다"); App.redraw();
        },
      });

      // 다른 화면에서 「이 협력점 명세서」로 넘어온 경우 바로 연다
      if (params.partner) { const pid = params.partner; delete params.partner; const s = liveOf(mon, pid) || db.settlements.find((x) => x.week === mon && x.partnerId === pid); if (s) openStatement(s); }
    },
  });
})();
</script>
<script>/* B-12 환수·미수 (옛 SC-33 해지 환수 등록 + SC-23 환수 확정 + SC-44 미수 잔액 이월).
   탭 「환수」: 해지된 개통 건에 환수를 등록(미확정 = 차감 안 됨) → 골라서 확정(확정된 것만 다음 주간 정산에서 차감).
   탭 「미수 잔액」: 협력점별 잔액과 변동 이력. 잔액은 App.receivableOf, 차감은 주간 정산(App.buildSettlement)이 한다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { tab: "claw", c: { state: "", q: "", partner: "", group: "" }, r: { group: "", q: "", from: "", to: "", only: false, pick: "" } };
  const D = () => App.db;
  const partnerOf = (pid) => D().partners.find((p) => p.id === pid) || {};
  const settleOf = (k) => (k.settleId ? D().settlements.find((s) => s.id === k.settleId) : null);
  /** 환수 한 건이 지금 어디에 있는지: 등록(차감 안 됨) / 확정 · 다음 정산에서 차감 / 확정 · 어느 주 정산에서 차감 */
  const phase = (k) => (k.state !== "확정" ? "등록" : k.settleId ? "차감됨" : "예정");

  /* ── 환수 등록: 1. 해지된 개통 건 찾기 → 2. 금액 · 사유 ── */
  function openRegister(after) {
    const db = D(); const f = { group: "", partner: "", carrier: "", product: "", open: "해지", by: "openedAt", from: "", to: "", q: "" }; let pick = null;
    const cands = () => db.customers.filter((c) => {
      if (c.via === "본사" || !c.openedAt) return false; // 환수는 협력점에 준 수수료를 되돌려 받는 것이라 협력점 접수 · 개통됐던 건만
      if (f.open ? c.openState !== f.open : !["해지", "유심개통", "개통완료"].includes(c.openState)) return false;
      if (f.partner && c.partnerId !== f.partner) return false; if (f.group && partnerOf(c.partnerId).group !== f.group) return false;
      if (f.carrier && c.carrier !== f.carrier) return false; if (f.product && c.product !== f.product) return false; if (f.q && !c.name.includes(f.q)) return false;
      const d = String(c[f.by] || "").slice(0, 10); if (f.from && (!d || d < f.from)) return false; if (f.to && (!d || d > f.to)) return false;
      return true;
    });
    const hadOf = (c) => db.clawbacks.find((k) => k.cid === c.id);
    App.modal({
      title: "환수 등록", sub: "해지된 개통 건을 찾아 환수 금액과 사유를 넣습니다", wide: "x",
      body: h`<div class="note warn">여기서 등록한 환수는 <b>「등록(미확정)」</b> 상태이며 정산에서 차감되지 않습니다. 목록에서 골라 「환수 확정」을 해야 다음 주간 정산에서 차감됩니다.</div>
        <div class="sec-h"><h2>1. 해지된 개통 건 찾기</h2><small data-cnt></small></div>
        <div class="card"><div class="filters" style="margin-bottom:0">
          <div class="search grow"><input class="in" data-on="mf" data-live data-k="q" placeholder="고객명" aria-label="고객명"></div>
          <select class="in fix" data-on="mf" data-k="group" aria-label="정산그룹">${App.opts(db.options.정산그룹, "", "정산그룹 전체")}</select>
          <select class="in fix" data-on="mf" data-k="partner" aria-label="협력점">${App.opts(db.partners.map((p) => [p.id, p.name]), "", "협력점 전체")}</select>
          <select class="in fix" data-on="mf" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, "", "통신사 전체")}</select>
          <select class="in fix" data-on="mf" data-k="product" aria-label="상품선택">${App.opts([...new Set(db.products.map((p) => p.name))], "", "상품 전체")}</select>
          <select class="in fix" data-on="mf" data-k="open" aria-label="개통상태">${App.opts(["해지", "개통완료", "유심개통"], "해지", "개통상태 전체")}</select>
          <select class="in fix" data-on="mf" data-k="by" aria-label="기간 기준">${App.opts([["openedAt", "개통일"], ["receivedAt", "접수일"]], "openedAt")}</select>
          <div class="range"><input class="in" type="date" data-on="mf" data-k="from" aria-label="시작일">~<input class="in" type="date" data-on="mf" data-k="to" aria-label="종료일"></div>
        </div><div data-list style="border-top:1px solid var(--line2);max-height:236px;overflow:auto"></div></div>
        <div class="sec-h" style="margin-top:16px"><h2>2. 환수 입력</h2><small>환수 금액은 본사가 건별로 직접 넣습니다</small></div>
        <div class="card" style="overflow:hidden"><div class="form">
          <div class="k">대상 건<span class="req">*</span></div><div class="v" data-f="target"><span data-target class="muted">위 목록에서 건을 골라 주세요</span></div>
          <div class="k">협력점</div><div class="v"><span data-partner class="muted">건을 고르면 채워집니다</span></div>
          <div class="k">환수 금액<span class="req">*</span></div><div class="v" data-f="amount"><div class="unit" data-unit="원"><input class="in" type="text" inputmode="numeric" name="amount" placeholder="0" aria-label="환수 금액"></div></div>
          <div class="k">사유<span class="req">*</span></div><div class="v" data-f="why"><input class="in" type="text" name="why" maxlength="100" placeholder="예: 개통 후 3개월 안 해지" aria-label="사유"></div>
        </div></div>
        <p class="errmsg" data-err style="margin-top:8px"></p>`,
      actions: [{ label: "취소" }, { label: "등록", kind: "p", onClick: (close, root) => {
        const err = $("[data-err]", root); const raw = $('[name="amount"]', root).value.replace(/[,\s원]/g, ""); const why = $('[name="why"]', root).value.trim();
        const fail = (msg, sel) => { err.textContent = msg; const i = sel && $(sel, root); if (i) i.focus(); };
        if (!pick) return fail("환수할 개통 건을 위 목록에서 골라 주세요");
        if (hadOf(pick)) return fail("이 건은 이미 환수가 등록되어 있습니다. 같은 건에 환수를 두 번 등록할 수 없습니다");
        if (!/^\d+$/.test(raw) || Number(raw) <= 0) return fail("환수 금액은 0보다 큰 숫자로 넣어 주세요(원 단위)", '[name="amount"]');
        if (!why) return fail("사유를 넣어 주세요", '[name="why"]');
        const k = { id: App.uid("K"), cid: pick.id, partnerId: pick.partnerId, amount: Number(raw), why, state: "등록", by: App.session.name, at: App.now(), settleId: "" };
        db.clawbacks.unshift(k); App.log("환수", `${pick.name} 환수 등록`, "", `${App.partnerName(k.partnerId)} ${App.won(k.amount)}원 · ${why}`);
        close(); App.toast("환수를 등록했습니다"); if (after) after();
      } }],
      onOpen: (root) => {
        const paint = () => {
          const list = cands(); $("[data-cnt]", root).textContent = `${list.length}건`;
          $("[data-list]", root).innerHTML = list.length ? h`<table class="tbl"><thead><tr><th style="width:34px"></th><th>고객명</th><th>협력점</th><th>통신사</th><th>상품</th><th>가입번호</th><th>개통일</th><th>접수일</th><th>개통상태</th><th>환수</th></tr></thead><tbody>
            ${list.map((c) => { const had = hadOf(c); return h`<tr class="${had ? "off" : "click"} ${pick === c ? "sel" : ""}" data-act="${had ? "" : "pick"}" data-id="${c.id}"><td class="c"><input type="radio" name="b12pick" class="cb" ${pick === c ? App.raw("checked") : ""} ${had ? App.raw("disabled") : ""} aria-label="${c.name} 고르기"></td><td class="name">${c.name}</td><td>${App.orgOf(c)}</td><td>${c.carrier}</td><td>${c.product}</td><td class="num">${c.joinNo || "-"}</td><td class="num">${c.openedAt}</td><td class="num">${App.d(c.receivedAt)}</td><td>${App.chip(c.openState)}</td><td>${had ? h`<span class="muted">이미 ${had.state}됨 · ${App.won(had.amount)}</span>` : h`<span class="muted">-</span>`}</td></tr>`; })}</tbody></table>`
            : h`<div class="empty" style="padding:24px"><b>조건에 맞는 건이 없습니다</b>협력점이 접수해 개통됐던 건만 나옵니다. 조건을 바꿔 다시 찾아 보세요.</div>`;
          $("[data-target]", root).innerHTML = pick ? h`<b>${pick.name}</b> · ${pick.carrier} ${pick.product} · 가입번호 <span class="num">${pick.joinNo || "-"}</span> · 개통일 <span class="num">${pick.openedAt}</span>` : "위 목록에서 건을 골라 주세요"; $("[data-target]", root).className = pick ? "" : "muted";
          $("[data-partner]", root).innerHTML = pick ? h`${App.partnerName(pick.partnerId)}${pick.subId ? " · " + App.subName(pick.subId) : ""} <span class="muted">· 지금 미수 잔액 <span class="num">${App.won(App.receivableOf(pick.partnerId))}</span>원</span>` : "건을 고르면 채워집니다"; $("[data-partner]", root).className = pick ? "" : "muted";
        };
        paint();
        App.on(root, {
          mf: (t) => { f[t.dataset.k] = t.value.trim(); if (pick && !cands().includes(pick)) pick = null; paint(); },
          pick: (t) => { pick = App.cust(t.dataset.id); $("[data-err]", root).textContent = ""; paint(); const a = $('[name="amount"]', root); if (a) a.focus(); },
        });
      },
    });
  }

  App.screen("B-12", {
    title: "환수·미수", sc: ["SC-33", "SC-23", "SC-44"],
    render(el, params) {
      if (params.tab) { st.tab = params.tab === "recv" ? "recv" : "claw"; delete params.tab; }
      if (params.partner) { st.r.pick = params.partner; delete params.partner; }
      const db = D(); const claws = db.clawbacks;
      const of = (ph) => claws.filter((k) => phase(k) === ph); const amt = (list) => list.reduce((a, k) => a + k.amount, 0);
      const recvTotal = db.partners.reduce((a, p) => a + App.receivableOf(p.id), 0);
      const reg = of("등록"); const due = of("예정"); const done = of("차감됨"); const conf = due.concat(done);

      el.innerHTML = h`<style>
        .b12-hist .tbl td,.b12-hist .tbl th{padding-left:14px;padding-right:14px}
        .b12-bal{display:flex;align-items:baseline;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
        .b12-bal span{font-size:12.5px;color:var(--ink2)} .b12-bal b{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-left:auto}
        .b12-where{font-size:12.5px}
      </style>
      ${App.head("환수·미수", { count: "확정된 환수와 이월 미수는 다음 주간 정산에서 차감됩니다", actions: st.tab === "claw" ? h`<button class="btn" data-go="B-11">주간 정산</button><button class="btn" data-act="xls">엑셀저장</button><button class="btn p" data-act="reg">환수 등록</button>` : h`<button class="btn" data-go="B-11">주간 정산</button><button class="btn" data-act="xls">엑셀저장</button>` })}
      <div data-tabs></div><div data-body></div>`;
      App.tabs($("[data-tabs]", el), [["claw", "환수", reg.length], ["recv", "미수 잔액"]], st.tab, (k) => { st.tab = k; App.redraw(); });
      const body = $("[data-body]", el); let tbl = null; let rowsFn = null;

      if (st.tab === "claw") {
        const f = st.c;
        body.innerHTML = h`
          <div class="kpis">
            <button class="kpi ${f.state === "등록" ? "on" : ""}" data-act="cst" data-v="등록"><span>등록(미확정)</span><b>${reg.length}<small style="display:inline;font-size:13px"> 건</small> · ${App.won(amt(reg))}</b><small>아직 정산에서 차감되지 않습니다</small></button>
            <button class="kpi ${f.state === "확정" ? "on" : ""}" data-act="cst" data-v="확정"><span>확정됨</span><b>${conf.length}<small style="display:inline;font-size:13px"> 건</small> · ${App.won(amt(conf))}</b><small>확정자 · 일시가 남습니다</small></button>
            <button class="kpi ${f.state === "예정" ? "on" : ""}" data-act="cst" data-v="예정"><span>다음 주간 정산 차감 예정액</span><b class="${due.length ? "neg" : ""}">${App.won(amt(due))}</b><small>확정됐고 아직 어느 정산에도 안 든 ${due.length}건</small></button>
