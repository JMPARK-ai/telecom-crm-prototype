        xls: () => App.fake(`거래처 ${tbl.rows().length}건 엑셀저장`),
        end: async (t) => {
          const p = find(t);
          const ok = await App.confirm(`${p.kind} 「${p.name}」과(와) 거래를 종료하시겠습니까?`, { danger: true, ok: "거래 종료", detail: p.kind === "협력점" ? "목록과 지난 접수 · 정산에는 그대로 남고, 새 접수 · 정산에서는 고를 수 없게 됩니다. 이 협력점의 계정은 조직·계정에서 따로 비활성화합니다." : "목록과 지난 접수 · 대사에는 그대로 남고, 새 접수 · 대사에서는 고를 수 없게 됩니다." });
          if (!ok) return;
          p.state = "거래 종료"; App.log("기준정보", `${p.kind} ${p.name} 거래 종료`, "거래중", "거래 종료"); App.toast("거래 종료로 바꿨습니다"); refresh();
        },
      });
    },
  });
})();
</script>
<script>/* B-19 데이터 이관 (옛 SC-38). 순서가 있는 일이라 한 화면의 단계로: ① 대상 · 파일 ② 검증(오류 행과 이유) ③ 반영 · 대조(원본 대비 건수 · 금액).
   실패 행은 보완한 파일로 그 행만 다시 반영한다. 아래에 지난 이관 기록.
   프로토타입: 실제 파일은 읽지 않고 대상별 예시 검증 결과를 보여 준다. 반영해도 고객 · 접수 목록에는 넣지 않고 이관 기록만 남긴다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  /* 대상별 예시: total 원본 행 수, money [금액 이름, 원본 합계], errs [행, 항목, 값, 이유, 그 행의 금액] */
  const HIDE = "(민감정보라 값은 숨김)";
  const T = {
    고객: { cols: "고객명 · 고객종류 · 주민번호 · 연락처 · 주소", total: 128, money: null, errs: [[14, "연락처", HIDE, "연락처 형식이 맞지 않습니다"], [57, "주민번호", HIDE, "자리 수가 모자랍니다"], [93, "고객명", "(빈 칸)", "고객명이 비어 있습니다"]] },
    접수: { cols: "접수일시 · 고객명 · 통신사 · 상품 · 협력점 · 가입번호 · 개통 상태 · 사은품", total: 342, money: ["사은품 금액 합계", 61450000], errs: [[21, "접수일시", "2026.3.2 오전", "일시 형식이 맞지 않습니다(예: 2026-03-02 10:20)", 200000], [118, "가입번호", "7431300911", "같은 가입번호가 파일에 두 번 있습니다", 350000], [207, "협력점", "협력점Z", "등록되지 않은 협력점입니다. 거래처에 먼저 등록해 주세요", 200000], [290, "상품명", "인터넷 300M", "등록되지 않은 상품입니다", 100000]] },
    협력점: { cols: "상호 · 사업자번호 · 대표자 · 연락처 · 정산 계좌", total: 6, money: null, errs: [[3, "사업자번호", "101-81-10001", "이미 등록된 사업자번호입니다"], [5, "사업자번호", "101-81-1", "숫자 10자리가 아닙니다"]] },
    수수료표: { cols: "통신사 · 상품 · 옵션 · 약정 · 적용 시작 일시 · 상부수수료 · 협력점 수수료", total: 24, money: ["상부수수료 합계", 7920000], errs: [[9, "적용 시작 일시", "2026/13/01", "날짜 형식이 맞지 않습니다", 260000], [17, "협력점 수수료", "십팔만", "숫자만 넣을 수 있습니다", 300000]] },
    "미수 잔액": { cols: "협력점 · 미수 잔액 · 기준일", total: 4, money: ["미수 잔액 합계", 1270000], errs: [[4, "협력점", "협력점Z", "등록되지 않은 협력점입니다", 150000]] },
  };
  const NAMES = Object.keys(T);
  const st = { step: "pick", target: "", file: "", job: null };
  const files = (t) => [[`${t}_기존.xlsx`, `${t}_기존.xlsx (예시: 오류 행이 섞인 파일)`], [`${t}_기존_보완.xlsx`, `${t}_기존_보완.xlsx (예시: 오류 없는 파일)`], [`${t}_정리.hwp`, `${t}_정리.hwp (예시: 엑셀이 아닌 파일)`]];
  const errSum = (j) => j.errs.reduce((a, e) => a + (e[4] || 0), 0);

  App.screen("B-19", {
    title: "데이터 이관", sc: ["SC-38"],
    render(el) {
      const db = App.db; const j = st.job;
      el.innerHTML = h`${App.head("데이터 이관", { actions: h`<button class="btn" data-act="tpl">양식 내려받기</button>${j ? h`<button class="btn" data-act="restart">새 이관 시작</button>` : ""}` })}
        <div class="note">쓰던 엑셀을 양식에 맞춰 한꺼번에 올립니다. 반영하기 전에 검증해서 오류 행과 이유를 알려 주고, 반영한 뒤에는 원본과 건수 · 금액을 대조합니다. 고객 · 접수는 최근 1년 치를 이관합니다.</div>
        <div data-steps></div><div data-body></div>
        <section class="sec"><div class="sec-h"><h2>지난 이관 기록</h2><small>반영한 순서대로 쌓입니다</small></div><div data-log></div></section>`;
      App.steps($("[data-steps]", el), [
        ["pick", "대상 · 파일", j ? `${j.target} · ${j.file}` : "이관 대상과 원본 파일", j ? "done" : ""],
        ["check", "검증", j ? (j.applied ? "검증 끝" : j.errs.length ? `오류 ${j.errs.length}행` : "오류 없음") : "오류 행과 이유", j && j.applied ? "done" : ""],
        ["apply", "반영 · 대조", j && j.applied ? (j.fail ? `실패 ${j.fail}행 남음` : "원본과 일치") : "원본 대비 건수 · 금액", j && j.applied && !j.fail ? "done" : ""],
      ], st.step, (k) => {
        if (k === "pick" && j && j.applied) { App.toast("이미 반영했습니다. 새로 올리려면 「새 이관 시작」을 눌러 주세요"); return; }
        if (k === "check" && !j) { App.toast("먼저 대상과 파일을 골라 올려 주세요"); return; }
        if (k === "apply" && !(j && j.applied)) { App.toast("검증한 뒤 반영해야 대조 결과가 보입니다"); return; }
        st.step = k; App.redraw();
      });
      const body = $("[data-body]", el);

      if (st.step === "pick") {
        body.innerHTML = h`<div class="card" style="overflow:hidden"><div class="form c1">
            <div class="k">이관 대상<span class="req">*</span></div><div class="v" data-f="target"><select class="in" data-on="target" style="max-width:320px" aria-label="이관 대상">${App.opts(NAMES, st.target, "고르기")}</select>${st.target ? h`<span class="hint">양식 열: ${T[st.target].cols}</span>` : h`<span class="hint">고객 · 접수 · 협력점 · 수수료표 · 미수 잔액 가운데 하나를 고릅니다.</span>`}</div>
            <div class="k">원본 파일<span class="req">*</span></div><div class="v" data-f="file"><select class="in" data-on="file" style="max-width:420px" aria-label="원본 파일" ${st.target ? "" : App.raw("disabled")}>${App.opts(st.target ? files(st.target) : [], st.file, st.target ? "파일 고르기" : "대상을 먼저 골라 주세요")}</select><span class="hint">.xlsx · .xls 파일만 올릴 수 있습니다. 프로토타입에서는 예시 파일 가운데 고릅니다.</span></div>
          </div><div class="bar-actions" style="margin-top:0;position:static"><span class="sp">표시(<span class="req" style="margin:0">*</span>)는 필수입니다. 올리면 바로 반영하지 않고 먼저 검증합니다.</span><p class="errmsg" data-err></p><button class="btn p" data-act="upload">올리기 · 검증</button></div></div>`;
      } else if (st.step === "check") {
        const ok = j.total - j.errs.length;
        body.innerHTML = h`<div class="kpis">
            <div class="kpi"><span>원본 행</span><b>${App.won(j.total)}</b><small>${j.file}</small></div>
            <div class="kpi"><span>반영할 수 있는 행</span><b>${App.won(ok)}</b><small>검증 통과</small></div>
            <div class="kpi"><span>오류 행</span><b class="${j.errs.length ? "neg" : ""}">${j.errs.length}</b><small>${j.errs.length ? "아래 이유를 보고 보완" : "없음"}</small></div></div>
          ${j.errs.length ? h`<div class="note warn"><b>오류 ${j.errs.length}행은 반영되지 않습니다.</b> 지금 정상 ${App.won(ok)}행만 먼저 반영하고, 오류 행은 원본을 고친 뒤 다음 단계에서 그 행만 다시 반영할 수 있습니다.</div>` : h`<div class="note ok"><b>오류 행이 없습니다.</b> ${App.won(j.total)}행을 모두 반영할 수 있습니다.</div>`}
          <div data-errs></div>
          <div class="card bar-actions" style="position:static;border-radius:var(--r2)"><span class="sp">주민번호 · 연락처 · 계좌번호는 반영할 때 암호화해서 저장합니다.</span><button class="btn" data-act="back">파일 다시 고르기</button><button class="btn p" data-act="apply">정상 ${App.won(ok)}행 반영</button></div>`;
        errTable($("[data-errs]", body), j.errs, "검증 오류 행");
      } else {
        const m = T[j.target].money; const lost = errSum(j);
        body.innerHTML = h`<div class="kpis">
            <div class="kpi"><span>원본 행</span><b>${App.won(j.total)}</b><small>${j.file}</small></div>
            <div class="kpi"><span>반영한 행</span><b>${App.won(j.ok)}</b><small>${App.dt(j.at)} · ${j.by}</small></div>
            <div class="kpi"><span>실패 행</span><b class="${j.fail ? "neg" : ""}">${j.fail}</b><small>${j.fail ? "보완 뒤 다시 반영" : "없음"}</small></div></div>
          ${j.fail ? h`<div class="note warn"><b>원본과 ${j.fail}행이 다릅니다.</b> 아래 실패 행을 원본에서 고친 뒤 「보완 파일로 다시 반영」을 누르면 실패한 행만 반영합니다(이미 반영한 행은 다시 넣지 않습니다).</div>` : h`<div class="note ok"><b>원본과 반영 결과가 일치합니다.</b> 건수${m ? " · 금액 합계" : ""}가 같습니다.</div>`}
          <div class="card"><div class="tblbar"><span>대조 결과 · 원본 대비${m ? " · 금액 단위: 원" : ""}</span></div><div class="tblwrap"><table class="tbl"><thead><tr><th>항목</th><th class="r">원본</th><th class="r">반영됨</th><th class="r">차이</th><th class="c">결과</th></tr></thead><tbody>
            <tr><td class="name">건수(행)</td><td class="r">${App.won(j.total)}</td><td class="r">${App.won(j.ok)}</td><td class="r">${j.fail ? h`<span class="neg">-${j.fail}</span>` : "0"}</td><td class="c">${j.fail ? App.raw('<span class="chip c-red">불일치</span>') : App.chip("일치")}</td></tr>
            ${m ? h`<tr><td class="name">${m[0]}</td><td class="r">${App.won(m[1])}</td><td class="r">${App.won(m[1] - lost)}</td><td class="r">${lost ? h`<span class="neg">-${App.won(lost)}</span>` : "0"}</td><td class="c">${lost ? App.raw('<span class="chip c-red">불일치</span>') : App.chip("일치")}</td></tr>` : ""}
          </tbody></table></div></div>
          ${j.fail ? h`<div class="sec" data-errs></div><div class="card bar-actions" style="position:static;border-radius:var(--r2)"><span class="sp">실패 행만 담긴 엑셀을 내려받아 고친 뒤 올리면 됩니다.</span><button class="btn" data-act="faildown">실패 행 내려받기</button><button class="btn p" data-act="retry">보완 파일로 다시 반영</button></div>` : ""}`;
        if (j.fail) errTable($("[data-errs]", body), j.errs, "실패 행");
      }
      function errTable(box, errs, name) {
        if (!errs.length) { box.innerHTML = ""; return; }
        App.table(box, [
          { label: "행", r: 1, render: (e) => e[0] + "행" }, { label: "항목", render: (e) => h`<span class="name">${e[1]}</span>` },
          { label: "원본 값", render: (e) => (e[2] === HIDE ? h`<span class="muted">${e[2]}</span>` : e[2]) }, { label: "이유", cls: "wrap", render: (e) => h`<span class="neg">${e[3]}</span>` },
        ], errs, { pageSize: 0, bar: `${name} <b>${errs.length}</b>건` });
      }

      App.table($("[data-log]", el), [
        { label: "일시", render: (r) => h`<span class="num">${App.dt(r.at)}</span>` }, { label: "대상", render: (r) => h`<span class="name">${r.target}</span>` }, { key: "file", label: "파일" },
        { label: "원본 행", r: 1, render: (r) => App.won(r.total) }, { label: "반영", r: 1, render: (r) => App.won(r.ok) }, { label: "실패", r: 1, render: (r) => (r.fail ? h`<span class="neg">${r.fail}</span>` : "0") },
        { label: "대조", render: (r) => (r.fail ? App.raw('<span class="chip c-red">불일치</span>') : App.chip("일치")) }, { key: "by", label: "처리자" },
      ], db.migrations, { pageSize: 0, empty: ["이관 기록이 없습니다", "위에서 대상과 파일을 골라 첫 이관을 시작해 보세요."] });

      App.on(el, {
        tpl: () => App.fake(st.target ? `${st.target} 이관 양식 내려받기` : "이관 양식(대상 5종) 내려받기"),
        target: (t) => { st.target = t.value; st.file = ""; App.redraw(); },
        file: (t) => { st.file = t.value; },
        upload: () => {
          const err = $("[data-err]", body);
          if (!st.target) { err.textContent = "이관 대상을 골라 주세요"; return; }
          if (!st.file) { err.textContent = "원본 파일을 골라 주세요"; return; }
          if (!/\.xlsx?$/.test(st.file)) { err.textContent = ".xlsx · .xls 파일만 올릴 수 있습니다"; return; }
          const d = T[st.target]; st.job = { target: st.target, file: st.file, total: d.total, errs: /보완/.test(st.file) ? [] : d.errs.slice(), applied: false, ok: 0, fail: 0 };
          st.step = "check"; App.toast(st.job.errs.length ? `검증했습니다. 오류 ${st.job.errs.length}행이 있습니다` : "검증했습니다. 오류 행이 없습니다"); App.redraw();
        },
        back: () => { st.job = null; st.step = "pick"; App.redraw(); },
        restart: () => { Object.assign(st, { step: "pick", target: "", file: "", job: null }); App.redraw(); },
        apply: async () => {
          const ok = j.total - j.errs.length;
          if (!(await App.confirm(`${j.target} ${App.won(ok)}행을 반영하시겠습니까?`, { ok: "반영", detail: j.errs.length ? `오류 ${j.errs.length}행은 빼고 반영합니다. 반영한 뒤 원본과 건수 · 금액을 대조해 보여 줍니다.` : "반영한 뒤 원본과 건수 · 금액을 대조해 보여 줍니다." }))) return;
          Object.assign(j, { applied: true, ok, fail: j.errs.length, at: App.now(), by: App.session.name });
          j.rec = { id: App.uid("M"), target: j.target, file: j.file, at: j.at, by: j.by, total: j.total, ok: j.ok, fail: j.fail }; db.migrations.unshift(j.rec);
          App.log("기준정보", `${j.target} 엑셀 이관 반영`, j.file, `${App.won(ok)}행 반영 · 실패 ${j.fail}행`);
          st.step = "apply"; App.toast(`${App.won(ok)}행을 반영했습니다`); App.redraw();
        },
        faildown: () => App.fake(`실패 ${j.fail}행 엑셀 내려받기`),
        retry: () => App.editModal({
          title: "보완 파일로 다시 반영", ok: "다시 반영", done: `실패 ${j.fail}행을 다시 반영했습니다`, note: `실패한 ${j.fail}행만 다시 검증해서 반영합니다. 이미 반영한 ${App.won(j.ok)}행은 건드리지 않습니다.`,
          fields: [{ name: "file", label: "보완 파일", type: "select", required: true, options: [[`${j.target}_기존_보완.xlsx`, `${j.target}_기존_보완.xlsx (예시: 실패 행을 고친 파일)`]], hint: ".xlsx · .xls 파일만 올릴 수 있습니다." }],
          onSave: (v) => {
            const n = j.fail; j.ok += n; j.fail = 0; j.errs = []; Object.assign(j.rec, { ok: j.ok, fail: 0 });
            App.log("기준정보", `${j.target} 실패 행 다시 반영`, `실패 ${n}행`, `${v.file} · ${n}행 반영`); App.redraw();
          },
        }),
      });
    },
  });
})();
</script>
<script>/* B-20 변경 이력 (옛 SC-30). App.db.audit 를 조회만 한다: 수정 · 삭제 단추가 없다.
   대상 · 기간 · 사용자로 거르고, 줄을 누르면 바꾸기 전 · 뒤를 펼쳐 본다. 다른 화면에서 params.target 으로 대상을 정해 들어올 수 있다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$;
  const TARGETS = ["접수", "상태", "수수료표", "정산", "환수", "기준정보", "계정 권한", "민감정보 원문 조회"];
  const st = { target: "", user: "", q: "", from: "", to: "", open: {} };

  App.screen("B-20", {
    title: "변경 이력", sc: ["SC-30"],
    render(el, params) {
      if (params.target) { st.target = params.target; params.target = ""; } // 다른 화면이 정해진 대상 밖의 이름으로 남긴 이력도 거를 수 있게 목록에 더한다
      const db = App.db;
      el.innerHTML = h`<style>.b20-x td{background:var(--sunk);white-space:normal}.b20-x .kv{grid-template-columns:96px minmax(0,1fr);max-width:900px}.b20-x dd{word-break:break-word}.b20-car{display:inline-block;width:18px}.b20-car::before{content:"";display:inline-block;width:6px;height:6px;border-right:1.8px solid var(--muted);border-bottom:1.8px solid var(--muted);transform:translateY(-1px) rotate(-45deg)}.b20-car.open::before{transform:translateY(-3px) rotate(45deg)}</style>
        ${App.head("변경 이력")}
        <div class="note gray">이력은 수정 · 삭제할 수 없습니다. 접수 · 상태 · 수수료표 · 정산 · 환수 · 기준정보 · 계정 권한 변경과 민감정보 원문 조회가 누가 · 언제 했는지와 함께 남고, 5년 동안 보관합니다.</div>
        <div class="card"><div class="filters">
          <select class="in fix" data-on="f" data-k="target" aria-label="대상">${App.opts([...new Set([...TARGETS, ...db.audit.map((a) => a.target)])], st.target, "대상 전체")}</select>
          <select class="in fix" data-on="f" data-k="user" aria-label="사용자">${App.opts([...new Set(db.audit.map((a) => a.user))], st.user, "사용자 전체")}</select>
          <div class="range"><input class="in" type="date" data-on="f" data-k="from" value="${st.from}" aria-label="시작일">~<input class="in" type="date" data-on="f" data-k="to" value="${st.to}" aria-label="종료일"></div>
          <button class="btn sm ghost" data-act="range" data-d="0">오늘</button><button class="btn sm ghost" data-act="range" data-d="6">7일</button><button class="btn sm ghost" data-act="range" data-d="29">30일</button>
          <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="내용으로 찾기(이름 · 아이디 · 바뀐 값)" aria-label="내용 검색"></div>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div data-tbl style="margin-top:10px"></div>`;
      const rows = () => db.audit.filter((a) => {
        if (st.target && a.target !== st.target) return false; if (st.user && a.user !== st.user) return false;
        const d = a.at.slice(0, 10); if (st.from && d < st.from) return false; if (st.to && d > st.to) return false;
        if (st.q && ![a.action, a.before, a.after].some((x) => String(x).includes(st.q))) return false;
        return true;
      }).slice().sort((a, b) => (a.at < b.at ? 1 : -1));
      const tbl = App.table($("[data-tbl]", el), [
        { label: "일시", render: (a) => h`<span class="b20-car ${st.open[a.id] ? "open" : ""}" data-id="${a.id}"></span><span class="num">${App.dt(a.at)}</span>` },
        { key: "user", label: "사용자" },
        { label: "대상", render: (a) => h`<span class="chip c-${a.target === "민감정보 원문 조회" ? "red" : a.target === "계정 권한" ? "violet" : a.target === "정산" || a.target === "환수" || a.target === "수수료표" ? "amber" : "blue"}">${a.target}</span>` },
        { label: "한 일", render: (a) => h`<span class="name">${a.action}</span>` },
        { label: "바꾸기 전", cls: "ell", render: (a) => a.before }, { label: "바꾼 뒤", cls: "ell", render: (a) => a.after },
      ], rows(), {
        onRow: (a) => { st.open[a.id] = !st.open[a.id]; tbl.redraw(); },
        bar: (n) => `검색 결과 <b>${n}</b>건 · 줄을 누르면 바꾸기 전 · 뒤가 펼쳐집니다`,
        empty: ["이력이 없습니다", "조건을 바꿔 다시 찾아 보세요. 다른 화면에서 저장 · 확정 · 원문 보기를 하면 여기에 쌓입니다."],
        /* 펼친 줄 아래에 변경 내용 줄을 끼워 넣는다(표 도우미에 펼침이 없어 여기서 그린다) */
        onDraw: (box) => $$("tbody tr[data-i]", box).forEach((tr) => {
          const m = $("[data-id]", tr); const a = m && st.open[m.dataset.id] && db.audit.find((x) => x.id === m.dataset.id); if (!a) return;
          const x = document.createElement("tr"); x.className = "b20-x";
          x.innerHTML = h`<td colspan="6"><dl class="kv"><dt>일시 · 사용자</dt><dd class="num">${a.at} · ${a.user}</dd><dt>대상</dt><dd>${a.target} · ${a.action}</dd><dt>바꾸기 전</dt><dd>${a.before || h`<span class="muted">없음(새로 생김 · 조회)</span>`}</dd><dt>바꾼 뒤</dt><dd><b>${a.after || "-"}</b></dd></dl></td>`;
          tr.after(x);
        }),
      });
      App.on(el, {
        f: (t) => { st[t.dataset.k] = t.value; tbl.set(rows()); },
        q: (t) => { st.q = t.value.trim(); tbl.set(rows()); },
        range: (t) => { st.to = App.today(); st.from = App.addDays(App.today(), -Number(t.dataset.d)); App.redraw(); },
        reset: () => { Object.assign(st, { target: "", user: "", q: "", from: "", to: "", open: {} }); App.redraw(); },
      });
    },
  });
})();
</script>
<script>/* B-21 보안·권한·백업 (옛 SC-54 역할별 접근 권한 · SC-53 민감정보 · SC-50 고객사별 데이터 분리 · SC-52 백업).
   안내만 하던 화면 넷을 한 장의 구역 넷으로 묶었다. 바꿀 수 있는 것은 「지금 백업」 하나(확인창)이고 나머지는 조회.
   역할은 본사 관리자 · 협력점 · 하부점 셋(D-14)이라 원문 조회 권한자를 따로 고르는 칸은 두지 않는다(본사 관리자만). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { busy: false, runs: null };

  App.screen("B-21", {
    title: "보안·권한·백업", sc: ["SC-53", "SC-50", "SC-54", "SC-52"],
    render(el, params) {
      const db = App.db; const s = App.session; const bk = db.backup; const T = App.today();
      if (!st.runs) st.runs = [0, 1, 2].map((i) => ({ at: App.addDays(T, -i) + " 03:00", kind: "자동", by: "-", result: "성공" }));
      const nAcc = (role) => db.accounts.filter((a) => a.role === role && a.state !== "비활성").length;
      const peeks = db.audit.filter((a) => a.target === "민감정보 원문 조회").length;
      const tenant = (db.tenants[0] || {}).name || "-";
      const c0 = db.customers[0] || {};
      const jump = [["role", "역할별 접근 범위"], ["mask", "민감정보"], ["tenant", "고객사 데이터 범위"], ["backup", "백업"]];
      el.innerHTML = h`<style>.b21-sec{scroll-margin-top:110px}.b21-ex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--sunk);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}.b21-tbl td{white-space:normal;vertical-align:top}.b21-tbl td:first-child{white-space:nowrap}</style>
        ${App.head("보안·권한·백업", { actions: h`<button class="btn" data-go="B-17">계정 관리로</button><button class="btn" data-go="B-20">변경 이력</button>` })}
        <div class="row" style="margin:-4px 0 16px;gap:14px"><span class="hint">이 화면의 구역</span>${jump.map(([k, l]) => h`<a class="link" style="font-size:13px" data-act="jump" data-k="${k}">${l}</a>`)}</div>

        <section class="b21-sec" id="b21-role"><div class="sec-h"><h2>역할별 접근 범위</h2><small>본사는 전체, 협력점은 자기와 하부점, 하부점은 자기 데이터만 봅니다</small></div>
          <div class="card"><div class="tblwrap"><table class="tbl b21-tbl"><thead><tr><th>역할</th><th>볼 수 있는 데이터</th><th>쓰는 화면</th><th>보이지 않는 것</th><th class="r">계정</th></tr></thead><tbody>
            <tr><td class="name">본사 관리자</td><td>전체 접수 · 정산 · 기준정보</td><td>PC 전체 메뉴(고객관리 · 정산관리 · 관리자 등)</td><td><span class="muted">없음</span></td><td class="r">${nAcc("본사 관리자")}개</td></tr>
            <tr><td class="name">협력점</td><td>자기와 소속 하부점이 접수한 건, 자기 정산 명세서(확정된 주만)</td><td>폰: 내 접수 · 고객 등록 · 회신 · 수수료표 · 정산 명세서 · 고객센터</td><td>상담 내용, 상부수수료, 다른 협력점의 데이터</td><td class="r">${nAcc("협력점")}개</td></tr>
            <tr><td class="name">하부점</td><td>자기가 접수한 건만</td><td>폰: 내 접수 · 고객 등록 · 회신 · 고객센터(공지 읽기)</td><td>상담 내용, 수수료표, 정산, 다른 하부점 · 협력점의 데이터</td><td class="r">${nAcc("하부점")}개</td></tr>
          </tbody></table></div></div>
          <p class="hint" style="margin-top:8px">메뉴를 숨기는 것과 따로, 요청마다 서버에서 계정의 역할과 조직을 다시 확인합니다. 주소나 요청 값을 바꿔도 범위 밖 데이터는 보이지 않습니다. 역할을 바꾸려면 <a class="link" data-go="B-17">조직·계정</a>에서 계정을 고칩니다.</p></section>

        <section class="sec b21-sec" id="b21-mask"><div class="sec-h"><h2>민감정보 항목과 가림 방식</h2><small>암호화해서 저장하고, 목록 · 조회 화면에는 가려서 보입니다</small><span class="sp"><button class="btn sm" data-go="B-20" data-params="target=민감정보 원문 조회">원문 조회 기록 ${peeks}건</button></span></div>
          <div class="card"><div class="tblwrap"><table class="tbl b21-tbl"><thead><tr><th>항목</th><th>화면 위치</th><th class="c">암호화 저장</th><th>화면에 보이는 모습</th><th>원문 보기</th></tr></thead><tbody>
            <tr><td class="name">주민번호</td><td>고객 등록 · 상세, 납부 · 사은품 계좌의 예금주 확인</td><td class="c">${App.raw('<span class="chip c-green">암호화</span>')}</td><td><span class="b21-ex">${App.maskRrn(c0.rrn || "900101-1234567")}</span> 뒷자리 전체 가림</td><td>본사 관리자만 · 볼 때마다 이력에 남음</td></tr>
            <tr><td class="name">연락처(전화 · 핸드폰)</td><td>고객 목록 · 상세, 가망고객, 인사관리, 거래처</td><td class="c">${App.raw('<span class="chip c-green">암호화</span>')}</td><td><span class="b21-ex">${App.maskPhone(c0.phone || "010-1234-5678")}</span> 가운데 · 끝 두 자리씩 가림</td><td>본사 관리자만 · 볼 때마다 이력에 남음</td></tr>
            <tr><td class="name">계좌번호</td><td>납부 계좌, 사은품 계좌, 거래처 정산 계좌</td><td class="c">${App.raw('<span class="chip c-green">암호화</span>')}</td><td><span class="b21-ex">${App.maskAcct(c0.pay ? c0.pay.acct : "556600001234")}</span> 앞 네 자리 · 끝 두 자리만 보임</td><td>본사 관리자만 · 볼 때마다 이력에 남음</td></tr>
          </tbody></table></div></div>
          <p class="hint" style="margin-top:8px">엑셀로 내려받은 파일과 시스템 기록에도 가린 값만 들어갑니다. 협력점 · 하부점 계정에는 「원문 보기」가 보이지 않습니다.</p></section>

        <section class="sec b21-sec" id="b21-tenant"><div class="sec-h"><h2>고객사 데이터 범위</h2><small>모든 조회 · 저장 · 내려받기는 로그인한 계정의 고객사 안에서만 이뤄집니다</small></div>
          <div class="split" style="grid-template-columns:360px minmax(0,1fr)"><div class="card pad"><dl class="kv"><dt>로그인 고객사</dt><dd><b>${tenant}</b></dd><dt>로그인 계정</dt><dd>${s.name} <span class="muted">(${s.org})</span></dd><dt>권한</dt><dd>${s.label}</dd><dt>데이터 범위</dt><dd>${App.raw('<span class="chip c-green">이 고객사만</span>')}</dd></dl>
              <p class="hint" style="margin-top:12px">다른 고객사의 데이터는 주소나 요청 값을 바꿔도 보이지 않습니다. 서비스 운영자도 고객사의 업무 데이터는 볼 수 없습니다.</p></div>
            <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>업무 영역</th><th>들어 있는 것</th><th>적용 범위</th><th class="r">지금 건수</th></tr></thead><tbody>
              ${[["고객 · 접수", "고객 정보, 접수 건, 상담 · 이력", db.customers.length + "건"], ["정산", "주간 정산, 환수, 미수 잔액, 대사", db.settlements.length + "건"], ["상품 · 수수료표", "상품, 수수료표 버전, 사은품, 부가서비스", db.products.length + db.fees.length + "건"], ["조직 · 계정", "협력점 · 상부점 · 하부점, 계정, 인사 명단", db.partners.length + db.uppers.length + db.subs.length + db.accounts.length + "건"], ["고객센터", "공지사항, 문의와 답변", db.notices.length + db.inquiries.length + "건"], ["변경 이력 · 내려받기", "변경 이력, 엑셀 내려받기 파일", db.audit.length + "건"]].map(([a, b, n]) => h`<tr><td class="name">${a}</td><td class="muted">${b}</td><td>${App.raw('<span class="chip c-green">이 고객사만</span>')}</td><td class="r">${n}</td></tr>`)}
            </tbody></table></div></div></div></section>

        <section class="sec b21-sec" id="b21-backup"><div class="sec-h"><h2>백업</h2><small>날마다 자동으로 백업하고 30일 동안 보관합니다</small><span class="sp"><button class="btn p" data-act="backup" ${st.busy ? App.raw("disabled") : ""}>${st.busy ? "백업 중…" : "지금 백업"}</button></span></div>
          ${st.busy ? h`<div class="note">백업하고 있습니다. 끝나면 아래 「마지막 백업」이 바뀝니다. 다른 화면으로 가도 계속됩니다.</div>` : ""}
          <div class="split" style="grid-template-columns:360px minmax(0,1fr)"><div class="card pad"><dl class="kv"><dt>마지막 백업</dt><dd class="num"><b>${bk.last}</b></dd><dt>결과</dt><dd>${bk.result === "성공" ? App.raw('<span class="chip c-green">성공</span>') : App.raw('<span class="chip c-red">실패</span>')}</dd><dt>백업 주기</dt><dd>${bk.cycle}</dd><dt>보관 기간</dt><dd>${bk.keep}</dd><dt>보관 위치</dt><dd>${bk.where}</dd></dl>
              <p class="hint" style="margin-top:12px">복구가 필요하면 서비스 운영자에게 요청합니다. 시험용 데이터는 운영 통계 · 정산에 섞이지 않게 따로 둡니다.</p></div>
            <div class="card"><div class="tblbar"><span>최근 백업</span></div><div class="tblwrap"><table class="tbl"><thead><tr><th>일시</th><th>구분</th><th>실행한 사람</th><th>결과</th></tr></thead><tbody>
              ${st.runs.slice(0, 6).map((r) => h`<tr><td class="num">${r.at}</td><td>${r.kind}</td><td>${r.by === "-" ? h`<span class="muted">정기 백업</span>` : r.by}</td><td>${App.raw('<span class="chip c-green">성공</span>')}</td></tr>`)}
            </tbody></table></div></div></div></section>`;

      const go = (k) => { const t = $("#b21-" + k, el); if (t) t.scrollIntoView({ block: "start" }); };
      if (params.sec) { const k = params.sec; params.sec = ""; setTimeout(() => go(k), 0); }
      App.on(el, {
        jump: (t) => go(t.dataset.k),
        backup: async () => {
          if (st.busy) return;
          if (!(await App.confirm("지금 백업하시겠습니까?", { ok: "지금 백업", detail: `마지막 백업은 ${bk.last} 입니다. 지금 시각의 데이터를 한 번 더 백업하며, 정기 백업(${bk.cycle})은 그대로 돕니다.` }))) return;
          st.busy = true; if (App.cur.code === "B-21") App.redraw();
          setTimeout(() => {
            st.busy = false; bk.last = App.now(); bk.result = "성공"; st.runs.unshift({ at: bk.last, kind: "수동", by: s.name, result: "성공" });
            App.toast("백업을 마쳤습니다"); if (App.cur && App.cur.code === "B-21") { const y = window.scrollY; App.redraw(); window.scrollTo(0, y); }
          }, 1200);
        },
      });
    },
  });
})();
</script>
<script>/* B-22 선택 항목 (옛 SC-59). 약정 · 지역 · 정산그룹 값을 관리한다(값 이름 · 정렬 순서 · 사용 여부 · W-208 · W-209).
   다른 화면은 App.db.options.<종류>(쓰는 값 이름 배열)와 App.db.contracts 를 읽으므로, 여기서 바꾸면 그 배열을 같은 순서로 맞춰 준다.
   「사용 안 함」 값과 정렬 순서는 App.db.optionMeta 에 따로 둔다(공통 데이터에 그 칸이 없어서 이 화면이 만든다). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { kind: "약정" };
  const KINDS = ["약정", "지역", "정산그룹"];
  const WHERE = { 약정: "고객 등록의 약정 선택 · 수수료표의 약정", 지역: "고객 등록 · 검색의 지역 선택", 정산그룹: "협력점의 정산그룹 · 검색의 정산그룹 선택" };

  function meta() {
    const db = App.db;
    if (!db.optionMeta) { db.optionMeta = {}; KINDS.forEach((k) => (db.optionMeta[k] = db.options[k].map((name) => ({ name, use: true })))); }
    KINDS.forEach((k) => db.options[k].forEach((name) => { if (!db.optionMeta[k].some((x) => x.name === name)) db.optionMeta[k].push({ name, use: true }); }));
    return db.optionMeta;
  }
  /** 쓰는 값만, 정렬 순서대로 공통 배열에 다시 채운다(배열 자체는 바꾸지 않고 내용만) */
  function sync(k) {
    const names = meta()[k].filter((x) => x.use).map((x) => x.name);
    const fill = (a) => { a.length = 0; a.push(...names); };
    fill(App.db.options[k]); if (k === "약정") fill(App.db.contracts);
  }
  function usage(k, name) {
    const db = App.db;
    if (k === "약정") { const c = db.customers.filter((x) => x.contract === name).length; const f = db.fees.filter((x) => x.contract === name).length; return { n: c + f, text: `접수 ${c}건 · 수수료표 ${f}줄` }; }
    if (k === "지역") { const c = db.customers.filter((x) => x.region === name).length; return { n: c, text: `접수 ${c}건` }; }
    const p = db.partners.filter((x) => x.group === name).length; return { n: p, text: `협력점 ${p}곳` };
  }

  function editValue(k, v) {
    const list = meta()[k]; const used = v ? usage(k, v.name) : { n: 0 };
    App.editModal({
      title: v ? `${k} 값 수정` : `새 ${k} 값 등록`, values: v ? { name: v.name } : {},
      note: v && used.n ? `${used.text}이(가) 이 값을 쓰고 있어 이름은 바꿀 수 없습니다. 새 값을 등록하고 이 값은 「사용 안 함」으로 바꾸세요.` : `저장하면 ${WHERE[k]}에 나타납니다.`,
      fields: [{ name: "name", label: "값 이름", required: true, readonly: !!(v && used.n), placeholder: k === "약정" ? "예: 24개월" : k === "지역" ? "예: 경기" : "예: 3그룹", pattern: /^.{1,20}$/, msg: "20자까지 넣을 수 있습니다" }],
      done: v ? "저장했습니다" : "값을 등록했습니다",
      onSave: (r) => {
        if (v && used.n) return "쓰고 있는 값이라 이름을 바꿀 수 없습니다.";
        if (list.some((x) => x !== v && x.name === r.name)) return "같은 이름의 값이 이미 있습니다.";
        if (v) { App.log("선택 항목", `${k} 값 이름 수정`, v.name, r.name); v.name = r.name; }
        else { list.push({ name: r.name, use: true }); App.log("선택 항목", `${k} 값 등록`, "", r.name); }
        sync(k); App.redraw();
      },
    });
  }

  App.screen("B-22", {
    title: "선택 항목", sc: ["SC-59"],
    render(el, params) {
      if (params.kind && KINDS.includes(params.kind)) { st.kind = params.kind; delete params.kind; }
      const k = st.kind; const list = meta()[k];
      el.innerHTML = h`${App.head("선택 항목", { actions: h`<button class="btn p" data-act="add">새 값 등록</button>` })}
        <div data-tabs></div>
        <div class="note gray">여기서 등록한 값이 ${WHERE[k]}에 정렬 순서대로 나타납니다. 「사용 안 함」으로 바꾼 값은 새 입력에서 빠지고, 이미 그 값으로 저장된 건은 그대로 남습니다.${k === "약정" ? h` 약정을 새로 등록하면 <a data-go="B-14" data-params="miss=1">수수료표</a>에 그 약정의 줄이 「미등록」으로 생기니 수수료도 등록해 주세요.` : ""}</div>
        <div data-tbl></div>`;
      App.tabs($("[data-tabs]", el), KINDS.map((x) => [x, x]), k, (x) => { st.kind = x; App.redraw(); });
      App.table($("[data-tbl]", el), [
        { label: "정렬 순서", render: (v, i) => h`<span class="num" style="display:inline-block;width:22px">${i + 1}</span><button class="btn sm ghost" data-act="up" data-i="${i}" aria-label="위로" ${i === 0 ? App.raw("disabled") : ""}>▲</button><button class="btn sm ghost" data-act="down" data-i="${i}" aria-label="아래로" ${i === list.length - 1 ? App.raw("disabled") : ""}>▼</button>` },
        { label: "값 이름", render: (v) => h`<span class="name">${v.name}</span>` },
        { label: "쓰는 곳", render: (v) => usage(k, v.name).text },
        { label: "사용 여부", render: (v) => App.chip(v.use ? "사용" : "사용중지") },
        { label: "", r: 1, render: (v, i) => h`<button class="btn sm" data-act="edit" data-i="${i}">수정</button> ${v.use ? h`<button class="btn sm" data-act="off" data-i="${i}">사용 안 함</button>` : h`<button class="btn sm" data-act="on" data-i="${i}">다시 사용</button>`}` },
      ], list, {
        pageSize: 0, rowClass: (v) => (v.use ? "" : "off"),
        bar: h`${k} 값 <b>${list.length}</b>개 · 사용 안 함 ${list.filter((v) => !v.use).length}개`,
        empty: [`${k} 값이 없습니다`, "「새 값 등록」으로 첫 값을 넣어 주세요."],
      });
      const move = (i, d) => { const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; sync(k); App.log("선택 항목", `${k} 정렬 순서 변경`, `${list[j].name} ${j + 1}번째`, `${list[j].name} ${i + 1}번째 ↔ ${list[i].name}`); App.redraw(); };
      App.on(el, {
        add: () => editValue(k, null), edit: (t) => editValue(k, list[+t.dataset.i]),
        up: (t) => move(+t.dataset.i, -1), down: (t) => move(+t.dataset.i, 1),
        off: async (t) => {
          const v = list[+t.dataset.i];
          if (list.filter((x) => x.use).length <= 1) { App.toast("쓰는 값이 하나는 있어야 합니다"); return; }
          if (!(await App.confirm(`${k} 「${v.name}」 값을 사용 안 함으로 바꾸시겠습니까?`, { danger: true, ok: "사용 안 함", detail: `새 입력과 검색 조건에서 빠집니다. ${usage(k, v.name).text}은(는) 그대로 남습니다.` }))) return;
          v.use = false; sync(k); App.log("선택 항목", `${k} 값 사용 안 함`, v.name + " 사용", "사용 안 함"); App.toast("사용 안 함으로 바꿨습니다"); App.redraw();
        },
        on: (t) => { const v = list[+t.dataset.i]; v.use = true; sync(k); App.log("선택 항목", `${k} 값 다시 사용`, "사용 안 함", v.name + " 사용"); App.toast("다시 사용하도록 바꿨습니다"); App.redraw(); },
      });
    },
  });
})();
</script>
<script>/* B-23 가용조회 (옛 SC-18 · W-253 ~ W-255). 위 도구 줄에서 연다(메뉴에 없음).
   통신사 자동 연동은 없다: 본사가 주소별 설치 가능 여부를 직접 등록해 두고 조회한다(W-255 확정). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { zip: "", addr: "", carrier: "", asked: null, err: "" };
  const entryOf = (addr) => App.db.availability.find((a) => a.addr === addr);

  /** 그 주소의 가용 정보 한 줄을 넣거나 바꾼다(같은 통신사 · 상품이면 덮어쓴다) */
  function editRow(addr, row) {
    const db = App.db;
    App.editModal({
      title: row ? "가용 정보 수정" : "가용 정보 등록", values: row ? { carrier: row[0], product: row[1], ok: row[2] } : { ok: "가능" },
      note: `${addr} · 통신사에 확인한 설치 가능 여부를 본사가 직접 적어 둡니다.`,
      fields: [
        { name: "carrier", label: "통신사", type: "select", options: db.carriers, required: true, readonly: !!row },
        { name: "product", label: "상품", type: "select", options: [...new Set(db.products.filter((p) => p.state === "사용" || (row && p.name === row[1])).map((p) => p.name))], required: true, readonly: !!row },
        { name: "ok", label: "설치 가능 여부", type: "radio", options: ["가능", "불가"], required: true },
      ],
      onSave: (v) => {
        if (row) { v.carrier = row[0]; v.product = row[1]; }
        if (!db.products.some((p) => p.carrier === v.carrier && p.name === v.product)) return `${v.carrier}에는 「${v.product}」 상품이 없습니다. 통신사와 상품을 다시 골라 주세요.`;
        let e = entryOf(addr); if (!e) { e = { addr, rows: [] }; db.availability.push(e); }
        const had = e.rows.find((r) => r[0] === v.carrier && r[1] === v.product);
        App.log("가용 정보", `${addr} · ${v.carrier} ${v.product}`, had ? had[2] : "", v.ok);
        if (had) had[2] = v.ok; else e.rows.push([v.carrier, v.product, v.ok]);
        App.redraw();
      },
    });
  }

  App.screen("B-23", {
    title: "가용조회", sc: ["SC-18"],
    render(el) {
      const db = App.db; const a = st.asked;
      const e = a ? entryOf(a.addr) : null; const rows = e ? e.rows.filter((r) => !a.carrier || r[0] === a.carrier) : [];
      el.innerHTML = h`${App.head("가용조회")}
        <div class="note gray">주소를 넣으면 통신사별 인터넷 · TV 설치 가능 여부를 보여 줍니다. 통신사와 자동으로 연결되지는 않고, 본사가 등록해 둔 정보에서 찾습니다.</div>
        <div class="card pad">
          <div class="row" style="align-items:flex-end">
            <div class="f" style="flex:1;min-width:280px"><label>주소<span class="req">*</span></label><div class="row" style="flex-wrap:nowrap"><input class="in fix" style="width:86px" readonly value="${st.zip}" placeholder="우편번호" aria-label="우편번호"><input class="in ${st.err ? "err" : ""}" readonly value="${st.addr}" placeholder="「주소 검색」으로 주소를 골라 주세요" aria-label="주소" data-act="addr"><button class="btn" data-act="addr">주소 검색</button></div></div>
            <div class="f" style="width:180px"><label>통신사</label><select class="in" data-on="carrier" aria-label="통신사">${App.opts(db.carriers, st.carrier, "전체")}</select></div>
            <button class="btn p" data-act="run">조회</button><button class="btn ghost" data-act="reset">초기화</button>
          </div>
          ${st.err ? h`<p class="errmsg" style="margin-top:6px">${st.err}</p>` : ""}
        </div>
        <section class="sec" data-result></section>`;

      const res = $("[data-result]", el);
      if (!a) res.innerHTML = h`<div class="card empty"><b>조회할 주소를 골라 주세요</b>주소를 고르고 「조회」를 누르면 통신사 · 상품별 설치 가능 여부가 나옵니다.</div>`;
      else {
        res.innerHTML = h`<div class="sec-h"><h2>${a.addr}</h2><small>${a.carrier || "통신사 전체"} · ${App.dt(a.at)} 조회</small><span class="sp"><button class="btn sm" data-act="add">가용 정보 등록</button></span></div><div data-tbl></div>`;
        App.table($("[data-tbl]", res), [
          { label: "통신사", render: (r) => r[0] }, { label: "상품", render: (r) => h`<span class="name">${r[1]}</span>` },
          { label: "설치 가능 여부", render: (r) => h`<span class="chip c-${r[2] === "가능" ? "green" : "red"}">${r[2] === "가능" ? "설치 가능" : "설치 불가"}</span>` },
          { label: "", r: 1, render: (r, i) => h`<button class="btn sm" data-act="edit" data-i="${i}">수정</button>` },
        ], rows, {
          pageSize: 0, bar: h`결과 <b>${rows.length}</b>건 · 가능 ${rows.filter((r) => r[2] === "가능").length}건 · 불가 ${rows.filter((r) => r[2] !== "가능").length}건`,
          empty: e && e.rows.length ? ["이 통신사로 등록된 가용 정보가 없습니다", "통신사를 「전체」로 바꿔 조회하거나, 확인한 내용을 「가용 정보 등록」으로 남겨 주세요."] : ["이 주소에 등록된 가용 정보가 없습니다", "통신사에 확인한 뒤 「가용 정보 등록」으로 남겨 두면 다음부터 바로 조회됩니다."],
        });
      }

      App.on(el, {
        addr: () => App.addressSearch((p) => { st.zip = p.zip; st.addr = p.addr; st.err = ""; App.redraw(); }),
        carrier: (t) => { st.carrier = t.value; },
        run: () => { if (!st.addr) { st.err = "주소를 넣어 주세요. 「주소 검색」으로 고를 수 있습니다."; st.asked = null; App.redraw(); return; } st.err = ""; st.asked = { addr: st.addr, carrier: st.carrier, at: App.now() }; App.redraw(); },
        reset: () => { st.zip = ""; st.addr = ""; st.carrier = ""; st.asked = null; st.err = ""; App.redraw(); },
        add: () => editRow(a.addr, null), edit: (t) => editRow(a.addr, rows[+t.dataset.i]),
      });
    },
  });
})();
</script>
<script>/* B-24 비밀번호변경 (옛 SC-19 PC). 위 도구에서 연다. 현재 비밀번호 확인 + 새 비밀번호(8자 이상 영문 · 숫자 조합) + 확인.

(function () {
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$;

  App.screen("B-24", {
    title: "비밀번호변경", sc: ["SC-19"],
    render(el) {
      const s = App.session;
      const row = (name, label, hint, auto) => h`<div class="k"><label for="b24-${name}">${label}</label><span class="req">*</span></div><div class="v" data-f="${name}"><input class="in" id="b24-${name}" type="password" name="${name}" data-enter="save" autocomplete="${auto}" style="max-width:320px">${hint ? h`<span class="hint">${hint}</span>` : ""}</div>`;
      el.innerHTML = h`<div style="max-width:720px">
        ${App.head("비밀번호변경")}
        <div class="card" style="overflow:hidden">
          <div class="form c1">
            <div class="k">계정</div><div class="v"><span>${s.name} <span class="muted">(${s.org} · ${s.label})</span></span></div>
            ${row("cur", "현재 비밀번호", "", "current-password")}
            ${row("next", "새 비밀번호", "8자 이상, 영문과 숫자를 섞어 주세요.", "new-password")}
            ${row("again", "새 비밀번호 확인", "", "new-password")}
          </div>
          <div class="bar-actions" style="margin-top:0;position:static"><span class="sp">표시(<span class="req" style="margin:0">*</span>)는 필수입니다. 저장하면 다음 로그인부터 새 비밀번호로만 들어갈 수 있습니다.</span><button class="btn" data-act="cancel">취소</button><button class="btn p" data-act="save">저장</button></div>
        </div>
        <p class="hint" style="margin-top:10px">비밀번호를 잊은 다른 사용자는 조직·계정에서 임시 비밀번호를 발급해 줍니다.</p></div>`;
      const fail = (name, msg) => { const box = $(`[data-f="${name}"]`, el); const i = $(".in", box); i.classList.add("err"); const m = document.createElement("span"); m.className = "errmsg"; m.textContent = msg; box.appendChild(m); return i; };
      App.on(el, {
        cancel: () => App.back(s.home),
        save: () => {
          $$(".errmsg", el).forEach((e) => e.remove()); $$(".in.err", el).forEach((e) => e.classList.remove("err"));
          const v = (n) => $(`[name="${n}"]`, el).value; const cur = v("cur"), next = v("next"), again = v("again"); const bad = [];
          if (!cur) bad.push(fail("cur", "현재 비밀번호를 넣어 주세요"));
          if (!next) bad.push(fail("next", "새 비밀번호를 넣어 주세요"));
          else if (next.length < 8 || !/[A-Za-z]/.test(next) || !/\d/.test(next)) bad.push(fail("next", "8자 이상, 영문과 숫자를 섞어 주세요"));

          if (!again) bad.push(fail("again", "새 비밀번호를 한 번 더 넣어 주세요"));
          else if (next && again !== next) bad.push(fail("again", "새 비밀번호와 같지 않습니다"));
          if (bad.length) { bad[0].focus(); return; }
          App.log("계정 권한", `${s.name} 비밀번호 변경`, "", "본인이 변경");

          App.back(s.home);
        },
      });
    },
  });
})();

            </div>

              <dl class="kv"><dt>가려서 보임</dt><dd>주민번호 · 연락처 · 계좌번호는 목록과 조회 화면에 가린 값으로 보입니다.</dd><dt>원문 보기</dt><dd>본사 관리자만 볼 수 있고, 볼 때마다 누가 · 언제 봤는지 기록이 남습니다.</dd><dt>범위</dt><dd>협력점은 자기와 하부점이 접수한 건, 하부점은 자기가 접수한 건만 봅니다.</dd><dt>내려받기</dt><dd>엑셀 파일에는 가린 값만 들어갑니다.</dd></dl></div>

</script>
<script>/* P-01 내 접수 (옛 SC-36 · SC-36H). 협력점 = 자기와 하부점 건, 하부점 = 자기 건. 폰 첫 화면.
   반송된 건은 맨 위에 따로 올린다(알림이 없으므로 들어오면 바로 보이게). 상담 내용은 보이지 않는다(D-4). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { state: "", q: "", org: "", open: "", from: "", to: "", more: false };
  App.screen("P-01", {
    title: "내 접수", device: "phone", roles: ["partner", "sub"], sc: ["SC-36", "SC-36H"],
    render(el) {
      const s = App.session; const mine = () => App.mine(App.db.customers).filter((c) => c.via !== "본사");
      el.innerHTML = h`<div class="ph-h"><h1>내 접수</h1><span class="sp"><button class="btn sm" data-act="more">검색 조건</button></span></div>
        <div data-bounce></div>
        <div class="search" style="margin-bottom:8px"><input class="in" style="height:42px" data-on="q" data-live value="${st.q}" placeholder="고객명으로 찾기" aria-label="고객명"></div>
        ${st.more ? h`<div class="card pad" style="margin-bottom:10px">
          ${s.role === "partner" ? h`<div class="pfield"><label class="lbl">접수한 곳</label><select class="in" data-on="f" data-k="org">${App.opts([["me", "내 협력점"], ...App.db.subs.filter((x) => x.partnerId === s.partnerId).map((x) => [x.id, x.name])], st.org, "전체")}</select></div>` : ""}
          <div class="pfield"><label class="lbl">개통상태</label><select class="in" data-on="f" data-k="open">${App.opts(App.OPEN_STATES, st.open, "전체")}</select></div>
          <div class="pfield" style="margin-bottom:0"><label class="lbl">접수일</label><div class="range"><input class="in" type="date" style="flex:1;width:auto" data-on="f" data-k="from" value="${st.from}" aria-label="시작일">~<input class="in" type="date" style="flex:1;width:auto" data-on="f" data-k="to" value="${st.to}" aria-label="종료일"></div></div></div>` : ""}
        <div data-pills></div><p class="hint" data-cnt style="margin-bottom:8px"></p><div data-list></div>`;
      const filtered = () => mine().filter((c) => (!st.q || c.name.includes(st.q)) && (!st.open || c.openState === st.open) && (!st.org || (st.org === "me" ? !c.subId : c.subId === st.org)) && (!st.from || c.receivedAt.slice(0, 10) >= st.from) && (!st.to || c.receivedAt.slice(0, 10) <= st.to));
      const card = (c) => h`<button class="pcard ${c.receiptState === "반송" ? "alert" : ""}" data-go="P-02" data-params="id=${c.id}">
        <div class="r1"><b>${c.name}</b>${App.chip(c.receiptState)}<span class="sp">${App.chip(c.openState)}</span></div>
        <div class="meta">${c.carrier} · ${c.product} · ${c.set}${s.role === "partner" && c.subId ? " · " + App.subName(c.subId) : ""}</div>
        <div class="meta muted num">접수 ${App.dt(c.receivedAt)}${c.openedAt ? " · 개통 " + c.openedAt : ""}</div>
        ${c.receiptState === "반송" ? h`<div class="ln" style="color:var(--red)">반송 사유: ${c.bounce}</div>` : c.reply ? h`<div class="ln">본사 회신: ${c.reply}</div>` : ""}</button>`;
      function paint() {
        const all = filtered(); const bounced = mine().filter((c) => c.receiptState === "반송");
        $("[data-bounce]", el).innerHTML = bounced.length && !st.state ? h`<div class="note bad" style="margin-bottom:10px"><b>보완이 필요한 접수 ${bounced.length}건</b><br>반송 사유를 확인하고 다시 접수해 주세요. <a data-act="st" data-v="반송">반송 건만 보기</a></div>` : "";
        App.pills($("[data-pills]", el), [["전체", all.length, ""], ...App.RECEIPT_STATES.map((x) => [x, all.filter((c) => c.receiptState === x).length, x])], st.state, (v) => { st.state = v; paint(); });
        const list = st.state ? all.filter((c) => c.receiptState === st.state) : all;
        $("[data-cnt]", el).textContent = `검색 결과 ${list.length}건 · ${s.role === "partner" ? "내 협력점과 하부점에 접수한 건만 보입니다" : "내가 접수한 건만 보입니다"}`;
        $("[data-list]", el).innerHTML = list.length ? h`${list.slice(0, 30).map(card)}${list.length > 30 ? h`<p class="hint" style="text-align:center;padding:8px">최근 30건만 보여 줍니다. 조건으로 좁혀 보세요.</p>` : ""}` : h`<div class="card empty"><b>${mine().length ? "검색 결과가 없습니다" : "아직 접수한 고객이 없습니다"}</b>${mine().length ? "조건을 바꿔 보세요." : "아래 「등록」으로 첫 고객을 접수해 보세요."}<br><button class="btn p" data-go="P-03">고객 등록</button></div>`;
      }
      paint();
      App.on(el, { q: (t) => { st.q = t.value.trim(); paint(); }, f: (t) => { st[t.dataset.k] = t.value; paint(); }, more: () => { st.more = !st.more; App.redraw(); }, st: (t) => { st.state = t.dataset.v; paint(); } });
    },
  });
})();
</script>
<script>/* P-02 접수 상세 (옛 SC-42). 고객 한 명의 접수 · 요청 · 본사 회신 · 반송 · 재접수를 오래된 순으로 보고, 본사에 요청 글을 남긴다.
   본사 상담 내용은 나오지 않는다(D-4 · App.historyOf(cid, true)). 반송이면 빨간 사유와 「재접수」(P-04). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  App.screen("P-02", {
    title: "접수 상세", device: "phone", roles: ["partner", "sub"], parent: "P-01", back: { code: "P-01", label: "내 접수" }, sc: ["SC-42"],
    render(el, params) {
      const F = App.phoneForm;
      if (!params.id && window.__ONLY) { const x = App.mine(App.db.customers).find((k) => k.via !== "본사" && k.receiptState === "반송"); if (x) params.id = x.id; } // 화면별 파일은 넘겨받은 건이 없으니 예시 한 건을 연다
      const c = F.own(params.id);
      if (!c) { el.innerHTML = h`<div class="card empty"><b>접수 건을 찾을 수 없습니다</b>내 범위의 접수 건만 볼 수 있습니다.<br><button class="btn p lg" data-go="P-01">내 접수로</button></div>`; return; }
      const rows = F.hist(c.id); const bounced = c.receiptState === "반송";
      el.innerHTML = h`${F.css}<div class="ph-h"><h1>접수 상세</h1></div>
        ${F.brief(c)}
        ${bounced ? h`<div class="note bad" role="alert"><b>반송됨</b> · 보완해서 다시 접수해 주세요.<p style="margin:4px 0 10px">${c.bounce}</p><button class="btn danger lg block" data-go="P-04" data-params="id=${c.id}&from=P-02">재접수</button></div>` : ""}
        ${c.receiptState === "회신 완료" && c.reply ? h`<div class="note ok"><b>본사 회신</b><p style="margin-top:2px">${c.reply}</p></div>` : ""}
        <div class="note gray">본사 처리 내용은 이 화면에 바로 반영됩니다. 별도 알림은 보내지 않습니다.</div>
        <div class="sec-h" style="margin-top:16px"><h2>이력</h2><small>${rows.length}건 · 오래된 순</small></div>
        <div class="card" style="padding:4px 14px">${rows.length ? App.timeline(rows) : h`<div class="empty"><b>이력이 없습니다</b>아래 단추로 본사에 요청을 남길 수 있습니다.</div>`}</div>
        <div class="pf-gap"></div>
        <div class="psticky"><button class="btn p lg block" data-act="ask">본사에 요청 남기기</button></div>`;
      App.on(el, {
        ask: () => App.modal({
          title: "본사에 요청 남기기", sub: c.name, sheet: true,
          body: h`<div class="pfield" data-box="text" style="margin-bottom:4px"><label class="lbl">요청 내용<span class="req">*</span></label><textarea class="in" rows="5" maxlength="500" data-text placeholder="예: 설치일을 토요일로 바꿔 주세요" aria-label="요청 내용"></textarea></div>
            <div class="row"><span class="hint">본사 접수함과 이 화면의 이력에 바로 보입니다.</span><span class="sp hint num" data-len>0 / 500</span></div><p class="errmsg" data-err></p>`,
          onOpen: (root) => { const ta = $("[data-text]", root); ta.oninput = () => ($("[data-len]", root).textContent = `${ta.value.length} / 500`); },
          actions: [{ label: "취소" }, { label: "요청 남기기", kind: "p", onClick: (close, root) => {
            const text = $("[data-text]", root).value.trim();
            if (!text) { $("[data-err]", root).textContent = "요청 내용을 넣어 주세요"; $("[data-text]", root).classList.add("err"); return; }
            if (text.length > 500) { $("[data-err]", root).textContent = "500자까지 넣을 수 있습니다"; return; }
            c.request = text; App.addHistory(c.id, "요청", text);
            close(); App.toast("요청을 남겼습니다"); App.redraw(); window.scrollTo(0, document.body.scrollHeight);
          } }],
        }),
      });
    },
  });
})();
</script>
<script>/* P-03 고객 등록 (옛 SC-43 · SC-8 폰 변형). 협력점 · 하부점이 휴대폰에서 4단계(고객 › 상품 › 사은품 · 납부 › 확인)로 접수한다.
   항목은 본사 고객 등록과 같은 범위(R-53). 접수하면 내 접수(P-01)로 간다(D-11).
   App.phoneForm = 등록(P-03)과 재접수(P-04)가 같이 쓰는 입력 묶음. 폰 화면 공통 보정 CSS(App.phoneForm.css)도 여기 둔다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$;
  const KINDS = ["개인", "개인사업자", "법인", "미성년자", "외국인"];
  const BANKS = ["국민", "신한", "우리", "하나", "농협", "기업"];
  const needRrn = (k) => k === "개인" || k === "미성년자" || k === "외국인";
  const needBiz = (k) => k === "개인사업자" || k === "법인";
  const REQ = App.raw('<span class="req">*</span>');
  const newLine = () => ({ product: "", option: "", set: "", setbox: "", contract: "", addon: "", count: "1" });
  const clean = (v) => String(v == null ? "" : v).replace(/[,\s원]/g, "");
  const num = (v) => Number(clean(v)) || 0;
  const isNum = (v) => /^\d+$/.test(clean(v));

  /* 폰 화면 공통 보정: 누르는 곳 44px 이상, 아래에서 올라오는 창 안 입력 높이. 선택자는 pf- 로 시작하거나 body.phone 안으로만 건다. */
  const css = App.raw(`<style>
    .pf-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:14px 14px 4px;margin-bottom:10px}
    .pf-card>h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .pf-card>h2 .sp{margin-left:auto}
    .pf-row{display:flex;gap:8px;align-items:center}
    .pf-row>.in{flex:1}
    .pf-mask{-webkit-text-security:disc}
    .pf-line{border:1px dashed #C3CAD5;border-radius:var(--r1);padding:10px 10px 0;margin-bottom:10px}
    .pf-line>b{display:flex;align-items:center;font-size:13px;margin-bottom:8px;min-height:28px}
    .pf-tap{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;border-radius:var(--r1);font-weight:700;font-size:13.5px;color:var(--brand)}
    .pf-pills .pill{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;font-size:14px}
    .pf-tabs .tabs button{min-height:44px;padding:0 4px;font-size:15px}
    .pf-kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 10px;font-size:13.5px;margin-bottom:10px}
    .pf-kv dt{color:var(--muted)} .pf-kv dd{min-width:0;word-break:break-word}
    .pf-gap{height:70px}
    .pf-card .pfield>.hint,.pf-card .pfield>.errmsg,body.phone .modal .pfield>.hint,body.phone .modal .pfield>.errmsg{display:block;margin-top:3px}
    body.phone .modal footer .btn{height:44px;flex:1;font-size:15px}
    body.phone .modal .x{width:44px;height:44px}
    body.phone .modal .mb .btn{height:44px}
    body.phone .modal .mb button.row{min-height:44px}
    body.phone .modal .mb input.in,body.phone .modal .mb select.in{height:44px;font-size:15px}
  </style>`);

  const box = (key, label, ctl, o) => { o = o || {}; return h`<div class="pfield" data-box="${key}"><label class="lbl">${label}${o.req ? REQ : ""}</label>${ctl}${o.hint ? h`<span class="hint">${o.hint}</span>` : ""}</div>`; };
  const inp = (d, key, label, o) => { o = o || {}; return box(key, label, h`<input class="in ${o.mask ? "pf-mask" : ""}" data-f="${key}" type="${o.type || "text"}" ${o.num ? App.raw('inputmode="numeric"') : ""} ${o.mask ? App.raw('autocomplete="off"') : ""} value="${d[key]}" placeholder="${o.ph || ""}" maxlength="${o.max || 60}" aria-label="${label}">`, o); };
  const sel = (d, key, label, list, o) => { o = o || {}; return box(key, label, h`<select class="in" data-f="${key}" ${o.re ? App.raw('data-on="re"') : ""} aria-label="${label}">${App.opts(list, d[key], o.first === undefined ? "고르기" : o.first)}</select>`, o); };

  const F = (App.phoneForm = {
    css,
    STEPS: ["고객", "상품", "사은품 · 납부", "확인"],
    /** 빈 입력값. 유치자는 내 조직 사람이 있으면 미리 골라 둔다. */
    blank() {
      const s = App.session; const mineRec = App.db.staff.find((x) => x.state === "재직" && x.roles.includes("유치자") && x.org === App.partnerName(s.partnerId));
      return { name: "", ceo: "", kind: "개인", rrn1: "", rrn2: "", rrnHad: false, bizNo: "", corpNo: "", zip: "", addr: "", addr2: "", tel: "", phoneCarrier: "", phone: "", email: "", authWay: "휴대폰", authVal: "", recruiter: mineRec ? mineRec.name : "",
        carrier: "", region: "", lines: [newLine()],
        payWay: "계좌이체", payDiscount: "", payBill: "문자", payBank: "", payAcct: "", payHolder: "", payRel: "", payRrn: "",
        gift: "", giftAmt: "", giftExtra: "", giftPayer: "", giftDue: "", giftBank: "", giftAcct: "", giftHolder: "", giftRrn: "", hqGift: "", hqGiftAmt: "",
        mnpOn: "", mnpFrom: "", mnpNo: "", mnpHolder: "", request: "" };
    },
    /** 접수 건 → 입력값(재접수). 주민번호 뒷자리는 화면에 싣지 않는다(비워 두면 기존 값을 그대로 쓴다). */
    fromCustomer(c) {
      const pay = c.pay || {}; const m = c.mnp;
      return Object.assign(F.blank(), { name: c.name, ceo: c.ceo, kind: c.kind, rrn1: c.rrn ? c.rrn.slice(0, 6) : "", rrn2: "", rrnHad: !!c.rrn, bizNo: c.bizNo, corpNo: c.corpNo || "", zip: c.zip, addr: c.addr, addr2: c.addr2, tel: c.tel, phoneCarrier: c.phoneCarrier, phone: c.phone, email: c.email, authWay: c.authWay || "휴대폰", authVal: c.authVal || "", recruiter: c.recruiter,
        carrier: c.carrier, region: c.region, lines: [{ product: c.product, option: c.option, set: c.set, setbox: c.setbox, contract: c.contract, addon: c.addon, count: String(c.lines || 1) }, ...(c.moreLines || []).map((l) => Object.assign({}, l))],
        payWay: pay.way || "계좌이체", payDiscount: pay.discount || "", payBill: pay.bill || "", payBank: pay.bank || "", payAcct: pay.acct || "", payHolder: pay.holder || "", payRel: pay.rel || "", payRrn: pay.rrn || "",
        gift: c.gift, giftAmt: c.gift ? String(c.giftAmt) : "", giftExtra: c.giftExtra ? String(c.giftExtra) : "", giftPayer: c.giftPayer, giftDue: c.giftDue, giftBank: c.giftBank, giftAcct: c.giftAcct, giftHolder: c.giftHolder, giftRrn: c.giftRrn || "", hqGift: c.hqGift, hqGiftAmt: c.hqGift ? String(c.hqGiftAmt) : "",
        mnpOn: m ? "있음" : "", mnpFrom: m ? m.from : "", mnpNo: m ? m.no : "", mnpHolder: m ? m.holder : "", request: "" });
    },
    /** 단계 한 장(0 고객 · 1 상품 · 2 납부 · 사은품 · 번호이동). opt.re = 재접수 */
    html(d, step, opt) {
      opt = opt || {}; const db = App.db;

        ${box("receivedAt", "접수일자", h`<input class="in" readonly value="${opt.re ? "재접수하는 시각으로 다시 기록됩니다" : "접수하는 시각으로 자동 기록됩니다"}" aria-label="접수일자">`)}</section>`;
      if (step === 1) return h`<section class="pf-card"><h2>상품 정보</h2>
        ${sel(d, "carrier", "통신사", db.carriers, { req: 1, re: 1 })}
        ${sel(d, "region", "지역", db.options.지역)}
        ${d.lines.map((L, i) => { const P = db.products.filter((p) => p.carrier === d.carrier && (p.state === "사용" || p.name === L.product)); const AD = db.addons.filter((a) => a.carrier === d.carrier && (a.state === "사용" || a.name === L.addon)); return h`<div class="pf-line"><b>상품 ${i + 1}${d.lines.length > 1 ? h`<button class="pf-tap" style="margin-left:auto;color:var(--red)" data-act="delLine" data-i="${i}">이 줄 빼기</button>` : ""}</b>
          <div class="pfield" data-box="l${i}.product"><label class="lbl">상품${REQ}</label><select class="in" data-l="${i}" data-lf="product" data-on="re" aria-label="상품 ${i + 1}">${App.opts(P.map((p) => p.name), L.product, d.carrier ? "고르기" : "통신사를 먼저 고르세요")}</select>${L.product ? h`<span class="hint">옵션 ${L.option} · 셋트 ${L.set} · 셋탑박스 ${L.setbox} (상품에 따라 자동)</span>` : ""}</div>

          <div class="pfield" data-box="l${i}.count"><label class="lbl">회선 수</label><input class="in" data-l="${i}" data-lf="count" inputmode="numeric" maxlength="2" value="${L.count}" aria-label="회선 수 ${i + 1}"></div></div>`; })}
        <div class="pfield"><button class="btn lg block" data-act="addLine">+ 상품 추가</button></div></section>`;
      return h`<section class="pf-card"><h2>납부 정보<span class="sp"><button class="pf-tap" data-act="samePay">위 고객 정보와 동일</button></span></h2>

        ${sel(d, "payBill", "청구서 종류", ["문자", "이메일", "우편"])}
        ${sel(d, "payBank", "은행", BANKS)}
        ${inp(d, "payAcct", "계좌번호", { num: 1, max: 20, ph: "숫자만" })}
        ${inp(d, "payHolder", "예금주", { max: 30 })}
        ${sel(d, "payRel", "고객과 관계", ["본인", "배우자", "부모", "자녀", "기타"])}
        ${inp(d, "payRrn", "예금주 주민번호", { num: 1, mask: 1, max: 14, ph: "숫자 13자리", hint: "가려서 저장 · 표시됩니다." })}</section>
      <section class="pf-card"><h2>사은품<span class="sp"><button class="pf-tap" data-act="sameGift">납부 계좌와 동일</button></span></h2>
        ${sel(d, "gift", "사은품 명", db.gifts.filter((g) => g.kind === "사은품" && (g.state === "사용" || g.name === d.gift)).map((g) => g.name), { re: 1, first: "없음", hint: "고르면 금액 · 지급처가 채워집니다." })}
        ${d.gift ? h`${inp(d, "giftAmt", "사은품 금액(원)", { req: 1, num: 1, max: 10 })}
        ${inp(d, "giftExtra", "추가사은품(원)", { num: 1, max: 10, ph: "0" })}
        ${sel(d, "giftPayer", "지급처", ["센터(자체) 지급", "유치자 지급"])}
