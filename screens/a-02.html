<script>/* 여러 화면이 같이 쓰는 업무 동작: 고객 서랍 · 개통 상태 변경 · 상담 저장 · 회신/반송 · 협력점 정보.
   규칙은 여기 한 곳에만 둔다(화면마다 따로 쓰지 않는다). */
(function () {
  "use strict";
  const App = window.App; const h = App.h; const $ = App.$;

  App.addHistory = (cid, kind, text) => App.db.history.unshift({ id: App.uid("H"), cid, at: App.now(), kind, text, by: App.session.name });
  App.historyOf = (cid, forPartner) => App.db.history.filter((x) => x.cid === cid && (!forPartner || x.kind !== "상담")); // 상담은 본사만 본다(D-4)

  /** 개통 상태 변경(한 건씩 · D-7). 확인창을 거치고, 바꾼 사람 · 시각을 남긴다. 유심개통 · 개통완료가 되면 개통일을 채운다. */
  App.changeOpenState = async (c, to, after) => {
    if (!to || to === c.openState) return;
    if (c.settleId && App.db.settlements.some((s) => s.id === c.settleId && s.state === "확정")) { App.toast("확정된 정산에 든 건은 상태를 바꿀 수 없습니다"); return; }
    const ok = await App.confirm(`개통 상태를 「${c.openState}」에서 「${to}」(으)로 바꾸시겠습니까?`, { detail: to === "개통완료" || to === "유심개통" ? "개통 완료된 건만 정산 대상이 됩니다." : to === "해지" ? "해지 건은 환수·미수 화면에서 환수를 등록할 수 있습니다." : "", danger: to === "해지" || to === "개통불가" });
    if (!ok) return;
    const before = c.openState; c.openState = to;
    if ((to === "유심개통" || to === "개통완료") && !c.openedAt) c.openedAt = App.today();
    App.addHistory(c.id, "상태 변경", `${before} > ${to}`); App.log("상태", `${c.name} 개통 상태 변경`, before, to);
    App.toast("개통 상태를 바꿨습니다"); if (after) after();
  };
  /** 상담 저장: 분류 태그 필수, 500자까지. 목록의 최종상담내용에 바로 보인다. */
  App.saveConsult = (c, tag, text) => {
    if (!tag) return "분류를 골라 주세요"; if (!text) return "상담 내용을 넣어 주세요"; if (text.length > 500) return "500자까지 넣을 수 있습니다";
    App.db.consults.unshift({ id: App.uid("N"), cid: c.id, tag, text, at: App.now(), by: App.session.name }); c.tag = tag; c.lastConsult = text; App.addHistory(c.id, "상담", `[${tag}] ${text}`); return "";
  };
  /** 협력점 접수 처리: 확인 · 회신 · 반송(반송은 되돌릴 수 없어 빨간 확인 단추 · D-12) */
  App.receiptConfirm = (c, after) => { const b = c.receiptState; c.receiptState = "확인"; App.addHistory(c.id, "확인", "본사가 접수를 확인했습니다"); App.log("접수", `${c.name} 접수 확인`, b, "확인"); App.toast("확인으로 바꿨습니다"); if (after) after(); };
  App.receiptReply = (c, after) => App.editModal({ title: `${c.name} 회신`, note: "회신 내용은 협력점 화면의 접수 상세에 바로 보입니다. 별도 알림은 가지 않습니다.", fields: [{ name: "text", label: "회신 내용", type: "textarea", required: true, max: 200, hint: "200자까지" }], done: "회신했습니다", onSave: (v) => { const b = c.receiptState; c.receiptState = "회신 완료"; c.reply = v.text; App.addHistory(c.id, "회신", v.text); App.log("접수", `${c.name} 회신`, b, "회신 완료"); if (after) after(); } });
  App.receiptBounce = (c, after) => App.modal({ title: `${c.name} 반송`, body: h`<div class="note warn">반송하면 협력점이 사유를 보고 보완해 다시 접수합니다. 재접수하면 접수일시가 그 시각으로 바뀝니다.</div><div class="card" style="overflow:hidden">${App.form([{ name: "text", label: "반송 사유", type: "textarea", required: true, max: 200, hint: "200자까지" }], { cols: 1 })}</div>`, actions: [{ label: "취소" }, { label: "반송", kind: "danger", onClick: (close, root) => { const r = App.readForm(root, [{ name: "text", label: "반송 사유", type: "textarea", required: true }]); if (!r.ok) return; const b = c.receiptState; c.receiptState = "반송"; c.bounce = r.values.text; App.addHistory(c.id, "반송", r.values.text); App.log("접수", `${c.name} 반송`, b, "반송"); close(); App.toast("반송했습니다"); if (after) after(); } }] });

  const KIND_CHIP = { 접수: "gray", 요청: "amber", 확인: "blue", 회신: "green", 반송: "red", 재접수: "violet", 상담: "gray", "상태 변경": "blue", 수정: "gray" };
  App.timeline = (rows) => (rows.length ? h`<div class="tl">${rows.map((x) => h`<div class="tl-i"><div><span class="chip c-${KIND_CHIP[x.kind] || "gray"}">${x.kind}</span></div><div><p>${x.text}</p><div class="who">${App.dt(x.at)} · ${x.by}</div></div></div>`)}</div>` : h`<div class="empty"><b>기록이 없습니다</b></div>`);

  /** 고객 서랍: 목록을 떠나지 않고 한 건을 처리한다(요약 · 상담 · 이력 · 정산). onChange 는 목록을 다시 그릴 때 쓴다. */
  App.openCustomer = (id, o) => {
    o = o || {}; const c = App.cust(id); if (!c) return; const changed = () => { if (o.onChange) o.onChange(); };
    let pickTag = "";
    const dr = App.drawer({
      wide: true, tab: o.tab || "sum",
      title: () => h`${c.name} ${App.chip(c.openState)}`,
      sub: () => h`${c.carrier} · ${c.product} · ${c.set} · ${App.orgOf(c)} · 접수 ${App.dt(c.receivedAt)}`,
      tabs: [["sum", "요약"], ["talk", "상담", () => App.db.consults.filter((x) => x.cid === id).length || ""], ["hist", "이력"], ["money", "정산"]],
      body: (tab) => {
        if (tab === "sum") return h`
          ${c.receiptState === "반송" ? h`<div class="note bad"><b>반송된 접수입니다.</b> ${c.bounce} <a data-go="B-03" data-params="id=${c.id}&mode=re">본사가 대신 재접수</a></div>` : ""}
          ${c.via !== "본사" && (c.receiptState === "접수" || c.receiptState === "재접수") ? h`<div class="note warn"><b>협력점 접수 확인 전입니다.</b> ${c.request ? h`요청: ${c.request}` : ""}<div class="row" style="margin-top:8px"><button class="btn sm p" data-act="rc">확인</button><button class="btn sm" data-act="rr">회신</button><button class="btn sm" data-act="rb">반송</button></div></div>` : ""}
          <section class="card pad"><div class="sec-h"><h2>개통</h2><span class="sp">${App.chip(c.auth)}</span></div>
            <div class="row"><select class="in fix" data-os aria-label="바꿀 개통 상태">${App.opts(App.OPEN_STATES, c.openState)}</select><button class="btn" data-act="os">상태 변경</button><span class="hint">개통 완료 · 유심개통만 정산 대상</span></div>
            <dl class="kv" style="margin-top:12px"><dt>가입번호</dt><dd class="num">${c.joinNo || "-"}</dd><dt>설치예정일</dt><dd class="num">${c.installDue || "-"}</dd><dt>개통일</dt><dd class="num">${c.openedAt || "-"}</dd><dt>접수 처리</dt><dd>${c.via === "본사" ? "본사 직접 접수" : App.chip(c.receiptState)}</dd></dl></section>
          <section class="sec card pad"><div class="sec-h"><h2>고객</h2></div><dl class="kv"><dt>고객종류</dt><dd>${c.kind}</dd><dt>핸드폰</dt><dd class="num">${App.maskPhone(c.phone)}</dd><dt>주소</dt><dd>${c.addr} ${c.addr2}</dd><dt>협력점</dt><dd>${App.partnerName(c.partnerId)}${c.subId ? " · " + App.subName(c.subId) : ""}</dd><dt>유치자</dt><dd>${c.recruiter}</dd><dt>담당자</dt><dd>${c.manager}</dd><dt>상부점</dt><dd>${App.upperName(c.upperId)}</dd></dl></section>
          <section class="sec card pad"><div class="sec-h"><h2>사은품</h2><span class="sp">${c.gift ? App.chip(c.giftPaid ? "지급완료" : "미지급") : ""}</span></div>
            ${c.gift ? h`<dl class="kv"><dt>사은품</dt><dd>${c.gift} <span class="num">${App.won(c.giftAmt)}원</span>${c.giftExtra ? h` + 추가 <span class="num">${App.won(c.giftExtra)}원</span>` : ""}</dd><dt>지급처</dt><dd class="${c.giftPayer.startsWith("센터") ? "neg" : ""}">${c.giftPayer}</dd><dt>지급예정일</dt><dd class="num">${c.giftDue}</dd><dt>계좌</dt><dd class="num">${c.giftBank} ${App.maskAcct(c.giftAcct)} (${c.giftHolder})</dd></dl><div class="row" style="margin-top:10px"><label class="check"><input type="checkbox" class="cb" data-on="paid" ${c.giftPaid ? App.raw("checked") : ""}> 지급완료로 표시</label></div>` : h`<p class="muted">사은품이 없습니다.</p>`}</section>`;
        if (tab === "talk") { const list = App.db.consults.filter((x) => x.cid === id); return h`
          <section class="card pad"><div class="row" style="margin-bottom:8px">${App.TAGS.map((t) => h`<button class="pill ${t === pickTag ? "on" : ""}" data-act="tag" data-t="${t}">${t}</button>`)}</div>
            <textarea class="in" rows="3" maxlength="500" data-text placeholder="상담 내용 (500자까지)" aria-label="상담 내용"></textarea><p class="errmsg" data-err></p>
            <div class="row" style="margin-top:8px"><span class="hint">저장하면 고객 목록의 최종상담내용에 보입니다. 협력점에는 보이지 않습니다.</span><span class="sp"><button class="btn p" data-act="talk">상담 저장</button></span></div></section>
          <section class="sec">${list.length ? h`<div class="tl card pad">${list.map((x) => h`<div class="tl-i"><div>${App.tag(x.tag)}</div><div><p>${x.text}</p><div class="who">${App.dt(x.at)} · ${x.by}</div></div></div>`)}</div>` : h`<div class="card empty"><b>상담 기록이 없습니다</b>위에서 첫 상담을 남겨 보세요.</div>`}</section>`; }
        if (tab === "hist") return h`<div class="card pad">${App.timeline(App.historyOf(id))}</div>`;
        const s = App.settleOf(c); const line = (l, v, neg) => h`<dt>${l}</dt><dd class="num" style="text-align:right">${v == null ? h`<span class="neg">수수료 미등록</span>` : neg && v ? h`<span class="neg">-${App.won(v)}</span>` : App.won(v)}</dd>`;
        return h`${App.isOpened(c) ? "" : h`<div class="note gray">아직 개통 전이라 정산 대상이 아닙니다. 아래는 지금 값으로 미리 본 금액입니다.</div>`}${s.fee ? "" : h`<div class="note bad">접수일시에 맞는 수수료표가 없습니다. <a data-go="B-14" data-params="tab=fee">수수료표 등록</a></div>`}
          <div class="card pad"><dl class="kv" style="grid-template-columns:1fr auto">${line("상부수수료" + (s.fee ? ` (v${s.fee.ver})` : ""), s.plus.upper)}${line("약정금액", s.plus.contract)}${line("셋탑박스", s.plus.setbox)}${line("부가서비스", s.plus.addon)}${line("본사사은품", s.minus.hqGift, 1)}${line("사은품", s.minus.gift, 1)}${line("추가사은품", s.minus.extra, 1)}${line("미비서류", s.minus.docs, 1)}${line("기타", s.minus.etc, 1)}
            <dt style="font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:8px">정산금액</dt><dd class="num" style="text-align:right;font-weight:800;font-size:16px;border-top:1px solid var(--line);padding-top:8px">${s.total == null ? "-" : App.wonc(s.total)}</dd></dl></div>
          <p class="hint" style="margin-top:8px">금액 단위: 원. 미비서류 · 기타 차감은 전체 정산관리에서 넣습니다.</p>`;
      },
      footer: () => h`<button class="btn" data-go="B-03" data-params="id=${c.id}">전체 정보 열기 · 수정</button><span style="margin-left:auto"></span><button class="btn ghost" data-act="close">닫기</button>`,
      onDraw: (root, tab, api) => App.on(root, {
        close: () => api.close(),
        os: () => App.changeOpenState(c, $("[data-os]", root).value, () => { api.redraw(); changed(); }),
        rc: () => App.receiptConfirm(c, () => { api.redraw(); changed(); }), rr: () => App.receiptReply(c, () => { api.redraw(); changed(); }), rb: () => App.receiptBounce(c, () => { api.redraw(); changed(); }),
        paid: (t) => { c.giftPaid = t.checked; App.log("접수", `${c.name} 사은품 지급완료`, !t.checked ? "지급완료" : "미지급", t.checked ? "지급완료" : "미지급"); App.toast(t.checked ? "지급완료로 표시했습니다" : "지급완료 표시를 풀었습니다"); changed(); },
        tag: (t) => { const keep = $("[data-text]", root).value; pickTag = t.dataset.t; api.redraw(); const ta = $("#layers [data-text]"); if (ta) { ta.value = keep; ta.focus(); } },
        talk: () => { const err = App.saveConsult(c, pickTag, $("[data-text]", root).value.trim()); if (err) { $("[data-err]", root).textContent = err; return; } pickTag = ""; App.toast("상담을 저장했습니다"); api.redraw(); changed(); },
      }),
    });
    return dr;
  };

  /** 협력점 정보 팝업(기본 정보 · 하부점 · 미수 · 적용 수수료표) */
  App.openPartnerInfo = (pid) => {
    const p = App.db.partners.find((x) => x.id === pid); if (!p) return; const subs = App.db.subs.filter((s) => s.partnerId === pid); const recv = App.receivableOf(pid);
    const week = App.db.customers.filter((c) => c.partnerId === pid && c.via !== "본사" && c.receivedAt >= App.weekStart(App.today())).length;
    App.modal({ title: p.name, sub: "협력점 정보", wide: true, body: h`<div class="grid2"><div class="card pad"><dl class="kv"><dt>상호</dt><dd>${p.name}</dd><dt>대표자</dt><dd>${p.ceo}</dd><dt>사업자번호</dt><dd class="num">${p.biz}</dd><dt>연락처</dt><dd class="num">${App.maskPhone(p.phone)}</dd><dt>정산 계좌</dt><dd class="num">${p.bank} ${App.maskAcct(p.acct)}</dd><dt>거래 상태</dt><dd>${App.chip(p.state)}</dd></dl></div>
      <div class="card pad"><dl class="kv"><dt>소속 하부점</dt><dd>${subs.length ? subs.map((s) => s.name).join(", ") : "없음"}</dd><dt>계정</dt><dd>${App.db.accounts.filter((a) => a.org === p.name || subs.some((s) => s.name === a.org)).length}개</dd><dt>이번 주 접수</dt><dd class="num">${week}건</dd><dt>미수 잔액</dt><dd class="num ${recv ? "neg" : ""}">${App.won(recv)}원</dd><dt>수수료표</dt><dd>전체 공통 표(지금 적용 중인 버전)</dd></dl>
      <div class="row" style="margin-top:12px"><a class="btn sm" data-go="B-17">조직·계정</a><a class="btn sm" data-go="B-12" data-params="tab=recv">미수 잔액</a><a class="btn sm" data-go="B-14" data-params="tab=fee">수수료표</a></div></div></div>` });
  };
})();
</script>
<script>/* A-01 어드민 로그인 (옛 SC-64). 운영자만 들어간다(D-19). 고객사 계정은 서비스 주소로 보낸다.
   2단계 인증 · 운영자 비밀번호변경은 1차에서 뺀다(D-15). 생김새는 서비스 로그인(C-01)과 한 식구, 「어드민」 표시만 다르다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const OPS = { op01: "ok", op02: "lock" }; // 운영자 계정(예시). op02 = 잠긴 계정
  /** 고객사 쪽 계정인가(서비스 계정 · 고객사 최초 관리자) */
  const isTenantLogin = (id) => App.db.accounts.some((a) => a.login === id) || App.db.tenants.some((t) => t.admin && t.admin === id);
  App.screen("A-01", {
    title: "어드민 로그인", app: "admin", device: "bare", roles: ["*"], sc: ["SC-64"],
    render(el) {
      el.innerHTML = h`<style>
          .a01-l{background:#121A36;box-shadow:inset 0 4px 0 var(--todo)}
          .a01-l .lgn-flow{grid-template-columns:repeat(3,1fr)}
          .a01-l .lgn-flow div{background:#1B2649}
          .a01-badge{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--todo);padding:2px 10px;border-radius:99px;vertical-align:middle;margin-left:8px;letter-spacing:0}
          .a01-none{font-size:12.5px;color:#C6CEE6;border-left:3px solid var(--todo);padding-left:10px;margin-top:20px}
        </style>
        <div class="lgn">
        <div class="lgn-l a01-l"><div class="logo"><i>C</i>통신유통 CRM<em>어드민</em></div>
          <div><h1>통신유통 CRM 어드민</h1><p>SaaS 운영자 전용입니다. 고객사를 개설하고 이용 상태를 관리합니다.</p>
            <div class="lgn-flow"><div><b>고객사 개설</b><span>업체 정보 · 사업자번호</span></div><div><b>최초 관리자 계정</b><span>아이디 · 임시 비밀번호</span></div><div><b>초기 설정</b><span>상품 · 수수료표</span></div></div>
            <p class="a01-none">고객사의 업무 데이터(고객 · 접수 · 정산)는 어드민에서 볼 수 없습니다.</p></div>
          <p style="font-size:12.5px">48466_통신유통 플랫폼 CRM · 어드민</p></div>
        <div class="lgn-r">
          <h2>어드민 로그인<span class="a01-badge">운영자 전용</span></h2>
          <div class="note warn" style="margin-bottom:0">고객사 계정은 여기서 로그인할 수 없습니다. 고객사 계정은 서비스 주소에서 로그인하세요.</div>
          <div class="f"><label for="a01-id">운영자 아이디</label><input class="in" id="a01-id" data-enter="login" autocomplete="off" placeholder="영문 소문자 · 숫자 4~20자"></div>
          <div class="f"><label for="a01-pw">비밀번호</label><input class="in" id="a01-pw" type="password" data-enter="login" placeholder="비밀번호"><p class="errmsg" data-err style="margin-top:6px"></p></div>
          <button class="btn p lg block" data-act="login">로그인</button>
          <div class="lgn-test"><p>시험 계정으로 바로 들어가기(프로토타입)</p><div class="row"><button class="btn sm" data-act="as">운영자</button><button class="btn sm ghost" data-act="fill" data-id="hq01">고객사 계정으로 시도</button><button class="btn sm ghost" data-act="fill" data-id="op02">잠긴 계정</button></div></div>
        </div></div>`;
      const enter = () => { App.login("operator"); App.go("A-02", null, { replace: true }); };
      const login = () => {
        const id = $("#a01-id", el).value.trim(); const pw = $("#a01-pw", el).value; const err = $("[data-err]", el);
        if (!id || !pw) { err.textContent = "아이디와 비밀번호를 넣어 주세요"; return; }
        if (isTenantLogin(id)) { err.textContent = "고객사 계정은 서비스 주소에서 로그인하세요"; return; }
        if (!/^[a-z0-9]{4,20}$/.test(id) || !OPS[id] || pw.length < 4) { err.textContent = "아이디 또는 비밀번호가 맞지 않습니다"; return; }
        if (OPS[id] === "lock") { err.textContent = "계정이 잠겼습니다. 운영 책임자에게 문의하세요"; return; }
        enter();
      };
      App.on(el, { login, as: enter, fill: (t) => { $("#a01-id", el).value = t.dataset.id; $("#a01-pw", el).value = "test1234"; login(); } });
    },
  });
})();
</script>
<script>/* A-02 고객사 (옛 SC-41 운영자 화면 + SC-48 고객사 등록·상태 관리). 운영자 첫 화면.
   운영자는 고객사의 업무 데이터(고객 · 접수 · 정산)를 볼 수 없다: 이 화면에는 이용 상태 · 계정 수 · 개설 진행만 둔다.
   줄을 누르면 서랍에서 정보 수정 · 중지/다시 이용 · 개설 이어 하기. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { state: "", q: "", todo: false };
  /** 개설에서 남은 단계 이름들(① 고객사 정보는 목록에 있으면 끝난 것) */
  const left = (t) => [!t.admin && "관리자 계정", !t.setup && "상품·수수료표"].filter(Boolean);
  const bizFmt = (v) => { const d = String(v).replace(/\D/g, ""); return d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}` : ""; };
  const FIELDS = [
    { name: "name", label: "고객사명", required: true },
    { name: "biz", label: "사업자번호", required: true, placeholder: "숫자 10자리", pattern: /^\d{3}-?\d{2}-?\d{5}$/, msg: "사업자번호는 숫자 10자리입니다" },
    { name: "manager", label: "담당자", required: true },
    { name: "phone", label: "담당자 연락처", type: "tel", placeholder: "010-0000-0000" },
  ];

  App.screen("A-02", {
    title: "고객사", app: "admin", roles: ["operator"], sc: ["SC-41", "SC-48"],
    render(el, params) {
      const db = App.db;
      el.innerHTML = h`${App.head("고객사", { actions: h`<button class="btn p" data-go="A-03">고객사 개설</button>` })}
        <div class="note gray">고객사의 업무 데이터(고객 · 접수 · 정산)는 볼 수 없습니다. 이 화면에는 이용 상태 · 계정 수 · 개설 진행만 보입니다.</div>
        <div class="kpis" data-kpis></div>
        <div class="card"><div class="filters">
          <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="고객사명 또는 사업자번호" aria-label="검색어"></div>
          <select class="in fix" data-on="state" aria-label="이용 상태">${App.opts(["이용중", "중지"], st.state, "이용 상태 전체")}</select>
          <label class="check"><input type="checkbox" class="cb" data-on="todo" ${st.todo ? App.raw("checked") : ""}>개설 진행 중만</label>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div data-tbl style="margin-top:12px"></div>
        <p class="hint" style="margin-top:8px">중지된 고객사의 계정은 로그인할 수 없습니다. 데이터는 보존됩니다.</p>`;

      const rows = () => db.tenants.filter((t) => {
        if (st.state && t.state !== st.state) return false;
        if (st.todo && !left(t).length) return false;
        if (st.q) { const q = st.q.replace(/-/g, ""); if (!t.name.includes(st.q) && !t.biz.replace(/-/g, "").includes(q)) return false; }
        return true;
      }).sort((a, b) => (a.at < b.at ? 1 : -1));

      const tbl = App.table($("[data-tbl]", el), [
        { label: "고객사명", render: (t) => h`<span class="name">${t.name}</span>` },
        { label: "사업자번호", render: (t) => h`<span class="num">${t.biz}</span>` },
        { key: "manager", label: "담당자" },
        { label: "이용 상태", render: (t) => App.chip(t.state) },
        { label: "계정 수", r: 1, render: (t) => h`${t.accounts}개` },
        { label: "등록일", render: (t) => h`<span class="num">${t.at}</span>` },
        { label: "개설 진행", render: (t) => { const l = left(t); return l.length ? h`<span class="chip c-amber">${l.length}단계 남음</span> <span class="muted">${l.join(" · ")}</span> <a class="link" data-go="A-03" data-params="id=${t.id}" style="margin-left:6px">이어 하기</a>` : h`<span class="chip c-green">개설 완료</span>`; } },
      ], rows(), {
        onRow: (t) => openTenant(t), rowClass: (t) => (t.state === "중지" ? "off" : ""),
        bar: (n) => `고객사 <b>${n}</b>곳`,
        empty: db.tenants.length ? ["검색 결과가 없습니다", "조건을 바꿔 다시 찾아 보세요."] : ["등록된 고객사가 없습니다", "오른쪽 위 「고객사 개설」로 첫 고객사를 만들어 보세요."],
      });

      function refresh() {
        const all = db.tenants; const on = all.filter((t) => t.state === "이용중"); const off = all.filter((t) => t.state === "중지");
        $("[data-kpis]", el).innerHTML = h`
          <button class="kpi ${st.state === "" ? "on" : ""}" data-act="kpi" data-v=""><span>전체 고객사</span><b>${all.length}</b><small>개설 진행 중 ${all.filter((t) => left(t).length).length}곳</small></button>
          <button class="kpi ${st.state === "이용중" ? "on" : ""}" data-act="kpi" data-v="이용중"><span>이용중</span><b>${on.length}</b><small>로그인 가능</small></button>
          <button class="kpi ${st.state === "중지" ? "on" : ""}" data-act="kpi" data-v="중지"><span>중지</span><b>${off.length}</b><small>로그인 차단 · 데이터 보존</small></button>
          <div class="kpi"><span>계정 수</span><b>${on.reduce((a, t) => a + t.accounts, 0)}</b><small>이용중 고객사의 계정만</small></div>`;
        tbl.set(rows());
      }

      /* 서랍: 정보 수정 · 중지/다시 이용 · 개설 이어 하기 */
      function openTenant(t) {
        App.drawer({
          title: () => h`${t.name} ${App.chip(t.state)}`,
          sub: () => h`사업자번호 ${t.biz} · 등록 ${t.at}`,
          body: () => { const l = left(t); const step = (ok, name, desc) => h`<div class="tl-i"><div>${ok ? h`<span class="chip c-green">완료</span>` : h`<span class="chip c-amber">남음</span>`}</div><div><p><b>${name}</b></p><div class="who">${desc}</div></div></div>`; return h`
            <div class="note gray">이 고객사의 업무 데이터(고객 · 접수 · 정산)는 볼 수 없습니다.</div>
            <section class="card pad"><div class="sec-h"><h2>개설 진행</h2><span class="sp">${l.length ? h`<button class="btn sm p" data-go="A-03" data-params="id=${t.id}">개설 이어 하기</button>` : h`<a class="btn sm" data-go="A-03" data-params="id=${t.id}&step=3">초기 설정 열기</a>`}</span></div>
              <div class="tl">${step(true, "① 고객사 정보", `${t.at} 등록`)}${step(!!t.admin, "② 최초 관리자 계정", t.admin ? `아이디 ${t.admin}` : "아직 발급하지 않았습니다")}${step(!!t.setup, "③ 상품 · 수수료표 초기 설정", t.setup ? "저장했습니다" : "아직 저장하지 않았습니다")}</div></section>
            <section class="sec"><div class="sec-h"><h2>고객사 정보</h2></div>
              <div class="card" style="overflow:hidden">${App.form(FIELDS, { cols: 1, values: t })}</div>
              <div class="row" style="margin-top:8px"><p class="neg" data-err style="font-size:12px;font-weight:600"></p><span class="sp"><button class="btn p" data-act="save">정보 저장</button></span></div></section>
            <section class="sec card pad"><div class="sec-h"><h2>계정</h2></div>
              <dl class="kv"><dt>최초 관리자</dt><dd class="num">${t.admin || "미발급"}</dd><dt>계정 수</dt><dd class="num">${t.accounts}개</dd></dl>
              <p class="hint" style="margin-top:8px">최초 관리자 계정만 운영자가 발급합니다. 그 뒤 계정은 고객사의 본사 관리자가 발급합니다.</p></section>
            <section class="sec card pad"><div class="sec-h"><h2>이용 상태</h2><span class="sp">${t.state === "중지" ? h`<button class="btn p" data-act="resume">다시 이용</button>` : h`<button class="btn danger" data-act="stop">이용 중지</button>`}</span></div>
              ${t.state === "중지" ? h`<p>중지 상태입니다${t.stoppedAt ? h` (${App.dt(t.stoppedAt)} 중지)` : ""}. 이 고객사의 계정은 로그인할 수 없고, 데이터는 보존되어 있습니다.</p>` : h`<p>이용중입니다. 중지하면 이 고객사의 계정은 로그인할 수 없습니다. 데이터는 보존됩니다.</p>`}</section>`; },
          footer: () => h`<span style="margin-left:auto"></span><button class="btn ghost" data-act="close">닫기</button>`,
          onDraw: (root, tab, api) => App.on(root, {
            close: () => api.close(),
            save: () => {
              const r = App.readForm(root, FIELDS); const err = $("[data-err]", root); err.textContent = ""; if (!r.ok) return;
              const biz = bizFmt(r.values.biz);
              if (db.tenants.some((x) => x !== t && x.biz === biz)) { err.textContent = "이미 등록된 사업자번호입니다"; return; }
              Object.assign(t, r.values, { biz }); App.toast("저장했습니다"); api.redraw(); refresh();
            },
            stop: async () => {
              const ok = await App.confirm(`「${t.name}」의 이용을 중지하시겠습니까?`, { danger: true, ok: "이용 중지", detail: "중지된 고객사의 계정은 로그인할 수 없습니다. 데이터는 보존됩니다. 지금 로그인해 있는 계정도 바로 로그아웃됩니다." });
              if (!ok) return; t.state = "중지"; t.stoppedAt = App.now(); App.toast("이용을 중지했습니다"); api.redraw(); refresh();
            },
            resume: async () => {
              const ok = await App.confirm(`「${t.name}」을(를) 다시 이용 상태로 바꾸시겠습니까?`, { ok: "다시 이용", detail: "이 고객사의 계정이 다시 로그인할 수 있습니다. 보존된 데이터는 그대로 이어서 씁니다." });
              if (!ok) return; t.state = "이용중"; t.stoppedAt = ""; App.toast("다시 이용 상태로 바꿨습니다"); api.redraw(); refresh();
            },
          }),
        });
      }

      refresh();
      App.on(el, {
        q: (t) => { st.q = t.value.trim(); refresh(); }, state: (t) => { st.state = t.value; refresh(); }, todo: (t) => { st.todo = t.checked; refresh(); },
        kpi: (t) => { st.state = t.dataset.v; App.redraw(); },
        reset: () => { st.q = ""; st.state = ""; st.todo = false; App.redraw(); },
      });
      if (params.id) { const t = db.tenants.find((x) => x.id === params.id); delete params.id; if (t) openTenant(t); } // 한 번만 연다(다시 그릴 때 서랍이 또 열리지 않게)
    },
  });
})();
</script>
<script>/* A-03 고객사 개설 (옛 SC-48 등록 + SC-24 최초 관리자 계정 발급 + SC-40 상품·수수료표 초기 설정).
   순서가 있는 일이라 한 화면의 3단계로 묶었다: ① 고객사 정보 → ② 최초 관리자 계정 → ③ 상품 · 수수료표.
   ① 을 저장하면 고객사가 바로 생기므로(이용중) 중간에 나가도 A-02 목록의 「개설 진행」에서 이어 한다(params.id).
   ③ 의 표는 그 고객사에만 붙는다(tenant.cfg). 서비스 쪽 예시 데이터(App.db.products · fees)는 건드리지 않는다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$;
  const st = { drafts: {} }; // 고객사 id → ③ 에서 고치는 중인 표(저장 전에 나갔다 와도 남는다)
  const bizFmt = (v) => { const d = String(v).replace(/\D/g, ""); return d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}` : ""; };
  const F1 = [
    { name: "name", label: "고객사명", required: true, placeholder: "예: 새빛통신(예시)" },
    { name: "biz", label: "사업자번호", required: true, placeholder: "숫자 10자리", pattern: /^\d{3}-?\d{2}-?\d{5}$/, msg: "사업자번호는 숫자 10자리입니다" },
    { name: "manager", label: "담당자", required: true },
    { name: "phone", label: "담당자 연락처", type: "tel", placeholder: "010-0000-0000" },
    { name: "state", label: "이용 상태", type: "static", value: "이용중", hint: "개설하면 이용중으로 시작합니다. 중지는 고객사 목록에서 바꿉니다." },
  ];
  const F2 = [
    { name: "name", label: "이름", required: true },
    { name: "login", label: "아이디", required: true, read: true, pattern: /^[a-z0-9]{4,20}$/, msg: "영문 소문자 · 숫자 4~20자로 넣어 주세요",
      html: '<div class="line"><input class="in" name="login" autocomplete="off" placeholder="영문 소문자 · 숫자 4~20자" data-on="loginEdit" data-live><button class="btn" data-act="dup" type="button">중복 확인</button></div><span class="hint" data-dup></span>' },
    { name: "phone", label: "핸드폰", type: "tel", placeholder: "010-0000-0000" },
    { name: "email", label: "이메일", pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/, msg: "이메일 형식이 맞지 않습니다" },
  ];
  /** 아이디는 서비스 전체에서 하나(R-33): 서비스 계정 · 다른 고객사 관리자 · 운영자 */
  const taken = (id) => App.db.accounts.some((a) => a.login === id) || App.db.tenants.some((t) => t.admin === id) || id === "op01" || id === "op02";
  /** 임시 비밀번호(지어낸 값). 화면에 한 번만 보여 주고 어디에도 담아 두지 않는다 */
  const tempPw = () => { const a = "abcdefghjkmnpqrstuvwxyz"; const n = "23456789"; const r = (s) => s[Math.floor(Math.random() * s.length)]; return "Tc" + r(a) + r(a) + r(a) + r(a) + r(n) + r(n) + r(n) + r(n) + "!"; };
  /** 금액 칸 읽기: 빈칸 = null, 숫자가 아니면 NaN */
  const num = (s) => { const v = String(s == null ? "" : s).replace(/[,\s원]/g, ""); return v === "" ? null : /^\d+$/.test(v) ? Number(v) : NaN; };
  const show = (s) => { const n = num(s); return n == null ? "" : isNaN(n) ? s : App.won(n); };
  /** 공통 템플릿을 복사해 이 고객사의 표로 만든다. 상품 × 약정마다 한 줄, 템플릿에 값이 없는 줄은 빈칸(= 미등록) */
  const fromTemplate = (tpl) => {
    const db = App.db; const products = db.products.map((p) => ({ carrier: p.carrier, name: p.name, option: p.option, set: p.set, setbox: p.setbox, bundle: p.bundle }));
    const fees = []; products.forEach((p) => db.contracts.forEach((ct) => { const f = db.fees.find((x) => x.ver === 1 && x.carrier === p.carrier && x.product === p.name && x.option === p.option && x.contract === ct); fees.push({ carrier: p.carrier, product: p.name, option: p.option, contract: ct, upper: f ? String(f.upper) : "", partner: f ? String(f.partner) : "" }); }));
    return { tpl: tpl.id, from: App.today(), products, fees, errs: {} };
  };
  const fromCfg = (c) => ({ tpl: c.template, from: c.from.slice(0, 10), products: c.products.map((p) => Object.assign({}, p)), fees: c.allRows.map((f) => Object.assign({}, f)), errs: {} });
  const rowState = (f) => { const u = num(f.upper); const p = num(f.partner); return u == null && p == null ? "none" : u == null || p == null || isNaN(u) || isNaN(p) ? "bad" : "ok"; };

  App.screen("A-03", {
    title: "고객사 개설", app: "admin", roles: ["operator"], sc: ["SC-48", "SC-24", "SC-40"],
    render(el, params) {
      const db = App.db; const t = params.id ? db.tenants.find((x) => x.id === params.id) : null;
      if (params.id && !t) { el.innerHTML = h`<div class="card empty"><b>고객사를 찾지 못했습니다</b>목록에서 다시 골라 주세요.<br><button class="btn" data-go="A-02">고객사 목록으로</button></div>`; return; }
      const step = !t ? "1" : String(params.step || (!t.admin ? 2 : 3));
      const goStep = (k, id) => App.go("A-03", { id: id || t.id, step: String(k) }, { replace: true });
      /** 한 단계를 끝낸 뒤: 남은 단계가 있으면 거기로, 없으면 목록으로 */
      const next = () => { if (!t.admin) goStep(2); else if (!t.setup) goStep(3); else App.go("A-02"); };
      const waiting = db.tenants.filter((x) => !x.admin || !x.setup);

      el.innerHTML = h`<style>
          .a03-wrap{max-width:1180px}
          .a03-pw{font-size:22px;font-weight:800;letter-spacing:1px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sunk);border:1px dashed var(--line);border-radius:var(--r2);padding:14px;text-align:center;margin:10px 0;user-select:all}
          .a03-amt{width:130px;text-align:right;height:30px;font-variant-numeric:tabular-nums}
          .a03-fee td{padding-top:6px;padding-bottom:6px}
          .a03-fee tr.a03-none td{background:#FFFAF9}
          .a03-guide li{margin:0 0 8px 18px;font-size:13px;color:var(--ink2)}
          .a03-guide li.a03-cur{color:var(--ink);font-weight:700}
        </style>
        <div class="a03-wrap">
        ${App.head("고객사 개설", { count: t ? t.name : "새 고객사", back: { code: "A-02", label: "고객사 목록" } })}
        ${!t && waiting.length ? h`<div class="note warn">개설을 마치지 않은 고객사가 ${waiting.length}곳 있습니다: ${waiting.map((x, i) => h`${i ? " · " : ""}<a data-go="A-03" data-params="id=${x.id}">${x.name} 이어 하기</a>`)}</div>` : ""}
        <div data-steps></div>
        <div data-body></div></div>`;
      App.steps($("[data-steps]", el), [
        ["1", "고객사 정보", t ? `${t.name} · ${t.biz}` : "업체명 · 사업자번호 · 담당자", t ? "done" : ""],
        ["2", "최초 관리자 계정", t && t.admin ? `아이디 ${t.admin}` : "아이디 · 임시 비밀번호", t && t.admin ? "done" : ""],
        ["3", "상품 · 수수료표 초기 설정", t && t.setup ? "저장했습니다" : "템플릿을 불러와 고치기", t && t.setup ? "done" : ""],
      ], step, (k) => { if (!t) { if (k !== "1") App.toast("먼저 고객사 정보를 저장하세요"); return; } goStep(k); });
      const body = $("[data-body]", el);
      const guide = (cur) => h`<aside class="card pad"><div class="sec-h"><h2>개설 순서</h2></div><ol class="a03-guide">
        <li class="${cur === 1 ? "a03-cur" : ""}">고객사 정보를 저장하면 고객사가 바로 생깁니다(이용중).</li>
        <li class="${cur === 2 ? "a03-cur" : ""}">최초 관리자 계정을 발급합니다. 임시 비밀번호는 한 번만 보입니다.</li>
        <li class="${cur === 3 ? "a03-cur" : ""}">상품 · 수수료표를 템플릿에서 불러와 이 고객사에 맞게 고칩니다.</li></ol>
        <p class="hint">중간에 나가도 됩니다. 고객사 목록의 「개설 진행」에서 남은 단계부터 이어 합니다.</p></aside>`;

      /* ── ① 고객사 정보 ── */
      if (step === "1") {
        body.innerHTML = h`<div class="split"><section>
            <div class="card" style="overflow:hidden">${App.form(F1, { cols: 1, values: t ? { name: t.name, biz: t.biz, manager: t.manager, phone: t.phone, state: t.state } : {} })}</div>
            <div class="row" style="margin-top:12px"><p class="neg" data-err style="font-size:12px;font-weight:600"></p><span class="sp row"><button class="btn ghost" data-go="A-02">취소</button><button class="btn p" data-act="save1">${t ? "저장하고 다음" : "저장하고 다음: 관리자 계정"}</button></span></div>
          </section>${guide(1)}</div>`;
        App.on(body, { save1: () => {
          const r = App.readForm(body, F1); const err = $("[data-err]", body); err.textContent = ""; if (!r.ok) return;
          const biz = bizFmt(r.values.biz);
          if (db.tenants.some((x) => x !== t && x.biz === biz)) { err.textContent = "이미 등록된 사업자번호입니다. 고객사 목록에서 확인해 주세요."; const i = $('[name="biz"]', body); i.classList.add("err"); i.focus(); return; }
          if (t) { Object.assign(t, r.values, { biz }); App.toast("저장했습니다"); next(); return; }
          const n = { id: App.uid("T"), name: r.values.name, biz, manager: r.values.manager, phone: r.values.phone || "", state: "이용중", at: App.today(), accounts: 0, admin: "", setup: false };
          db.tenants.push(n); App.toast("고객사를 등록했습니다"); goStep(2, n.id);
        } });
        return;
      }

      /* ── ② 최초 관리자 계정 ── */
      if (step === "2") {
        const info = h`<dl class="kv" style="grid-template-columns:110px minmax(0,1fr)"><dt>고객사명</dt><dd>${t.name}</dd><dt>사업자번호</dt><dd class="num">${t.biz}</dd><dt>로그인 범위</dt><dd>이 고객사만</dd></dl>`;
        if (t.admin) {
          body.innerHTML = h`<div class="split"><section>
              <div class="note ok">최초 관리자 계정을 발급했습니다.</div>
              <div class="card pad">${info}<dl class="kv" style="grid-template-columns:110px minmax(0,1fr);margin-top:6px"><dt>관리자 아이디</dt><dd class="num"><b>${t.admin}</b></dd>${t.adminName ? h`<dt>이름</dt><dd>${t.adminName}</dd>` : ""}${t.adminAt ? h`<dt>발급 일시</dt><dd class="num">${App.dt(t.adminAt)}</dd>` : ""}</dl>
                <p class="hint" style="margin-top:10px">임시 비밀번호는 발급할 때 한 번만 보여 줍니다. 이후 계정은 고객사의 본사 관리자가 발급합니다.</p></div>
              <div class="row" style="margin-top:12px"><span class="sp row"><button class="btn ghost" data-go="A-02">고객사 목록</button>${t.setup ? "" : h`<button class="btn p" data-act="to3">다음: 상품 · 수수료표</button>`}</span></div>
            </section>${guide(2)}</div>`;
          App.on(body, { to3: () => goStep(3) });
          return;
        }
        body.innerHTML = h`<div class="split"><section>
            <div class="note">발급된 계정은 해당 고객사에만 로그인됩니다.</div>
            <div class="card pad">${info}</div>
            <div class="sec-h" style="margin-top:16px"><h2>관리자 계정</h2><small><span class="req">*</span> 표시는 필수</small></div>
            <div class="card" style="overflow:hidden">${App.form(F2, { cols: 1, values: { name: t.manager, phone: t.phone } })}</div>
            <div class="row" style="margin-top:12px"><span class="hint">임시 비밀번호는 발급 뒤 화면에 한 번 보여 줍니다. 문자 · 메일로는 보내지 않습니다.</span><span class="sp row"><button class="btn ghost" data-go="A-02">나중에 하기</button><button class="btn p" data-act="issue">발급</button></span></div>
          </section>${guide(2)}</div>`;
        const dupMsg = (txt, bad) => { const m = $("[data-dup]", body); m.textContent = txt; m.style.color = bad ? "var(--red)" : txt ? "var(--green)" : ""; };
        App.on(body, {
          loginEdit: () => dupMsg(""),
          dup: () => { const id = $('[name="login"]', body).value.trim(); if (!/^[a-z0-9]{4,20}$/.test(id)) return dupMsg("영문 소문자 · 숫자 4~20자로 넣어 주세요", true); taken(id) ? dupMsg("이미 쓰고 있는 아이디입니다", true) : dupMsg("쓸 수 있는 아이디입니다"); },
          issue: () => {
            dupMsg(""); const r = App.readForm(body, F2); if (!r.ok) return;
            if (taken(r.values.login)) { dupMsg("이미 쓰고 있는 아이디입니다", true); const i = $('[name="login"]', body); i.classList.add("err"); i.focus(); return; }
            Object.assign(t, { admin: r.values.login, adminName: r.values.name, adminPhone: r.values.phone || "", adminEmail: r.values.email || "", adminAt: App.now(), accounts: t.accounts + 1 });
            const pw = tempPw(); App.redraw();
            App.modal({ title: "관리자 계정을 발급했습니다", sub: t.name,
              body: h`<dl class="kv"><dt>아이디</dt><dd class="num"><b>${t.admin}</b></dd><dt>이름</dt><dd>${t.adminName}</dd></dl>
                <div class="lbl" style="margin-top:12px">임시 비밀번호</div><div class="a03-pw" data-pw>${pw}</div>
                <div class="note warn" style="margin-bottom:0">이 창을 닫으면 임시 비밀번호를 다시 볼 수 없습니다. 지금 적어서 고객사 담당자에게 직접 전달해 주세요.</div>`,
              actions: [{ label: t.setup ? "확인" : "확인하고 다음 단계로", kind: "p", onClick: (close) => { close(); next(); } }] });
          },
        });
        return;
      }

      /* ── ③ 상품 · 수수료표 초기 설정 ── */
      let d = st.drafts[t.id];
      if (!d && t.cfg) d = st.drafts[t.id] = fromCfg(t.cfg);
      if (!d && t.setup) d = st.drafts[t.id] = fromTemplate(db.templates[0]); // 예시 데이터로 이미 끝난 고객사: 템플릿 값으로 저장돼 있다고 본다
      const tplPick = h`<select class="in fix" data-tpl aria-label="템플릿">${App.opts(db.templates.map((x) => [x.id, `${x.name} (상품 ${x.products}개 · 수수료 ${x.fees}줄)`]), d ? d.tpl : db.templates[0].id)}</select>`;
      const scope = h`<div class="note">이 설정은 <b>${t.name}</b>(사업자번호 ${t.biz})에만 적용됩니다. 다른 고객사에는 영향을 주지 않습니다.</div>`;
      if (!d) {
        body.innerHTML = h`${scope}<div class="card empty"><b>아직 설정이 없습니다</b>공통 템플릿을 불러오면 상품과 수수료표가 채워집니다. 불러온 뒤 이 고객사에 맞게 값을 고쳐 저장하세요.
            <div class="row" style="justify-content:center;margin-top:14px">${tplPick}<button class="btn p" style="margin-top:0" data-act="load">템플릿 불러오기</button></div></div>
          <div class="row" style="margin-top:12px"><span class="sp"><button class="btn ghost" data-go="A-02">나중에 하기</button></span></div>`;
      } else {
        const cnt = { ok: 0, none: 0, bad: 0 }; d.fees.forEach((f) => cnt[rowState(f)]++);
        const nErr = Object.keys(d.errs).length;
        body.innerHTML = h`${scope}
          ${d.top ? h`<div class="note bad" data-top>${d.top}</div>` : ""}
          <div class="card"><div class="filters" style="margin-bottom:0">${tplPick}<button class="btn" data-act="load">템플릿 다시 불러오기</button>
            <span style="margin-left:auto" class="row"><label class="lbl" for="a03-from" style="margin:0">수수료 적용 시작일<span class="req">*</span></label><input class="in fix" type="date" id="a03-from" data-on="from" value="${d.from}"></span></div></div>

          <section class="sec"><div class="sec-h"><h2>상품</h2><small>통신사 · 상품 · 결합 구성 ${d.products.length}개. 이 고객사가 다루지 않는 상품은 빼세요.</small></div>
            <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>통신사</th><th>상품명</th><th>옵션</th><th>셋트</th><th>셋탑</th><th>결합 구성</th><th class="c">빼기</th></tr></thead>
              <tbody>${d.products.map((p, i) => h`<tr><td>${p.carrier}</td><td class="name">${p.name}</td><td>${p.option}</td><td>${p.set}</td><td>${p.setbox}</td><td>${p.bundle}</td><td class="c"><button class="btn sm ghost" data-act="drop" data-i="${i}" aria-label="${p.name} 빼기">빼기</button></td></tr>`)}</tbody></table></div>
              ${d.products.length ? "" : h`<div class="empty"><b>상품이 없습니다</b>「템플릿 다시 불러오기」로 다시 채우세요.</div>`}</div></section>

          <section class="sec"><div class="sec-h"><h2>수수료표</h2><small>상부수수료 = 본사가 상부점에서 받는 돈 · 협력점 수수료 = 본사가 협력점에 주는 돈 · 금액 단위: 원</small></div>
            <div class="card"><div class="tblbar"><span data-cnt>입력 <b>${cnt.ok}</b>줄 · <span class="${cnt.none ? "neg" : ""}">미등록 ${cnt.none}줄</span></span><span class="sp hint">두 금액을 모두 비워 두면 미등록으로 남고, 고객사의 본사 관리자가 나중에 등록합니다.</span></div>
              <div class="tblwrap"><table class="tbl a03-fee"><thead><tr><th>통신사</th><th>상품</th><th>옵션</th><th>약정</th><th>적용 시작</th><th class="r hot">상부수수료</th><th class="r">협력점 수수료</th><th>상태</th></tr></thead>
              <tbody>${d.fees.map((f, i) => { const s = rowState(f); return h`<tr data-row="${i}" class="${s === "none" ? "a03-none" : ""}"><td>${f.carrier}</td><td class="name">${f.product}</td><td>${f.option}</td><td>${f.contract}</td><td class="num" data-from>${d.from || "-"}</td>
                <td class="r hot"><input class="in fix a03-amt ${d.errs[i] ? "err" : ""}" data-on="fee" data-i="${i}" data-k="upper" value="${show(f.upper)}" inputmode="numeric" aria-label="${f.product} ${f.contract} 상부수수료"></td>
                <td class="r"><input class="in fix a03-amt ${d.errs[i] ? "err" : ""}" data-on="fee" data-i="${i}" data-k="partner" value="${show(f.partner)}" inputmode="numeric" aria-label="${f.product} ${f.contract} 협력점 수수료"></td>
                <td data-st>${d.errs[i] ? h`<span class="errmsg">${d.errs[i]}</span>` : s === "none" ? h`<span class="chip c-red">미등록</span>` : h`<span class="muted">입력</span>`}</td></tr>`; })}</tbody></table></div></div></section>

          <div class="bar-actions card"><span class="sp">${nErr ? h`<span class="neg">수수료표 ${nErr}줄을 확인해 주세요</span>` : h`저장하면 ${t.name}에만 적용됩니다`}</span><button class="btn ghost" data-go="A-02">나중에 하기</button><button class="btn p" data-act="save3">${t.admin ? "저장하고 개설 마치기" : "저장"}</button></div>`;
      }
      const load = () => { const tpl = db.templates.find((x) => x.id === $("[data-tpl]", body).value) || db.templates[0]; st.drafts[t.id] = fromTemplate(tpl); App.toast(`「${tpl.name}」 템플릿을 불러왔습니다`); App.redraw(); };
      App.on(body, {
        load: async () => { if (d && !(await App.confirm("템플릿을 다시 불러오시겠습니까?", { detail: "지금 고친 금액과 뺀 상품이 템플릿 값으로 돌아갑니다.", ok: "다시 불러오기" }))) return; load(); },
        from: (x) => { d.from = x.value; $$("[data-from]", body).forEach((c) => (c.textContent = d.from || "-")); },
        drop: (x) => { const p = d.products[+x.dataset.i]; d.products.splice(+x.dataset.i, 1); d.fees = d.fees.filter((f) => !(f.carrier === p.carrier && f.product === p.name && f.option === p.option)); d.errs = {}; d.top = ""; App.toast(`「${p.name}」을(를) 뺐습니다`); App.redraw(); },
        fee: (x) => {
          const i = +x.dataset.i; const f = d.fees[i]; f[x.dataset.k] = x.value.trim(); x.value = show(f[x.dataset.k]);
          const tr = x.closest("tr"); const s = rowState(f); delete d.errs[i];
          tr.classList.toggle("a03-none", s === "none"); $$(".a03-amt", tr).forEach((e) => e.classList.remove("err"));
          $("[data-st]", tr).innerHTML = s === "none" ? '<span class="chip c-red">미등록</span>' : s === "ok" ? '<span class="muted">입력</span>' : '<span class="muted">입력 중</span>';
          const c = { ok: 0, none: 0, bad: 0 }; d.fees.forEach((r) => c[rowState(r)]++);
          $("[data-cnt]", body).innerHTML = h`입력 <b>${c.ok}</b>줄 · <span class="${c.none ? "neg" : ""}">미등록 ${c.none}줄</span>`;
        },
        save3: () => {
          d.errs = {}; d.top = "";
          d.fees.forEach((f, i) => { const u = num(f.upper); const p = num(f.partner); if (u == null && p == null) return; if ((u != null && isNaN(u)) || (p != null && isNaN(p))) d.errs[i] = "0 이상의 숫자만 넣어 주세요"; else if (u == null || p == null) d.errs[i] = "두 금액을 모두 넣어 주세요"; });
          const filled = d.fees.filter((f) => rowState(f) === "ok");
          if (!d.products.length) d.top = "상품이 하나도 없습니다. 템플릿을 다시 불러와 주세요.";
          else if (!d.from) d.top = "수수료 적용 시작일을 넣어 주세요.";
          else if (Object.keys(d.errs).length) d.top = `수수료표 ${Object.keys(d.errs).length}줄을 확인해 주세요. 빨간 칸을 고치면 저장할 수 있습니다.`;
          else if (!filled.length) d.top = "수수료표에 금액이 한 줄도 없습니다. 한 줄 이상 넣어 주세요.";
          if (d.top) { App.redraw(); const e = $(".a03-amt.err", el) || $("[data-top]", el); if (e) { e.scrollIntoView({ block: "center" }); if (e.focus) e.focus(); } return; }
          t.cfg = { template: d.tpl, from: d.from + " 00:00", products: d.products.map((p) => Object.assign({ state: "사용" }, p)),
            fees: filled.map((f) => ({ ver: 1, carrier: f.carrier, product: f.product, option: f.option, contract: f.contract, from: d.from + " 00:00", upper: num(f.upper), partner: num(f.partner), by: App.session.name, at: App.now() })),
            allRows: d.fees.map((f) => ({ carrier: f.carrier, product: f.product, option: f.option, contract: f.contract, upper: f.upper, partner: f.partner })) };
          t.setup = true; delete st.drafts[t.id];
          if (t.admin) { App.toast("초기 설정을 저장했습니다. 고객사 개설을 마쳤습니다"); App.go("A-02"); }
          else { App.toast("초기 설정을 저장했습니다. 관리자 계정 발급이 남았습니다"); goStep(2); }
        },
      });
    },
  });
})();
</script>
<script>/* B-01 전체 고객관리 (옛 SC-3 + 줄을 누르면 서랍에서 SC-5 요약 · SC-7 상담 · SC-6 이력 · 개통 상태 변경).
   본사 첫 화면. 위 「할 일 띠」가 알림을 대신한다(문자 · 푸시가 범위 밖이라 새 접수를 놓치지 않게). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { todo: "", open: "", q: "", qBy: "name", more: false, f: { group: "", carrier: "", product: "", option: "", set: "", partner: "", recruiter: "", manager: "", upper: "", giftType: "", by: "receivedAt", from: "", to: "" } };
  const TODOS = [
    ["new", "협력점 새 접수", (c) => c.via !== "본사" && (c.receiptState === "접수" || c.receiptState === "재접수"), "확인 전"],
    ["auth", "고객인증 대기", (c) => c.auth === "인증대기" && !App.isOpened(c) && c.openState !== "해지" && c.openState !== "개통불가", "개통 전"],
    ["due", "설치예정일 지남", (c) => c.installDue && c.installDue < App.today() && !App.isOpened(c), "미개통"],
    ["gift", "사은품 지급할 건", (c) => c.gift && !c.giftPaid && App.isOpened(c) && c.giftPayer.startsWith("센터"), "센터 지급"],
    ["fee", "수수료 미등록", (c) => App.isOpened(c) && !App.feeOf(c), "개통 건"],
  ];
  App.screen("B-01", {
    title: "전체 고객관리", sc: ["SC-3", "SC-5", "SC-6", "SC-7", "SC-28"],
    render(el, params) {
      if (params.todo) st.todo = params.todo;
      const db = App.db; const f = st.f;
      el.innerHTML = h`${App.head("전체 고객관리", { actions: h`<button class="btn" data-go="B-06">고객이력</button><button class="btn p" data-go="B-02">고객등록</button>` })}
        <div class="todo" data-todo></div>
        <div class="card"><div class="filters">
            <select class="in fix" data-on="f" data-k="qBy" aria-label="검색 항목">${App.opts([["name", "고객명"], ["joinNo", "가입번호"]], st.qBy)}</select>
            <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="고객명 또는 가입번호" aria-label="검색어"></div>
            <select class="in fix" data-on="ff" data-k="partner" aria-label="협력점">${App.opts(db.partners.map((p) => [p.id, p.name]), f.partner, "협력점 전체")}</select>
            <select class="in fix" data-on="ff" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, f.carrier, "통신사 전체")}</select>
            <select class="in fix" data-on="ff" data-k="by" aria-label="기간 기준">${App.opts([["receivedAt", "접수일"], ["openedAt", "개통일"], ["installDue", "설치예정일"]], f.by)}</select>
            <div class="range"><input class="in" type="date" data-on="ff" data-k="from" value="${f.from}" aria-label="시작일">~<input class="in" type="date" data-on="ff" data-k="to" value="${f.to}" aria-label="종료일"></div>
            <button class="btn sm ghost" data-act="range" data-d="0">오늘</button><button class="btn sm ghost" data-act="range" data-d="6">7일</button><button class="btn sm ghost" data-act="range" data-d="29">30일</button>
            <button class="btn sm" data-act="more">조건 ${st.more ? "접기" : "더 보기"}</button><button class="btn sm ghost" data-act="reset">초기화</button>
          ${st.more ? h`<div class="filters-more">
            <div class="f"><label>정산그룹</label><select class="in" data-on="ff" data-k="group">${App.opts(db.options.정산그룹, f.group, "전체")}</select></div>
            <div class="f"><label>상품선택</label><select class="in" data-on="ff" data-k="product">${App.opts([...new Set(db.products.map((p) => p.name))], f.product, "전체")}</select></div>
            <div class="f"><label>옵션선택</label><select class="in" data-on="ff" data-k="option">${App.opts([...new Set(db.products.map((p) => p.option))], f.option, "전체")}</select></div>
            <div class="f"><label>셋트</label><select class="in" data-on="ff" data-k="set">${App.opts(["단독", "DPS", "TPS"], f.set, "전체")}</select></div>
            <div class="f"><label>유치자</label><select class="in" data-on="ff" data-k="recruiter">${App.opts(db.staff.filter((s) => s.roles.includes("유치자")).map((s) => s.name), f.recruiter, "전체")}</select></div>
            <div class="f"><label>담당자</label><select class="in" data-on="ff" data-k="manager">${App.opts(db.staff.filter((s) => s.roles.includes("담당자")).map((s) => s.name), f.manager, "전체")}</select></div>
            <div class="f"><label>상부점</label><select class="in" data-on="ff" data-k="upper">${App.opts(db.uppers.map((u) => [u.id, u.name]), f.upper, "전체")}</select></div>
            <div class="f"><label>사은품유형</label><select class="in" data-on="ff" data-k="giftType">${App.opts(["현금", "없음"], f.giftType, "전체")}</select></div>
          </div>` : ""}</div></div>
        <div data-pills style="margin-top:12px"></div>
        <div data-tbl></div>
        <p class="hint" style="margin-top:8px">엑셀저장은 화면 검색 조건과 같은 건수를 내려받습니다. 주민번호 · 연락처 · 계좌번호는 가린 값으로 들어가고 내려받기 기록이 남습니다.</p>`;

      const base = () => db.customers.filter((c) => {
        if (st.q && !String(c[st.qBy] || "").includes(st.q)) return false;
        if (f.partner && c.partnerId !== f.partner) return false; if (f.carrier && c.carrier !== f.carrier) return false;
        if (f.group && (db.partners.find((p) => p.id === c.partnerId) || {}).group !== f.group) return false;
        if (f.product && c.product !== f.product) return false; if (f.option && c.option !== f.option) return false; if (f.set && c.set !== f.set) return false;
        if (f.recruiter && c.recruiter !== f.recruiter) return false; if (f.manager && c.manager !== f.manager) return false; if (f.upper && c.upperId !== f.upper) return false;
        if (f.giftType === "현금" && !c.gift) return false; if (f.giftType === "없음" && c.gift) return false;
        const d = String(c[f.by] || "").slice(0, 10); if (f.from && (!d || d < f.from)) return false; if (f.to && (!d || d > f.to)) return false;
        return true;
      });
      const rows = () => { let r = base(); const t = TODOS.find((x) => x[0] === st.todo); if (t) r = r.filter(t[2]); if (st.open) r = r.filter((c) => c.openState === st.open); return r; };

      const tbl = App.table($("[data-tbl]", el), [
        { label: "No", render: (c, i) => h`${App.tag(c.tag)} <span class="muted num">${db.customers.length - db.customers.indexOf(c)}</span>` },
        { label: "고객명", render: (c) => h`<span class="name">${c.name}</span>` },
        { label: "접수일", render: (c) => h`<span class="num">${App.dt(c.receivedAt)}</span>` },
        { key: "setbox", label: "셋탑" }, { key: "carrier", label: "통신사" }, { key: "product", label: "상품명" },

          ${F("이전 통신사", "mnpFrom", sel("mnpFrom", withCur([...db.carriers, "알뜰폰"], v.mnpFrom), "번호이동 없음"))}
          ${F("이동할 번호", "mnpNo", inp("mnpNo", { ph: "010-1234-5678", max: 13, type: "tel" }))}
          ${F("명의자", "mnpHolder", inp("mnpHolder", { ph: "명의자 이름", max: 30 }))}
          ${F("생년월일", "mnpBirth", inp("mnpBirth", { ph: "6자리 (예: 900101)", max: 6, num: 1 }))}
        </div>`,
    };
    const tools = { mnp: raw('<button type="button" class="btn sm" data-act="cfMnpSame">위 고객정보와 동일</button><button type="button" class="btn sm ghost" data-act="cfMnpClear">비우기</button>') };
    host.innerHTML = h`<style>${raw(CSS)}</style>${SECS.map(([k, l]) => h`<section class="card b02-sec" id="cf-${k}" data-sec="${k}"><div class="b02-sh"><h2>${l}</h2><small data-prog="${k}"></small><span class="sp">${tools[k] || ""}</span></div><div data-secbody="${k}"></div></section>`)}`;

    function markErrors() {
      $$(".errmsg[data-cf]", host).forEach((e) => e.remove()); $$(".err", host).forEach((e) => e.classList.remove("err"));
      const by = new Map(); lastErrors.forEach((e) => { if (!by.has(e.f)) by.set(e.f, []); by.get(e.f).push(e); });
      by.forEach((list, f) => {
        const cell = $(`[data-f="${f}"]`, host); if (!cell) return;
        const m = document.createElement("span"); m.className = "errmsg"; m.dataset.cf = "1"; m.textContent = list.map((e) => e.msg).join(" · "); cell.appendChild(m);
        list.forEach((e) => { const i = e.line != null ? $(`[data-line="${e.line}"][data-lk="${e.lk}"]`, host) : $(`.in[data-k="${e.k}"]`, host); if (i) i.classList.add("err"); });
      });
    }
    function progress() {
      const R = rules(v);
      return SECS.map(([key, label]) => { const need = R.filter((r) => r.sec === key && r.req); const done = need.filter((r) => { const x = String(getv(v, r.k) == null ? "" : getv(v, r.k)).trim(); return x && (!r.re || r.re.test(x)); }).length; return { key, label, need: need.length, done, err: lastErrors.filter((e) => e.sec === key).length }; });
    }
    function drawProg() {
      progress().forEach((p) => { const e = $(`[data-prog="${p.key}"]`, host); if (!e) return; e.className = p.err ? "bad" : p.need && p.done === p.need ? "ok" : ""; e.textContent = p.err ? `확인할 칸 ${p.err}개` : !p.need ? "필수 칸 없음 · 있을 때만 넣습니다" : p.done === p.need ? `필수 ${p.need}개 채움` : `필수 ${p.done} / ${p.need}`; });
      $$("[data-need]", host).forEach((e) => (e.hidden = idNeed(v.kind) !== e.dataset.need));
    }
    function paint(k, focusSel) { $(`[data-secbody="${k}"]`, host).innerHTML = body[k](); if (lastErrors.length) markErrors(); if (focusSel) { const t = $(focusSel, host); if (t) t.focus({ preventScroll: true }); } }
    const changed = () => { drawProg(); if (opt.onChange) opt.onChange(); };
    SECS.forEach(([k]) => paint(k)); drawProg();

    /* 값이 바뀌면 묶음 값에 바로 적는다. 따라 채우는 일은 고른 뒤(change)에만 한다 */
    function onInput(e) {
      const t = e.target; const chg = e.type === "change";
      if (t.dataset.line != null) {
        const i = +t.dataset.line; const ln = v.lines[i]; const lk = t.dataset.lk; if (!ln) return; ln[lk] = t.value;
        lastErrors = lastErrors.filter((x) => !(x.line === i && x.lk === lk));
        if (chg && t.tagName === "SELECT") {
          if (lk === "product") { const p = db.products.find((x) => x.carrier === v.carrier && x.name === ln.product); Object.assign(ln, p ? { option: p.option, set: p.set, setbox: p.setbox } : { option: "", set: "", setbox: "없음" }); }
          if (lk === "option") { const p = db.products.find((x) => x.carrier === v.carrier && x.name === ln.product && x.option === ln.option); if (p) Object.assign(ln, { set: p.set, setbox: p.setbox }); }
          paint("prod", `[data-line="${i}"][data-lk="${lk}"]`);
        } else markErrors();
        changed(); return;
      }
      const k = t.dataset.k; if (!k || (t.type === "radio" && !t.checked)) return;
      if (chg && t.dataset.money != null) t.value = comma(t.value);
      v[k] = t.value; lastErrors = lastErrors.filter((x) => x.k !== k);
      if (chg) {
        if (k === "carrier") { v.lines.forEach((ln) => { if (!db.products.some((p) => p.carrier === v.carrier && p.name === ln.product)) Object.assign(ln, { product: "", option: "", set: "", setbox: "없음", addon: "" }); }); paint("prod", `input[data-k="carrier"]:checked`); }
        else if (k === "recruitOrg") { const recs = db.staff.filter((s) => s.roles.includes("유치자") && s.state === "재직" && s.org === v.recruitOrg); v.recruiter = recs.length === 1 ? recs[0].name : ""; paint("cust", `[data-k="recruitOrg"]`); }
        else if (k === "gift") { const g = db.gifts.find((x) => x.kind === "사은품" && x.name === v.gift); if (g) { v.giftAmt = comma(g.amount); v.giftPayer = g.payer; if (!v.giftDue) v.giftDue = App.addDays(App.today(), 14); } else Object.assign(v, { giftAmt: "", giftExtra: "", giftPayer: "", giftDue: "" }); lastErrors = lastErrors.filter((x) => x.sec !== "gift"); paint("gift", `[data-k="gift"]`); }
        else if (k === "hqGift") { const g = db.gifts.find((x) => x.kind === "본사사은품" && x.name === v.hqGift); v.hqGiftAmt = g ? comma(g.amount) : ""; paint("gift", `[data-k="hqGift"]`); }
        else if (k === "payWay") paint("pay", `input[data-k="payWay"]:checked`);
        else markErrors();
      }
      changed();
    }
    host.addEventListener("input", onInput); host.addEventListener("change", onInput);
    const who = () => (opt.c ? opt.c.name : v.name);
    App.on(host, {
      cfAddr: () => App.addressSearch((a) => { v.zip = a.zip; v.addr = a.addr; paint("cust", `[data-k="addr2"]`); changed(); }),
      cfCopyRrn: () => { if (!/^\d{6}$/.test(v.rrn1)) { App.toast("주민번호 앞자리를 먼저 넣어 주세요"); return; } v.payRrn = rrnJoin(v); if (v.gift) v.giftRrn = rrnJoin(v); paint("pay"); paint("gift"); changed(); App.toast(v.gift ? "주민번호를 납부 · 사은품 예금주 칸에 복사했습니다" : "주민번호를 납부 예금주 칸에 복사했습니다"); },
      cfPaySame: () => { if (!v.name.trim()) { App.toast("고객명을 먼저 넣어 주세요"); return; } v.payHolder = v.name.trim(); v.payRrn = rrnJoin(v); v.payRel = "본인"; lastErrors = lastErrors.filter((x) => x.k !== "payHolder"); paint("pay", `[data-k="payBank"]`); changed(); },
      cfGiftSameCust: () => { if (!v.name.trim()) { App.toast("고객명을 먼저 넣어 주세요"); return; } v.giftHolder = v.name.trim(); v.giftRrn = rrnJoin(v); paint("gift", `[data-k="giftBank"]`); changed(); },
      cfGiftSamePay: () => { if (!v.payAcct) { App.toast("납부 계좌를 먼저 넣어 주세요"); return; } Object.assign(v, { giftBank: v.payBank, giftAcct: v.payAcct, giftHolder: v.payHolder, giftRrn: v.payRrn }); lastErrors = lastErrors.filter((x) => x.k !== "giftAcct" && x.k !== "giftRrn"); paint("gift"); changed(); },
      cfMnpSame: () => { Object.assign(v, { mnpHolder: v.name.trim(), mnpNo: v.phone, mnpFrom: v.mnpFrom || v.phoneCarrier, mnpBirth: v.rrn1 }); lastErrors = lastErrors.filter((x) => x.sec !== "mnp"); paint("mnp", `[data-k="mnpFrom"]`); changed(); },
      cfMnpClear: () => { Object.assign(v, { mnpFrom: "", mnpNo: "", mnpHolder: "", mnpBirth: "" }); lastErrors = lastErrors.filter((x) => x.sec !== "mnp"); paint("mnp"); changed(); },
      cfAddLine: () => { v.lines.push(blankLine()); paint("prod", `[data-line="${v.lines.length - 1}"][data-lk="product"]`); changed(); },
      cfDelLine: (t) => { v.lines.splice(+t.dataset.i, 1); lastErrors = lastErrors.filter((x) => x.sec !== "prod"); paint("prod"); changed(); },
      cfReveal: (t) => { const k = t.dataset.k; opt.revealed.add(k); App.log("민감정보 원문 조회", `${L[k]} 원문 보기`, "", who()); paint(SEC_OF[k], `[data-k="${k}"]`); App.toast("원문을 보여 줍니다. 조회 기록이 남았습니다"); },
    });

    const api = {
      progress, paint,
      /** 검사하고 틀린 칸을 표시한다. → { ok, errors } */
      validate: () => { lastErrors = check(v); markErrors(); drawProg(); if (lastErrors.length) api.focus(lastErrors[0]); return { ok: !lastErrors.length, errors: lastErrors }; },
      focus: (e) => { const i = e.line != null ? $(`[data-line="${e.line}"][data-lk="${e.lk}"]`, host) : $(`[data-k="${e.k}"]`, host); const cell = $(`[data-f="${e.f}"]`, host); if (cell) cell.scrollIntoView({ block: "center" }); if (i) i.focus({ preventScroll: true }); },
    };
    return api;
  }
  /** 묶음 길잡이: 누르면 그 묶음으로 가고, 묶음마다 필수 채움을 보여 준다 */
  function nav(el, api, o) {
    const cur = el.dataset.cur || "cust";
    el.className = "card b02-nav" + (o && o.hz ? " hz" : "");
    el.innerHTML = h`${api.progress().map((p, i) => h`<button type="button" class="${p.key === cur ? "on" : ""} ${p.err ? "bad" : p.need && p.done === p.need ? "done" : ""}" data-sec-go="${p.key}"><i>${p.err ? "!" : p.need && p.done === p.need ? "✓" : i + 1}</i>${p.label}<small>${p.err ? `${p.err}칸 확인` : p.need ? `${p.done}/${p.need}` : "선택"}</small></button>`)}`;
    $$("[data-sec-go]", el).forEach((b) => (b.onclick = () => { el.dataset.cur = b.dataset.secGo; const s = document.getElementById("cf-" + b.dataset.secGo); if (s) s.scrollIntoView({ block: "start" }); nav(el, api, o); }));
  }
  /** 맨 위 누락 알림 띠(W-47). 칸 이름을 누르면 그 칸으로 간다 */
  function banner(el, api, errors) {
    if (!errors || !errors.length) { el.innerHTML = ""; return; }
    const miss = errors.some((e) => e.miss);
    el.innerHTML = h`<div class="note bad b02-banner" role="alert"><b>${miss ? "빠진 필수 항목 칸이 있습니다. 표시된 칸을 확인해 주세요." : "형식이 맞지 않는 칸이 있습니다. 표시된 칸을 확인해 주세요."}</b><div style="margin-top:4px">${errors.map((e, i) => h`<a data-i="${i}">${e.label}</a>`)}</div></div>`;
    $$("a[data-i]", el).forEach((a) => (a.onclick = () => api.focus(errors[+a.dataset.i])));
    window.scrollTo(0, 0);
  }
  /* 스크롤 위치에 맞춰 길잡이의 지금 묶음을 바꾼다(화면이 다시 그려져도 한 번만 건다) */
  let tick = 0;
  if (window.addEventListener) window.addEventListener("scroll", () => {
    if (tick) return; tick = setTimeout(() => {
      tick = 0; const n = document.querySelector("#main .b02-nav"); if (!n) return;
      const line = n.classList.contains("hz") ? 170 : 140; let cur = "cust";
      SECS.forEach(([k]) => { const s = document.getElementById("cf-" + k); if (s && s.getBoundingClientRect().top <= line) cur = k; });
      if (n.dataset.cur !== cur) { n.dataset.cur = cur; $$("[data-sec-go]", n).forEach((b) => b.classList.toggle("on", b.dataset.secGo === cur)); }
    }, 80);
  }, { passive: true });

  App.custForm = { SECS, L, blank, fromCustomer, apply, createFrom, diff, check, mount, nav, banner, num, comma };

  /* ── B-02 화면 ── */
  const st = { v: null, from: "", saving: false };
  App.screen("B-02", {
    title: "고객 등록", parent: "B-01", sc: ["SC-4", "SC-8"],
    render(el, params) {
      const db = App.db; const from = params.from || "";
      if (!st.v || st.from !== from) { st.v = blank(from); st.from = from; }
      const v = st.v; const ps = from ? db.prospects.find((p) => p.id === from) : null;
      el.innerHTML = h`${App.head("고객 등록", { back: { code: "B-01", label: "전체 고객관리" }, count: h`<span class="req" style="margin:0">*</span> 표시는 필수 · 접수일시는 저장 시각으로 기록`, actions: h`<button class="btn" data-act="reset">새로 쓰기</button><button class="btn p" data-act="save">저장</button>` })}
        <div class="b02-wrap">
          <aside class="b02-side"><nav data-nav></nav><p class="hint" style="margin:10px 4px 0">Tab 으로 다음 칸으로 넘어갑니다. 고객종류를 바꾸면 필요한 번호 칸의 필수 표시가 바뀝니다.</p></aside>
          <div style="min-width:0">
            <div data-top></div>
            ${ps ? h`<div class="note">가망고객 <b>${ps.name}</b>에서 넘어왔습니다. 이름 · 연락처 · 관심 상품을 채워 두었습니다. 저장하면 가망고객의 상담 상태가 「전환」으로 바뀝니다.</div>` : ""}
            <div data-form></div>
            <div class="bar-actions b02-bar"><span class="sp" data-info></span><button class="btn" data-back="B-01">취소</button><button class="btn p" data-act="save">저장</button></div>
          </div>
        </div>`;
      const navEl = $("[data-nav]", el);
      const info = () => { const p = api.progress(); const need = p.reduce((a, x) => a + x.need, 0); const done = p.reduce((a, x) => a + x.done, 0); $("[data-info]", el).innerHTML = h`필수 <b class="${done === need ? "" : "neg"}">${done}</b> / ${need}칸 채움 · 상품 ${v.lines.length}줄${v.gift ? h` · 사은품 ${v.gift}` : ""}`; nav(navEl, api); };
      const api = mount($("[data-form]", el), v, { mode: "new", onChange: () => info() });
      info();
      const first = $('[data-k="name"]', el); if (first && !v.name) first.focus({ preventScroll: true });
      App.on(el, {
        reset: async () => { if (!(await App.confirm("입력한 내용을 지우고 새로 쓰시겠습니까?", { ok: "새로 쓰기" }))) return; st.v = blank(from); App.redraw(); },
        save: () => {
          if (st.saving) return; // 여러 번 눌러도 접수 건은 하나만 생긴다
          const r = api.validate(); banner($("[data-top]", el), api, r.errors); nav(navEl, api); if (!r.ok) return;
          st.saving = true; $$('[data-act="save"]', el).forEach((b) => { b.disabled = true; b.textContent = "저장 중…"; });
          const main = createFrom(v, 0); const recs = [main, ...v.lines.slice(1).map((_, i) => createFrom(v, i + 1, main))];
          db.customers.unshift(...recs);
          recs.forEach((c) => App.addHistory(c.id, "접수", `본사에서 접수 (${c.product} · ${c.contract})`));
          App.log("접수", `${main.name} 고객 등록`, "", `${main.carrier} ${recs.map((c) => c.product).join(", ")}`);
          if (ps) { const b = ps.state; ps.state = "전환"; ps.next = ""; App.log("가망고객", `${ps.name} 접수로 전환`, b, "전환"); }
          st.v = null; st.saving = false; App.toast("저장했습니다");
          App.go("B-03", { id: main.id, saved: "new" }, { replace: true });
          if (App.cur.code === "B-02") App.redraw(); // 화면별 파일에서는 이동하지 않으므로 빈 등록 화면으로 돌아간다
        },
      });
    },
  });
})();
</script>
<script>/* B-03 고객 상세·수정 (옛 SC-5 상세·수정 + SC-7 상담 + SC-45 재접수 + SC-6 이력의 한 건 보기).
   왼쪽 = 등록과 같은 입력 묶음(App.custForm, b-02 파일), 오른쪽 = 바로 반영되는 일(개통 상태 · 접수 처리 · 사은품 지급 · 상담)과 이력.
   params.mode=re 이고 반송 건이면 재접수 방식으로 열린다. */
(function () {
  "use strict";
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$; const raw = App.raw;
  const st = { id: "", params: null, v: null, snap: null, revealed: new Set(), tag: "" };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const CSS = `
.b03{--cf-top:152px}
.b03 .b02-bar{padding-left:140px}
.b03-sum{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:10px 16px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.b03-sum .nm{font-size:16px;color:var(--ink);font-weight:800;letter-spacing:-.2px}
.b03-sum .bar{width:1px;height:14px;background:var(--line)}
.b03-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.b03-open{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:12px;font-size:13px}
.b03-open label{color:var(--muted)}
.b03-hist{max-height:440px;overflow:auto;padding-right:4px}
.b03-last{background:var(--sunk);border:1px solid var(--line2);border-radius:var(--r1);padding:8px 10px;font-size:13px;margin-bottom:10px}
.b03-last p{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.b03-req{background:var(--amber-bg);color:#6B4705;border-radius:var(--r1);padding:8px 10px;font-size:13px;margin:8px 0}`;

  App.screen("B-03", {
    title: "고객 상세·수정", parent: "B-01", sc: ["SC-5", "SC-7", "SC-45", "SC-6"],
    render(el, params) {
      const CF = App.custForm; const db = App.db;
      let c = params.id ? App.cust(params.id) : null;
      if (!c && !params.id) c = (params.mode === "re" && db.customers.find((x) => x.receiptState === "반송")) || db.customers[0]; // 화면별 파일로 바로 열었을 때
      if (!c) { el.innerHTML = h`${App.head("고객 상세·수정", { back: { code: "B-01", label: "전체 고객관리" } })}<div class="card empty"><b>접수 건을 찾을 수 없습니다</b>목록에서 다시 골라 주세요.<br><button class="btn" data-go="B-01">전체 고객관리로</button></div>`; return; }
      const re = params.mode === "re" && c.receiptState === "반송";

      /* 입력 중이던 값은 다시 그려도 남긴다. 손대지 않은 칸은 늘 기록의 지금 값을 따른다(서랍 · 오른쪽 칸에서 바뀐 값이 묻히지 않게) */
      const fresh = CF.fromCustomer(c);
      if (st.id !== c.id || st.params !== params || !st.v) Object.assign(st, { id: c.id, params, v: fresh, snap: clone(fresh), revealed: new Set(), tag: "" });
      else { Object.keys(fresh).forEach((k) => { if (k === "lines") { if (JSON.stringify(st.v.lines[0]) === JSON.stringify(st.snap.lines[0])) st.v.lines[0] = fresh.lines[0]; } else if (st.v[k] === st.snap[k]) st.v[k] = fresh[k]; }); st.snap = clone(fresh); }
      const v = st.v;
      const fee = App.feeOf(c); const locked = !!(c.settleId && db.settlements.some((s) => s.id === c.settleId && s.state === "확정"));
      const sibs = db.customers.filter((x) => x !== c && (x.groupId || x.id) === (c.groupId || c.id));
      const lastOs = db.history.find((x) => x.cid === c.id && x.kind === "상태 변경");
      const bounceAt = (db.history.find((x) => x.cid === c.id && x.kind === "반송") || {}).at;

      function side() {
        const cons = db.consults.filter((x) => x.cid === c.id); const hist = App.historyOf(c.id);
        const pending = c.via !== "본사" && (c.receiptState === "접수" || c.receiptState === "재접수");
        return h`
          <section class="card pad"><div class="sec-h"><h2>개통 상태</h2><span class="sp">${App.chip(c.openState)}</span></div>
            <div class="row" style="flex-wrap:nowrap"><select class="in" data-os aria-label="바꿀 개통 상태">${App.opts(App.OPEN_STATES, c.openState)}</select><button class="btn" data-act="os" style="flex:none">상태 변경</button></div>
            <p class="hint" style="margin-top:6px">${lastOs ? `최근 변경 ${App.dt(lastOs.at)} · ${lastOs.by}` : "아직 상태를 바꾼 적이 없습니다"}. 개통완료 · 유심개통만 정산 대상이 됩니다.</p>
            ${locked ? raw('<div class="note gray" style="margin:8px 0 0">확정된 정산에 든 건이라 개통 상태 · 상품은 바꿀 수 없습니다.</div>') : ""}
            <div class="b03-open">
              <label for="b03-join">가입번호</label><input class="in num" id="b03-join" data-on="open" data-live data-k="joinNo" value="${v.joinNo}" maxlength="20" placeholder="개통되면 넣습니다">
              <label for="b03-due">설치예정일</label><input class="in" id="b03-due" type="date" data-on="open" data-k="installDue" value="${v.installDue}">
              <label for="b03-opened">개통일</label><input class="in" id="b03-opened" type="date" data-on="open" data-k="openedAt" value="${v.openedAt}">
            </div>
            <p class="hint" style="margin-top:6px">가입번호 · 설치예정일 · 개통일은 「${re ? "재접수" : "저장"}」을 눌러야 반영됩니다.</p></section>
          ${c.via !== "본사" ? h`<section class="card pad"><div class="sec-h"><h2>협력점 접수 처리</h2><span class="sp">${App.chip(c.receiptState)}</span></div>
            <dl class="kv"><dt>접수한 곳</dt><dd>${App.partnerName(c.partnerId)}${c.subId ? " · " + App.subName(c.subId) : ""}</dd>${c.reply ? h`<dt>최근 회신</dt><dd>${c.reply}</dd>` : ""}${c.receiptState === "반송" ? h`<dt>반송 사유</dt><dd class="neg">${c.bounce}</dd>` : ""}</dl>
            ${c.request ? h`<div class="b03-req"><b>요청</b> ${c.request}</div>` : ""}
            <div class="row" style="margin-top:8px">${pending ? raw('<button class="btn sm p" data-act="rc">확인</button>') : ""}${c.receiptState !== "반송" ? raw('<button class="btn sm" data-act="rr">회신</button><button class="btn sm" data-act="rb">반송</button>') : re ? "" : h`<button class="btn sm" data-go="B-03" data-params="id=${c.id}&mode=re">본사가 대신 재접수</button>`}<a class="btn sm ghost" data-go="B-04" data-params="id=${c.id}" style="margin-left:auto">접수함에서 보기</a></div></section>` : ""}
          <section class="card pad"><div class="sec-h"><h2>사은품 지급</h2><span class="sp">${c.gift ? App.chip(c.giftPaid ? "지급완료" : "미지급") : ""}</span></div>
            ${c.gift ? h`<dl class="kv"><dt>사은품</dt><dd>${c.gift} <span class="num">${App.won(c.giftAmt)}원</span>${c.giftExtra ? h` + 추가 <span class="num">${App.won(c.giftExtra)}원</span>` : ""}</dd><dt>지급예정일</dt><dd class="num">${c.giftDue || "-"}</dd><dt>계좌</dt><dd class="num">${c.giftAcct ? `${c.giftBank} ${App.maskAcct(c.giftAcct)} (${c.giftHolder})` : "-"}</dd></dl>
              <div class="row" style="margin-top:10px;flex-wrap:nowrap"><select class="in" data-on="payer" aria-label="지급처">${App.opts(["센터(자체) 지급", "유치자 지급"], c.giftPayer, "지급처 고르기")}</select><label class="check" style="flex:none"><input type="checkbox" class="cb" data-on="paid" ${c.giftPaid ? raw("checked") : ""}> 지급완료</label></div>
              <p class="hint" style="margin-top:6px">지급처 · 지급완료는 바꾸는 즉시 반영되고 변경 이력에 남습니다.</p>` : h`<p class="muted" style="font-size:13px">사은품이 없습니다. 왼쪽 「사은품」 묶음에서 고르고 저장하면 여기서 지급을 관리합니다.</p>`}</section>
          <section class="card pad"><div class="sec-h"><h2>상담</h2><small>본사만 봅니다</small><span class="sp">${cons.length ? h`<a class="link" data-act="allTalk" style="font-size:12.5px">전체 ${cons.length}건 보기</a>` : ""}</span></div>
            ${cons.length ? h`<div class="b03-last"><div class="row">${App.tag(cons[0].tag)}<span class="muted" style="font-size:12px">${App.dt(cons[0].at)} · ${cons[0].by}</span></div><p>${cons[0].text}</p></div>` : h`<p class="muted" style="font-size:13px;margin-bottom:10px">상담 기록이 없습니다. 아래에서 첫 상담을 남겨 보세요.</p>`}
            <div class="row" style="margin-bottom:8px" data-tags>${App.TAGS.map((t) => h`<button class="pill ${t === st.tag ? "on" : ""}" data-act="tag" data-t="${t}">${t}</button>`)}</div>
            <textarea class="in" rows="3" maxlength="500" data-text placeholder="상담 내용 (500자까지)" aria-label="상담 내용"></textarea><p class="errmsg" data-talkerr></p>
            <div class="row" style="margin-top:6px"><span class="hint" style="flex:1;min-width:0">저장하면 고객 목록의 최종상담내용에 보입니다.</span><button class="btn p sm" data-act="talk">상담 저장</button></div></section>
          <section class="card pad"><div class="sec-h"><h2>이력</h2><small>최근 순 · ${hist.length}건</small><span class="sp"><a class="link" data-go="B-06" data-params="cid=${c.id}" style="font-size:12.5px">고객이력에서 보기</a></span></div>
            <div class="b03-hist">${App.timeline(hist)}</div></section>`;
      }

      el.innerHTML = h`<style>${raw(CSS)}</style><div class="b03">
        ${App.head(re ? "재접수 처리" : "고객 상세·수정", { back: { code: "B-01", label: "전체 고객관리" }, count: re ? "반송된 건을 본사가 보완해 대신 재접수합니다" : "", actions: h`<a class="btn" data-go="B-06" data-params="cid=${c.id}">고객이력</a>${!re && c.receiptState === "반송" ? h`<button class="btn" data-go="B-03" data-params="id=${c.id}&mode=re">재접수 처리</button>` : ""}${re ? h`<button class="btn" data-go="B-03" data-params="id=${c.id}">재접수 그만두기</button><button class="btn p" data-act="resubmit">재접수</button>` : raw('<button class="btn p" data-act="save">저장</button>')}` })}
        ${re ? h`<div data-steps></div>` : ""}
        <div class="card b03-sum"><span class="nm">${c.name}</span>${App.chip(c.openState)}${c.via === "본사" ? raw('<span class="chip c-gray">본사 직접 접수</span>') : App.chip(c.receiptState)}${App.chip(c.auth)}
          <i class="bar"></i><span>${c.carrier} · ${c.product} · ${c.option} · ${c.contract}</span><i class="bar"></i><span>${App.orgOf(c)}</span><i class="bar"></i><span>접수 <b class="num">${App.dt(c.receivedAt)}</b></span><i class="bar"></i>
          <span>수수료표 ${fee ? h`<b>v${fee.ver}</b>` : raw('<b class="neg">수수료 미등록</b>')}</span>
          ${sibs.length ? h`<i class="bar"></i><span>같은 접수의 다른 상품 ${sibs.map((x) => h`<a class="link" data-go="B-03" data-params="id=${x.id}" style="margin-left:6px">${x.product}</a>`)}</span>` : ""}</div>
        ${re ? h`<div class="note bad"><b>반송 사유</b> ${c.bounce || "사유가 적혀 있지 않습니다."}${bounceAt ? h` <span style="opacity:.75">(${App.dt(bounceAt)})</span>` : ""}</div>
          <div class="note warn">수수료는 확정된 접수일시 기준으로 적용됩니다. <b>재접수하면 접수일시가 지금 시각으로 바뀌고</b>, 수수료는 새 접수일시에 적용 중인 수수료표로 다시 찾습니다. 지금 접수일시(${App.dt(c.receivedAt)})는 이력에 남습니다.</div>` : ""}
        ${!re && c.receiptState === "반송" ? h`<div class="note bad"><b>반송된 접수입니다.</b> ${c.bounce} <a data-go="B-03" data-params="id=${c.id}&mode=re">본사가 대신 재접수</a></div>` : ""}
        ${params.saved === "new" ? h`<div class="note ok"><b>접수했습니다.</b> 접수일시 ${App.dt(c.receivedAt)}. 개통 상태 · 가입번호는 오른쪽에서 이어서 넣습니다.</div>` : ""}
        ${params.saved === "re" ? h`<div class="note ok"><b>재접수했습니다.</b> 접수일시가 ${App.dt(c.receivedAt)}(으)로 바뀌었습니다. ${fee ? `수수료표 v${fee.ver} 이 적용됩니다.` : "이 접수일시에 맞는 수수료표가 없습니다."}</div>` : ""}
        <div class="split">
          <div style="min-width:0"><nav data-nav></nav><div data-top></div><div data-form></div>
            <div class="bar-actions b02-bar"><span class="sp" data-info></span><button class="btn" data-back="B-01">닫기</button>${re ? raw('<button class="btn p" data-act="resubmit">재접수</button>') : raw('<button class="btn p" data-act="save">저장</button>')}</div></div>
          <aside class="b03-side" data-side>${side()}</aside>
        </div></div>`;
      if (re) App.steps($("[data-steps]", el), [["a", "반송됨", bounceAt ? App.dt(bounceAt) : "본사가 반송", "done"], ["b", "보완 입력 중", "아래 칸을 고칩니다", ""], ["c", "재접수 완료", "접수일시가 바뀝니다", ""]], "b");

      const navEl = $("[data-nav]", el);
      const changes = () => { const d = CF.diff(st.snap, v); const extra = v.lines.length - 1; return { d, extra, n: d.length + extra }; };
      const info = () => { const ch = changes(); const p = api.progress(); const need = p.reduce((a, x) => a + x.need, 0); const done = p.reduce((a, x) => a + x.done, 0);
        $("[data-info]", el).innerHTML = h`필수 <b class="${done === need ? "" : "neg"}">${done}</b> / ${need}칸 · ${ch.n ? h`<b style="color:var(--todo)">바꾼 칸 ${ch.n}개</b> <span>(${[...ch.d.map((x) => x.label), ...(ch.extra ? [`상품 추가 ${ch.extra}줄`] : [])].slice(0, 4).join(", ")}${ch.n > 4 ? " 등" : ""}) · 저장 전</span>` : "바꾼 칸 없음"}`; CF.nav(navEl, api, { hz: true }); };
      const api = CF.mount($("[data-form]", el), v, { mode: "edit", mask: true, revealed: st.revealed, c, onChange: info });
      info();

      /** 검사 → 기록에 반영. 성공하면 바뀐 칸 목록을 돌려준다 */
      function commit() {
        const r = api.validate(); CF.banner($("[data-top]", el), api, r.errors); CF.nav(navEl, api, { hz: true }); if (!r.ok) return null;
        const ch = changes();
        if (locked && ch.d.some((x) => x.k === "lines" || x.k === "carrier")) { App.toast("확정된 정산에 든 건은 통신사 · 상품을 바꿀 수 없습니다"); return null; }
        CF.apply(c, v, 0, { open: true });
        const at = db.customers.indexOf(c);
        v.lines.slice(1).forEach((_, i) => { const n = CF.createFrom(v, i + 1, c); if (!c.groupId) c.groupId = c.id; db.customers.splice(at, 0, n); App.addHistory(n.id, "접수", `같은 접수에 상품 추가 (${n.product} · ${n.contract})`); });
        if (ch.d.length) { App.addHistory(c.id, "수정", `${ch.d.slice(0, 5).map((x) => x.label).join(" · ")}${ch.d.length > 5 ? ` 외 ${ch.d.length - 5}칸` : ""} 수정`); App.log("접수", `${c.name} 정보 수정`, ch.d.map((x) => `${x.label}: ${x.before || "-"}`).join(" / "), ch.d.map((x) => `${x.label}: ${x.after || "-"}`).join(" / ")); }
        return ch;
      }
      const after = () => App.redraw();
      App.on(el, {
        save: () => { if (!changes().n) { const r = api.validate(); CF.banner($("[data-top]", el), api, r.errors); if (r.ok) App.toast("바꾼 내용이 없습니다"); return; } const ch = commit(); if (!ch) return; st.v = null; App.toast("저장했습니다"); App.redraw(); },
        resubmit: async () => {
          const r = api.validate(); CF.banner($("[data-top]", el), api, r.errors); CF.nav(navEl, api, { hz: true }); if (!r.ok) return;
          const ln = v.lines[0]; const now = App.now(); const nf = App.feeOf({ carrier: v.carrier, product: ln.product, option: ln.option, contract: ln.contract, receivedAt: now });
          const ok = await App.confirm(`${c.name} 건을 재접수하시겠습니까?`, { ok: "재접수", detail: `접수일시가 ${App.dt(c.receivedAt)} 에서 ${now} (으)로 바뀝니다. 수수료표: ${fee ? "v" + fee.ver : "미등록"} → ${nf ? "v" + nf.ver : "미등록"}. 이전 접수일시는 이력에 남습니다.` });
          if (!ok) return; if (!commit()) return;
          const old = c.receivedAt; c.receivedAt = App.now(); c.receiptState = "재접수";
          App.addHistory(c.id, "재접수", `본사가 보완해 대신 재접수 (이전 접수일시 ${App.dt(old)})`); App.log("접수", `${c.name} 재접수`, `반송 · 접수일시 ${App.dt(old)}`, `재접수 · 접수일시 ${c.receivedAt}`);
          st.v = null; App.toast("재접수했습니다"); App.go("B-03", { id: c.id, saved: "re" }, { replace: true });
        },
        recvEdit: () => App.editModal({ title: "접수일시 수정", note: "수수료는 접수일시에 적용 중인 수수료표로 다시 찾습니다. 수정 사유와 바꾸기 전 · 뒤 값이 변경 이력에 남습니다.", done: "접수일시를 바꿨습니다",
          fields: [{ name: "at", label: "새 접수일시", required: true, value: c.receivedAt, placeholder: "2026-11-26 09:30", pattern: /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/, msg: "2026-11-26 09:30 꼴로 넣어 주세요", hint: `지금 ${c.receivedAt}` }, { name: "why", label: "수정 사유", type: "textarea", required: true, max: 200, hint: "200자까지" }],
          onSave: (x) => { if (locked) return "확정된 정산에 든 건은 접수일시를 바꿀 수 없습니다"; if (x.at === c.receivedAt) return "접수일시가 그대로입니다"; if (x.at > App.now()) return "지금보다 뒤 시각으로는 바꿀 수 없습니다";
            const old = c.receivedAt; c.receivedAt = x.at; App.addHistory(c.id, "수정", `접수일시 ${old} > ${x.at} (사유: ${x.why})`); App.log("접수", `${c.name} 접수일시 수정`, old, `${x.at} (사유: ${x.why})`); App.redraw(); } }),
        open: (t) => { v[t.dataset.k] = t.value.trim(); info(); },
        os: () => App.changeOpenState(c, $("[data-os]", el).value, after),
        rc: () => App.receiptConfirm(c, after), rr: () => App.receiptReply(c, after), rb: () => App.receiptBounce(c, after),
        payer: (t) => { if (!t.value) { t.value = c.giftPayer; return; } const b = c.giftPayer; c.giftPayer = t.value; App.log("접수", `${c.name} 사은품 지급처`, b, t.value); App.toast("지급처를 바꿨습니다"); App.redraw(); },
        paid: (t) => { c.giftPaid = t.checked; App.log("접수", `${c.name} 사은품 지급완료`, t.checked ? "미지급" : "지급완료", t.checked ? "지급완료" : "미지급"); App.toast(t.checked ? "지급완료로 표시했습니다" : "지급완료 표시를 풀었습니다"); App.redraw(); },
        tag: (t) => { st.tag = st.tag === t.dataset.t ? "" : t.dataset.t; $$("[data-tags] .pill", el).forEach((b) => b.classList.toggle("on", b.dataset.t === st.tag)); $("[data-text]", el).focus(); },
        talk: () => { const err = App.saveConsult(c, st.tag, $("[data-text]", el).value.trim()); if (err) { $("[data-talkerr]", el).textContent = err; return; } st.tag = ""; App.toast("상담을 저장했습니다"); App.redraw(); },
        allTalk: () => App.openCustomer(c.id, { tab: "talk", onChange: after }),
      });
    },
  });
})();
</script>
<script>/* B-04 협력점 접수함 (옛 SC-39 접수 확인·회신·반송). 받은편지함 꼴: 왼쪽 목록에서 고르고 오른쪽에서 확인 · 회신 · 반송.
   처리하면 다음 미처리 건(접수 · 재접수)으로 넘어간다. 협력점에 보이는 본사 글은 여기서 쓴 회신 · 반송 사유뿐이다(D-4). */
(function () {
  "use strict";
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { state: "", group: "", partner: "", carrier: "", product: "", q: "", sel: "" };
  const todo = (c) => c.receiptState === "접수" || c.receiptState === "재접수";
  const CSS = `
.b04-wrap{display:grid;grid-template-columns:minmax(0,1fr) 452px;gap:16px;align-items:start}
.b04-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.b04-kpis .kpi b.hot{color:var(--todo)}
.b04-detail{position:sticky;top:108px;max-height:calc(100vh - 124px);display:flex;flex-direction:column;overflow:hidden}
