        ${inp(d, "giftAcct", "사은품 계좌번호", { num: 1, max: 20, ph: "숫자만" })}
        ${inp(d, "giftHolder", "예금주", { max: 30 })}
        ${inp(d, "giftRrn", "예금주 주민번호", { num: 1, mask: 1, max: 14, ph: "숫자 13자리" })}` : ""}</section>
      <section class="pf-card"><h2>본사 사은품</h2>
        ${sel(d, "hqGift", "본사사은품 명", db.gifts.filter((g) => g.kind === "본사사은품" && (g.state === "사용" || g.name === d.hqGift)).map((g) => g.name), { re: 1, first: "없음" })}
        ${d.hqGift ? inp(d, "hqGiftAmt", "본사사은품 금액(원)", { num: 1, max: 10 }) : ""}</section>
      <section class="pf-card"><h2>번호이동${d.mnpOn ? h`<span class="sp"><button class="pf-tap" data-act="sameMnp">위 고객 정보와 동일</button></span>` : ""}</h2>
        ${sel(d, "mnpOn", "번호이동", ["있음"], { re: 1, first: "없음" })}
        ${d.mnpOn ? h`${sel(d, "mnpFrom", "이전 통신사", db.carriers, { req: 1 })}${inp(d, "mnpNo", "이동할 번호", { req: 1, type: "tel", max: 13, ph: "010-0000-0000" })}${inp(d, "mnpHolder", "명의자", { req: 1, max: 30 })}` : ""}</section>`;
    },
    /** 화면에 있는 칸 값을 입력값에 옮긴다 */
    collect(root, d) {
      $$("[data-f]", root).forEach((e) => (d[e.dataset.f] = e.value.trim()));
      $$("[data-lf]", root).forEach((e) => { const L = d.lines[+e.dataset.l]; if (L) L[e.dataset.lf] = e.value.trim(); });
    },
    /** 그 단계의 필수 · 형식 검사 → [{ f: 칸 이름, msg }] */
    check(d, step, opt) {
      opt = opt || {}; const e = []; const bad = (f, msg) => e.push({ f, msg });
      if (step === 0) {
        if (!d.name) bad("name", "고객명을 넣어 주세요");
        if (!d.kind) bad("kind", "고객종류를 골라 주세요");
        if (needRrn(d.kind)) { const keep = opt.re && d.rrnHad && !d.rrn2; if (!/^\d{6}$/.test(d.rrn1) || !(keep || /^\d{7}$/.test(d.rrn2))) bad("rrn", "주민번호 앞 6자리 · 뒤 7자리를 숫자로 넣어 주세요"); }
        if (needBiz(d.kind)) { if (!d.bizNo) bad("bizNo", "사업자번호를 넣어 주세요"); else if (!/^\d{3}-?\d{2}-?\d{5}$/.test(d.bizNo)) bad("bizNo", "사업자번호 형식이 맞지 않습니다(예: 123-45-67890)"); }
        if (d.kind === "법인") { if (!d.corpNo) bad("corpNo", "법인번호를 넣어 주세요"); else if (!/^\d{6}-?\d{7}$/.test(d.corpNo)) bad("corpNo", "법인번호 13자리를 넣어 주세요"); }
        if (!d.phone) bad("phone", "핸드폰 번호를 넣어 주세요"); else if (!App.PHONE.test(d.phone)) bad("phone", "연락처 형식이 맞지 않습니다(예: 010-1234-5678)");
        if (d.tel && !/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(d.tel)) bad("tel", "전화번호 형식이 맞지 않습니다");
        if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) bad("email", "이메일 형식이 맞지 않습니다");
      } else if (step === 1) {
        if (!d.carrier) bad("carrier", "통신사를 골라 주세요");
        d.lines.forEach((L, i) => { if (!L.product) bad(`l${i}.product`, "상품을 골라 주세요"); if (!L.contract) bad(`l${i}.contract`, "약정을 골라 주세요"); if (!isNum(L.count) || num(L.count) < 1) bad(`l${i}.count`, "회선 수는 1 이상 숫자로 넣어 주세요"); });
      } else {
        const acct = /^[\d-]{6,20}$/; const rrn = /^\d{6}-?\d{7}$/;
        if (d.payAcct && !acct.test(d.payAcct)) bad("payAcct", "계좌번호는 숫자로 넣어 주세요");
        if (d.payRrn && !rrn.test(d.payRrn)) bad("payRrn", "주민번호 13자리를 넣어 주세요");
        if (d.gift) {
          if (!d.giftAmt) bad("giftAmt", "사은품 금액을 넣어 주세요"); else if (!isNum(d.giftAmt)) bad("giftAmt", "숫자만 넣어 주세요");
          if (d.giftExtra && !isNum(d.giftExtra)) bad("giftExtra", "숫자만 넣어 주세요");
          if (d.giftAcct && !acct.test(d.giftAcct)) bad("giftAcct", "계좌번호는 숫자로 넣어 주세요");
          if (d.giftRrn && !rrn.test(d.giftRrn)) bad("giftRrn", "주민번호 13자리를 넣어 주세요");
        }
        if (d.hqGift && d.hqGiftAmt && !isNum(d.hqGiftAmt)) bad("hqGiftAmt", "숫자만 넣어 주세요");
        if (d.mnpOn) { if (!d.mnpFrom) bad("mnpFrom", "이전 통신사를 골라 주세요"); if (!d.mnpNo) bad("mnpNo", "이동할 번호를 넣어 주세요"); else if (!App.PHONE.test(d.mnpNo)) bad("mnpNo", "연락처 형식이 맞지 않습니다(예: 010-1234-5678)"); if (!d.mnpHolder) bad("mnpHolder", "명의자를 넣어 주세요"); }
      }
      return e;
    },
    /** 틀린 칸 표시: 맨 위 알림 띠([data-top]) + 칸 아래 문구. 첫 칸으로 간다. */
    mark(root, errs) {
      $$(".errmsg", root).forEach((x) => x.remove()); $$(".in.err", root).forEach((x) => x.classList.remove("err"));
      const top = $("[data-top]", root); if (top) top.innerHTML = errs.length ? '<div class="note bad" role="alert"><b>빠진 필수 항목 칸이 있습니다.</b> 표시된 칸을 확인해 주세요.</div>' : "";
      let first = null;
      errs.forEach((x) => { const b = $(`[data-box="${x.f}"]`, root); if (!b) return; $$(".in", b).forEach((i) => i.classList.add("err")); const m = document.createElement("span"); m.className = "errmsg"; m.textContent = x.msg; b.appendChild(m); if (!first) first = b; });
      if (first) { first.scrollIntoView({ block: "center" }); const i = $(".in:not([readonly])", first); if (i) i.focus({ preventScroll: true }); }
    },
    /** 입력 묶음 안의 동작(따라 채우기 · 줄 추가 · 주소 검색). repaint 는 화면이 입력 구역을 다시 그리는 함수 */
    handlers(root, d, repaint) {
      const again = () => { F.collect(root, d); repaint(); };
      return {
        re: (t) => {
          F.collect(root, d); const db = App.db;
          if (t.dataset.f === "carrier") d.lines.forEach((L) => Object.assign(L, { product: "", option: "", set: "", setbox: "", addon: "" })); // 통신사가 바뀌면 상품을 다시 고른다
          if (t.dataset.lf === "product") { const L = d.lines[+t.dataset.l]; const p = db.products.find((x) => x.carrier === d.carrier && x.name === L.product); Object.assign(L, p ? { option: p.option, set: p.set, setbox: p.setbox } : { option: "", set: "", setbox: "" }); }
          if (t.dataset.f === "gift") { const g = db.gifts.find((x) => x.name === d.gift); d.giftAmt = g ? String(g.amount) : ""; d.giftPayer = g ? g.payer : ""; if (g && !d.giftDue) d.giftDue = App.addDays(App.today(), 14); }
          if (t.dataset.f === "hqGift") { const g = db.gifts.find((x) => x.name === d.hqGift); d.hqGiftAmt = g ? String(g.amount) : ""; }
          repaint();
        },
        addLine: () => { F.collect(root, d); d.lines.push(newLine()); repaint(); },
        delLine: (t) => { F.collect(root, d); d.lines.splice(+t.dataset.i, 1); repaint(); },
        addr: () => App.addressSearch((a) => { F.collect(root, d); d.zip = a.zip; d.addr = a.addr; repaint(); const x = $('[data-f="addr2"]', root); if (x) x.focus(); }),
        samePay: () => { F.collect(root, d); d.payHolder = d.name; d.payRel = "본인"; if (d.rrn1 && d.rrn2) d.payRrn = d.rrn1 + d.rrn2; repaint(); App.toast("예금주를 고객 정보로 채웠습니다"); },
        sameGift: () => { F.collect(root, d); if (!d.gift) { App.toast("사은품을 먼저 골라 주세요"); return; } d.giftBank = d.payBank; d.giftAcct = d.payAcct; d.giftHolder = d.payHolder; d.giftRrn = d.payRrn; repaint(); App.toast("납부 계좌로 채웠습니다"); },
        sameMnp: () => { F.collect(root, d); d.mnpHolder = d.name; d.mnpNo = d.phone; if (!d.mnpFrom) d.mnpFrom = d.phoneCarrier; repaint(); App.toast("고객 정보로 채웠습니다"); },
        again,
      };
    },
    /** 확인 단계 요약(주민번호 · 계좌는 가려서). 「고치기」는 data-act="step" */
    summary(d, o) {
      o = o || {}; const fix = (n) => h`<span class="sp"><button class="pf-tap" data-act="step" data-s="${n}">고치기</button></span>`;
      const row = (k, v) => (v ? h`<dt>${k}</dt><dd>${v}</dd>` : "");
      const rrn = needRrn(d.kind) ? (d.rrn1 ? d.rrn1 + "-*******" : "") : "";
      return h`<section class="pf-card"><h2>고객${fix(0)}</h2><dl class="pf-kv">${row("고객명", d.name)}${row("고객종류", d.kind)}${row("주민번호", rrn)}${needBiz(d.kind) ? h`${row("대표자", d.ceo)}${row("사업자번호", d.bizNo)}` : ""}${d.kind === "법인" ? row("법인번호", d.corpNo) : ""}${row("핸드폰", [d.phoneCarrier, d.phone].filter(Boolean).join(" "))}${row("전화", d.tel)}${row("이메일", d.email)}${row("주소", [d.zip && `(${d.zip})`, d.addr, d.addr2].filter(Boolean).join(" "))}${row("고객인증", [d.authWay, d.authVal].filter(Boolean).join(" · "))}${row("유치자", d.recruiter)}</dl></section>
        <section class="pf-card"><h2>상품${fix(1)}</h2><dl class="pf-kv">${row("통신사", d.carrier)}${row("지역", d.region)}${d.lines.map((L, i) => row("상품 " + (i + 1), [L.product, L.option && "옵션 " + L.option, L.set, L.setbox && L.setbox !== "없음" && L.setbox, L.contract, L.addon && "부가 " + L.addon, num(L.count) + "회선"].filter(Boolean).join(" · ")))}</dl></section>
        <section class="pf-card"><h2>사은품 · 납부${fix(2)}</h2><dl class="pf-kv">${row("납부 방법", [d.payWay, d.payDiscount && "감면 " + d.payDiscount, d.payBill && "청구서 " + d.payBill].filter(Boolean).join(" · "))}${row("납부 계좌", d.payAcct ? `${d.payBank} ${App.maskAcct(clean(d.payAcct))} (${d.payHolder || "-"}${d.payRel ? " · " + d.payRel : ""})` : "")}
          ${d.gift ? h`${row("사은품", h`${d.gift} <span class="num">${App.won(num(d.giftAmt))}원</span>${num(d.giftExtra) ? h` + 추가 <span class="num">${App.won(num(d.giftExtra))}원</span>` : ""}`)}${row("지급처", d.giftPayer)}${row("지급예정일", d.giftDue)}${row("사은품 계좌", d.giftAcct ? `${d.giftBank} ${App.maskAcct(clean(d.giftAcct))} (${d.giftHolder || "-"})` : "")}` : row("사은품", "없음")}
          ${row("본사 사은품", d.hqGift ? h`${d.hqGift} <span class="num">${App.won(num(d.hqGiftAmt))}원</span>` : "")}${row("번호이동", d.mnpOn ? `${d.mnpFrom} · ${App.maskPhone(d.mnpNo)} · ${d.mnpHolder}` : "없음")}</dl></section>`;
    },
    /** 입력값을 접수 건에 옮긴다(등록 · 재접수 공통). 첫 상품 줄이 접수 건의 상품, 나머지 줄은 moreLines */
    apply(c, d) {
      const db = App.db; const L = d.lines[0]; const ad = db.addons.find((a) => a.carrier === d.carrier && a.name === L.addon);
      Object.assign(c, { name: d.name, ceo: needBiz(d.kind) ? d.ceo : "", kind: d.kind, bizNo: needBiz(d.kind) ? d.bizNo : "", corpNo: d.kind === "법인" ? d.corpNo : "", phone: d.phone, tel: d.tel, email: d.email, phoneCarrier: d.phoneCarrier, zip: d.zip, addr: d.addr, addr2: d.addr2, authWay: d.authWay, authVal: d.authVal, recruiter: d.recruiter,
        carrier: d.carrier, product: L.product, option: L.option, set: L.set, setbox: L.setbox, contract: L.contract, region: d.region, lines: num(L.count) || 1, addon: L.addon, addonAmt: ad ? ad.settle : 0, moreLines: d.lines.slice(1).map((x) => Object.assign({}, x)),
        gift: d.gift, giftAmt: d.gift ? num(d.giftAmt) : 0, giftExtra: d.gift ? num(d.giftExtra) : 0, giftPayer: d.gift ? d.giftPayer : "", giftDue: d.gift ? d.giftDue : "", giftBank: d.gift ? d.giftBank : "", giftAcct: d.gift ? clean(d.giftAcct) : "", giftHolder: d.gift ? d.giftHolder : "", giftRrn: d.gift ? d.giftRrn : "",
        hqGift: d.hqGift, hqGiftAmt: d.hqGift ? num(d.hqGiftAmt) : 0,
        pay: { way: d.payWay, discount: d.payDiscount, bill: d.payBill, bank: d.payBank, acct: clean(d.payAcct), holder: d.payHolder, rel: d.payRel, rrn: d.payRrn },
        mnp: d.mnpOn ? { from: d.mnpFrom, no: d.mnpNo, holder: d.mnpHolder } : null });
      if (needRrn(d.kind)) { if (d.rrn2) c.rrn = d.rrn1 + "-" + d.rrn2; else if (c.rrn) c.rrn = d.rrn1 + c.rrn.slice(6); } // 칸이 안 보이는 고객종류면 기존 값을 건드리지 않는다(재접수로 지워지지 않게)
      return c;
    },
    /** 새 접수 건을 만든다: 협력점 경로, 세션의 협력점 · 하부점, 접수 · 청약대기, 접수일시 = 지금 */
    create(d) {
      const s = App.session;
      const c = F.apply({ id: App.uid("C"), rrn: "", joinNo: "", via: "협력점", partnerId: s.partnerId, subId: s.subId || "", manager: "", consultant: "", upperId: "",
        receivedAt: App.now(), installDue: "", openedAt: "", openState: "청약대기", receiptState: "접수", auth: "인증대기", giftPaid: false,
        contractAmt: 0, setboxAmt: 0, dedDocs: 0, dedDocsWhy: "", dedEtc: 0, dedEtcWhy: "", settleKind: "일반", settleId: "", tag: "", lastConsult: "", request: d.request || "", reply: "", bounce: "" }, d);
      App.db.customers.unshift(c);
      // 상품 줄마다 접수 건을 하나씩 만든다(정산은 상품 단위 한 줄 · R-113, 본사 등록 B-02 와 같은 방식). 사은품은 첫 줄에만 둔다.
      const more = c.moreLines || [];
      more.forEach((l, i) => { const ad2 = App.db.addons.find((a) => a.carrier === c.carrier && a.name === l.addon); const n = Object.assign({}, c, { id: App.uid("C"), groupId: c.id, product: l.product, option: l.option, set: l.set, setbox: l.setbox, contract: l.contract, addon: l.addon || "", addonAmt: ad2 ? ad2.settle : 0, lines: Number(l.count) || 1, moreLines: [], gift: "", giftAmt: 0, giftExtra: 0, giftPayer: "", giftPaid: false, hqGift: "", hqGiftAmt: 0, request: "" }); App.db.customers.splice(1 + i, 0, n); App.addHistory(n.id, "접수", `같은 접수의 상품 ${i + 2}번째 줄 (${n.product} · ${n.contract})`); });
      if (more.length) { c.groupId = c.id; c.moreLines = []; }
      App.addHistory(c.id, "접수", `${s.org}에서 접수`);
      if (c.request) App.addHistory(c.id, "요청", c.request);
      App.log("접수", `${c.name} 협력점 접수`, "", "접수");
      return c;
    },
    /** 내 범위(협력점 = 자기와 하부점, 하부점 = 자기)의 협력점 접수 건만 돌려준다. 아니면 null */
    own(id) { return App.mine(App.db.customers).find((c) => c.id === id && c.via !== "본사") || null; },
    /** 협력점에 보여 줄 이력(상담 제외 · D-4), 오래된 순 */
    hist(cid) { return App.historyOf(cid, true).slice().reverse(); }, // db.history 는 새 기록이 앞에 쌓인다 → 뒤집으면 쌓인 순서(방금 남긴 요청이 맨 아래)
    /** 접수 건 요약 카드 */
    brief(c) {
      return h`<div class="pcard ${c.receiptState === "반송" ? "alert" : ""}"><div class="r1"><b>${c.name}</b>${App.chip(c.receiptState)}<span class="sp">${App.chip(c.openState)}</span></div>
        <dl class="pf-kv" style="margin:8px 0 0"><dt>접수일시</dt><dd class="num">${App.dt(c.receivedAt)}</dd><dt>상품</dt><dd>${c.carrier} · ${c.product} · ${c.set} · ${c.contract}${(c.moreLines || []).map((l) => h`<br>${l.product} · ${l.set} · ${l.contract}`)}</dd><dt>협력점</dt><dd>${App.partnerName(c.partnerId)}${c.subId ? " · " + App.subName(c.subId) : ""}</dd><dt>핸드폰</dt><dd class="num">${App.maskPhone(c.phone)}</dd>${c.installDue ? h`<dt>설치예정일</dt><dd class="num">${c.installDue}</dd>` : ""}${c.openedAt ? h`<dt>개통일</dt><dd class="num">${c.openedAt}</dd>` : ""}</dl></div>`;
    },
  });

  const st = { step: 0, d: null, busy: false };
  App.screen("P-03", {
    title: "고객 등록", device: "phone", roles: ["partner", "sub"], sc: ["SC-43", "SC-8"],
    render(el) {
      if (!st.d) { st.d = F.blank(); st.step = 0; } // 다른 탭에 다녀와도 넣던 값은 남는다
      st.busy = false; const d = st.d;
      el.innerHTML = h`${F.css}<div class="ph-h"><h1>고객 등록</h1><span class="sp"><button class="pf-tap" data-act="reset">처음부터 다시</button></span></div>
        <div data-prog></div><div data-top></div><div data-form></div><div class="pf-gap"></div><div class="psticky" data-foot></div>`;
      function paint() {
        const n = st.step;
        $("[data-prog]", el).innerHTML = h`<div class="pprog">${F.STEPS.map((_, i) => h`<i class="${i <= n ? "on" : ""}"></i>`)}</div><p class="hint" style="margin:-6px 0 10px"><b style="color:var(--ink)">${n + 1} / 4 · ${F.STEPS[n]}</b> · ${n < 3 ? h`<span class="req" style="margin:0">*</span> 표시는 필수` : "내용을 확인하고 접수해 주세요"}</p>`;
        $("[data-top]", el).innerHTML = "";
        $("[data-form]", el).innerHTML = n < 3 ? F.html(d, n) : h`${F.summary(d)}<section class="pf-card"><h2>본사에 남길 요청</h2><div class="pfield" data-box="request"><textarea class="in" rows="3" maxlength="500" data-f="request" placeholder="설치 희망일 등 본사에 전할 말 (선택, 500자까지)" aria-label="본사에 남길 요청">${d.request}</textarea></div></section><div class="note gray">접수하면 지금 시각이 접수일시로 기록되고, 본사 접수함과 내 접수에 바로 보입니다.</div>`;
        $("[data-foot]", el).innerHTML = h`${n > 0 ? h`<button class="btn lg" data-act="prev">이전</button>` : ""}${n < 3 ? h`<button class="btn p lg" style="flex:1" data-act="next">다음 · ${F.STEPS[n + 1]}</button>` : h`<button class="btn p lg" style="flex:1" data-act="submit">접수하기</button>`}`;
      }
      const move = (n) => { st.step = n; paint(); window.scrollTo(0, 0); };
      paint();
      App.on(el, Object.assign(F.handlers(el, d, paint), {
        next: () => { F.collect(el, d); const errs = F.check(d, st.step); if (errs.length) { F.mark(el, errs); return; } move(st.step + 1); },
        prev: () => { F.collect(el, d); move(st.step - 1); },
        step: (t) => { F.collect(el, d); move(+t.dataset.s); },
        reset: async () => { if (!(await App.confirm("넣던 내용을 지우고 처음부터 다시 쓰시겠습니까?", { danger: true, ok: "지우기" }))) return; st.d = null; App.redraw(); },
        submit: () => {
          if (st.busy) return; st.busy = true; // 여러 번 눌러도 접수 건은 하나만(F-13)
          F.collect(el, d);
          for (let n = 0; n < 3; n++) { const errs = F.check(d, n); if (errs.length) { st.busy = false; move(n); F.mark(el, errs); return; } }
          const c = F.create(d); st.d = null; st.step = 0;
          App.toast(`${c.name} 고객을 접수했습니다`); App.go("P-01");
        },
      }));
    },
  });
})();
</script>
<script>/* P-04 재접수 (옛 SC-25). 반송 사유와 지난 이력을 보고, 등록과 같은 칸(App.phoneForm · 값 채워짐)을 보완해 다시 접수한다.
   재접수하면 처리 상태 = 재접수, 접수일시 = 지금(이전 접수일시는 이력에 남는다), 반송 사유는 비운다 → 접수 상세(P-02). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  App.screen("P-04", {
    title: "재접수", device: "phone", roles: ["partner", "sub"], parent: "P-01", back: { code: "P-01", label: "돌아가기" }, sc: ["SC-25"],
    render(el, params) {
      const F = App.phoneForm;
      if (!params.id && window.__ONLY) { const x = App.mine(App.db.customers).find((k) => k.via !== "본사" && k.receiptState === "반송"); if (x) params.id = x.id; } // 화면별 파일은 넘겨받은 건이 없으니 예시 한 건을 연다
      const c = F.own(params.id);
      if (!c) { el.innerHTML = h`<div class="card empty"><b>접수 건을 찾을 수 없습니다</b>내 범위의 접수 건만 재접수할 수 있습니다.<br><button class="btn p lg" data-go="P-01">내 접수로</button></div>`; return; }
      if (c.receiptState !== "반송") { el.innerHTML = h`<div class="card empty"><b>반송된 건만 재접수할 수 있습니다</b>${c.name} 고객은 지금 「${c.receiptState}」 상태입니다.<br><button class="btn p lg" data-go="P-02" data-params="id=${c.id}">접수 상세 보기</button></div>`; return; }
      const d = F.fromCustomer(c); const rows = F.hist(c.id); let busy = false;
      el.innerHTML = h`${F.css}<div class="ph-h"><h1>재접수</h1></div>
        <div class="pprog"><i class="on"></i><i class="on"></i><i></i></div><p class="hint" style="margin:-6px 0 10px"><b style="color:var(--ink)">반송됨 › 보완 입력 중</b> › 재접수 완료</p>
        ${F.brief(c)}
        <div class="note bad" role="alert"><b>반송 사유</b><p style="margin-top:2px">${c.bounce}</p></div>
        <div class="note warn">재접수하면 접수일시가 재접수한 시각으로 바뀝니다. 수수료는 새 접수일시 기준으로 적용됩니다.</div>
        <details class="card" style="padding:0 14px;margin-bottom:12px"><summary style="min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer">지난 요청 · 회신 이력 ${rows.length}건 (오래된 순)</summary>${App.timeline(rows)}</details>
        <div class="sec-h"><h2>보완 입력</h2><small><span class="req">*</span> 표시는 필수</small></div>
        <div data-top></div><div data-form></div><div class="pf-gap"></div>
        <div class="psticky"><button class="btn lg" data-act="cancel">취소</button><button class="btn p lg" style="flex:1" data-act="save">재접수</button></div>`;
      const paint = () => { $("[data-form]", el).innerHTML = h`${F.html(d, 0, { re: true })}${F.html(d, 1, { re: true })}${F.html(d, 2, { re: true })}`; };
      paint();
      App.on(el, Object.assign(F.handlers(el, d, paint), {
        cancel: () => App.back("P-01"),
        save: async () => {
          if (busy) return; F.collect(el, d);
          const errs = [0, 1, 2].flatMap((n) => F.check(d, n, { re: true }));
          if (errs.length) { F.mark(el, errs); return; }
          F.mark(el, []);
          if (!(await App.confirm(`${d.name} 고객을 재접수하시겠습니까?`, { detail: "접수일시가 지금 시각으로 바뀌고, 이전 접수일시는 이력에 남습니다.", ok: "재접수" }))) return;
          if (busy) return; busy = true; // 두 번 눌러도 한 번만
          const before = c.receivedAt;
          F.apply(c, d); c.receiptState = "재접수"; c.receivedAt = App.now(); c.bounce = "";
          App.addHistory(c.id, "재접수", `보완해서 다시 접수 (이전 접수일시 ${App.dt(before)})`);
          App.log("접수", `${c.name} 재접수`, `반송 · 접수일시 ${App.dt(before)}`, `재접수 · 접수일시 ${c.receivedAt}`);
          App.toast("재접수했습니다");
          if (params.from === "P-02") App.back("P-02"); else App.go("P-02", { id: c.id }, { replace: true });
        },
      }));
    },
  });
})();
</script>
<script>/* P-05 회신 (옛 SC-60). 본사가 회신 · 반송한 건만 모아 본다. 카드를 누르면 접수 상세(P-02), 반송 카드에는 「재접수」(P-04).
   범위: 협력점 = 자기와 하부점 건, 하부점 = 자기 건. 본사 상담 내용은 나오지 않는다(D-4). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { kind: "" };
  App.screen("P-05", {
    title: "회신", device: "phone", roles: ["partner", "sub"], sc: ["SC-60"],
    render(el) {
      const F = App.phoneForm; const s = App.session;
      /* 그 건의 마지막 회신 · 반송 시각(이력에서 찾는다) */
      const lastAt = (c, kind) => { const x = App.historyOf(c.id, true).find((r) => r.kind === kind); return x ? x.at : c.receivedAt; };
      const all = () => App.mine(App.db.customers).filter((c) => c.via !== "본사" && (c.receiptState === "회신 완료" || c.receiptState === "반송"))
        .map((c) => ({ c, at: lastAt(c, c.receiptState === "반송" ? "반송" : "회신") })).sort((a, b) => (a.at < b.at ? 1 : -1));
      el.innerHTML = h`${F.css}<div class="ph-h"><h1>회신</h1></div>
        <div class="pf-pills"><div data-pills></div></div><p class="hint" data-cnt style="margin-bottom:8px"></p><div data-list></div>`;
      function paint() {
        const rows = all(); const list = st.kind ? rows.filter((r) => r.c.receiptState === st.kind) : rows;
        App.pills($("[data-pills]", el), [["전체", rows.length, ""], ["회신 완료", rows.filter((r) => r.c.receiptState === "회신 완료").length, "회신 완료"], ["반송", rows.filter((r) => r.c.receiptState === "반송").length, "반송"]], st.kind, (v) => { st.kind = v; paint(); });
        $("[data-cnt]", el).textContent = `${list.length}건 · 본사가 회신하거나 반송한 건만 보입니다 · 최근 순`;
        $("[data-list]", el).innerHTML = list.length ? h`${list.map(({ c, at }) => { const b = c.receiptState === "반송"; return h`<div class="pcard ${b ? "alert" : ""}" role="button" tabindex="0" data-go="P-02" data-params="id=${c.id}" style="cursor:pointer">
            <div class="r1"><b>${c.name}</b>${App.chip(c.receiptState)}<span class="sp meta muted num">${App.dt(at)}</span></div>
            <div class="meta">${c.carrier} · ${c.product}${s.role === "partner" && c.subId ? " · " + App.subName(c.subId) : ""}</div>
            <div class="ln" style="white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;${b ? "color:var(--red)" : ""}">${b ? "반송 사유: " + c.bounce : "본사 회신: " + c.reply}</div>
            ${b ? h`<button class="btn danger lg block" style="margin-top:10px" data-go="P-04" data-params="id=${c.id}">재접수</button>` : ""}</div>`; })}`
          : h`<div class="card empty"><b>${rows.length ? "해당하는 건이 없습니다" : "아직 받은 회신이 없습니다"}</b>${rows.length ? "다른 구분을 골라 보세요." : "본사가 회신하거나 반송하면 여기에 모입니다."}<br><button class="btn lg" data-go="P-01">내 접수 보기</button></div>`;
      }
      paint();
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches(".pcard[data-go]")) e.target.click(); });
    },
  });
})();
</script>
<script>/* P-06 수수료표 (옛 SC-22). 협력점만(하부점은 권한 없음 · R-25). 지금 적용 중인 표에서 협력점 수수료만 보인다.
   상부수수료는 화면 · 엑셀 어디에도 내보내지 않는다(D-3). 금액은 수수료표에 저장된 값 그대로. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { carrier: "", product: "", set: "" };
  App.screen("P-06", {
    title: "수수료표", device: "phone", roles: ["partner"], sc: ["SC-22"],
    render(el) {
      const F = App.phoneForm; const db = App.db;
      /* 지금 적용 중인 줄 + 상품의 셋트 · 셋탑(사용중지 상품은 접수할 수 없으니 뺀다). 협력점 수수료 칸만 꺼낸다. */
      const rows = App.currentFees().map((f) => { const p = db.products.find((x) => x.carrier === f.carrier && x.name === f.product && x.option === f.option); return p && p.state === "사용" ? { carrier: f.carrier, product: f.product, option: f.option, contract: f.contract, from: f.from, fee: f.partner, set: p.set, setbox: p.setbox } : null; }).filter(Boolean)
        .sort((a, b) => (a.carrier + a.product + a.contract).localeCompare(b.carrier + b.product + b.contract, "ko"));
      const latest = rows.reduce((m, r) => (r.from > m ? r.from : m), "");
      el.innerHTML = h`${F.css}<div class="ph-h"><h1>수수료표</h1><span class="sp"><button class="btn lg" data-act="xls">엑셀저장</button></span></div>
        <div class="note">협력점 수수료만 보입니다. 수수료는 확정된 접수일시 기준으로 적용됩니다.</div>
        <div class="card pad" style="margin-bottom:10px"><dl class="pf-kv" style="margin:0"><dt>협력점</dt><dd>${App.partnerName(App.session.partnerId)}</dd><dt>적용 기준</dt><dd>지금 적용 중인 표 <span class="muted num">(가장 최근 변경 ${App.dt(latest)})</span></dd></dl></div>
        <div class="card pad" style="margin-bottom:10px;padding-bottom:4px">
          <div class="pfield"><label class="lbl">통신사</label><select class="in" data-on="f" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, st.carrier, "전체")}</select></div>
          <div class="pfield"><label class="lbl">상품</label><select class="in" data-on="f" data-k="product" aria-label="상품" data-prod></select></div>
          <div class="pfield"><label class="lbl">셋트</label><select class="in" data-on="f" data-k="set" aria-label="셋트">${App.opts(["단독", "DPS", "TPS"], st.set, "전체")}</select></div>
          ${st.carrier || st.product || st.set ? h`<div class="pfield"><button class="btn lg block" data-act="clear">조건 지우기</button></div>` : ""}</div>
        <p class="hint" data-cnt style="margin-bottom:8px"></p><div data-list></div>`;
      const filtered = () => rows.filter((r) => (!st.carrier || r.carrier === st.carrier) && (!st.product || r.product === st.product) && (!st.set || r.set === st.set));
      function paint() {
        const names = [...new Set(rows.filter((r) => !st.carrier || r.carrier === st.carrier).map((r) => r.product))];
        if (st.product && !names.includes(st.product)) st.product = "";
        $("[data-prod]", el).innerHTML = App.opts(names, st.product, "전체");
        const list = filtered();
        $("[data-cnt]", el).textContent = `검색 결과 ${list.length}건 · 금액 단위: 원`;
        $("[data-list]", el).innerHTML = list.length ? h`${list.map((r) => h`<div class="pcard"><div class="r1"><b style="min-width:0">${r.product}</b><span class="sp num" style="font-size:17px;font-weight:800;white-space:nowrap">${App.won(r.fee)}</span></div>
            <div class="meta">${r.carrier} · 옵션 ${r.option} · ${r.set} · 셋탑 ${r.setbox} · 약정 ${r.contract}</div>
            <div class="meta muted num">적용 시작 ${App.dt(r.from)}</div></div>`)}`
          : h`<div class="card empty"><b>${rows.length ? "조건에 맞는 수수료가 없습니다" : "등록된 수수료표가 없습니다"}</b>${rows.length ? "조건을 바꿔 보세요." : "본사가 수수료표를 등록하면 여기에 보입니다."}</div>`;
      }
      paint();
      App.on(el, {
        f: (t) => { const had = !!(st.carrier || st.product || st.set); st[t.dataset.k] = t.value; if (had !== !!(st.carrier || st.product || st.set)) App.redraw(); else paint(); },
        clear: () => { st.carrier = st.product = st.set = ""; App.redraw(); },
        xls: () => App.fake(`엑셀저장: 화면 조건과 같은 ${filtered().length}건 · 협력점 수수료만`),
      });
    },
  });
})();
</script>
<script>/* P-07 정산 명세서 (옛 SC-27 폰 변형). 협력점만(하부점은 권한 없음 · R-25). 자기 협력점의 「확정」된 주만 보인다.
   금액은 확정 때 저장된 값(items[].fee · feeSum · clawSum · carried · pay · newRecv)을 그대로 쓴다 — 화면에서 다시 계산하지 않는다.
   수수료 = 협력점 수수료. 상부수수료는 나오지 않는다(D-3). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { week: "", carrier: "" };
  App.screen("P-07", {
    title: "정산 명세서", device: "phone", roles: ["partner"], parent: "P-09", back: { code: "P-09", label: "더보기" }, sc: ["SC-27"],
    render(el, params) {
      const F = App.phoneForm; const db = App.db; const pid = App.session.partnerId;
      const list = db.settlements.filter((s) => s.partnerId === pid && s.state === "확정" && s.sent).sort((a, b) => (a.week < b.week ? 1 : -1));
      if (params.week) { st.week = params.week; params.week = ""; }
      if (!list.some((s) => s.week === st.week)) st.week = list.length ? list[0].week : "";
      const head = h`${F.css}<div class="ph-h"><h1>정산 명세서</h1></div><div class="note gray">협력점 계정은 자기 협력점 명세서만 볼 수 있습니다. 확정된 주만 보입니다.</div>`;
      if (!list.length) { el.innerHTML = h`${head}<div class="card empty"><b>확정된 명세서가 없습니다</b>본사가 주간 정산을 확정하면 여기에 보입니다.</div>`; return; }
      const s = list.find((x) => x.week === st.week);
      const items = s.items.map((i) => ({ i, c: App.cust(i.cid) })).filter((x) => !st.carrier || (x.c && x.c.carrier === st.carrier));
      const claws = db.clawbacks.filter((k) => (s.clawIds || []).includes(k.id));
      const line = (l, v, o) => h`<div class="p07-ln ${o && o.big ? "big" : ""}"><span>${l}</span><b class="num">${v}</b></div>`;
      const minus = (n) => (n ? h`<span class="neg">-${App.won(n)}</span>` : "0");
      el.innerHTML = h`${head}<style>
          .p07-ln{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
          .p07-ln:last-child{border-bottom:0}
          .p07-ln span{color:var(--ink2);min-width:0}
          .p07-ln b{margin-left:auto;font-weight:700;white-space:nowrap}
          .p07-ln.big{padding:12px 0 6px;border-top:2px solid var(--ink);border-bottom:0;margin-top:4px}
          .p07-ln.big span{font-weight:800;color:var(--ink)} .p07-ln.big b{font-size:22px;font-weight:800;letter-spacing:-.5px}
          .p07-it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line2)}
          .p07-it:last-child{border-bottom:0}
          .p07-it b{font-size:14px} .p07-it small{font-size:12.5px;color:var(--muted);grid-column:1}
          .p07-it .fee{grid-row:1 / span 2;grid-column:2;align-self:center;font-weight:700;white-space:nowrap}
        </style>
        <div class="card pad" style="margin-bottom:10px;padding-bottom:4px">
          <div class="pfield"><label class="lbl">정산 주차</label><select class="in" data-on="week" aria-label="정산 주차">${App.opts(list.map((x) => [x.week, `${App.weekLabel(x.week)} (${x.week.slice(0, 4)}년)`]), st.week)}</select></div>
          <div class="pfield"><label class="lbl">통신사</label><select class="in" data-on="carrier" aria-label="통신사">${App.opts(db.carriers, st.carrier, "전체")}</select></div></div>
        <div class="card pad" style="margin-bottom:10px"><dl class="pf-kv" style="margin:0"><dt>협력점</dt><dd>${App.partnerName(pid)}</dd><dt>정산 기간</dt><dd class="num">${s.week} ~ ${App.addDays(s.week, 6)} <span class="muted">(개통일 기준)</span></dd><dt>정산 확정일</dt><dd class="num">${App.dt(s.confirmedAt)}</dd><dt>명세서 발송</dt><dd class="num">${s.sent ? App.dt(s.sent) : "발송 전"}</dd><dt>금액 단위</dt><dd>원</dd></dl></div>
        <div class="sec-h"><h2>개통 건별 수수료</h2><small>${st.carrier ? `${st.carrier} ${items.length}건 / 전체 ${s.items.length}건` : `${s.items.length}건`}</small></div>
        <div class="card" style="padding:2px 14px;margin-bottom:10px">${items.length ? items.map(({ i, c }) => h`<div class="p07-it"><b>${i.name}</b><small>${c ? c.carrier + " · " : ""}${i.product}${c && c.openedAt ? " · 개통 " + c.openedAt : ""}</small><span class="fee num">${i.fee == null ? h`<span class="neg">수수료 미등록</span>` : App.won(i.fee)}</span></div>`) : h`<div class="empty" style="padding:24px 0"><b>${s.items.length ? "이 통신사의 개통 건이 없습니다" : "이 주에 개통된 건이 없습니다"}</b>${s.items.length ? "통신사를 「전체」로 바꿔 보세요." : "환수 · 미수만 정리된 주입니다."}</div>`}</div>
        ${claws.length ? h`<div class="sec-h"><h2>환수 내역</h2><small>${claws.length}건</small></div><div class="card" style="padding:2px 14px;margin-bottom:10px">${claws.map((k) => { const c = App.cust(k.cid); return h`<div class="p07-it"><b>${c ? c.name : "-"}</b><small>${k.why}</small><span class="fee num neg">-${App.won(k.amount)}</span></div>`; })}</div>` : ""}
        <div class="sec-h"><h2>지급액</h2>${st.carrier ? h`<small>합계는 통신사 조건과 상관없이 주 전체 기준</small>` : ""}</div>
        <div class="card" style="padding:4px 14px 10px;margin-bottom:10px">
          ${line("수수료 합계", App.won(s.feeSum))}${line("환수 차감", minus(s.clawSum))}${line("미수 이월 차감", minus(s.carried))}${line("최종 지급액", App.won(s.pay), { big: 1 })}</div>
        ${s.unpriced ? h`<div class="note bad">수수료 미등록 ${s.unpriced}건은 합계에 들어 있지 않습니다. 본사에 문의해 주세요.</div>` : ""}
        ${s.newRecv ? h`<div class="note warn">수수료보다 차감액이 커서 지급액은 0원이고, <b class="num">${App.won(s.newRecv)}원</b>이 미수로 남아 다음 정산에서 차감됩니다.</div>` : ""}
        <button class="btn lg block" data-act="down">명세서 내려받기</button>
        <button class="btn ghost lg block" style="margin-top:6px" data-go="P-08" data-params="tab=q">금액이 다르면 고객센터에 문의하기</button>`;
      App.on(el, {
        week: (t) => { st.week = t.value; App.redraw(); },
        carrier: (t) => { st.carrier = t.value; App.redraw(); },
        down: () => App.fake(`명세서 내려받기: ${App.weekLabel(s.week)} · 화면 합계와 같은 파일`),
      });
    },
  });
})();
</script>
<script>/* P-08 고객센터 (옛 SC-11 폰 변형). 공지사항은 협력점 · 하부점 모두 읽기만. 문의는 협력점만 쓰고, 자기 협력점 문의와 본사 답변만 본다(F-125 · F-126).
   협력점은 「더보기」에서, 하부점은 맨 아래 탭에서 들어온다(D-2) — 그래서 켜질 탭과 뒤로 가기를 역할에 따라 달리 준다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { tab: "notice", open: "" };
  App.screen("P-08", {
    title: "고객센터", device: "phone", roles: ["partner", "sub"], sc: ["SC-11"],
    render(el, params) {
      const F = App.phoneForm; const s = App.session; const db = App.db; const canAsk = s.role === "partner";
      if (params.tab) { st.tab = params.tab === "q" ? "q" : "notice"; params.tab = ""; }
      if (!canAsk) st.tab = "notice";
      const notices = db.notices.slice().sort((a, b) => (a.at < b.at ? 1 : -1));
      const mineQ = () => db.inquiries.filter((q) => q.partnerId === s.partnerId).sort((a, b) => (a.at < b.at ? 1 : -1));
      const qs = mineQ(); const wait = qs.filter((q) => q.state === "답변 대기").length;
      const item = (id, top, meta, body) => h`<div class="pcard" style="padding:0"><button class="p08-h" data-act="open" data-id="${id}" aria-expanded="${st.open === id}">${top}<span class="meta muted num">${meta}</span></button>${st.open === id ? h`<div class="p08-b">${body}</div>` : ""}</div>`;
      el.innerHTML = h`${F.css}<style>
          .p08-h{display:block;width:100%;text-align:left;padding:12px 14px;min-height:44px}
          .p08-h b{display:block;font-size:15px;font-weight:800;margin-bottom:2px}
          .p08-h .r{display:flex;align-items:center;gap:8px;margin-bottom:2px} .p08-h .r b{margin:0;min-width:0}
          .p08-h .r .chip{margin-left:auto;flex:none}
          .p08-b{padding:12px 14px;border-top:1px dashed var(--line);font-size:14px;white-space:pre-wrap;word-break:break-word}
          .p08-a{margin-top:10px;padding:10px 12px;border-radius:var(--r1);background:var(--green-bg);color:#145C38}
        </style><div class="ph-h"><h1>고객센터</h1></div>
        ${canAsk ? h`<div class="pf-tabs"><div data-tabs></div></div>` : h`<div class="note gray">공지사항을 볼 수 있습니다. 본사 문의는 소속 협력점을 통해 남겨 주세요.</div>`}
        ${st.tab === "notice"
          ? h`<p class="hint" style="margin-bottom:8px">공지 ${notices.length}건 · 최근 순</p>${notices.length ? notices.map((n) => item(n.id, h`<b>${n.title}</b>`, `${App.dt(n.at)} · ${n.by}`, n.body)) : h`<div class="card empty"><b>공지사항이 없습니다</b>본사가 공지를 올리면 여기에 보입니다.</div>`}`
          : h`<p class="hint" style="margin-bottom:8px">내 협력점 문의 ${qs.length}건 · 답변 대기 ${wait}건</p>${qs.length ? qs.map((q) => item(q.id, h`<span class="r"><b>${q.title}</b>${App.chip(q.state)}</span>`, `${App.dt(q.at)} · ${q.by}`, h`${q.body}${q.answer ? h`<div class="p08-a"><b>본사 답변</b> <span class="num" style="font-size:12px">${App.dt(q.answerAt)}</span><br>${q.answer}</div>` : h`<p class="hint" style="margin-top:8px">본사가 답변하면 이 자리에 보입니다. 별도 알림은 보내지 않습니다.</p>`}`)) : h`<div class="card empty"><b>남긴 문의가 없습니다</b>아래 「문의 쓰기」로 본사에 물어볼 수 있습니다.</div>`}
            <div class="pf-gap"></div><div class="psticky"><button class="btn p lg block" data-act="write">문의 쓰기</button></div>`}`;
      if (canAsk) App.tabs($("[data-tabs]", el), [["notice", "공지사항"], ["q", "문의", wait]], st.tab, (k) => { st.tab = k; st.open = ""; App.redraw(); });
      App.on(el, {
        open: (t) => { st.open = st.open === t.dataset.id ? "" : t.dataset.id; const y = window.scrollY; App.redraw(); window.scrollTo(0, y); },
        write: () => App.modal({
          title: "문의 쓰기", sub: "본사 고객센터로 갑니다", sheet: true,
          body: h`<div class="pfield" data-box="title"><label class="lbl">제목<span class="req">*</span></label><input class="in" data-title maxlength="60" placeholder="예: 명세서 금액 문의" aria-label="제목"></div>
            <div class="pfield" data-box="body" style="margin-bottom:4px"><label class="lbl">내용<span class="req">*</span></label><textarea class="in" rows="5" maxlength="1000" data-body placeholder="고객명 · 접수일 등 확인에 필요한 내용을 함께 적어 주세요" aria-label="내용"></textarea></div>
            <p class="hint">고객 주민번호 · 계좌번호는 적지 마세요.</p>`,
          actions: [{ label: "취소" }, { label: "문의 남기기", kind: "p", onClick: (close, root) => {
            root.querySelectorAll(".errmsg").forEach((x) => x.remove()); let ok = true;
            const need = (sel, box, msg) => { const e = $(sel, root); const v = e.value.trim(); e.classList.toggle("err", !v); if (!v) { ok = false; const m = document.createElement("span"); m.className = "errmsg"; m.textContent = msg; $(`[data-box="${box}"]`, root).appendChild(m); } return v; };
            const title = need("[data-title]", "title", "제목을 넣어 주세요"); const body = need("[data-body]", "body", "내용을 넣어 주세요");
            if (!ok) return;
            const q = { id: App.uid("Q"), partnerId: s.partnerId, title, body, at: App.now(), by: s.name, answer: "", state: "답변 대기" };
            db.inquiries.unshift(q); st.tab = "q"; st.open = q.id;
            close(); App.toast("문의를 남겼습니다"); App.redraw();
          } }],
        }),
      });
    },
  });
  /* 협력점은 더보기 안의 화면(탭 = 더보기, 머리에 ‹ 더보기), 하부점은 탭 화면. core.js 는 parent · back 을 그릴 때마다 읽으므로 역할에 따라 돌려준다. */
  const def = App.screens["P-08"]; const isPartner = () => !!App.session && App.session.role === "partner";
  Object.defineProperty(def, "parent", { get: () => (isPartner() ? "P-09" : undefined), enumerable: true, configurable: true });
  Object.defineProperty(def, "back", { get: () => (isPartner() ? { code: "P-09", label: "더보기" } : undefined), enumerable: true, configurable: true });
})();
</script>
<script>/* P-09 더보기 (옛 SC-19 폰 변형 · SC-56 · SC-57 들머리). 맨 아래 탭에 다 못 올린 메뉴를 모은다(D-2).
   협력점 = 정산 명세서 · 고객센터 · 비밀번호변경 · 이용 안내 · 개인정보 처리 안내 · 로그아웃. 하부점 = 정산 명세서 없음(R-25).
   비밀번호변경은 아래에서 올라오는 창: 현재 · 새(8자 이상 영문 · 숫자) · 확인. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$; const $$ = App.$$;
  function changePassword() {
    App.modal({
      title: "비밀번호변경", sheet: true,
      body: h`<div class="note gray">저장하면 다음 로그인부터 새 비밀번호로만 들어갈 수 있습니다.</div>
        <div class="pfield" data-box="cur"><label class="lbl">현재 비밀번호<span class="req">*</span></label><input class="in" type="password" data-pw="cur" autocomplete="off" maxlength="40" aria-label="현재 비밀번호"></div>
        <div class="pfield" data-box="next"><label class="lbl">새 비밀번호<span class="req">*</span></label><input class="in" type="password" data-pw="next" autocomplete="off" maxlength="40" aria-label="새 비밀번호"><span class="hint">8자 이상, 영문과 숫자를 함께 넣어 주세요.</span></div>
        <div class="pfield" data-box="again" style="margin-bottom:0"><label class="lbl">새 비밀번호 확인<span class="req">*</span></label><input class="in" type="password" data-pw="again" autocomplete="off" maxlength="40" aria-label="새 비밀번호 확인"></div>`,
      actions: [{ label: "취소" }, { label: "저장", kind: "p", onClick: (close, root) => {
        $$(".errmsg", root).forEach((x) => x.remove()); $$(".in.err", root).forEach((x) => x.classList.remove("err"));
        const v = {}; $$("[data-pw]", root).forEach((e) => (v[e.dataset.pw] = e.value)); let first = null;
        const bad = (k, msg) => { const b = $(`[data-box="${k}"]`, root); $(".in", b).classList.add("err"); const m = document.createElement("span"); m.className = "errmsg"; m.textContent = msg; b.appendChild(m); if (!first) first = $(".in", b); };
        if (!v.cur) bad("cur", "현재 비밀번호를 넣어 주세요");
        if (!v.next) bad("next", "새 비밀번호를 넣어 주세요");
        else if (v.next.length < 8 || !/[A-Za-z]/.test(v.next) || !/\d/.test(v.next)) bad("next", "8자 이상, 영문과 숫자를 함께 넣어 주세요");
        else if (v.next === v.cur) bad("next", "현재 비밀번호와 다른 비밀번호를 넣어 주세요");
        if (!v.again) bad("again", "새 비밀번호를 한 번 더 넣어 주세요"); else if (v.again !== v.next) bad("again", "새 비밀번호와 같지 않습니다");
        if (first) { first.focus(); return; }
        App.log("계정", `${App.session.name} 비밀번호 변경`, "", "변경함");
        close(); App.toast("비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 씁니다");
      } }],
    });
  }
  App.screen("P-09", {
    title: "더보기", device: "phone", roles: ["partner", "sub"], sc: ["SC-19", "SC-56", "SC-57"],
    render(el) {
      const F = App.phoneForm; const s = App.session; const partner = s.role === "partner";
      const waitQ = partner ? App.db.inquiries.filter((q) => q.partnerId === s.partnerId && q.state === "답변 대기").length : 0;
      const stmt = partner ? App.db.settlements.filter((x) => x.partnerId === s.partnerId && x.state === "확정").sort((a, b) => (a.week < b.week ? 1 : -1))[0] : null;
      const row = (label, sub, attr) => h`<a class="p09-r" role="button" tabindex="0" ${App.raw(attr)}><span><b>${label}</b>${sub ? h`<small>${sub}</small>` : ""}</span><i aria-hidden="true">›</i></a>`;
      el.innerHTML = h`${F.css}<style>
          .p09-me{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:12px}
          .p09-me i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:17px}
          .p09-me b{display:block;font-size:16px;font-weight:800} .p09-me small{color:var(--muted);font-size:12.5px}
          .p09-g{margin-bottom:12px;overflow:hidden}
          .p09-r{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--line2)}
          .p09-r:last-child{border-bottom:0}
          .p09-r:active{background:var(--sunk)}
          .p09-r span{min-width:0} .p09-r b{display:block;font-size:15px;font-weight:700} .p09-r small{display:block;font-size:12.5px;color:var(--muted)}
          .p09-r i{margin-left:auto;font-style:normal;color:var(--faint);font-size:20px}
          .p09-r.out b{color:var(--red)}
        </style><div class="ph-h"><h1>더보기</h1></div>
        <div class="card p09-me"><i>${s.name.slice(0, 1)}</i><div><b>${s.name}님</b><small>${s.org} · ${s.label}${partner ? "" : " · 소속 " + App.partnerName(s.partnerId)}</small></div></div>
        <div class="card p09-g">
          ${partner ? row("정산 명세서", stmt ? `최근 확정 ${App.weekLabel(stmt.week)} · 지급액 ${App.won(stmt.pay)}원` : "확정된 명세서가 아직 없습니다", 'data-go="P-07"') : ""}
          ${row("고객센터", partner ? (waitQ ? `공지사항 · 문의 (답변 대기 ${waitQ}건)` : "공지사항 · 본사 문의") : "공지사항", 'data-go="P-08"')}</div>
        <div class="card p09-g">
          ${row("비밀번호변경", "8자 이상 영문 · 숫자", 'data-act="pw"')}
          ${row("이용 안내", "", 'data-go="C-02"')}
          ${row("개인정보 처리 안내", "", 'data-go="C-03"')}</div>
        <div class="card p09-g"><a class="p09-r out" role="button" tabindex="0" data-act="out"><span><b>로그아웃</b></span></a></div>
        ${partner ? "" : h`<p class="hint" style="text-align:center">수수료표와 정산 명세서는 협력점 계정에서만 볼 수 있습니다.</p>`}`;
      App.on(el, {
        pw: changePassword,
        out: async () => { if (await App.confirm("로그아웃하시겠습니까?", { ok: "로그아웃" })) App.logout(); },
      });
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches(".p09-r")) e.target.click(); });
    },
  });
})();
</script>
<script>App.start();</script></body></html>
