            <button class="kpi" data-act="tab" data-v="recv"><span>미수 잔액 합계</span><b class="${recvTotal ? "neg" : ""}">${App.won(recvTotal)}</b><small>미수 잔액 탭에서 협력점별로 봅니다</small></button>
          </div>
          <div class="note"><b>확정된 환수만</b> 다음 주간 정산에서 차감됩니다. 등록(미확정) 상태는 차감되지 않으니, 검토한 뒤 목록에서 골라 「환수 확정」을 눌러 주세요.</div>
          <div class="card"><div class="filters">
            <div class="search grow"><input class="in" data-on="cq" data-live value="${f.q}" placeholder="고객명" aria-label="고객명"></div>
            <select class="in fix" data-on="cf" data-k="state" aria-label="상태">${App.opts([["등록", "등록(미확정)"], ["확정", "확정 전체"], ["예정", "확정 · 차감 예정"], ["차감됨", "확정 · 정산에 반영"]], f.state, "상태 전체")}</select>
            <select class="in fix" data-on="cf" data-k="group" aria-label="정산그룹">${App.opts(db.options.정산그룹, f.group, "정산그룹 전체")}</select>
            <select class="in fix" data-on="cf" data-k="partner" aria-label="협력점">${App.opts(db.partners.map((p) => [p.id, p.name]), f.partner, "협력점 전체")}</select>
            <button class="btn sm ghost" data-act="creset">초기화</button>
          </div></div>
          <div data-tbl style="margin-top:10px"></div>`;
        const ph = (k, v) => (v === "확정" ? k.state === "확정" : phase(k) === v);
        rowsFn = () => claws.filter((k) => {
          if (f.state && !ph(k, f.state)) return false; if (f.partner && k.partnerId !== f.partner) return false; if (f.group && partnerOf(k.partnerId).group !== f.group) return false;
          if (f.q && !((App.cust(k.cid) || {}).name || "").includes(f.q)) return false; return true;
        });
        const list = rowsFn();
        tbl = App.table($("[data-tbl]", body), [
          { label: "협력점", render: (k) => h`<a class="link" data-act="pinfo" data-id="${k.partnerId}">${App.partnerName(k.partnerId)}</a>` },
          { key: "name", label: "고객명", render: (k) => h`<a class="name" data-act="cust" data-id="${k.cid}">${(App.cust(k.cid) || {}).name || "-"}</a>` },
          { label: "개통 건", render: (k) => { const c = App.cust(k.cid) || {}; return h`${c.carrier} ${c.product} <span class="muted num">${c.joinNo || ""}</span>`; } },
          { label: "개통일", render: (k) => h`<span class="num">${(App.cust(k.cid) || {}).openedAt}</span>` },
          { key: "amount", label: "환수 금액", r: 1, render: (k) => h`<b>${App.won(k.amount)}</b>` },
          { label: "사유", cls: "ell", render: (k) => h`<span title="${k.why}">${k.why}</span>` },
          { label: "상태", render: (k) => App.chip(k.state) },
          { label: "정산 차감", cls: "b12-where", render: (k) => { const s = settleOf(k); return k.state !== "확정" ? h`<span class="muted">확정 전 · 차감 안 됨</span>` : s ? h`<a class="link num" data-go="B-11" data-params="week=${s.week}&step=3&partner=${s.partnerId}">${App.weekLabel(s.week)} 정산</a> ${App.chip(s.state)}` : h`<span style="color:var(--todo);font-weight:700">다음 주간 정산에서 차감</span>`; } },
          { label: "등록자", render: (k) => k.by }, { label: "등록일시", render: (k) => h`<span class="num">${App.dt(k.at)}</span>` },
          { label: "확정자", render: (k) => (k.state === "확정" ? k.confirmedBy || k.by : "") }, { label: "확정일시", render: (k) => (k.state === "확정" && k.confirmedAt ? h`<span class="num">${App.dt(k.confirmedAt)}</span>` : "") },
        ], list, { select: true, pageSize: 30, sum: { name: "합계", amount: h`<span class="neg">${App.won(amt(list))}</span>` },
          bar: (n, s) => `검색 결과 <b>${n}</b>건 · 선택 ${s}건 · 금액 단위: 원`, tools: h`<button class="btn sm danger" data-act="confirm">환수 확정</button>`,
          empty: claws.length ? ["조건에 맞는 환수가 없습니다", "조건을 바꿔 다시 찾아 보세요."] : ["등록된 환수가 없습니다", h`해지된 개통 건이 생기면 「환수 등록」으로 환수 금액을 넣으세요.<br><button class="btn p" data-act="reg">환수 등록</button>`] });
      }

      if (st.tab === "recv") {
        const f = st.r;
        const all = db.partners.map((p) => { const hist = db.receivables.filter((x) => x.partnerId === p.id); return { p, bal: App.receivableOf(p.id), hist, last: hist.length ? hist[hist.length - 1].at : "" }; });
        const list = all.filter((x) => (!f.group || x.p.group === f.group) && (!f.q || x.p.name.includes(f.q)) && (!f.only || x.bal > 0));
        if (!f.pick || !list.some((x) => x.p.id === f.pick)) f.pick = (list.find((x) => x.bal > 0) || list[0] || { p: {} }).p.id || "";
        const cur = all.find((x) => x.p.id === f.pick);
        // 변동 이력: 증감을 차례로 더한 잔액(맨 끝 = 지금 잔액)
        let run = 0; const hist = cur ? cur.hist.map((x) => ({ x, bal: (run += x.delta) })).filter((r) => { const d = r.x.at.slice(0, 10); return (!f.from || d >= f.from) && (!f.to || d <= f.to); }).reverse() : [];
        body.innerHTML = h`
          <div class="kpis">
            <div class="kpi"><span>미수 잔액 합계</span><b class="${recvTotal ? "neg" : ""}">${App.won(recvTotal)}</b><small>모든 협력점 · 금액 단위: 원</small></div>
            <div class="kpi"><span>미수가 있는 협력점</span><b>${all.filter((x) => x.bal > 0).length}<small style="display:inline;font-size:13px"> 곳</small></b><small>전체 ${all.length}곳</small></div>
            <button class="kpi" data-act="tab" data-v="claw"><span>다음 주간 정산 차감 예정 환수</span><b class="${due.length ? "neg" : ""}">${App.won(amt(due))}</b><small>확정된 환수 ${due.length}건 · 환수 탭에서 봅니다</small></button>
          </div>
          <div class="note">정산 지급액이 음수가 되지 않도록 <b>부족분은 미수로 이월</b>됩니다. 미수 잔액은 다음 주간 정산에서 먼저 차감되고, 정산을 확정할 때 잔액이 바뀝니다.</div>
          <div class="card"><div class="filters">
            <div class="search grow"><input class="in" data-on="rq" data-live value="${f.q}" placeholder="협력점명" aria-label="협력점명"></div>
            <select class="in fix" data-on="rf" data-k="group" aria-label="정산그룹">${App.opts(db.options.정산그룹, f.group, "정산그룹 전체")}</select>
            <span class="lbl" style="margin:0">변동 기간</span><div class="range"><input class="in" type="date" data-on="rf" data-k="from" value="${f.from}" aria-label="시작일">~<input class="in" type="date" data-on="rf" data-k="to" value="${f.to}" aria-label="종료일"></div>
            <label class="check"><input type="checkbox" class="cb" data-on="ronly" ${f.only ? App.raw("checked") : ""}> 미수 있는 곳만</label>
            <button class="btn sm ghost" data-act="rreset">초기화</button>
          </div></div>
          <div class="split" style="margin-top:10px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)"><div data-tbl></div>
            <div class="card b12-hist">${cur ? h`<div class="b12-bal"><span><a class="link" data-act="pinfo" data-id="${cur.p.id}" style="font-size:15px">${cur.p.name}</a> 변동 이력 · 지금 미수 잔액</span><b class="num ${cur.bal ? "neg" : ""}">${App.won(cur.bal)}<small style="font-size:13px"> 원</small></b></div>
              ${hist.length ? h`<div class="tblwrap"><table class="tbl"><thead><tr><th>일시</th><th>정산 주차</th><th>내용</th><th class="r">증감</th><th class="r">잔액</th></tr></thead><tbody>
                ${hist.map((r) => h`<tr><td class="num">${App.dt(r.x.at)}</td><td><a class="link num" data-go="B-11" data-params="week=${r.x.week}&step=4&partner=${cur.p.id}" title="이 주의 정산 명세서 열기">${App.weekLabel(r.x.week)}</a></td><td>${r.x.why}</td><td class="r">${r.x.delta > 0 ? h`<span class="neg">+${App.won(r.x.delta)}</span>` : h`<span class="pos">${App.won(r.x.delta)}</span>`}</td><td class="r"><b>${App.won(r.bal)}</b></td></tr>`)}</tbody></table></div>`
              : h`<div class="empty"><b>${cur.hist.length ? "이 기간에는 변동이 없습니다" : "미수 변동 이력이 없습니다"}</b>${cur.hist.length ? "변동 기간을 바꿔 보세요." : "주간 정산에서 지급액이 모자랄 때 미수가 생깁니다."}</div>`}` : h`<div class="empty"><b>협력점을 골라 주세요</b>왼쪽 목록에서 협력점을 누르면 변동 이력이 보입니다.</div>`}</div></div>`;
        tbl = App.table($("[data-tbl]", body), [
          { key: "name", label: "협력점", render: (x) => h`<span class="name">${x.p.name}</span>` }, { label: "정산그룹", render: (x) => x.p.group }, { label: "거래 상태", render: (x) => App.chip(x.p.state) },
          { key: "bal", label: "미수 잔액", r: 1, render: (x) => (x.bal ? h`<b class="neg">${App.won(x.bal)}</b>` : h`<span class="muted">0</span>`) },
          { label: "변동", r: 1, render: (x) => `${x.hist.length}회` }, { label: "마지막 변동", render: (x) => (x.last ? h`<span class="num">${App.d(x.last)}</span>` : "") },
        ], list, { pageSize: 30, onRow: (x) => { f.pick = x.p.id; App.redraw(); }, rowClass: (x) => (x.p.id === f.pick ? "sel" : ""),
          sum: { name: "미수 잔액 합계", bal: h`<span class="neg">${App.won(list.reduce((a, x) => a + x.bal, 0))}</span>` },
          bar: (n) => `협력점 <b>${n}</b>곳 · 금액 단위: 원 · 줄을 누르면 오른쪽에 변동 이력`,
          empty: ["조건에 맞는 협력점이 없습니다", "조건을 바꿔 다시 찾아 보세요."] });
      }

      const refocus = (sel, pos) => { const i = $(sel, document); if (i) { i.focus(); i.setSelectionRange(pos, pos); } };
      App.on(el, {
        tab: (t) => { st.tab = t.dataset.v; App.redraw(); },
        reg: () => openRegister(() => { st.c.state = ""; App.redraw(); }),
        xls: () => App.fake(st.tab === "claw" ? `환수 ${tbl ? tbl.rows().length : 0}건 엑셀저장` : "협력점별 미수 잔액 엑셀저장"),
        pinfo: (t) => App.openPartnerInfo(t.dataset.id), cust: (t) => App.openCustomer(t.dataset.id, { tab: "sum", onChange: () => App.redraw() }),
        cst: (t) => { st.c.state = st.c.state === t.dataset.v ? "" : t.dataset.v; App.redraw(); },
        cf: (t) => { st.c[t.dataset.k] = t.value; App.redraw(); }, creset: () => { Object.assign(st.c, { state: "", q: "", partner: "", group: "" }); App.redraw(); },
        cq: (t) => { st.c.q = t.value.trim(); const p = t.selectionStart; App.redraw(); refocus('[data-on="cq"]', p); },
        rf: (t) => { st.r[t.dataset.k] = t.value; App.redraw(); }, ronly: (t) => { st.r.only = t.checked; App.redraw(); }, rreset: () => { Object.assign(st.r, { group: "", q: "", from: "", to: "", only: false }); App.redraw(); },
        rq: (t) => { st.r.q = t.value.trim(); const p = t.selectionStart; App.redraw(); refocus('[data-on="rq"]', p); },
        confirm: async () => {
          if (!tbl) return; const sel = tbl.selected(); if (!sel.length) { App.toast("확정할 환수를 골라 주세요"); return; }
          const list = sel.filter((k) => k.state === "등록"); if (!list.length) { App.toast("등록(미확정) 상태인 환수만 확정할 수 있습니다"); return; }
          const ok = await App.confirm(`환수 ${list.length}건(${App.won(amt(list))}원)을 확정하시겠습니까?`, { danger: true, ok: "환수 확정", detail: `${list.map((k) => `${App.partnerName(k.partnerId)} ${(App.cust(k.cid) || {}).name} ${App.won(k.amount)}원`).join(" · ")}${sel.length > list.length ? ` · 선택 ${sel.length}건 중 이미 확정된 ${sel.length - list.length}건은 그대로 둡니다.` : ""} 확정하면 다음 주간 정산에서 차감되고 되돌릴 수 없습니다.` });
          if (!ok) return; const at = App.now();
          list.forEach((k) => { k.state = "확정"; k.confirmedBy = App.session.name; k.confirmedAt = at; App.log("환수", `${(App.cust(k.cid) || {}).name} 환수 확정`, "등록", `확정 ${App.won(k.amount)}원 · ${App.partnerName(k.partnerId)}`); });
          App.toast("환수를 확정했습니다"); App.redraw();
        },
      });
    },
  });
})();
</script>
<script>/* B-13 상부 정산서 대사 (옛 SC-32 올리기 + SC-20 자동 대조 + SC-34 불일치 처리 기록 + SC-49 내려받기).
   왼쪽에서 정산서를 고르거나 올리고, 오른쪽에서 대조 결과를 보며 그 줄에서 바로 처리 결과를 남긴다.
   가입번호로 맞추고 오차는 0원(R-155). 처리 결과는 기록만 남기고 정산 금액은 건드리지 않는다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { sel: "", kind: "", todo: false, q: "" };
  const KINDS = ["일치", "금액 불일치", "시스템에만 있음", "정산서에만 있음"];
  const DOT = { 일치: "green", "금액 불일치": "red", "시스템에만 있음": "amber", "정산서에만 있음": "violet" };
  const RESULTS = ["상부 누락 요청", "시스템 수정", "무시"];
  /* 프로토타입은 실제 파일을 읽지 않는다. 예시 파일 이름을 고르면 그 이름에 맞는 검사 결과가 나온다. */
  const SAMPLES = ["상부점가_11월누계.xlsx", "상부점나_11월누계.xlsx", "상부점가_11월3주.xlsx", "상부점가_11월누계_열누락.xlsx", "정산서_스캔본.pdf"];
  const BAD_ROWS = [[3, "가입번호가 비어 있습니다"], [7, "금액이 숫자가 아닙니다(「이십만원」)"], [12, "개통일 형식이 맞지 않습니다(2026.11.33)"]];
  let extra = 0;

  /** 분류: 정산서에 없으면 「시스템에만 있음」, 시스템에 없으면 「정산서에만 있음」, 금액이 1원이라도 다르면 「금액 불일치」 */
  const classify = (r) => (!r.cid ? "정산서에만 있음" : r.sheet == null ? "시스템에만 있음" : r.sheet === r.sys ? "일치" : "금액 불일치");
  const sysOf = (c) => { const f = App.feeOf(c); return f ? f.upper : null; };
  const rowsOf = (id) => App.db.recon.rows.filter((r) => r.uploadId === id);
  const openOf = (id) => rowsOf(id).filter((r) => r.kind !== "일치" && !r.done).length;
  const sum = (rows, k) => rows.reduce((a, r) => a + (r[k] || 0), 0);

  /** 올린 정산서를 개통 건과 맞춘다(그 상부점 · 그 기간에 개통된 건). 정산서 쪽 값은 예시로 지어낸다. */
  function buildRows(up) {
    const src = App.db.customers.filter((c) => App.isOpened(c) && c.joinNo && c.upperId === up.upperId && c.openedAt >= up.from && c.openedAt <= up.to);
    const rows = src.map((c, i) => {
      const sys = sysOf(c); let sheet = sys == null ? 200000 : sys;
      if (i % 5 === 1) sheet = (sys || 200000) - 10000; if (i % 6 === 4) sheet = null;
      const r = { id: App.uid("RC"), uploadId: up.id, joinNo: c.joinNo, cid: c.id, name: c.name, upperId: up.upperId, sheet, sys, done: "", memo: "", by: "", at: "" };
      r.kind = classify(r); return r;
    });
    rows.push({ id: App.uid("RC"), uploadId: up.id, joinNo: "74999" + String(10002 + extra++), cid: "", name: "(시스템에 없음)", upperId: up.upperId, sheet: 240000, sys: null, kind: "정산서에만 있음", done: "", memo: "", by: "", at: "" });
    App.db.recon.rows.push(...rows);
    up.rows = rows.filter((r) => r.sheet != null).length;
    return rows;
  }

  App.screen("B-13", {
    title: "상부 정산서 대사", sc: ["SC-32", "SC-20", "SC-34", "SC-49"],
    render(el, params) {
      const db = App.db; const R = db.recon;
      if (params.id) { st.sel = params.id; delete params.id; }
      if (!R.uploads.some((u) => u.id === st.sel)) st.sel = R.uploads[0] ? R.uploads[0].id : "";
      const up = R.uploads.find((u) => u.id === st.sel);

      el.innerHTML = h`<style>
          .b13-up{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line2)}
          .b13-up:last-child{border-bottom:0}
          .b13-up:hover{background:var(--sunk)}
          .b13-up.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
          .b13-up b{display:block;font-size:13.5px;word-break:break-all}
          .b13-up span{display:block;font-size:12.5px;color:var(--ink2)}
          .b13-up small{display:block;font-size:12px;color:var(--muted)}
          .b13-up em{font-style:normal;font-weight:700;color:var(--todo)}
          .b13-info{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px}
          .b13-info span{color:var(--muted);margin-right:6px}
          .b13-proc{display:flex;gap:6px;align-items:center}
          .b13-proc .in{height:28px;font-size:12.5px}
          .b13-proc input.in{width:170px}
          .b13-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
          .b13-who{display:block;font-size:12px;color:var(--muted);margin-top:2px}
          .b13-res{margin-top:12px}
          .b13-res li{margin-left:18px}
        </style>
        ${App.head("상부 정산서 대사", { count: `올린 정산서 ${R.uploads.length}개`, actions: h`<button class="btn p" data-act="upload">정산서 올리기</button>` })}
        <div class="note">상부점이 보낸 정산서를 개통 건과 <b>가입번호</b>로 맞춥니다(오차 0원). 처리 결과는 기록만 남깁니다. <b>정산 금액은 자동으로 수정하지 않습니다.</b></div>
        <div class="split l">
          <div><div class="sec-h"><h2>올린 정산서</h2><small>고르면 오른쪽에 대조 결과가 열립니다</small></div><div class="card" data-ups></div></div>
          <div data-right></div>
        </div>`;

      function paintLeft() {
        $("[data-ups]", el).innerHTML = R.uploads.length ? h`${R.uploads.map((u) => { const n = openOf(u.id); return h`<button class="b13-up ${u.id === st.sel ? "on" : ""}" data-act="pick" data-id="${u.id}"><b>${u.file}</b><span>${App.upperName(u.upperId)} · 정산 기간 ${u.from} ~ ${u.to}</span><small>${u.by} · ${App.dt(u.at)} · ${u.rows}행 · ${n ? h`<em>미처리 ${n}건</em>` : "불일치 처리 끝"}</small></button>`; })}` : h`<div class="empty"><b>올린 정산서가 없습니다</b>「정산서 올리기」로 상부점 정산서를 올려 주세요.</div>`;
      }
      paintLeft();

      const right = $("[data-right]", el); let tbl = null;
      if (!up) right.innerHTML = h`<div class="card empty"><b>대조할 정산서가 없습니다</b>상부점 정산서를 올리면 개통 건과 바로 대조합니다.<br><button class="btn p" data-act="upload">정산서 올리기</button></div>`;
      else {
        right.innerHTML = h`<div class="card pad">
            <div class="sec-h"><h2>${up.file}</h2><span class="sp"><button class="btn sm" data-act="rerun">다시 대조</button><button class="btn sm" data-act="dlAll">대조 결과 내려받기</button><button class="btn sm" data-act="dlBad">불일치 목록 내려받기</button></span></div>
            <div class="b13-info"><div><span>상부점</span>${App.upperName(up.upperId)}</div><div><span>정산 기간</span><b class="num">${up.from} ~ ${up.to}</b></div><div><span>대조 키</span>가입번호 · 오차 0원</div><div><span>대조 시작</span><b class="num">${App.dt(up.at)}</b></div><div><span>마지막 대조</span><b class="num" data-last>${App.dt(up.lastAt || up.at)}</b></div></div>
          </div>
          <div class="kpis" data-cards style="margin-top:12px"></div>
          <div class="card"><div class="filters">
            <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="가입번호 또는 고객명" aria-label="검색어"></div>
            <label class="check"><input type="checkbox" class="cb" data-on="todo" ${st.todo ? App.raw("checked") : ""}> 미처리만 보기</label>
            <button class="btn sm ghost" data-act="reset">초기화</button>
          </div></div>
          <div data-tbl></div>
          <p class="hint" style="margin-top:8px">내려받기는 본사 계정만 쓸 수 있고, 화면과 같은 건수 · 합계로 받습니다. 「다시 대조」는 지금 수수료표로 시스템 금액을 다시 읽어 분류만 고칩니다(처리 기록은 그대로).</p>`;

        const all = () => rowsOf(up.id);
        const view = () => all().filter((r) => (!st.kind || r.kind === st.kind) && (!st.todo || (r.kind !== "일치" && !r.done)) && (!st.q || r.joinNo.includes(st.q) || r.name.includes(st.q)));
        tbl = App.table($("[data-tbl]", el), [
          { label: "가입번호", render: (r) => h`<span class="num">${r.joinNo}</span>` },
          { label: "고객명", render: (r) => (r.cid ? h`<a class="link" data-act="cust" data-id="${r.cid}">${r.name}</a>` : h`<span class="muted">${r.name}</span>`) },
          { label: "정산서 금액", r: 1, render: (r) => (r.sheet == null ? h`<span class="muted">없음</span>` : App.won(r.sheet)) },
          { label: "시스템 금액", r: 1, render: (r) => (!r.cid ? h`<span class="muted">없음</span>` : r.sys == null ? h`<span class="neg">수수료 미등록</span>` : App.won(r.sys)) },
          { label: "차이", r: 1, render: (r) => (r.sheet != null && r.sys != null ? (r.sheet === r.sys ? "0" : App.wonc(r.sheet - r.sys)) : "") },
          { label: "분류", render: (r) => App.chip(r.kind) },
          { label: "처리 상태 · 처리자 · 일시", render: (r) => (r.kind === "일치" ? "" : r.done ? h`${App.chip("처리")} ${r.done}<span class="b13-who">${r.by} · <span class="num">${App.dt(r.at)}</span></span>` : App.chip("미처리")) },
          { label: "처리 결과 · 메모", render: (r) => (r.kind === "일치" ? "" : h`<div class="b13-proc"><select class="in fix" aria-label="처리 결과">${App.opts(RESULTS, r.done, "처리 결과")}</select><input class="in" data-memo maxlength="200" value="${r.memo}" placeholder="메모(200자까지)" aria-label="메모"><button class="btn sm ${r.done ? "" : "p"}" data-act="save" data-id="${r.id}">${r.done ? "다시 저장" : "저장"}</button></div>`) },
        ], view(), {
          bar: (n) => { const a = all(); return h`대조 <b>${a.length}</b>건 중 ${n}건 표시 · 불일치 ${a.filter((r) => r.kind !== "일치").length}건 · 미처리 <b>${openOf(up.id)}</b>건 · 금액 단위: 원`; },
          empty: st.todo ? ["미처리 건이 없습니다", "불일치 건을 모두 처리했습니다."] : ["대조 결과가 없습니다", "조건을 바꿔 다시 찾아 보세요."],
        });
        const refresh = () => {
          const a = all();
          $("[data-cards]", el).innerHTML = h`${KINDS.map((k) => { const rs = a.filter((r) => r.kind === k); return h`<button class="kpi ${st.kind === k ? "on" : ""}" data-act="kind" data-k="${k}"><span><i class="b13-dot" style="background:var(--${DOT[k]})"></i>${k}</span><b>${rs.length}건</b><small>정산서 ${App.won(sum(rs, "sheet"))} · 시스템 ${App.won(sum(rs, "sys"))}</small></button>`; })}`;
          tbl.set(view());
        };
        refresh();
        right._refresh = refresh;
      }

      /* 정산서 올리기: 기간 · 상부점 · 파일 → 검사(형식 오류 · 중복 파일) → 올리기 완료 → 대조 */
      function upload() {
        const first = App.today().slice(0, 8) + "01"; // 기본값 = 이번 달 1일 ~ 오늘
        const fields = [
          { name: "from", label: "정산 기간 시작", type: "date", required: true, value: first },
          { name: "to", label: "정산 기간 끝", type: "date", required: true, value: App.today() },
          { name: "upper", label: "상부점", type: "select", required: true, options: db.uppers.filter((u) => u.state === "거래중").map((u) => [u.id, u.name]) },
          { name: "file", label: "정산 엑셀 파일", type: "select", required: true, options: SAMPLES, first: "파일 고르기", hint: "프로토타입: 실제 파일 대신 예시 파일 이름을 고릅니다. 엑셀(.xlsx · .xls) · 10MB 이하 · 가입번호 · 개통일 · 금액 열 필수" },
        ];
        App.modal({
          title: "정산서 올리기", sub: "검사를 통과해야 올라갑니다",
          body: h`<div class="card" style="overflow:hidden">${App.form(fields, { cols: 1 })}</div><div class="b13-res" data-res></div>`,
          actions: [{ label: "취소" }, { label: "검사 후 올리기", kind: "p", onClick: (close, root) => {
            const res = $("[data-res]", root); res.innerHTML = "";
            const r = App.readForm(root, fields); if (!r.ok) return; const v = r.values;
            if (v.from > v.to) { res.innerHTML = h`<div class="note bad">정산 기간의 끝이 시작보다 앞입니다.</div>`; return; }
            res.innerHTML = h`<div class="note gray">검사 중입니다…</div>`;
            setTimeout(() => {
              if (!res.isConnected) return;
              if (!/\.(xlsx|xls)$/i.test(v.file)) { res.innerHTML = h`<div class="note bad"><b>형식 오류</b> · 엑셀 파일(.xlsx · .xls)만 올릴 수 있습니다. 올린 것은 없습니다.</div>`; return; }
              const dup = R.uploads.find((u) => u.file === v.file);
              if (dup) { res.innerHTML = h`<div class="note bad"><b>이미 올린 파일입니다</b> · 「${dup.file}」은 ${App.dt(dup.at)}에 ${dup.by}님이 올렸습니다. 같은 파일은 다시 올릴 수 없습니다. 왼쪽 목록에서 그 정산서를 골라 대조 결과를 보세요.</div>`; return; }
              if (/열누락/.test(v.file)) { res.innerHTML = h`<div class="note bad"><b>형식 오류 ${BAD_ROWS.length}행</b> · 오류를 고친 뒤 다시 올려 주세요. 올린 것은 없습니다.<ul>${BAD_ROWS.map(([n, why]) => h`<li><span class="num">${n}행</span> · ${why}</li>`)}</ul></div>`; return; }
              const nu = { id: App.uid("UP"), file: v.file, upperId: v.upper, from: v.from, to: v.to, by: App.session.name, at: App.now(), rows: 0 };
              R.uploads.unshift(nu); const rows = buildRows(nu);
              App.log("대사", "상부 정산서 올리기", "", `${nu.file} (${nu.rows}행)`);
              close(); st.sel = nu.id; st.kind = ""; st.todo = false; st.q = ""; App.redraw();
              App.modal({ title: "올리기 완료", sub: nu.file, body: h`<div class="note ok">검사를 통과해 ${nu.rows}행을 올렸고, 개통 건과 가입번호로 대조했습니다.</div><div class="card pad"><dl class="kv" style="grid-template-columns:140px minmax(0,1fr)">${KINDS.map((k) => h`<dt>${k}</dt><dd class="num">${rows.filter((x) => x.kind === k).length}건</dd>`)}</dl></div><p class="hint" style="margin-top:8px">불일치 건은 대조 결과에서 처리 결과와 메모를 남깁니다. 정산 금액은 자동으로 수정하지 않습니다.</p>`, actions: [{ label: "대조 결과 보기", kind: "p" }] });
            }, 300);
          } }],
        });
      }

      App.on(el, {
        upload,
        pick: (t) => { st.sel = t.dataset.id; st.kind = ""; st.todo = false; st.q = ""; App.redraw(); },
        kind: (t) => { st.kind = st.kind === t.dataset.k ? "" : t.dataset.k; right._refresh(); },
        q: (t) => { st.q = t.value.trim(); right._refresh(); },
        todo: (t) => { st.todo = t.checked; App.redraw(); },
        reset: () => { st.kind = ""; st.todo = false; st.q = ""; App.redraw(); },
        cust: (t) => App.openCustomer(t.dataset.id, { tab: "money" }),
        save: (t) => {
          const tr = t.closest("tr"); const r = R.rows.find((x) => x.id === t.dataset.id); const res = $("select", tr).value; const memo = $("[data-memo]", tr).value.trim();
          if (!res) { App.toast("처리 결과를 골라 주세요"); $("select", tr).focus(); return; }
          if (res === "무시" && !memo) { App.toast("「무시」로 처리할 때는 이유를 메모에 남겨 주세요"); $("[data-memo]", tr).focus(); return; }
          const before = r.done || "미처리"; r.done = res; r.memo = memo; r.by = App.session.name; r.at = App.now();
          App.log("대사", `${r.joinNo} 불일치 처리`, before, res + (memo ? " · " + memo : ""));
          App.toast("처리 결과를 저장했습니다. 정산 금액은 바뀌지 않습니다"); paintLeft(); right._refresh();
        },
        rerun: () => {
          let changed = 0;
          rowsOf(up.id).forEach((r) => { if (!r.cid) return; const c = App.cust(r.cid); if (!c) return; const b = r.kind; r.sys = sysOf(c); r.kind = classify(r); if (b !== r.kind) changed++; });
          up.lastAt = App.now(); $("[data-last]", el).textContent = App.dt(up.lastAt); paintLeft(); right._refresh();
          App.toast(changed ? `다시 대조했습니다. 분류가 바뀐 건 ${changed}건` : "다시 대조했습니다. 바뀐 분류는 없습니다");
        },
        dlAll: () => { const n = rowsOf(up.id).length; App.log("대사 내려받기", up.file, "", `대조 결과 ${n}건`); App.fake(`대조 결과 ${n}건 내려받기`); },
        dlBad: () => { const n = rowsOf(up.id).filter((r) => r.kind !== "일치").length; App.log("대사 내려받기", up.file, "", `불일치 목록 ${n}건`); App.fake(`불일치 목록 ${n}건 내려받기`); },
      });
    },
  });
})();
</script>
<script>/* B-14 상품·수수료표 (옛 SC-35 상품·결합 구성 + SC-13 수수료 설정 + SC-31 적용 일시별 수수료표 등록).
   수수료표 한 줄 = 통신사 · 상품 · 옵션 · 약정 · 적용 시작 일시 + 상부수수료 · 협력점 수수료(D-3, 전체 공통 한 벌).
   고치는 길은 「새 버전 등록」 하나뿐이다. 이전 버전은 지우지 않고 이력으로 남는다(수정 · 삭제 없음). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { tab: "prod", p: { carrier: "", set: "", setbox: "", state: "", q: "" }, f: { carrier: "", q: "", miss: false } };
  const SETS = ["단독", "DPS", "TPS"];
  const keyOf = (x) => [x.carrier, x.product, x.option, x.contract].join("|");
  const versionsOf = (key) => App.db.fees.filter((f) => keyOf(f) === key).sort((a, b) => (a.from < b.from ? 1 : -1));
  const prodOf = (r) => App.db.products.find((p) => p.carrier === r.carrier && p.name === r.product && p.option === r.option);
  const usedBy = (p) => ({ fees: App.db.fees.filter((f) => f.carrier === p.carrier && f.product === p.name && f.option === p.option).length, custs: App.db.customers.filter((c) => c.carrier === p.carrier && c.product === p.name && c.option === p.option).length });

  /** 지금 적용 중인 줄 + 줄이 없는 조합(사용 중인 상품 × 약정)을 「미등록」 줄로 */
  function feeRows() {
    const db = App.db; const now = App.now(); const cur = App.currentFees(); const has = new Set(cur.map(keyOf));
    const rows = cur.map((f) => ({ fee: f, carrier: f.carrier, product: f.product, option: f.option, contract: f.contract }));
    db.products.filter((p) => p.state === "사용").forEach((p) => db.contracts.forEach((ct) => { const r = { fee: null, carrier: p.carrier, product: p.name, option: p.option, contract: ct }; if (!has.has(keyOf(r))) rows.push(r); }));
    rows.forEach((r) => { r.key = keyOf(r); const vs = versionsOf(r.key); r.count = vs.length; r.next = vs.filter((f) => f.from > now).pop() || null; const p = prodOf(r); r.off = !!p && p.state === "사용중지"; });
    return rows.sort((a, b) => (a.key < b.key ? -1 : 1));
  }
  const missCount = () => feeRows().filter((r) => !r.fee).length;

  /* ── 새 버전 등록(대상 + 적용 시작 일시 + 두 금액 전부 필수 · 같은 대상 같은 시작 일시면 겹침 오류) ── */
  function openNew(preset, after) {
    const db = App.db; preset = preset || {};
    const targets = db.products.filter((p) => p.state === "사용" || (preset.product === p.name && preset.carrier === p.carrier && preset.option === p.option));
    const pre = targets.find((p) => preset.product === p.name && preset.carrier === p.carrier && preset.option === p.option);
    const cts = db.contracts.includes(preset.contract) || !preset.contract ? db.contracts : [...db.contracts, preset.contract];
    const fields = [
      { name: "target", label: "통신사 · 상품 · 옵션", type: "select", required: true, value: pre ? pre.id : "", options: targets.map((p) => [p.id, `${p.carrier} · ${p.name} · ${p.option}${p.state === "사용중지" ? " (사용중지)" : ""}`]) },
      { name: "contract", label: "약정", type: "select", required: true, value: preset.contract || "", options: cts },
      { name: "date", label: "적용 시작 날짜", type: "date", required: true, value: App.today() },
      { name: "time", label: "적용 시작 시각", required: true, value: "00:00", placeholder: "00:00", pattern: /^([01]\d|2[0-3]):[0-5]\d$/, msg: "시각은 24시간제로 넣어 주세요(예: 00:00 · 13:30)", hint: "접수일시가 이 일시와 같거나 늦은 건부터 이 버전이 적용됩니다" },
      { name: "upper", label: "상부수수료", unit: "원", required: true, hint: "본사가 상부점에서 받는 돈" },
      { name: "partner", label: "협력점 수수료", unit: "원", required: true, hint: "협력점에 주는 돈(협력점 화면에는 이 금액만 보입니다)" },
    ];
    App.modal({
      title: "수수료표 새 버전 등록", sub: "전체 협력점 공통",
      body: h`<div class="note">수수료는 <b>접수일시</b> 기준으로 적용됩니다. 같은 대상의 적용 시작 일시는 겹칠 수 없고, 이전 버전은 이력으로 남습니다(수정 · 삭제 없음).</div>
        <div class="card" style="overflow:hidden">${App.form(fields, { cols: 1 })}</div><div data-info style="margin-top:10px"></div><p class="errmsg" data-top style="margin-top:8px"></p>`,
      onOpen: (root) => {
        const info = () => {
          const p = db.products.find((x) => x.id === $('[name="target"]', root).value); const ct = $('[name="contract"]', root).value; const box = $("[data-info]", root);
          if (!p || !ct) { box.innerHTML = ""; return; }
          const vs = versionsOf([p.carrier, p.name, p.option, ct].join("|"));
          box.innerHTML = vs.length ? h`<div class="note gray" style="margin:0"><b>이 대상의 지금까지 버전</b>${vs.map((f) => h`<div class="num">v${f.ver} · ${f.from} 부터 · 상부 ${App.won(f.upper)}원 · 협력점 ${App.won(f.partner)}원</div>`)}</div>` : h`<div class="note warn" style="margin:0">이 대상은 아직 수수료가 없습니다(미등록). 첫 버전으로 등록됩니다.</div>`;
        };
        root.addEventListener("change", info); info();
      },
      actions: [{ label: "취소" }, { label: "새 버전 등록", kind: "p", onClick: async (close, root) => {
        const top = $("[data-top]", root); top.textContent = "";
        const r = App.readForm(root, fields); if (!r.ok) return; const v = r.values;
        if (v.upper < 0 || v.partner < 0) { top.textContent = "수수료는 0원 이상으로 넣어 주세요."; return; }
        const p = db.products.find((x) => x.id === v.target); const from = `${v.date} ${v.time.slice(0, 5)}`;
        const row = { carrier: p.carrier, product: p.name, option: p.option, contract: v.contract }; const key = keyOf(row); const vs = versionsOf(key);
        const clash = vs.find((f) => f.from === from);
        if (clash) { top.textContent = `적용 구간이 겹칩니다. 같은 대상에 ${clash.from} 부터 적용되는 v${clash.ver}(상부 ${App.won(clash.upper)}원 · 협력점 ${App.won(clash.partner)}원)이 이미 있습니다. 적용 시작 일시를 바꿔 주세요.`; return; }
        /* 지난 일시로 등록하면 이미 접수된 건의 수수료가 바뀐다 → 몇 건인지 알리고 확인받는다 */
        const hit = db.customers.filter((c) => keyOf(c) === key && c.receivedAt >= from && !vs.some((f) => f.from > from && f.from <= c.receivedAt)).length;
        const warn = []; if (hit) warn.push(`이미 접수된 ${hit}건의 수수료가 이 버전으로 바뀝니다.`); if (v.partner > v.upper) warn.push("협력점 수수료가 상부수수료보다 큽니다.");
        if (warn.length && !(await App.confirm(`${warn.join(" ")} 등록하시겠습니까?`, { danger: true, ok: "등록", detail: "등록한 버전은 고치거나 지울 수 없습니다. 이미 만든 주간 정산안 · 확정한 정산의 금액은 바뀌지 않습니다." }))) return;
        const ver = vs.reduce((a, f) => Math.max(a, f.ver), 0) + 1; const cur = App.currentFees().find((f) => keyOf(f) === key);
        db.fees.push(Object.assign({ id: App.uid("F"), ver, from, upper: v.upper, partner: v.partner, by: App.session.name, at: App.now() }, row));
        App.log("수수료표", `새 버전 등록 · ${p.carrier} ${p.name} ${p.option} ${v.contract}`, cur ? `v${cur.ver} 상부 ${App.won(cur.upper)} · 협력점 ${App.won(cur.partner)}` : "미등록", `v${ver} (${from} 부터) 상부 ${App.won(v.upper)} · 협력점 ${App.won(v.partner)}`);
        close(); App.toast(`새 버전 v${ver}을 등록했습니다`); if (after) after(); else App.redraw();
      } }],
    });
  }

  /* ── 한 대상의 버전 이력(보기만) ── */
  function openHistory(r) {
    const now = App.now();
    const dr = App.drawer({
      wide: true, title: () => h`${r.product} · ${r.contract}`, sub: () => h`${r.carrier} · 옵션 ${r.option} · 수수료 버전 이력`,
      body: () => {
        const vs = versionsOf(r.key); const cur = vs.find((f) => f.from <= now);
        return h`<div class="note gray">버전은 고치거나 지우지 않습니다. 금액을 바꾸려면 새 버전을 등록하세요. 접수일시가 든 구간의 버전이 그 건에 적용됩니다.</div>
          ${vs.length ? h`<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>버전</th><th>적용 구간</th><th class="r">상부수수료</th><th class="r">협력점 수수료</th><th>등록자</th><th>등록일시</th></tr></thead><tbody>
            ${vs.map((f, i) => { const end = i > 0 ? vs[i - 1].from : ""; const state = f.from > now ? ["예정", "amber"] : f === cur ? ["적용 중", "green"] : ["지난 버전", "gray"]; return h`<tr class="${state[0] === "지난 버전" ? "off" : ""}"><td><b>v${f.ver}</b> <span class="chip c-${state[1]}">${state[0]}</span></td><td class="num">${f.from} ~ ${end ? end + " 전" : "계속"}</td><td class="r">${App.won(f.upper)}</td><td class="r">${App.won(f.partner)}</td><td>${f.by}</td><td class="num">${App.dt(f.at)}</td></tr>`; })}
          </tbody></table></div></div>` : h`<div class="card empty"><b>등록된 수수료가 없습니다</b>이 대상으로 접수된 건은 「수수료 미등록」으로 보입니다.</div>`}
          <p class="hint" style="margin-top:8px">금액 단위: 원 · 전체 협력점 공통</p>`;
      },
      footer: () => h`<button class="btn p" data-act="add">이 대상 새 버전 등록</button><span style="margin-left:auto"></span><button class="btn ghost" data-act="close">닫기</button>`,
      onDraw: (root, tab, api) => App.on(root, { close: () => api.close(), add: () => openNew(r, () => { App.redraw(); api.redraw(); }) }),
    });
    return dr;
  }

  /* ── 상품 등록 · 수정 ── */
  function editProduct(p) {
    const db = App.db; const used = p ? usedBy(p) : { fees: 0, custs: 0 }; const lock = used.fees + used.custs > 0;
    App.editModal({
      title: p ? "상품 수정" : "새 상품 등록", values: p || { set: "단독", setbox: "없음" },
      note: lock ? `수수료표 ${used.fees}줄 · 접수 ${used.custs}건이 이 상품을 쓰고 있어 통신사 · 상품명 · 옵션은 바꿀 수 없습니다. 바꾸려면 새 상품으로 등록하고 이 상품은 사용중지하세요.` : "저장하면 고객 등록의 상품 선택에 바로 나타납니다. 수수료는 수수료표 탭에서 따로 등록합니다.",
      fields: [
        { name: "carrier", label: "통신사", type: "select", options: db.carriers, required: true, readonly: lock },
        { name: "name", label: "상품명", required: true, readonly: lock, placeholder: "예: 인터넷 500M + TV" },
        { name: "option", label: "옵션", required: true, readonly: lock, placeholder: "예: 기본 · 결합 · 유심후납" },
        { name: "set", label: "셋트", type: "select", options: SETS, required: true },
        { name: "setbox", label: "셋탑박스", required: true, placeholder: "없으면 「없음」" },
        { name: "bundle", label: "결합 구성", required: true, placeholder: "예: 인터넷 + TV" },
      ],
      done: p ? "저장했습니다" : "상품을 등록했습니다. 수수료표 탭에서 수수료를 등록해 주세요",
      onSave: (v) => {
        if (lock) { v.carrier = p.carrier; v.name = p.name; v.option = p.option; }
        if (db.products.some((x) => x !== p && x.carrier === v.carrier && x.name === v.name && x.option === v.option)) return "같은 통신사 · 상품명 · 옵션의 상품이 이미 있습니다.";
        if (p) { const before = `${p.set} · ${p.setbox} · ${p.bundle}`; Object.assign(p, v); App.log("상품", `${p.carrier} ${p.name} 수정`, before, `${p.set} · ${p.setbox} · ${p.bundle}`); }
        else { db.products.push(Object.assign({ id: App.uid("PR"), state: "사용" }, v)); App.log("상품", "새 상품 등록", "", `${v.carrier} ${v.name} ${v.option}`); }
        App.redraw();
      },
    });
  }

  App.screen("B-14", {
    title: "상품·수수료표", sc: ["SC-35", "SC-13", "SC-31"],
    render(el, params) {
      if (params.tab) { st.tab = params.tab === "fee" ? "fee" : "prod"; delete params.tab; }
      if (params.miss) { st.tab = "fee"; st.f.miss = true; delete params.miss; }
      const db = App.db; const miss = missCount();
      el.innerHTML = h`${App.head("상품·수수료표", { actions: st.tab === "prod" ? h`<button class="btn p" data-act="newProd">새 상품 등록</button>` : h`<button class="btn" data-act="xls">엑셀저장</button><button class="btn p" data-act="newFee">새 버전 등록</button>` })}
        <div data-tabs></div><div data-body></div>`;
      App.tabs($("[data-tabs]", el), [["prod", "상품"], ["fee", "수수료표", miss ? `미등록 ${miss}` : ""]], st.tab, (k) => { st.tab = k; App.redraw(); });
      const body = $("[data-body]", el); let tbl;

      if (st.tab === "prod") {
        const f = st.p;
        body.innerHTML = h`<div class="note gray">사용중지한 상품은 새 접수에서 고를 수 없고, 기존 접수 건은 유지됩니다.</div>
          <div class="card"><div class="filters">
            <select class="in fix" data-on="pf" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, f.carrier, "통신사 전체")}</select>
            <select class="in fix" data-on="pf" data-k="set" aria-label="셋트">${App.opts(SETS, f.set, "셋트 전체")}</select>
            <select class="in fix" data-on="pf" data-k="setbox" aria-label="셋탑박스">${App.opts([...new Set(db.products.map((p) => p.setbox))], f.setbox, "셋탑박스 전체")}</select>
            <select class="in fix" data-on="pf" data-k="state" aria-label="사용 여부">${App.opts(["사용", "사용중지"], f.state, "사용 여부 전체")}</select>
            <div class="search grow"><input class="in" data-on="pq" data-live value="${f.q}" placeholder="상품명 또는 옵션" aria-label="검색어"></div>
            <button class="btn sm ghost" data-act="pReset">초기화</button>
          </div></div><div data-tbl></div>`;
        const rows = () => db.products.filter((p) => (!f.carrier || p.carrier === f.carrier) && (!f.set || p.set === f.set) && (!f.setbox || p.setbox === f.setbox) && (!f.state || p.state === f.state) && (!f.q || p.name.includes(f.q) || p.option.includes(f.q)));
        const cur = new Set(App.currentFees().map(keyOf));
        tbl = App.table($("[data-tbl]", body), [
          { key: "carrier", label: "통신사" }, { label: "상품명", render: (p) => h`<span class="name">${p.name}</span>` }, { key: "option", label: "옵션" }, { key: "set", label: "셋트" }, { key: "setbox", label: "셋탑박스" }, { key: "bundle", label: "결합 구성" },
          { label: "수수료표", render: (p) => { const n = db.contracts.filter((ct) => !cur.has([p.carrier, p.name, p.option, ct].join("|"))).length; return p.state !== "사용" ? h`<span class="muted">-</span>` : n ? h`<a class="neg" style="font-weight:700;text-decoration:underline" data-act="toFee" data-q="${p.name}">미등록 ${n}줄</a>` : "등록됨"; } },
          { label: "접수 건", r: 1, render: (p) => usedBy(p).custs + "건" },
          { label: "사용 여부", render: (p) => App.chip(p.state) },
          { label: "", r: 1, render: (p) => h`<button class="btn sm" data-act="editProd" data-id="${p.id}">수정</button> ${p.state === "사용" ? h`<button class="btn sm" data-act="stop" data-id="${p.id}">사용중지</button>` : h`<button class="btn sm" data-act="resume" data-id="${p.id}">다시 사용</button>`}` },
        ], rows(), {
          rowClass: (p) => (p.state === "사용중지" ? "off" : ""), onRow: (p) => editProduct(p),
          bar: (n) => h`상품 <b>${n}</b>건 · 사용중지 ${rows().filter((p) => p.state === "사용중지").length}건`,
          empty: ["상품이 없습니다", "조건을 바꾸거나 「새 상품 등록」으로 추가해 주세요."],
        });
        App.on(el, {
          newProd: () => editProduct(null), editProd: (t) => editProduct(db.products.find((p) => p.id === t.dataset.id)),
          pf: (t) => { f[t.dataset.k] = t.value; tbl.set(rows()); }, pq: (t) => { f.q = t.value.trim(); tbl.set(rows()); },
          pReset: () => { Object.keys(f).forEach((k) => (f[k] = "")); App.redraw(); },
          toFee: (t) => { st.tab = "fee"; st.f.q = t.dataset.q; st.f.carrier = ""; st.f.miss = true; App.redraw(); },
          stop: async (t) => { const p = db.products.find((x) => x.id === t.dataset.id); if (!(await App.confirm(`「${p.carrier} ${p.name}」 상품을 사용중지하시겠습니까?`, { danger: true, ok: "사용중지", detail: "새 접수에서 고를 수 없게 됩니다. 기존 접수 건과 수수료표 이력은 그대로 남습니다." }))) return; p.state = "사용중지"; App.log("상품", `${p.carrier} ${p.name} 사용중지`, "사용", "사용중지"); App.toast("사용중지했습니다"); App.redraw(); },
          resume: (t) => { const p = db.products.find((x) => x.id === t.dataset.id); p.state = "사용"; App.log("상품", `${p.carrier} ${p.name} 다시 사용`, "사용중지", "사용"); App.toast("다시 사용하도록 바꿨습니다"); App.redraw(); },
        });
        return;
      }

      /* 수수료표 탭 */
      const f = st.f; const all = feeRows();
      body.innerHTML = h`<div class="note">지금 적용 중인 표입니다(전체 협력점 공통). 수수료는 <b>접수일시</b>에 걸리는 버전으로 계산되고, 줄이 없는 조합은 0원이 아니라 <b class="neg">수수료 미등록</b>으로 보입니다. 금액을 바꾸려면 「새 버전 등록」을 쓰세요. 이전 버전은 이력으로 남습니다.</div>
        ${miss ? h`<div class="note bad"><b>수수료가 없는 조합 ${miss}줄</b> · 이 조합으로 접수된 건은 정산에서 「수수료 미등록」으로 빠집니다. 아래 빨간 줄의 「등록」으로 바로 채울 수 있습니다.</div>` : ""}
        <div class="card"><div class="filters">
          <select class="in fix" data-on="ff" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, f.carrier, "통신사 전체")}</select>
          <div class="search grow"><input class="in" data-on="fq" data-live value="${f.q}" placeholder="상품명 또는 옵션" aria-label="검색어"></div>
          <label class="check"><input type="checkbox" class="cb" data-on="fmiss" ${f.miss ? App.raw("checked") : ""}> 미등록만 보기</label>
          <button class="btn sm ghost" data-act="fReset">초기화</button>
        </div></div><div data-tbl></div>
        <p class="hint" style="margin-top:8px">줄을 누르면 그 대상의 버전 이력이 열립니다. 협력점 화면에는 협력점 수수료만 보입니다.</p>`;
      const rows = () => all.filter((r) => (!f.carrier || r.carrier === f.carrier) && (!f.q || r.product.includes(f.q) || r.option.includes(f.q)) && (!f.miss || !r.fee));
      const none = App.raw('<span class="neg">미등록</span>');
      tbl = App.table($("[data-tbl]", body), [
        { key: "carrier", label: "통신사" }, { label: "상품", render: (r) => h`<span class="name">${r.product}</span>${r.off ? h` <span class="muted">(사용중지)</span>` : ""}` }, { key: "option", label: "옵션" }, { key: "contract", label: "약정" },
        { label: "적용 시작", render: (r) => (r.fee ? h`<span class="num">${r.fee.from}</span>` : none) },
        { label: "상부수수료", r: 1, cls: "hot", render: (r) => (r.fee ? App.won(r.fee.upper) : none) },
        { label: "협력점 수수료", r: 1, render: (r) => (r.fee ? App.won(r.fee.partner) : none) },
        { label: "버전", render: (r) => (r.fee ? h`<b>v${r.fee.ver}</b> <span class="muted">· 모두 ${r.count}개</span>` : r.count ? h`<span class="muted">예정 ${r.count}개</span>` : "") },
        { label: "다음 예정", render: (r) => (r.next ? h`<span class="chip c-amber">예정</span> <span class="num">v${r.next.ver} · ${r.next.from} 부터</span>` : "") },
        { label: "", r: 1, render: (r) => h`<button class="btn sm ${r.fee ? "" : "p"}" data-act="rowNew" data-key="${r.key}">${r.fee ? "새 버전" : "등록"}</button>` },
      ], rows(), {
        pageSize: 50, onRow: (r) => openHistory(r), rowClass: (r) => (r.fee ? "" : "b14-miss"),
        bar: (n) => h`적용 중 <b>${all.filter((r) => r.fee).length}</b>줄 · 미등록 <b class="${miss ? "neg" : ""}">${miss}</b>줄 · ${n}줄 표시 · 금액 단위: 원`,
        empty: f.miss ? ["미등록 줄이 없습니다", "사용 중인 모든 상품 · 약정에 수수료가 등록돼 있습니다."] : ["수수료표가 없습니다", "「새 버전 등록」으로 첫 줄을 넣어 주세요."],
      });
      body.insertAdjacentHTML("afterbegin", "<style>.tbl tr.b14-miss td{background:#FFF8F7}.tbl tr.b14-miss td:first-child{box-shadow:inset 3px 0 0 var(--red)}</style>");
      App.on(el, {
        newFee: () => openNew(), rowNew: (t) => openNew(all.find((r) => r.key === t.dataset.key)),
        ff: (t) => { f[t.dataset.k] = t.value; tbl.set(rows()); }, fq: (t) => { f.q = t.value.trim(); tbl.set(rows()); }, fmiss: (t) => { f.miss = t.checked; App.redraw(); },
        fReset: () => { f.carrier = ""; f.q = ""; f.miss = false; App.redraw(); },
        xls: () => App.fake(`수수료표 ${tbl.rows().length}줄 엑셀저장`),
      });
    },
  });
})();
</script>
<script>/* B-15 사은품 (옛 SC-29 사은품 항목 관리). 사은품 · 본사사은품 항목 목록 + 등록/수정 팝업 + 사용중지.
   재고는 관리하지 않고 금액만 정산 차감에 쓴다. 사용중지하면 새 접수에서 빠지고 기존 접수 건은 그대로 남는다. */
(function () {
  "use strict";
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { kind: "", type: "", payer: "", state: "", q: "" };
  const PAYERS = ["센터(자체) 지급", "유치자 지급"]; const TYPES = ["현금"];
  App.screen("B-15", {
    title: "사은품", sc: ["SC-29"],
    render(el) {
      const db = App.db;
      el.innerHTML = h`${App.head("사은품", { count: "사은품 · 본사사은품 항목", actions: h`<button class="btn p" data-act="add">새 항목 등록</button>` })}
        <div class="note">여기에 등록한 사은품 항목은 고객 등록 화면에서 고를 수 있습니다. 재고는 관리하지 않고 금액만 정산 차감에 반영합니다.</div>
        <div class="card"><div class="filters">
          <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="사은품 명" aria-label="사은품 명"></div>
          <select class="in fix" data-on="f" data-k="type" aria-label="사은품유형">${App.opts(TYPES, st.type, "사은품유형 전체")}</select>
          <select class="in fix" data-on="f" data-k="payer" aria-label="지급처">${App.opts(PAYERS, st.payer, "지급처 전체")}</select>
          <select class="in fix" data-on="f" data-k="state" aria-label="사용 여부">${App.opts(["사용", "사용중지"], st.state, "사용 여부 전체")}</select>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div data-pills style="margin-top:12px"></div>
        <div data-tbl></div>`;
      const used = (g) => db.customers.filter((c) => (g.kind === "본사사은품" ? c.hqGift : c.gift) === g.name).length;
      const base = () => db.gifts.filter((g) => (!st.q || g.name.includes(st.q)) && (!st.type || g.type === st.type) && (!st.payer || g.payer === st.payer) && (!st.state || g.state === st.state));
      const rows = () => base().filter((g) => !st.kind || g.kind === st.kind);
      const tbl = App.table($("[data-tbl]", el), [
        { label: "구분", render: (g) => h`<span class="chip c-${g.kind === "본사사은품" ? "violet" : "blue"}">${g.kind}</span>` },
        { key: "type", label: "사은품유형" },
        { label: "사은품 명", render: (g) => h`<span class="name">${g.name}</span>` },
        { label: "기본 금액", r: 1, render: (g) => App.won(g.amount) },
        { label: "지급처", render: (g) => h`<span class="${g.payer.startsWith("센터") && g.state === "사용" ? "neg" : ""}">${g.payer}</span>` },
        { label: "사용 여부", render: (g) => App.chip(g.state) },
        { label: "쓰인 접수", r: 1, render: (g) => h`${used(g)}건` },
        { label: "", r: 1, render: (g) => h`<button class="btn sm" data-act="edit" data-id="${g.id}">수정</button> ${g.state === "사용" ? h`<button class="btn sm" data-act="stop" data-id="${g.id}">사용중지</button>` : h`<button class="btn sm" data-act="resume" data-id="${g.id}">다시 사용</button>`}` },
      ], rows(), {
        pageSize: 0, onRow: (g) => edit(g), rowClass: (g) => (g.state === "사용중지" ? "off" : ""),
        bar: (n) => `사은품 항목 <b>${n}</b>건 · 금액 단위: 원`,
        empty: ["사은품 항목이 없습니다", st.q || st.kind || st.type || st.payer || st.state ? "조건을 바꿔 다시 찾아 보세요." : "「새 항목 등록」으로 첫 항목을 만들어 보세요."],
      });
      function refresh() {
        const b = base();
        App.pills($("[data-pills]", el), [["전체", b.length, ""], ["사은품", b.filter((g) => g.kind === "사은품").length, "사은품"], ["본사사은품", b.filter((g) => g.kind === "본사사은품").length, "본사사은품"]], st.kind, (k) => { st.kind = k; refresh(); });
        tbl.set(rows());
      }
      function edit(g) {
        const isNew = !g;
        App.editModal({ title: isNew ? "새 사은품 항목 등록" : `${g.name} 수정`, note: isNew ? "저장하면 고객 등록 화면의 사은품 목록에 바로 나옵니다." : "금액 · 지급처를 고쳐도 이미 접수된 건의 값은 바뀌지 않습니다.",
          fields: [
            { name: "kind", label: "구분", type: "radio", options: ["사은품", "본사사은품"], required: true },
            { name: "type", label: "사은품유형", type: "select", options: TYPES, required: true, first: null },
            { name: "name", label: "사은품 명", required: true, placeholder: "예: 현금 20만" },
            { name: "amount", label: "기본 금액", unit: "원", required: true, hint: "숫자만. 접수할 때 건별로 고칠 수 있습니다" },
            { name: "payer", label: "지급처", type: "radio", options: PAYERS, required: true },
            { name: "state", label: "사용 여부", type: "radio", options: ["사용", "사용중지"], required: true },
          ],
          values: isNew ? { kind: st.kind || "사은품", type: "현금", payer: PAYERS[0], state: "사용" } : g,
          onSave: (x) => {
            if (x.amount < 0) return "기본 금액은 0원 이상이어야 합니다";
            if (db.gifts.some((o) => o !== g && o.kind === x.kind && o.name === x.name)) return `같은 구분에 「${x.name}」 항목이 이미 있습니다`;
            if (isNew) { db.gifts.unshift(Object.assign({ id: App.uid("G") }, x)); App.log("사은품", `${x.name} 등록`, "", `${x.kind} · ${App.won(x.amount)}원 · ${x.payer}`); }
            else { const before = `${g.kind} · ${g.name} · ${App.won(g.amount)}원 · ${g.payer} · ${g.state}`; Object.assign(g, x); App.log("사은품", `${g.name} 수정`, before, `${g.kind} · ${g.name} · ${App.won(g.amount)}원 · ${g.payer} · ${g.state}`); }
            refresh();
          } });
      }
      const byId = (t) => db.gifts.find((g) => g.id === t.dataset.id);
      refresh();
      App.on(el, {
        q: (t) => { st.q = t.value.trim(); refresh(); }, f: (t) => { st[t.dataset.k] = t.value; refresh(); },
        reset: () => { Object.assign(st, { kind: "", type: "", payer: "", state: "", q: "" }); App.redraw(); },
        add: () => edit(null), edit: (t) => edit(byId(t)),
        stop: async (t) => { const g = byId(t); if (!(await App.confirm(`「${g.name}」 항목을 사용중지하시겠습니까?`, { danger: true, ok: "사용중지", detail: `새 접수에서는 고를 수 없게 됩니다. 이미 접수된 ${used(g)}건은 그대로 남습니다.` }))) return; g.state = "사용중지"; App.log("사은품", `${g.name} 사용중지`, "사용", "사용중지"); App.toast("사용중지했습니다"); refresh(); },
        resume: (t) => { const g = byId(t); g.state = "사용"; App.log("사은품", `${g.name} 다시 사용`, "사용중지", "사용"); App.toast("다시 사용으로 바꿨습니다"); refresh(); },
      });
    },
  });
})();
</script>
<script>/* B-16 부가서비스 (옛 SC-17). 탭 「항목 관리」(W-212) · 「가입 건 조회」(W-213).
   항목의 정산 금액은 고객 등록에서 부가서비스를 고를 때 그 건의 부가서비스 금액으로 들어간다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { tab: "item", i: { carrier: "", state: "", q: "" }, j: { carrier: "", addon: "", from: "", to: "" } };
  const joined = (a) => App.db.customers.filter((c) => c.addon === a.name && c.carrier === a.carrier).length;

  function editItem(a) {
    const db = App.db; const n = a ? joined(a) : 0;
    App.editModal({
      title: a ? "부가서비스 수정" : "새 항목 등록", values: a || {},
      note: n ? `가입 ${n}건이 이 항목을 쓰고 있어 이름 · 통신사는 바꿀 수 없습니다. 금액을 바꿔도 이미 접수된 건의 금액은 그대로입니다.` : "저장하면 고객 등록의 부가서비스 선택에 바로 나타납니다.",
      fields: [
        { name: "name", label: "이름", required: true, readonly: n > 0, placeholder: "예: WIFI" },
        { name: "carrier", label: "통신사", type: "select", options: db.carriers, required: true, readonly: n > 0 },
        { name: "monthly", label: "월 요금", unit: "원", required: true, hint: "고객이 달마다 내는 요금" },
        { name: "settle", label: "정산 금액", unit: "원", required: true, hint: "정산식의 부가서비스 금액(더하는 항목)" },
      ],
      done: a ? "저장했습니다" : "항목을 등록했습니다",
      onSave: (v) => {
        if (n) { v.name = a.name; v.carrier = a.carrier; }
        if (v.monthly < 0 || v.settle < 0) return "금액은 0원 이상으로 넣어 주세요.";
        if (db.addons.some((x) => x !== a && x.name === v.name && x.carrier === v.carrier)) return "같은 통신사에 같은 이름의 항목이 이미 있습니다.";
        if (a) { const before = `월 ${App.won(a.monthly)} · 정산 ${App.won(a.settle)}`; Object.assign(a, v); App.log("부가서비스", `${a.carrier} ${a.name} 수정`, before, `월 ${App.won(a.monthly)} · 정산 ${App.won(a.settle)}`); }
        else { db.addons.push(Object.assign({ id: App.uid("AD"), state: "사용" }, v)); App.log("부가서비스", "새 항목 등록", "", `${v.carrier} ${v.name}`); }
        App.redraw();
      },
    });
  }

  App.screen("B-16", {
    title: "부가서비스", sc: ["SC-17"],
    render(el, params) {
      if (params.tab) { st.tab = params.tab === "join" ? "join" : "item"; delete params.tab; }
      const db = App.db;
      el.innerHTML = h`${App.head("부가서비스", { actions: st.tab === "item" ? h`<button class="btn p" data-act="add">새 항목 등록</button>` : h`<button class="btn" data-act="xls">엑셀저장</button>` })}<div data-tabs></div><div data-body></div>`;
      App.tabs($("[data-tabs]", el), [["item", "항목 관리"], ["join", "가입 건 조회"]], st.tab, (k) => { st.tab = k; App.redraw(); });
      const body = $("[data-body]", el); let tbl;

      if (st.tab === "item") {
        const f = st.i;
        body.innerHTML = h`<div class="card"><div class="filters">
            <select class="in fix" data-on="f" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, f.carrier, "통신사 전체")}</select>
            <select class="in fix" data-on="f" data-k="state" aria-label="사용 여부">${App.opts(["사용", "사용중지"], f.state, "사용 여부 전체")}</select>
            <div class="search grow"><input class="in" data-on="q" data-live value="${f.q}" placeholder="부가서비스 이름" aria-label="이름"></div>
            <button class="btn sm ghost" data-act="reset">초기화</button>
          </div></div><div data-tbl></div>
          <p class="hint" style="margin-top:8px">사용중지한 항목은 새 접수에서 고를 수 없고, 이미 가입한 건은 그대로 남습니다.</p>`;
        const rows = () => db.addons.filter((a) => (!f.carrier || a.carrier === f.carrier) && (!f.state || a.state === f.state) && (!f.q || a.name.includes(f.q)));
        tbl = App.table($("[data-tbl]", body), [
          { label: "이름", render: (a) => h`<span class="name">${a.name}</span>` }, { key: "carrier", label: "통신사" },
          { label: "월 요금", r: 1, render: (a) => App.won(a.monthly) }, { label: "정산 금액", r: 1, render: (a) => App.won(a.settle) },
          { label: "가입 건", r: 1, render: (a) => { const n = joined(a); return n ? h`<a class="link" data-act="toJoin" data-id="${a.id}">${n}건</a>` : "0건"; } },
          { label: "사용 여부", render: (a) => App.chip(a.state) },
          { label: "", r: 1, render: (a) => h`<button class="btn sm" data-act="edit" data-id="${a.id}">수정</button> ${a.state === "사용" ? h`<button class="btn sm" data-act="stop" data-id="${a.id}">사용중지</button>` : h`<button class="btn sm" data-act="resume" data-id="${a.id}">다시 사용</button>`}` },
        ], rows(), {
          rowClass: (a) => (a.state === "사용중지" ? "off" : ""), onRow: (a) => editItem(a),
          bar: (n) => h`항목 <b>${n}</b>건 · 사용중지 ${rows().filter((a) => a.state === "사용중지").length}건 · 금액 단위: 원`,
          empty: ["부가서비스 항목이 없습니다", "조건을 바꾸거나 「새 항목 등록」으로 추가해 주세요."],
        });
        const find = (t) => db.addons.find((a) => a.id === t.dataset.id);
        App.on(el, {
          add: () => editItem(null), edit: (t) => editItem(find(t)),
          f: (t) => { f[t.dataset.k] = t.value; tbl.set(rows()); }, q: (t) => { f.q = t.value.trim(); tbl.set(rows()); },
          reset: () => { f.carrier = ""; f.state = ""; f.q = ""; App.redraw(); },
          toJoin: (t) => { const a = find(t); st.tab = "join"; st.j = { carrier: a.carrier, addon: a.name, from: "", to: "" }; App.redraw(); },
          stop: async (t) => { const a = find(t); if (!(await App.confirm(`「${a.carrier} ${a.name}」 항목을 사용중지하시겠습니까?`, { danger: true, ok: "사용중지", detail: "새 접수에서 고를 수 없게 됩니다. 이미 가입한 건은 그대로 남습니다." }))) return; a.state = "사용중지"; App.log("부가서비스", `${a.carrier} ${a.name} 사용중지`, "사용", "사용중지"); App.toast("사용중지했습니다"); App.redraw(); },
          resume: (t) => { const a = find(t); a.state = "사용"; App.log("부가서비스", `${a.carrier} ${a.name} 다시 사용`, "사용중지", "사용"); App.toast("다시 사용하도록 바꿨습니다"); App.redraw(); },
        });
        return;
      }

      /* 가입 건 조회 */
      const f = st.j;
      body.innerHTML = h`<div class="card"><div class="filters">
          <select class="in fix" data-on="f" data-k="carrier" aria-label="통신사">${App.opts(db.carriers, f.carrier, "통신사 전체")}</select>
          <select class="in fix" data-on="f" data-k="addon" aria-label="부가서비스">${App.opts([...new Set(db.addons.map((a) => a.name))], f.addon, "부가서비스 전체")}</select>
          <span class="muted">접수일</span><div class="range"><input class="in" type="date" data-on="f" data-k="from" value="${f.from}" aria-label="시작일">~<input class="in" type="date" data-on="f" data-k="to" value="${f.to}" aria-label="종료일"></div>
          <button class="btn sm ghost" data-act="range" data-d="6">7일</button><button class="btn sm ghost" data-act="range" data-d="29">30일</button>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div><div data-tbl></div>`;
      const rows = () => db.customers.filter((c) => c.addon && (!f.carrier || c.carrier === f.carrier) && (!f.addon || c.addon === f.addon) && (!f.from || App.d(c.receivedAt) >= f.from) && (!f.to || App.d(c.receivedAt) <= f.to));
      tbl = App.table($("[data-tbl]", body), [
        { label: "고객명", render: (c) => h`<span class="name">${c.name}</span>` }, { label: "접수일", render: (c) => h`<span class="num">${App.dt(c.receivedAt)}</span>` },
        { key: "carrier", label: "통신사" }, { key: "product", label: "상품" }, { key: "addon", label: "부가서비스" },
        { label: "정산 금액", r: 1, render: (c) => App.won(c.addonAmt) }, { label: "개통상태", render: (c) => App.chip(c.openState) }, { label: "협력점", render: (c) => App.orgOf(c) },
      ], rows(), {
        onRow: (c) => App.openCustomer(c.id, { onChange: () => tbl.set(rows()) }),
        bar: (n) => h`가입 <b>${n}</b>건 · 정산 금액 합계 <b>${App.won(rows().reduce((a, c) => a + c.addonAmt, 0))}</b>원`,
        empty: ["부가서비스에 가입한 건이 없습니다", "조건을 바꿔 다시 찾아 보세요."],
      });
      App.on(el, {
        f: (t) => { f[t.dataset.k] = t.value; tbl.set(rows()); },
        range: (t) => { f.to = App.today(); f.from = App.addDays(App.today(), -Number(t.dataset.d)); App.redraw(); },
        reset: () => { st.j = { carrier: "", addon: "", from: "", to: "" }; App.redraw(); },
        xls: () => App.fake(`가입 건 ${tbl.rows().length}건 엑셀저장`),
      });
    },
  });
})();
</script>
<script>/* B-17 조직·계정 (옛 SC-47 조직 구조 + SC-37 계정 발급·수정·비활성화).
   왼쪽 조직 트리(본사 › 협력점 › 하부점)에서 조직을 고르면 오른쪽에 그 조직의 계정이 보인다.
   하부점은 여기서 등록한다(D-5. 협력점 · 상부점은 거래처 B-18). 역할은 본사 관리자 · 협력점 · 하부점 셋(D-14).
   임시 비밀번호는 화면에 한 번만 보여 준다(문자 발송 없음 · 저장하지 않음). */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const ROLE = { 본사: "본사 관리자", 협력점: "협력점", 하부점: "하부점" };
  const st = { org: null, shut: {}, tq: "", q: "", role: "", state: "" };
  const LOGIN = /^[a-z0-9]{4,20}$/;
  const RED = "margin-top:8px;font-size:12px;font-weight:600;color:var(--red)";

  App.screen("B-17", {
    title: "조직·계정", sc: ["SC-47", "SC-37"],
    render(el, params) {
      const db = App.db;
      if (params.org) { const p = db.partners.find((x) => x.id === params.org || x.name === params.org); if (p) st.org = { kind: "협력점", name: p.name }; params.org = ""; }
      const subsOf = (p) => db.subs.filter((s) => s.partnerId === p.id);
      const orgNames = (kind) => (kind === "본사" ? ["본사"] : kind === "협력점" ? db.partners.filter((p) => p.state === "거래중").map((p) => p.name) : db.subs.filter((s) => (db.partners.find((p) => p.id === s.partnerId) || {}).state === "거래중").map((s) => s.name));
      const scope = (a) => { const o = st.org; if (!o) return true; if (o.kind !== "협력점") return a.org === o.name; const p = db.partners.find((x) => x.name === o.name); return a.org === o.name || (p && subsOf(p).some((s) => s.name === a.org)); };
      const cnt = (name) => db.accounts.filter((a) => a.org === name && a.state !== "비활성").length;

      el.innerHTML = h`<style>
          .b17-tree{padding:6px}
          .b17-ln{display:flex;align-items:center;gap:2px;border-radius:var(--r1)}
          .b17-ln:hover{background:var(--sunk)} .b17-ln.on{background:var(--brand-soft)}
          .b17-ln.on .b17-n{color:var(--brand)}
          .b17-n{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 8px;font-size:13.5px;font-weight:700;text-align:left}
          .b17-n em{margin-left:auto;font-style:normal;font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap}
          .b17-n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .b17-tg{flex:none;width:22px;height:28px}
          .b17-tg.has::before{content:"";display:inline-block;width:6px;height:6px;border-right:1.8px solid var(--muted);border-bottom:1.8px solid var(--muted);transform:translateY(-2px) rotate(45deg)}
          .b17-tg.has.shut::before{transform:rotate(-45deg)}
          .b17-d1{padding-left:10px} .b17-d2{padding-left:44px} .b17-d2 .b17-n{font-weight:600}
          .b17-off .b17-n{color:var(--faint)}
          .b17-pw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;padding:16px;background:var(--sunk);border:1px dashed var(--line);border-radius:var(--r2);user-select:all}
        </style>
        ${App.head("조직·계정", { actions: h`<button class="btn" data-act="addsub">하부점 등록</button><button class="btn p" data-act="issue">새 계정 발급</button>` })}
        <div class="note">본사 아래에 협력점을, 협력점 아래에 하부점을 연결합니다. 협력점 · 상부점은 <a data-go="B-18">거래처</a>에서 등록하고, 하부점은 여기서 등록합니다. 비활성화한 계정은 로그인할 수 없습니다.</div>
        <div class="split l"><div class="card">
            <div class="tblbar"><span data-treecnt></span></div>
            <div style="padding:8px 8px 0"><div class="search"><input class="in" data-on="tq" data-live value="${st.tq}" placeholder="조직 이름으로 찾기" aria-label="조직 검색"></div></div>
            <div class="b17-tree" data-tree></div>
          </div><div><div class="card"><div class="filters">
            <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="이름 · 아이디로 찾기" aria-label="이름 또는 아이디"></div>
            <select class="in fix" data-on="f" data-k="role" aria-label="역할">${App.opts(Object.values(ROLE), st.role, "역할 전체")}</select>
            <select class="in fix" data-on="f" data-k="state" aria-label="계정 상태">${App.opts(["사용", "잠김", "비활성"], st.state, "상태 전체")}</select>
            <button class="btn sm ghost" data-act="reset">초기화</button>
          </div></div><div data-tbl style="margin-top:10px"></div></div></div>`;

      function tree() {
        const q = st.tq; const ps = db.partners.filter((p) => !q || p.name.includes(q) || subsOf(p).some((s) => s.name.includes(q)));
        const on = (kind, name) => (st.org ? st.org.kind === kind && st.org.name === name : kind === "") ? "on" : "";
        $("[data-treecnt]", el).innerHTML = h`협력점 <b>${db.partners.length}</b> · 하부점 <b>${db.subs.length}</b>`;
        $("[data-tree]", el).innerHTML = h`
            <div class="b17-ln ${on("", "")}"><button class="b17-n" data-act="org" data-kind="" data-name=""><span>전체 계정</span><em>${db.accounts.length}개</em></button></div>
            <div class="b17-ln ${on("본사", "본사")}"><button class="b17-n" data-act="org" data-kind="본사" data-name="본사"><span>본사</span><em>계정 ${cnt("본사")}</em></button></div>
            ${ps.map((p) => { const ss = subsOf(p).filter((s) => !q || p.name.includes(q) || s.name.includes(q)); const shut = st.shut[p.id] && !q; return h`
              <div class="b17-ln b17-d1 ${on("협력점", p.name)} ${p.state === "거래중" ? "" : "b17-off"}">
                <button class="b17-tg ${ss.length ? "has" : ""} ${shut ? "shut" : ""}" data-act="tg" data-id="${p.id}" aria-label="${shut ? "하부점 펴기" : "하부점 접기"}"></button>
                <button class="b17-n" data-act="org" data-kind="협력점" data-name="${p.name}"><span>${p.name}</span>${p.state === "거래중" ? "" : App.chip(p.state)}<em>하부점 ${subsOf(p).length} · 계정 ${cnt(p.name)}</em></button>
                ${p.state === "거래중" ? h`<button class="btn sm ghost" data-act="addsub" data-id="${p.id}" title="${p.name} 아래에 하부점 등록">+ 하부점</button>` : ""}
              </div>
              ${shut ? "" : ss.map((s) => h`<div class="b17-ln b17-d2 ${on("하부점", s.name)}"><button class="b17-n" data-act="org" data-kind="하부점" data-name="${s.name}"><span>${s.name}</span><em>계정 ${cnt(s.name)}</em></button></div>`)}`; })}
            ${ps.length ? "" : h`<div class="empty" style="padding:24px 12px"><b>찾는 조직이 없습니다</b>이름을 다시 확인해 주세요.</div>`}`;
      }
      const rows = () => db.accounts.filter((a) => scope(a) && (!st.q || a.name.includes(st.q) || a.login.includes(st.q.toLowerCase())) && (!st.role || a.role === st.role) && (!st.state || a.state === st.state));
      const tbl = App.table($("[data-tbl]", el), [
        { label: "조직", render: (a) => h`<span class="muted" style="font-size:12px">${a.orgKind}</span> ${a.org}` },
        { label: "이름", render: (a) => h`<span class="name">${a.name}</span>` },
        { label: "아이디", render: (a) => h`<span class="num">${a.login}</span>` },
        { key: "role", label: "역할" },
        { label: "상태", render: (a) => App.chip(a.state) },
        { label: "마지막 로그인", render: (a) => (a.last ? h`<span class="num">${App.dt(a.last)}</span>` : h`<span class="muted">아직 없음</span>`) },
        { label: "", r: 1, render: (a) => (a.state === "비활성" ? h`<span class="muted" style="font-size:12px">로그인할 수 없는 계정</span>` : h`<button class="btn sm" data-act="edit" data-id="${a.id}">수정</button> ${a.state === "잠김" ? h`<button class="btn sm p" data-act="unlock" data-id="${a.id}">잠금 해제</button> ` : ""}<button class="btn sm" data-act="temp" data-id="${a.id}">임시 비밀번호</button> <button class="btn sm" data-act="off" data-id="${a.id}" style="color:var(--red)">비활성화</button>`) },
      ], rows(), {
        rowClass: (a) => (a.state === "비활성" ? "off" : ""),
        bar: (n) => `${st.org ? App.esc(st.org.name) + (st.org.kind === "협력점" ? "과 소속 하부점" : "") : "전체"} 계정 <b>${n}</b>개`,
        tools: h`<button class="btn sm" data-act="xls">엑셀저장</button>`,
        empty: ["계정이 없습니다", "「새 계정 발급」으로 이 조직의 계정을 만들어 보세요."],
      });
      const refresh = () => { tree(); tbl.set(rows()); };
      tree();

      /* 임시 비밀번호: 지어낸 값을 한 번만 보여 준다 */
      function tempPw() { const A = "abcdefghjkmnpqrstuvwxyz", N = "23456789"; let s = ""; for (let i = 0; i < 10; i++) { const set = i % 3 === 2 ? N : A; s += set[Math.floor(Math.random() * set.length)]; } return s; }
      function showTemp(a, why) {
        App.modal({ title: "임시 비밀번호", sub: why, body: h`<div class="note warn"><b>이 창을 닫으면 다시 볼 수 없습니다.</b> 문자로 보내지 않으니 지금 적어서 ${a.name}님에게 직접 전해 주세요.</div>
          <div class="b17-pw" data-pw>${tempPw()}</div>
          <dl class="kv" style="margin-top:14px"><dt>조직</dt><dd>${a.org}</dd><dt>이름</dt><dd>${a.name}</dd><dt>아이디</dt><dd class="num">${a.login}</dd></dl>
          <p class="hint" style="margin-top:10px">이 비밀번호로 로그인한 뒤 비밀번호변경에서 새 비밀번호로 바꿔 쓰도록 안내해 주세요.</p>`, actions: [{ label: "적어 두었습니다", kind: "p" }] });
      }
      /* 발급 · 수정 팝업(W-222). 조직 구분을 바꾸면 조직명 목록과 역할이 따라 바뀐다. */
      function account(a) {
        const kind0 = a ? a.orgKind : st.org ? st.org.kind : "협력점"; const org0 = a ? a.org : st.org ? st.org.name : "";
        const F = [
          { name: "orgKind", label: "조직 구분", type: "select", options: Object.keys(ROLE), first: null, required: true },
          { name: "org", label: "조직명", type: "select", options: [...new Set([...orgNames(kind0), ...(org0 ? [org0] : [])])], required: true },
          { name: "role", label: "역할", html: String(h`<span data-role>${ROLE[kind0]}</span>`), hint: "역할은 조직 구분에 따라 정해집니다." },
          { name: "name", label: "이름", required: true, pattern: /^.{1,20}$/, msg: "이름은 20자까지 넣을 수 있습니다" },
          { name: "login", label: "아이디", required: !a, readonly: !!a, pattern: LOGIN, msg: "아이디는 영문 소문자 · 숫자 4~20자입니다", placeholder: "예: partnera2", hint: a ? "아이디는 발급한 뒤에는 바꿀 수 없습니다." : "영문 소문자 · 숫자 4~20자. 서비스 전체에서 겹치지 않아야 합니다." },
        ];
        App.modal({
          title: a ? `${a.name} 계정 수정` : "새 계정 발급",
          body: h`${a ? "" : h`<div class="note gray">저장하면 임시 비밀번호가 화면에 한 번 보입니다. 문자로는 보내지 않습니다.</div>`}<div class="card" style="overflow:hidden">${App.form(F, { cols: 1, values: a ? a : { orgKind: kind0, org: org0 } })}</div><p data-top style="${RED}"></p>`,
          onOpen: (root) => { const k = $('[name="orgKind"]', root); k.onchange = () => { $('[name="org"]', root).innerHTML = String(App.opts(orgNames(k.value), k.value === "본사" ? "본사" : "", "고르기")); $("[data-role]", root).textContent = ROLE[k.value]; }; },
          actions: [{ label: "취소" }, { label: a ? "저장" : "발급", kind: "p", onClick: (close, root) => {
            const top = $("[data-top]", root); top.textContent = ""; const r = App.readForm(root, F); if (!r.ok) return; const v = r.values; const role = ROLE[v.orgKind];
            if (a) {
              const before = `${a.org} · ${a.role} · ${a.name}`; Object.assign(a, { orgKind: v.orgKind, org: v.org, role, name: v.name }); const after = `${a.org} · ${a.role} · ${a.name}`;
              if (before !== after) App.log("계정 권한", `${a.login} 계정 수정`, before, after);
              close(); App.toast("저장했습니다. 다음 요청부터 바뀐 권한이 적용됩니다"); refresh(); return;
            }
            if (db.accounts.some((x) => x.login === v.login) || db.tenants.some((t) => t.admin === v.login) || v.login === "op01") { top.textContent = `「${v.login}」은(는) 이미 쓰고 있는 아이디입니다. 다른 아이디를 넣어 주세요.`; const i = $('[name="login"]', root); i.classList.add("err"); i.focus(); return; }
            const n = { id: App.uid("AC"), org: v.org, orgKind: v.orgKind, name: v.name, login: v.login, role, state: "사용", last: "" };
            db.accounts.unshift(n); App.log("계정 권한", `${n.login} 계정 발급`, "", `${n.org} · ${role} · ${n.name}`);
            close(); App.toast("계정을 발급했습니다"); refresh(); showTemp(n, "새 계정 발급");
          } }],
        });
      }
      /* 하부점 등록(D-5 · W-214): 하부점명 · 상위 협력점 */
      function addSub(pid) {
        const F = [{ name: "name", label: "하부점명", required: true, pattern: /^.{1,30}$/, msg: "하부점명은 30자까지 넣을 수 있습니다" }, { name: "partnerId", label: "상위 협력점", type: "select", required: true, options: db.partners.filter((p) => p.state === "거래중").map((p) => [p.id, p.name]), hint: "하부점은 협력점 하나에만 속합니다." }];
        const sel = pid || (st.org && st.org.kind === "협력점" ? (db.partners.find((p) => p.name === st.org.name && p.state === "거래중") || {}).id : "") || "";
        App.modal({
          title: "하부점 등록", body: h`<div class="card" style="overflow:hidden">${App.form(F, { cols: 1, values: { partnerId: sel } })}</div><p data-top style="${RED}"></p>`,
          actions: [{ label: "취소" }, { label: "등록", kind: "p", onClick: (close, root) => {
            const top = $("[data-top]", root); top.textContent = ""; const r = App.readForm(root, F); if (!r.ok) return; const v = r.values;
            if (db.subs.some((s) => s.name === v.name) || db.partners.some((p) => p.name === v.name) || v.name === "본사") { top.textContent = `「${v.name}」은(는) 이미 있는 조직 이름입니다.`; return; }
            db.subs.push({ id: App.uid("S"), name: v.name, partnerId: v.partnerId }); st.shut[v.partnerId] = false; st.org = { kind: "하부점", name: v.name };
            App.log("기준정보", `하부점 ${v.name} 등록`, "", `${App.partnerName(v.partnerId)} 아래`);
            close(); App.toast("하부점을 등록했습니다. 이어서 계정을 발급하세요"); refresh();
          } }],
        });
      }
      const acc = (t) => db.accounts.find((a) => a.id === t.dataset.id);

      App.on(el, {
        tq: (t) => { st.tq = t.value.trim(); tree(); },
        q: (t) => { st.q = t.value.trim(); tbl.set(rows()); },
        f: (t) => { st[t.dataset.k] = t.value; tbl.set(rows()); },
        reset: () => { Object.assign(st, { q: "", role: "", state: "", org: null, tq: "" }); App.redraw(); },
        org: (t) => { st.org = t.dataset.kind ? { kind: t.dataset.kind, name: t.dataset.name } : null; refresh(); },
        tg: (t) => { st.shut[t.dataset.id] = !st.shut[t.dataset.id]; tree(); },
        addsub: (t) => addSub(t.dataset.id), issue: () => account(null), edit: (t) => account(acc(t)),
        xls: () => App.fake(`계정 ${tbl.rows().length}개 엑셀저장`),
        unlock: async (t) => {
          const a = acc(t); if (!(await App.confirm(`${a.name}(${a.login}) 계정의 잠금을 푸시겠습니까?`, { detail: "비밀번호를 여러 번 틀려 잠긴 계정입니다. 풀면 바로 로그인할 수 있습니다.", ok: "잠금 해제" }))) return;
          a.state = "사용"; App.log("계정 권한", `${a.login} 잠금 해제`, "잠김", "사용"); App.toast("잠금을 풀었습니다"); refresh();
        },
        temp: async (t) => {
          const a = acc(t); if (!(await App.confirm(`${a.name}(${a.login}) 계정에 임시 비밀번호를 발급하시겠습니까?`, { detail: "지금 쓰던 비밀번호로는 더 이상 로그인할 수 없습니다. 임시 비밀번호는 다음 화면에 한 번만 보입니다.", ok: "발급" }))) return;
          const before = a.state; if (a.state === "잠김") a.state = "사용";
          App.log("계정 권한", `${a.login} 임시 비밀번호 발급`, before, a.state); refresh(); showTemp(a, "임시 비밀번호 발급");
        },
        off: async (t) => {
          const a = acc(t);
          if (a.orgKind === "본사" && a.name === App.session.name) { App.toast("지금 로그인한 계정은 비활성화할 수 없습니다"); return; }
          if (!(await App.confirm(`${a.name}(${a.login}) 계정을 비활성화하시겠습니까?`, { danger: true, ok: "비활성화", detail: "이 계정은 로그인할 수 없게 되고 지금 열려 있는 화면도 끊깁니다. 되돌릴 수 없으니 다시 쓰려면 새 계정을 발급해야 합니다." }))) return;
          const before = a.state; a.state = "비활성"; App.log("계정 권한", `${a.login} 계정 비활성화`, before, "비활성"); App.toast("계정을 비활성화했습니다"); refresh();
        },
      });
    },
  });
})();
</script>
<script>/* B-18 거래처 (옛 SC-46 협력점·상부점 기준정보). 하부점은 조직·계정(B-17)에서 등록한다(D-5).
   사업자번호는 숫자 10자리 · 중복 불가. 거래 종료는 삭제가 아니라 상태 변경(목록에 남고 새 접수 · 정산에서 고를 수 없다).
   연락처 · 정산 계좌는 가려서 보이고, 고칠 때만 새 값을 넣는다. */
(function () {
  const App = window.App; const h = App.h; const $ = App.$;
  const st = { kind: "", state: "", q: "" };
  const bizFmt = (v) => { const d = String(v).replace(/\D/g, ""); return `${d.slice(0, 3)}-${d.slice(3, 5)}-${d.slice(5)}`; };
  /* 공통 가림은 휴대폰 번호 꼴만 가려서, 지역번호로 시작하는 번호는 여기서 한 번 더 가린다 */
  const maskTel = (p) => { const m = String(App.maskPhone(p)); return m !== String(p) ? m : String(p).replace(/\d{2}(-?)(\d{2})\d{2}$/, "**$1$2**"); };
  const BANKS = ["국민", "신한", "우리", "하나", "농협", "기업", "새마을", "우체국", "카카오뱅크", "토스뱅크"];

  App.screen("B-18", {
    title: "거래처", sc: ["SC-46"],
    render(el) {
      const db = App.db; const all = () => [...db.partners, ...db.uppers];
      el.innerHTML = h`${App.head("거래처", { actions: h`<button class="btn p" data-act="add">새로 등록</button>` })}
        <div class="note">협력점과 상부점의 기준정보입니다. 거래 종료는 삭제가 아닌 상태 변경입니다. 하부점은 <a data-go="B-17">조직·계정</a>에서 등록합니다.</div>
        <div class="card"><div class="filters">
          <div class="search grow"><input class="in" data-on="q" data-live value="${st.q}" placeholder="상호 또는 사업자번호" aria-label="상호 또는 사업자번호"></div>
          <select class="in fix" data-on="f" data-k="state" aria-label="거래 상태">${App.opts(["거래중", "거래 종료"], st.state, "거래 상태 전체")}</select>
          <button class="btn sm ghost" data-act="reset">초기화</button>
        </div></div>
        <div data-pills style="margin-top:12px"></div>
        <div data-tbl></div>
        <p class="hint" style="margin-top:8px">엑셀저장 파일에는 연락처 · 정산 계좌가 가린 값으로 들어갑니다.</p>`;
      const base = () => all().filter((p) => { const q = st.q.replace(/-/g, ""); return (!st.q || p.name.includes(st.q) || p.biz.replace(/-/g, "").includes(q)) && (!st.state || p.state === st.state); });
      const rows = () => base().filter((p) => !st.kind || p.kind === st.kind);
      const tbl = App.table($("[data-tbl]", el), [
        { label: "구분", render: (p) => h`<span class="chip c-${p.kind === "협력점" ? "blue" : "violet"}">${p.kind}</span>` },
        { label: "상호", render: (p) => h`<span class="name">${p.name}</span>` },
        { label: "사업자번호", render: (p) => h`<span class="num">${p.biz}</span>` },
        { key: "ceo", label: "대표자" },
        { label: "연락처", render: (p) => (p.phone ? h`<span class="num">${maskTel(p.phone)}</span>` : "") },
        { label: "정산 계좌", render: (p) => (p.acct ? h`<span class="num">${p.bank} ${App.maskAcct(p.acct)}</span>` : "") },
        { label: "정산그룹", render: (p) => (p.kind === "협력점" ? p.group : "") },
        { label: "거래 상태", render: (p) => App.chip(p.state) },
        { label: "", r: 1, render: (p) => h`<button class="btn sm" data-act="edit" data-id="${p.id}">수정</button>${p.state === "거래중" ? h` <button class="btn sm" data-act="end" data-id="${p.id}" style="color:var(--red)">거래 종료</button>` : ""}` },
      ], rows(), {
        rowClass: (p) => (p.state === "거래중" ? "" : "off"), onRow: (p) => (p.kind === "협력점" ? App.openPartnerInfo(p.id) : edit(p)),
        bar: (n) => `검색 결과 <b>${n}</b>건 · 거래중 ${rows().filter((p) => p.state === "거래중").length}`,
        tools: h`<button class="btn sm" data-act="xls">엑셀저장</button>`,
        empty: ["거래처가 없습니다", "조건을 바꾸거나 「새로 등록」으로 협력점 · 상부점을 넣어 보세요."],
      });
      function refresh() {
        const b = base();
        App.pills($("[data-pills]", el), [["전체", b.length, ""], ["협력점", b.filter((p) => p.kind === "협력점").length, "협력점"], ["상부점", b.filter((p) => p.kind === "상부점").length, "상부점"]], st.kind, (v) => { st.kind = v; refresh(); });
        tbl.set(rows());
      }
      refresh();

      /* 등록 · 수정 팝업(W-231) */
      function edit(p) {
        const F = [
          p ? { name: "kind", label: "구분", type: "static", value: p.kind } : { name: "kind", label: "구분", type: "radio", options: ["협력점", "상부점"], required: true },
          { name: "name", label: "상호", required: true, pattern: /^.{1,40}$/, msg: "상호는 40자까지 넣을 수 있습니다" },
          { name: "biz", label: "사업자번호", required: true, pattern: /^\d{3}-?\d{2}-?\d{5}$/, msg: "사업자번호는 숫자 10자리입니다(예: 101-81-12345)", placeholder: "000-00-00000" },
          { name: "ceo", label: "대표자" },
          { name: "phone", label: "연락처", pattern: /^0\d{1,2}-?\d{3,4}-?\d{4}$/, msg: "연락처 형식이 맞지 않습니다(예: 010-1234-5678)", placeholder: p && p.phone ? maskTel(p.phone) : "010-0000-0000", hint: p && p.phone ? "바꿀 때만 새 번호를 넣습니다. 비워 두면 그대로 둡니다." : "" },
          { name: "bank", label: "정산 계좌 은행", type: "select", options: BANKS },
          { name: "acct", label: "계좌번호", pattern: /^[\d-]{8,20}$/, msg: "계좌번호는 숫자만 넣어 주세요", placeholder: p && p.acct ? App.maskAcct(p.acct) : "숫자만", hint: p && p.acct ? "바꿀 때만 새 계좌번호를 넣습니다. 비워 두면 그대로 둡니다." : "" },
          { name: "group", label: "정산그룹", type: "select", options: db.options.정산그룹, hint: "협력점만 고릅니다." },
        ];
        if (p) F.push({ name: "state", label: "거래 상태", type: "static", value: p.state });
        App.modal({
          title: p ? `${p.name} 수정` : "거래처 등록",
          body: h`${p ? "" : h`<div class="note gray">등록하면 접수 · 정산 · 대사 화면의 선택 항목에 나타납니다.</div>`}<div class="card" style="overflow:hidden">${App.form(F, { cols: 1, values: p ? Object.assign({}, p, { phone: "", acct: "" }) : { kind: st.kind || "협력점" } })}</div><p data-top style="margin-top:8px;font-size:12px;font-weight:600;color:var(--red)"></p>`,
          actions: [{ label: "취소" }, { label: p ? "저장" : "등록", kind: "p", onClick: (close, root) => {
            const top = $("[data-top]", root); top.textContent = ""; const r = App.readForm(root, F); if (!r.ok) return; const v = r.values;
            v.biz = bizFmt(v.biz); const kind = p ? p.kind : v.kind;
            const dup = all().find((x) => x !== p && x.biz === v.biz);
            if (dup) { top.textContent = `이미 등록된 사업자번호입니다(${dup.kind} ${dup.name}). 저장하지 않았습니다.`; const i = $('[name="biz"]', root); i.classList.add("err"); i.focus(); return; }
            if (all().some((x) => x !== p && x.name === v.name)) { top.textContent = `「${v.name}」은(는) 이미 있는 상호입니다.`; return; }
            if (v.phone === "") delete v.phone; if (v.acct === "") delete v.acct; else v.acct = v.acct.replace(/\D/g, "");
            if (kind !== "협력점") v.group = "";
            if (p) {
              /* 바뀐 항목만 이력에 남긴다(연락처 · 계좌번호는 가린 값으로) */
              const L = { name: "상호", biz: "사업자번호", ceo: "대표자", phone: "연락처", bank: "은행", acct: "계좌번호", group: "정산그룹" }; const show = (k, x) => `${L[k]} ${k === "phone" ? maskTel(x) : k === "acct" ? App.maskAcct(x) : x || "없음"}`;
              const diff = Object.keys(L).filter((k) => k in v && (p[k] || "") !== (v[k] || "")); const before = diff.map((k) => show(k, p[k])).join(" · "); const oldName = p.name; Object.assign(p, v);
              if (oldName !== p.name) { db.accounts.forEach((a) => { if (a.org === oldName) a.org = p.name; }); db.staff.forEach((s) => { if (s.org === oldName) s.org = p.name; }); }
              if (diff.length) App.log("기준정보", `${p.kind} ${p.name} 수정`, before, diff.map((k) => show(k, p[k])).join(" · "));
            } else {
              const n = Object.assign({ id: App.uid(kind === "협력점" ? "P" : "U"), kind, ceo: "", phone: "", bank: "", acct: "", state: "거래중" }, v); n.kind = kind;
              (kind === "협력점" ? db.partners : db.uppers).push(n); App.log("기준정보", `${kind} ${n.name} 등록`, "", n.biz);
            }
            close(); App.toast(p ? "저장했습니다" : "거래처를 등록했습니다"); refresh();
          } }],
        });
      }
      const find = (t) => all().find((p) => p.id === t.dataset.id);

      App.on(el, {
        q: (t) => { st.q = t.value.trim(); refresh(); },
        f: (t) => { st[t.dataset.k] = t.value; refresh(); },
        reset: () => { Object.assign(st, { kind: "", state: "", q: "" }); App.redraw(); },
        add: () => edit(null), edit: (t) => edit(find(t)),
